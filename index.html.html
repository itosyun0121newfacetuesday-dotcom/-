<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ネットワークスペシャリスト用語集</title>
<style>
  :root {
    --bg: #0e1420;
    --panel: #141c2b;
    --panel2: #101724;
    --line: #253247;
    --text: #dbe4ef;
    --sub: #8fa3bf;
    --accent: #4fd1c5;
    --accent2: #5b8def;
    --mono: 'JetBrains Mono', 'Menlo', 'Consolas', monospace;
    --sans: 'Inter', -apple-system, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    min-height: 100vh;
  }
  aside {
    width: 300px;
    flex-shrink: 0;
    background: var(--panel2);
    border-right: 1px solid var(--line);
    padding: 20px 0;
    height: 100vh;
    position: sticky;
    top: 0;
    overflow-y: auto;
  }
  .brand {
    padding: 0 20px 16px 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 8px;
  }
  .brand .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .brand h1 {
    font-size: 18px;
    margin: 6px 0 0 0;
    font-weight: 700;
    line-height: 1.3;
  }
  .cat-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 20px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--sub);
    border-left: 3px solid transparent;
    transition: background 0.12s, color 0.12s;
  }
  .cat-item:hover { background: rgba(255,255,255,0.03); color: var(--text); }
  .cat-item.active {
    color: var(--text);
    background: rgba(79,209,197,0.08);
    border-left-color: var(--accent);
  }
  .cat-item .cnt {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--sub);
    background: rgba(255,255,255,0.04);
    padding: 1px 7px;
    border-radius: 10px;
  }
  main {
    flex: 1;
    padding: 28px 40px 80px 40px;
    max-width: 980px;
  }
  .topbar {
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 4px 0 18px 0;
    z-index: 5;
  }
  .search-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .search-wrap input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14.5px;
    font-family: var(--sans);
  }
  .search-wrap svg { flex-shrink: 0; opacity: 0.6; }
  .meta-row {
    margin-top: 10px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--sub);
  }
  .group-title {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--accent2);
    text-transform: uppercase;
    margin: 26px 0 8px 0;
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--line);
  }
  .group-title:first-of-type { margin-top: 6px; }
  details.term {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 6px;
    overflow: hidden;
  }
  details.term > summary {
    list-style: none;
    cursor: pointer;
    padding: 11px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 14.5px;
    user-select: none;
  }
  details.term > summary::-webkit-details-marker { display: none; }
  details.term > summary .arrow {
    font-family: var(--mono);
    color: var(--accent);
    transition: transform 0.15s ease;
    flex-shrink: 0;
    font-size: 12px;
  }
  details.term[open] > summary .arrow { transform: rotate(90deg); }
  details.term > summary .word { color: var(--text); }
  details.term > summary .short-preview {
    color: var(--sub);
    font-weight: 400;
    font-size: 12.5px;
    margin-left: auto;
    text-align: right;
    max-width: 46%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  details.term .body {
    padding: 2px 16px 16px 40px;
    border-top: 1px solid var(--line);
  }
  details.term .short {
    color: var(--accent);
    font-weight: 600;
    font-size: 14px;
    margin: 12px 0 8px 0;
  }
  details.term .detail {
    color: var(--text);
    font-size: 13.5px;
    line-height: 1.85;
    opacity: 0.92;
  }
  mark {
    background: rgba(79,209,197,0.35);
    color: inherit;
    border-radius: 2px;
    padding: 0 1px;
  }
  .empty {
    color: var(--sub);
    font-family: var(--mono);
    font-size: 13px;
    padding: 40px 0;
    text-align: center;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  @media (max-width: 860px) {
    body { flex-direction: column; }
    aside { width: 100%; height: auto; position: relative; overflow-y: visible; }
    main { padding: 20px; }
  }
</style>
</head>
<body>

<aside>
  <div class="brand">
    <div class="eyebrow">Network Specialist</div>
    <h1>用語集 索引ビューア</h1>
  </div>
  <div id="catList"></div>
</aside>

<main>
  <div class="topbar">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="用語・解説をキーワード検索...">
    </div>
    <div class="meta-row" id="metaRow"></div>
  </div>
  <div id="content"></div>
</main>

<script id="glossary-data" type="application/json">[{"cat": "イーサネット・LAN規格", "group": "有線LAN規格(物理層)", "word": "DIX規格イーサネット", "short": "DEC/Intel/Xeroxが策定したEthernet II形式の通称。", "detail": "IEEE802.3規格とは別に生まれたEthernet II(DIXフレーム)の仕様。フレームにタイプフィールドを持ち、現在最も一般的に使われているフレーム形式の元になっている。"}, {"cat": "イーサネット・LAN規格", "group": "有線LAN規格(物理層)", "word": "IEEE802.3規格", "short": "IEEEが標準化した有線LAN(イーサネット)の規格群。", "detail": "10BASE-T以降の有線イーサネットの物理層・MAC副層を規定する標準群。CSMA/CDによるアクセス制御も元々ここに含まれる。"}, {"cat": "イーサネット・LAN規格", "group": "有線LAN規格(物理層)", "word": "1000BASE-T", "short": "より対線を使う1Gbps有線LAN規格。", "detail": "カテゴリ5e以上のUTPケーブルを使用し全二重で1Gbpsを実現。最大伝送距離100m。オフィス配線の標準として広く普及。"}, {"cat": "イーサネット・LAN規格", "group": "有線LAN規格(物理層)", "word": "1000BASE-SX", "short": "短距離向けマルチモード光ファイバの1Gbps規格。", "detail": "850nm帯のレーザーを使うマルチモードファイバ規格で伝送距離は数百m程度。データセンター内など短距離接続向け。"}, {"cat": "イーサネット・LAN規格", "group": "有線LAN規格(物理層)", "word": "1000BASE-LX", "short": "長距離向けの1Gbps光ファイバ規格。", "detail": "1310nm帯を使いシングルモード/マルチモード両対応、シングルモードでは数km〜数十kmの長距離伝送が可能。建物間接続などに使われる。"}, {"cat": "イーサネット・LAN規格", "group": "有線LAN規格(物理層)", "word": "10GBASE-T", "short": "より対線を使う10Gbps有線LAN規格。", "detail": "カテゴリ6A以上のケーブルを用いて最大100mの伝送を実現。既存配線を流用しやすい反面、消費電力・発熱が大きい。"}, {"cat": "イーサネット・LAN規格", "group": "有線LAN規格(物理層)", "word": "10GBASE-SR", "short": "短距離向けマルチモード光ファイバの10Gbps規格。", "detail": "850nm帯を使用し伝送距離は数十m〜数百m程度。データセンター内のサーバ・スイッチ間接続に多用される。"}, {"cat": "イーサネット・LAN規格", "group": "有線LAN規格(物理層)", "word": "2.5GBASE-T", "short": "より対線を使う2.5Gbps有線LAN規格。", "detail": "既存のカテゴリ5e/6ケーブルでも動作するよう設計された中間速度規格で、無線LANアクセスポイントのバックホールなどで採用が進む。"}, {"cat": "イーサネット・LAN規格", "group": "有線LAN規格(物理層)", "word": "5GBASE-T", "short": "より対線を使う5Gbps有線LAN規格。", "detail": "既存配線を活かしつつ2.5GBASE-Tより高速化した規格。10GBASE-Tへの移行過程で採用されることがある。"}, {"cat": "イーサネット・LAN規格", "group": "有線LAN規格(物理層)", "word": "GE-PON", "short": "光ファイバで複数拠点を収容するギガビットPON規格。", "detail": "1本の光ファイバを分岐させ複数の加入者を収容する受動光ネットワーク(PON)技術のギガビット版。"}, {"cat": "イーサネット・LAN規格", "group": "有線LAN規格(物理層)", "word": "PON", "short": "1本の光ファイバを分岐器で分けて複数拠点に配る受動光網。", "detail": "Passive Optical Network。局側のOLTと加入者側のONUの間を、電源不要の光スプリッタで分岐して接続する構成。"}, {"cat": "イーサネット・LAN規格", "group": "有線LAN規格(物理層)", "word": "OLT", "short": "PONの局舎側終端装置。", "detail": "Optical Line Terminal。通信事業者の局舎に設置され、複数のONUへ光信号を分配・収容する装置。"}, {"cat": "イーサネット・LAN規格", "group": "有線LAN規格(物理層)", "word": "ONU", "short": "PONの加入者側終端装置。", "detail": "Optical Network Unit。利用者宅側に設置され光信号と電気信号を変換する終端装置。"}, {"cat": "イーサネット・LAN規格", "group": "有線LAN規格(物理層)", "word": "FTTH", "short": "光ファイバを加入者宅まで直接引き込む方式。", "detail": "Fiber To The Home。局舎から利用者宅まで光ファイバで接続するアクセス回線方式。"}, {"cat": "イーサネット・LAN規格", "group": "有線LAN規格(物理層)", "word": "FTTx", "short": "光ファイバをどこまで引き込むかを表す総称。", "detail": "FTTH/FTTB/FTTCなど、光ファイバの終端位置により分類されるアクセス方式全般の総称。"}, {"cat": "イーサネット・LAN規格", "group": "データリンク層", "word": "LLC", "short": "MAC副層の上位で上位プロトコルとの多重化を担う副層。", "detail": "Logical Link Control。IEEE802.2で規定され、MACフレームの上に位置し複数の上位プロトコルを識別・多重化する。"}, {"cat": "イーサネット・LAN規格", "group": "データリンク層", "word": "LLC副層", "short": "LLCが担当するデータリンク層内の分割区分。", "detail": "データリンク層はMAC副層とLLC副層に分かれ、LLC副層は誤り制御やプロトコル識別を担う。"}, {"cat": "イーサネット・LAN規格", "group": "データリンク層", "word": "SNAP", "short": "LLCヘッダにEthernetタイプ相当の情報を含める拡張形式。", "detail": "Sub-Network Access Protocol。IEEE802.3フレームでもEthernet IIのようなタイプ識別を行えるようLLCヘッダを拡張した形式。"}, {"cat": "イーサネット・LAN規格", "group": "データリンク層", "word": "FCS", "short": "フレーム末尾に付与される誤り検出用チェックサム。", "detail": "Frame Check Sequence。CRCによりフレーム伝送中の誤りを検出するためのフィールド。"}, {"cat": "イーサネット・LAN規格", "group": "データリンク層", "word": "PAUSEフレーム", "short": "一時的な送信停止を要求するフロー制御用フレーム。", "detail": "IEEE802.3xで規定される制御フレームで、受信側バッファ溢れ防止のため相手に送信の一時停止を要求する。"}, {"cat": "イーサネット・LAN規格", "group": "VLAN", "word": "VLAN", "short": "物理構成に依存せず論理的にLANを分割する技術。", "detail": "Virtual LAN。1つの物理スイッチ・ネットワークを複数の論理セグメントに分割し、ブロードキャストドメインを分離する技術。"}, {"cat": "イーサネット・LAN規格", "group": "VLAN", "word": "VLAN ID", "short": "VLANを識別する12ビットの番号。", "detail": "IEEE802.1QのタグフィールドでVLANを一意に識別するための番号(1〜4094)。"}, {"cat": "イーサネット・LAN規格", "group": "VLAN", "word": "VLANフレーム", "short": "VLANタグが付与されたイーサネットフレーム。", "detail": "通常のフレームに4バイトのVLANタグを挿入した形式のフレーム全般を指す。"}, {"cat": "イーサネット・LAN規格", "group": "VLAN", "word": "VLANタグフレーム", "short": "VLANタグを含むフレームの呼称。", "detail": "VLANフレームとほぼ同義で、タグ付きフレームであることを強調した表現。"}, {"cat": "イーサネット・LAN規格", "group": "VLAN", "word": "タグVLAN", "short": "トランクリンク上でVLANタグを付与して複数VLANを1本の物理リンクで運ぶ方式。", "detail": "IEEE802.1Qに基づきフレームにVLAN IDを付与し、1つの物理ポートで複数VLANのトラフィックを識別・伝送できるようにする方式。"}, {"cat": "イーサネット・LAN規格", "group": "VLAN", "word": "デフォルトVLAN", "short": "タグなしフレームが所属する既定のVLAN。", "detail": "スイッチ出荷時に全ポートが所属する初期VLAN(多くの機器でVLAN1)で、タグなし(ネイティブ)フレームの扱いにも関係する。"}, {"cat": "イーサネット・LAN規格", "group": "VLAN", "word": "ポートベースVLAN", "short": "物理ポート単位でVLANの所属を決める方式。", "detail": "スイッチの各ポートにVLANを静的に割り当てる最も基本的なVLAN構成方式。"}, {"cat": "イーサネット・LAN規格", "group": "VLAN", "word": "トランクポート", "short": "複数VLANのフレームをタグ付きで通すポート。", "detail": "タグVLANの通信を通すために設定するスイッチ間接続用ポート。"}, {"cat": "イーサネット・LAN規格", "group": "VLAN", "word": "トランク接続", "short": "トランクポート同士を接続し複数VLANを1本の回線で運ぶ接続形態。", "detail": "スイッチ間などでタグVLANを使い複数VLANのトラフィックを1本の物理リンクに集約する接続方式。"}, {"cat": "イーサネット・LAN規格", "group": "VLAN", "word": "拡張VLANタグ", "short": "IEEE802.1Qタグを二重に付与するQinQ等の拡張手法。", "detail": "スタックVLAN(Q-in-Q)などVLANタグをさらにもう1段付与し、事業者網でユーザVLANを透過させる技術。"}, {"cat": "イーサネット・LAN規格", "group": "リンク集約・冗長化(物理)", "word": "LACP", "short": "複数の物理リンクを1本の論理リンクとして束ねる制御プロトコル。", "detail": "Link Aggregation Control Protocol。IEEE802.1axで規定され、複数リンクの自動検出・束ね・障害時の切り離しを行う。"}, {"cat": "イーサネット・LAN規格", "group": "リンク集約・冗長化(物理)", "word": "NICチーミング", "short": "サーバの複数NICを束ねて冗長化・帯域拡張する技術。", "detail": "OS/ドライバレベルで複数の物理NICを論理的に1つにまとめ、可用性向上やスループット向上を図る機能。"}, {"cat": "イーサネット・LAN規格", "group": "リンク集約・冗長化(物理)", "word": "NICの冗長化", "short": "NICの故障に備えて予備回線・予備NICを用意する構成。", "detail": "アクティブ/スタンバイ方式などでNIC障害時にも通信を継続できるようにする冗長構成全般を指す。"}, {"cat": "イーサネット・LAN規格", "group": "物理接続・その他", "word": "MTU", "short": "1回の送信で扱える最大フレーム/パケットサイズ。", "detail": "Maximum Transmission Unit。これを超えるデータはフラグメント化(分割)されて送信される。"}, {"cat": "イーサネット・LAN規格", "group": "物理接続・その他", "word": "PCI Express", "short": "サーバ内蔵NICなどの高速拡張バス規格。", "detail": "マザーボードと拡張カード(NICなど)を接続する高速シリアルバス規格。"}, {"cat": "イーサネット・LAN規格", "group": "物理接続・その他", "word": "PoE、PoE+、PoE++", "short": "LANケーブルで電力を供給する技術とその世代。", "detail": "Power over Ethernet。データ通信線を使い機器(AP、IPカメラ等)へ給電する技術で、世代が上がるほど供給可能電力が増える。"}, {"cat": "無線LAN", "group": "無線LAN基本", "word": "IEEE802.11", "short": "無線LANの標準規格群。", "detail": "MAC層・物理層を規定するIEEEの無線LAN標準。11a/b/g/n/ac/axなど多数の拡張規格がある。"}, {"cat": "無線LAN", "group": "無線LAN基本", "word": "IEEE802.15", "short": "近距離無線通信(WPAN)の標準規格群。", "detail": "Bluetoothなど無線PAN(Personal Area Network)に関する標準を定めるIEEEの規格群。"}, {"cat": "無線LAN", "group": "無線LAN基本", "word": "無線PAN", "short": "数m程度の近距離無線ネットワーク。", "detail": "Personal Area Network。Bluetoothなど個人の身の回り機器同士を結ぶ近距離無線通信の総称。"}, {"cat": "無線LAN", "group": "無線LAN基本", "word": "Bluetooth", "short": "近距離無線通信の代表的な規格。", "detail": "2.4GHz帯を使う低消費電力の近距離無線通信規格。周辺機器接続などに使われる。"}, {"cat": "無線LAN", "group": "無線LAN基本", "word": "AP", "short": "無線LAN端末を収容する基地局機器。", "detail": "Access Point。無線クライアントを有線LANへ接続するブリッジの役割を果たす機器。"}, {"cat": "無線LAN", "group": "無線LAN基本", "word": "BSS", "short": "1台のAPが形成する無線LANの管理単位。", "detail": "Basic Service Set。1つのAPとそれに接続するクライアント群で構成される基本サービスセット。"}, {"cat": "無線LAN", "group": "無線LAN基本", "word": "ESS", "short": "複数APにより構成される広域の無線LANサービス範囲。", "detail": "Extended Service Set。同一SSIDを共有する複数BSSをまとめた拡張サービスセット。"}, {"cat": "無線LAN", "group": "無線LAN基本", "word": "SSID", "short": "無線LANのネットワーク識別子。", "detail": "Service Set Identifier。APやネットワークを識別するための名前。"}, {"cat": "無線LAN", "group": "無線LAN基本", "word": "ESSID", "short": "ESS単位のネットワーク識別子。", "detail": "複数APで構成されるESSを識別するためのSSID。実務上SSIDとほぼ同義に使われることが多い。"}, {"cat": "無線LAN", "group": "無線LAN基本", "word": "SSID隠蔽", "short": "SSIDのビーコン送出を止め見えにくくする設定。", "detail": "APがSSIDを含むビーコンフレームをブロードキャストしないよう設定し、一覧に表示されないようにする対策。ただし完全な秘匿にはならない。"}, {"cat": "無線LAN", "group": "無線LAN接続制御", "word": "ANY接続", "short": "SSIDを指定しない状態でAPに接続する動作。", "detail": "クライアントがSSIDを空欄にしてブロードキャストされているSSIDへ接続を試みる動作。"}, {"cat": "無線LAN", "group": "無線LAN接続制御", "word": "ANY接続拒否", "short": "SSID未指定での接続要求を拒否するAP側の設定。", "detail": "ANY接続によるSSID推測・不正接続を防ぐための設定。SSID自体は別途傍受可能なため万能ではない。"}, {"cat": "無線LAN", "group": "無線LAN接続制御", "word": "隠れ端末問題", "short": "互いの電波が届かない端末同士が衝突を検知できない問題。", "detail": "無線LANでは端末同士が互いを検知できずに同時送信し衝突が発生することがあり、これを隠れ端末問題と呼ぶ。RTS/CTSで緩和する。"}, {"cat": "無線LAN", "group": "無線LAN接続制御", "word": "RTS/CTS制御方式", "short": "送信前に予約を行い衝突を回避する制御方式。", "detail": "送信要求(RTS)と送信許可(CTS)を交換してから実データを送ることで隠れ端末問題による衝突を回避する仕組み。"}, {"cat": "無線LAN", "group": "無線LAN接続制御", "word": "CSMA/CA", "short": "無線LANで使われる衝突回避型のアクセス制御方式。", "detail": "Carrier Sense Multiple Access with Collision Avoidance。送信前にキャリアセンスを行い、衝突を検知ではなく回避する方式。"}, {"cat": "無線LAN", "group": "無線LAN接続制御", "word": "CSMA/CD", "short": "有線LANで使われる衝突検出型のアクセス制御方式。", "detail": "Carrier Sense Multiple Access with Collision Detection。送信中に衝突を検出し再送する古典的なイーサネットの制御方式。"}, {"cat": "無線LAN", "group": "無線LAN物理層", "word": "OFDM", "short": "複数の直交サブキャリアを使うデジタル変調方式。", "detail": "Orthogonal Frequency Division Multiplexing。無線LANや4Gなどで使われる、周波数利用効率の高い変調方式。"}, {"cat": "無線LAN", "group": "無線LAN物理層", "word": "OFDMA", "short": "OFDMのサブキャリアを複数ユーザで分割利用する多元接続方式。", "detail": "Orthogonal Frequency Division Multiple Access。Wi-Fi6(802.11ax)などで採用され、複数端末への同時割当効率を高める。"}, {"cat": "無線LAN", "group": "無線LAN物理層", "word": "MIMO", "short": "複数アンテナで複数の空間ストリームを同時伝送する技術。", "detail": "Multiple-Input Multiple-Output。送受信双方に複数アンテナを用い、同一周波数で複数のデータストリームを並行伝送し高速化する技術。"}, {"cat": "無線LAN", "group": "無線LAN物理層", "word": "MU-MIMO", "short": "複数端末に同時にMIMO伝送を行う技術。", "detail": "Multi User MIMO。1つのAPが複数の端末に対し同時に空間多重通信を行い実効スループットを高める技術。"}, {"cat": "無線LAN", "group": "無線LAN物理層", "word": "チャネルボンディング", "short": "複数の無線チャネルを束ねて帯域を広げる技術。", "detail": "隣接する複数のチャネルを結合し1回線あたりの帯域幅を広げることで高速化を図る技術。"}, {"cat": "無線LAN", "group": "無線LAN物理層", "word": "デュアルバンド", "short": "2.4GHzと5GHzの2つの周波数帯に対応すること。", "detail": "無線LAN機器が2つの周波数帯を同時または切替で利用できる機能。"}, {"cat": "無線LAN", "group": "無線LAN物理層", "word": "トライバンド", "short": "2.4GHz・5GHzに加えもう1つの帯域(5GHz2本など)に対応すること。", "detail": "3つの周波数帯(または帯域)を同時利用できる無線LAN機器の機能で、混雑回避や高速化に寄与する。"}, {"cat": "無線LAN", "group": "無線LAN物理層", "word": "ISMバンド", "short": "免許不要で利用できる産業科学医療用周波数帯。", "detail": "Industry-Science-Medical band。2.4GHz帯など免許不要で機器が使える周波数帯で、無線LANやBluetoothもここを利用する。"}, {"cat": "無線LAN", "group": "無線LAN物理層", "word": "クアッドバンド", "short": "携帯電話等が4つの周波数帯に対応すること。", "detail": "複数国・複数事業者の周波数帯4つに対応する端末の特性を表す用語。"}, {"cat": "無線LAN", "group": "無線LANコントローラ方式", "word": "無線LANコントローラ", "short": "複数APを集中管理する装置。", "detail": "WLC(Wireless LAN Controller)。多数のAPの設定・チャネル・電波出力・ローミング制御などを集中管理する装置。"}, {"cat": "無線LAN", "group": "無線LANコントローラ方式", "word": "WLC", "short": "無線LANコントローラの略称。", "detail": "Wireless LAN Controller。複数のAPを集中管理し、認証・チャネル割当・ローミングなどを一元制御する装置。"}, {"cat": "無線LAN", "group": "無線LANコントローラ方式", "word": "仮想AP機能", "short": "1台の物理APで複数のSSID(仮想AP)を提供する機能。", "detail": "1つの物理APが複数のSSID・VLANを持つ仮想的な複数APとして動作させる機能。"}, {"cat": "無線LAN", "group": "無線LANコントローラ方式", "word": "ローミング", "short": "端末が移動しながらAP間を切り替えて通信を継続すること。", "detail": "クライアントが複数APのエリアを移動する際、接続先APを切り替えても通信セッションを維持する仕組み。"}, {"cat": "無線LAN", "group": "無線LANコントローラ方式", "word": "ローミング機能", "short": "ローミングを実現するための各種制御機能。", "detail": "高速な認証切替(802.11rなど)を含む、AP間ハンドオーバを円滑にするための機能群。"}, {"cat": "無線LAN", "group": "無線LAN管理", "word": "ビーコン", "short": "APが定期的に発信する報知フレーム。", "detail": "SSIDや対応レートなどネットワーク情報を周囲に知らせるためAPが一定間隔で送信する管理フレーム。"}, {"cat": "無線LAN", "group": "無線LAN管理", "word": "ビーコン信号", "short": "ビーコンフレームによる報知電波。", "detail": "ビーコンフレームが実際に送出される電波信号を指す表現。"}, {"cat": "無線LAN", "group": "無線LAN管理", "word": "パッシブスキャン", "short": "ビーコンを待ち受けて周囲のAPを探す方式。", "detail": "クライアントが自らプローブ要求を送らず、APからのビーコンを受信して利用可能なネットワークを検出する方式。"}, {"cat": "無線LAN", "group": "無線LAN管理", "word": "媒体共有型", "short": "無線LANのように伝送媒体(空間)を複数端末で共有する形態。", "detail": "有線の専用線と異なり、電波という媒体を複数端末が共有してアクセスする形態を指す。"}, {"cat": "無線LAN", "group": "無線LANセキュリティ", "word": "WEP", "short": "初期の脆弱な無線LAN暗号化方式。", "detail": "Wired Equivalent Privacy。RC4を使うが鍵管理の脆弱性により容易に解読可能で現在は非推奨。"}, {"cat": "無線LAN", "group": "無線LANセキュリティ", "word": "WPA", "short": "WEPの脆弱性を改善した無線LAN暗号化規格。", "detail": "Wi-Fi Protected Access。TKIPを用いてWEPより強固な鍵管理・暗号化を実現した規格。"}, {"cat": "無線LAN", "group": "無線LANセキュリティ", "word": "WPA2", "short": "AES-CCMPを採用した無線LAN暗号化規格。", "detail": "WPAの後継でAESベースのCCMPを必須とし、より強固なセキュリティを提供する規格。"}, {"cat": "無線LAN", "group": "無線LANセキュリティ", "word": "WPA3", "short": "SAEを採用した最新の無線LAN暗号化規格。", "detail": "WPA2の脆弱性(KRACK等)を踏まえ、より安全な鍵交換(SAE)などを導入した最新規格。"}, {"cat": "無線LAN", "group": "無線LANセキュリティ", "word": "Wi-Fi Alliance", "short": "無線LAN機器の相互接続性を認証する業界団体。", "detail": "WPA/WPA2/WPA3などの認証プログラムを策定・運用し、Wi-Fi機器の相互運用性を保証する業界団体。"}, {"cat": "無線LAN", "group": "無線LANセキュリティ", "word": "エンタープライズモード", "short": "IEEE802.1X/RADIUSを用いる企業向け認証モード。", "detail": "WPA/WPA2/WPA3において、ユーザーごとの個別認証(EAP+RADIUS)を行う企業向けモード。"}, {"cat": "無線LAN", "group": "無線LANセキュリティ", "word": "パーソナルモード", "short": "事前共有鍵(PSK)による簡易な認証モード。", "detail": "WPA/WPA2/WPA3において、全端末が共通の事前共有鍵を使う家庭向けの簡易モード。"}, {"cat": "無線LAN", "group": "無線LANセキュリティ", "word": "PSK", "short": "無線LANで事前に共有しておく鍵。", "detail": "Pre-Shared Key。パーソナルモードで使われる、AP・クライアント間で事前に設定しておく共通鍵。"}, {"cat": "無線LAN", "group": "無線LANセキュリティ", "word": "PMK", "short": "4ウェイハンドシェークの元になるマスター鍵。", "detail": "Pairwise Master Key。認証結果やPSKから導出され、PTK生成の基になるマスター鍵。"}, {"cat": "無線LAN", "group": "無線LANセキュリティ", "word": "PTK", "short": "端末ごとに生成される一時的な暗号鍵。", "detail": "Pairwise Transient Key。PMKから4ウェイハンドシェークにより導出される、通信を暗号化する実際の鍵。"}, {"cat": "無線LAN", "group": "無線LANセキュリティ", "word": "GTK", "short": "ブロードキャスト/マルチキャスト通信用の共通鍵。", "detail": "Group Transient Key。APが配下の全クライアントへ配布する、グループ通信暗号化用の鍵。"}, {"cat": "無線LAN", "group": "無線LANセキュリティ", "word": "GMK", "short": "GTKの元になるグループマスター鍵。", "detail": "Group Master Key。GTKを生成するためのAP内部のマスター鍵。"}, {"cat": "無線LAN", "group": "無線LANセキュリティ", "word": "4ウェイハンドシェーク", "short": "WPA/WPA2で暗号鍵を安全に共有する4回のやり取り。", "detail": "APとクライアント間でPMKを基にPTK・GTKを生成・共有するための4回のEAPOLメッセージ交換。盗聴・解析がパスワードクラックの起点にされることもある。"}, {"cat": "無線LAN", "group": "無線LANセキュリティ", "word": "IEEE802.11i", "short": "無線LANのセキュリティ強化を定めた標準。", "detail": "WPA2のベースとなった標準で、CCMP(AES)による強固な暗号化と認証の枠組みを規定する。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPアドレス基本", "word": "IPアドレス", "short": "ネットワーク上の機器を識別する論理アドレス。", "detail": "IPv4/IPv6において通信相手を一意に識別するための階層的なアドレス。ネットワーク部とホスト部から構成される。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPアドレス基本", "word": "IPv6", "short": "128ビットの次世代IPアドレス体系。", "detail": "アドレス枯渇に対応する次世代プロトコルで、アドレス長がIPv4の32ビットから128ビットに拡張されている。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPアドレス基本", "word": "限定的ブロードキャストアドレス", "short": "255.255.255.255で表される、同一セグメント内全体宛のアドレス。", "detail": "ルータを越えて転送されない、自セグメント内の全ホスト宛てのブロードキャストアドレス。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPアドレス基本", "word": "ブロードキャストアドレス", "short": "セグメント内の全ホストへ一斉送信するためのアドレス。", "detail": "ホスト部が全ビット1になったアドレスで、そのネットワーク内の全端末へ届く。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPアドレス基本", "word": "制限ブロードキャストアドレス", "short": "限定的ブロードキャストアドレスの別称。", "detail": "255.255.255.255を指し、ルータを越えない自セグメント限定のブロードキャストに使われる。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPアドレス基本", "word": "ブロードキャストドメイン", "short": "ブロードキャストが到達する範囲。", "detail": "同一のブロードキャストが届く範囲を指し、通常はルータで区切られる(VLANでも分割可能)。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPアドレス基本", "word": "ブロードキャストパケット", "short": "宛先が全ホストであるパケット。", "detail": "ネットワーク内の全ホストに配送されるよう宛先アドレスが設定されたパケット。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPアドレス基本", "word": "ブロードキャストマルチアクセス", "short": "複数端末が同一媒体でブロードキャスト可能な接続形態。", "detail": "イーサネットのように、1つの伝送路上で複数ノードが直接ブロードキャスト通信できるネットワーク形態。OSPFのネットワークタイプの一つ。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPアドレス基本", "word": "非ブロードキャストマルチアクセス", "short": "ブロードキャストができない複数アクセス媒体。", "detail": "NBMA。フレームリレーなど、複数ノードは接続されるがブロードキャスト機能を持たないネットワーク形態。OSPFでは特別な設定が必要。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPアドレス基本", "word": "NBMA", "short": "非ブロードキャストマルチアクセスの略称。", "detail": "Non-Broadcast Multi-Access。ブロードキャスト機能のない多重アクセス網で、OSPFのネイバー設定などに影響する。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPアドレス基本", "word": "マルチキャストアドレス", "short": "特定グループ宛に送信するためのアドレス。", "detail": "1対多だが全ホストではなく、特定のグループに参加したホストのみが受信するアドレス。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPアドレス基本", "word": "予約されたマルチキャストアドレス", "short": "用途があらかじめ決められているマルチキャストアドレス。", "detail": "224.0.0.0/24などIANAにより特定プロトコル(OSPF、RIPv2等)用に予約されているアドレス範囲。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPアドレス基本", "word": "ユニキャストアドレス", "short": "1対1通信に使われるアドレス。", "detail": "特定の1台のホストのみを宛先とする通常のIPアドレス形態。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPアドレス基本", "word": "ユニキャストパケット", "short": "宛先が単一ホストであるパケット。", "detail": "1対1の通信で送受信される、宛先が特定の1台のみのパケット。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPアドレス基本", "word": "プライベートアドレス", "short": "組織内など閉域網で自由に使えるIPアドレス。", "detail": "RFC1918で定められた、インターネット上でルーティングされない予約アドレス範囲(10.0.0.0/8等)。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPアドレス基本", "word": "ループバックアドレス", "short": "自ホスト自身を指すアドレス。", "detail": "127.0.0.1(IPv4)や::1(IPv6)など、自分自身宛の通信をテストする際に使うアドレス。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPアドレス基本", "word": "ループバックインタフェース", "short": "物理NICに依存しない仮想インタフェース。", "detail": "常にUP状態を保つ論理インタフェースで、ルータIDの固定や管理アクセス用途に使われる。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPアドレス基本", "word": "リンクローカルアドレス", "short": "同一リンク内でのみ有効なアドレス。", "detail": "IPv6のfe80::/10など、ルーティングされずリンク内のみで通信に使われるアドレス。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPアドレス基本", "word": "IPアドレス重複の検出", "short": "同一セグメント内でのIPアドレス重複を検知する仕組み。", "detail": "無償ARP(Gratuitous ARP)などを利用し、同じIPアドレスを持つ機器が既に存在しないか確認する仕組み。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPパケット構造", "word": "IPパケット", "short": "IP層で転送される通信データの単位。", "detail": "IPヘッダとペイロードから構成される、ネットワーク層でルーティングされるデータの単位。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPパケット構造", "word": "IPデータグラム", "short": "コネクションレス型で転送されるIPパケットの呼称。", "detail": "IPは信頼性を保証しないコネクションレス型であるため、その転送単位をデータグラムと呼ぶ。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPパケット構造", "word": "IPヘッダ", "short": "IPパケットの制御情報部分。", "detail": "送信元/宛先アドレス、TTL、プロトコル番号などを含む、IPパケット先頭の制御情報。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPパケット構造", "word": "TTL", "short": "パケットが転送可能なホップ数の上限。", "detail": "Time To Live。ルータを通過するたびに1減算され、0になるとパケットは破棄されループを防止する。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPパケット構造", "word": "プロトコル番号", "short": "IPヘッダ内で上位プロトコルを示す番号。", "detail": "TCP=6、UDP=17など、IPペイロードがどのプロトコルかを示すフィールド値。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPパケット構造", "word": "フラグメント", "short": "MTUを超えるパケットを分割したもの。", "detail": "MTUより大きいIPパケットを送信する際、複数の断片(フラグメント)に分割したもの。"}, {"cat": "IPアドレス・ARP・NAT", "group": "IPパケット構造", "word": "フラグメントオフセット", "short": "分割されたパケットの元データ内での位置を示す値。", "detail": "フラグメント化されたパケットを受信側が正しい順序で再構成するための、元データ内オフセットを示すフィールド。"}, {"cat": "IPアドレス・ARP・NAT", "group": "ARP", "word": "ARP", "short": "IPアドレスからMACアドレスを解決するプロトコル。", "detail": "Address Resolution Protocol。同一LANセグメント内で宛先IPアドレスに対応するMACアドレスを問い合わせるために使われる。"}, {"cat": "IPアドレス・ARP・NAT", "group": "ARP", "word": "ARPキャッシュ", "short": "解決済みのIP-MAC対応関係を一時保存する仕組み。", "detail": "ARP要求の都度の送信を避けるため、一定時間ホストが保持するテーブル。ARPスプーフィングの標的にもなる。"}, {"cat": "IPアドレス・ARP・NAT", "group": "ARP", "word": "ARPテーブル", "short": "ARPキャッシュの実体である対応表。", "detail": "IPアドレスとMACアドレスの対応を保持するテーブルで、OSやルータ・スイッチが内部に保持する。"}, {"cat": "IPアドレス・ARP・NAT", "group": "ARP", "word": "RARP", "short": "MACアドレスからIPアドレスを求める逆方向のARP。", "detail": "Reverse ARP。古いディスクレスワークステーション等で自身のIPアドレスを取得するために使われた、ARPと逆方向のプロトコル。"}, {"cat": "IPアドレス・ARP・NAT", "group": "ARP", "word": "Gratuitous ARP", "short": "自分のIP-MAC対応を周囲に通知する無償のARP。", "detail": "送信元・宛先IPを自分自身に設定して送るARP要求で、アドレス重複検知やフェイルオーバー時のARPテーブル更新に使われる。"}, {"cat": "IPアドレス・ARP・NAT", "group": "ARP", "word": "Proxy ARP", "short": "別セグメントの機器の代わりにルータがARP応答すること。", "detail": "ルータが本来応答すべきでないARP要求に代理応答し、異なるセグメント間でもあたかも同一セグメントのように通信させる仕組み。"}, {"cat": "IPアドレス・ARP・NAT", "group": "NAT", "word": "NAT", "short": "IPアドレスを変換する技術の総称。", "detail": "Network Address Translation。プライベートアドレスとグローバルアドレスなどを相互変換し、アドレス変換・秘匿を行う技術。"}, {"cat": "IPアドレス・ARP・NAT", "group": "NAT", "word": "NAT機能", "short": "NATを実現する装置・ソフトウェアの機能。", "detail": "ルータやFWが持つ、パケット通過時にアドレスを書き換える処理機能全般を指す。"}, {"cat": "IPアドレス・ARP・NAT", "group": "NAT", "word": "NAPT", "short": "IPアドレスとポート番号を組み合わせて変換する技術。", "detail": "Network Address Port Translation。1つのグローバルアドレスを複数の内部ホストで共有できるようポート番号も含めて変換する(いわゆるIPマスカレード)。"}, {"cat": "IPアドレス・ARP・NAT", "group": "NAT", "word": "IPマスカレード", "short": "複数内部ホストが1つのグローバルアドレスを共有する変換方式。", "detail": "NAPTの実装の一つで、Linuxなどでの呼び名。ポート番号により内部ホストを区別し1つの外部アドレスを共有する。"}, {"cat": "IPアドレス・ARP・NAT", "group": "NAT", "word": "静的NAT", "short": "IPアドレスを1対1で固定的に変換する方式。", "detail": "内部アドレスと外部アドレスを固定的に1対1でマッピングするNAT方式で、外部から特定サーバへの接続などに使う。"}, {"cat": "IPアドレス・ARP・NAT", "group": "NAT", "word": "NAT越え", "short": "NAT環境を越えてEnd-to-End通信を成立させること全般。", "detail": "NAT配下の端末同士やNAT配下からの着信通信を成立させるための各種技術・工夫の総称。"}, {"cat": "IPアドレス・ARP・NAT", "group": "NAT", "word": "NATトラバーサル", "short": "NAT環境でIPsecやSIP等の通信を成立させる技術。", "detail": "NAT Traversal。IPsecのESPをUDPでカプセル化するなど、NAT配下でもend-to-endの通信を可能にする技術。"}, {"cat": "IPアドレス・ARP・NAT", "group": "NAT", "word": "VPNパススルー", "short": "NATルータ配下でVPN通信を透過させる機能。", "detail": "家庭用ルータ等が持つ、PPTPやIPsecなどのVPNプロトコルをNAT越しに正しく中継するための機能。"}, {"cat": "TCP・UDP", "group": "TCP基本", "word": "TCP", "short": "コネクション型で信頼性を保証するトランスポート層プロトコル。", "detail": "Transmission Control Protocol。3ウェイハンドシェークによる接続確立、順序制御・再送制御・フロー制御・輻輳制御により信頼性の高い通信を提供する。"}, {"cat": "TCP・UDP", "group": "TCP基本", "word": "TCPヘッダ", "short": "TCPセグメントの制御情報部分。", "detail": "送信元/宛先ポート番号、シーケンス番号、確認応答番号、コントロールフラグ、ウィンドウサイズなどを含む制御情報。"}, {"cat": "TCP・UDP", "group": "TCP基本", "word": "TCPセグメント", "short": "TCP層で転送されるデータの単位。", "detail": "TCPヘッダとデータから構成される、TCPにおける転送単位。"}, {"cat": "TCP・UDP", "group": "TCP基本", "word": "TCPコネクション", "short": "3ウェイハンドシェークにより確立される論理的な通信路。", "detail": "送信元・宛先のIPアドレスとポート番号の組で識別される、TCPの論理的な通信セッション。"}, {"cat": "TCP・UDP", "group": "TCP基本", "word": "TCP通信", "short": "TCPを用いたコネクション型の通信全般。", "detail": "コネクション確立・データ転送・切断という一連の手順を伴う、信頼性のある通信方式。"}, {"cat": "TCP・UDP", "group": "TCP基本", "word": "コネクション確立フェーズ", "short": "3ウェイハンドシェークによりTCP接続を開始する段階。", "detail": "SYN→SYN/ACK→ACKの3回のやり取りによりTCPコネクションを確立するフェーズ。"}, {"cat": "TCP・UDP", "group": "TCP基本", "word": "コネクション切断フェーズ", "short": "4ウェイでTCP接続を終了する段階。", "detail": "FIN/ACKのやり取りにより双方向の通信を段階的に終了させるフェーズ。"}, {"cat": "TCP・UDP", "group": "TCPフラグ・制御", "word": "ACK", "short": "受信確認を示すTCPフラグ。", "detail": "Acknowledgement。TCPヘッダ内のコントロールフラグの一つで、セグメントを正常に受信したことを相手に通知する。"}, {"cat": "TCP・UDP", "group": "TCPフラグ・制御", "word": "ACK制御方式", "short": "ACKの送信タイミングを制御する方式の総称。", "detail": "毎セグメントごとにACKを返す方式や、複数セグメントをまとめて確認応答する遅延ACK方式などがあり、スループットや輻輳制御に影響する。"}, {"cat": "TCP・UDP", "group": "TCPフラグ・制御", "word": "SYN", "short": "接続開始を要求するTCPフラグ。", "detail": "Synchronize。3ウェイハンドシェークの最初のセグメントに立てられ、シーケンス番号の同期を要求する。"}, {"cat": "TCP・UDP", "group": "TCPフラグ・制御", "word": "FIN", "short": "接続終了を要求するTCPフラグ。", "detail": "Finish。送信側がこれ以上送るデータがないことを通知し、コネクション終了処理を開始するフラグ。"}, {"cat": "TCP・UDP", "group": "TCPフラグ・制御", "word": "RST", "short": "強制的に接続をリセットするTCPフラグ。", "detail": "Reset。異常なセグメント受信時などに接続を即座に強制切断するために使われるフラグ。"}, {"cat": "TCP・UDP", "group": "TCPフラグ・制御", "word": "PSH", "short": "バッファリングせず即座にデータを上位へ渡すことを促すフラグ。", "detail": "Push。受信側にバッファに溜めずアプリケーションへ即座にデータを渡すよう指示するフラグ。"}, {"cat": "TCP・UDP", "group": "TCPフラグ・制御", "word": "URG", "short": "緊急データが含まれることを示すフラグ。", "detail": "Urgent。緊急ポインタフィールドが有効であることを示すフラグ。"}, {"cat": "TCP・UDP", "group": "TCPフラグ・制御", "word": "ECE", "short": "明示的輻輳通知を受け取ったことを示すTCPフラグ。", "detail": "ECN-Echo。IPヘッダのECNマーキングを受信したことを相手に通知するためのTCPフラグ。"}, {"cat": "TCP・UDP", "group": "TCPフラグ・制御", "word": "CWR", "short": "輻輳ウィンドウを縮小したことを通知するTCPフラグ。", "detail": "Congestion Window Reduced。ECN通知を受けて輻輳ウィンドウを縮小したことを相手に伝えるフラグ。"}, {"cat": "TCP・UDP", "group": "TCP接続制御", "word": "TCP接続リセット", "short": "異常時などに強制的にTCPコネクションを切断する動作。", "detail": "RSTフラグを使って通常の4ウェイ切断手順を経ずに即座にコネクションを終了させる動作。"}, {"cat": "TCP・UDP", "group": "TCP接続制御", "word": "TCPの53番ポート", "short": "DNSがゾーン転送などで使うTCPポート。", "detail": "DNSは通常UDP53番だが、応答が大きい場合やゾーン転送時にはTCP53番ポートが使われる。"}, {"cat": "TCP・UDP", "group": "フロー制御・輻輳制御", "word": "ウィンドウサイズ", "short": "一度に送信を許可されるデータ量を示す値。", "detail": "TCPヘッダ内のフィールドで、受信バッファの空き容量を送信側に伝えフロー制御を行うために使われる。"}, {"cat": "TCP・UDP", "group": "フロー制御・輻輳制御", "word": "スライディングウィンドウ方式", "short": "ACKを待たず連続してデータを送るフロー制御方式。", "detail": "ウィンドウサイズの範囲内であれば複数セグメントをACK待ちせず連続送信できる方式で、TCPのスループット向上に寄与する。"}, {"cat": "TCP・UDP", "group": "フロー制御・輻輳制御", "word": "ゼロウィンドウ", "short": "受信バッファが満杯でこれ以上受信できない状態。", "detail": "受信側がウィンドウサイズ0を通知し、送信側に一時送信停止を求める状態。"}, {"cat": "TCP・UDP", "group": "フロー制御・輻輳制御", "word": "ウィンドウプローブ", "short": "ゼロウィンドウ解消を確認するための小さな問い合わせ。", "detail": "ゼロウィンドウ通知後、送信側が定期的に小さなセグメントを送りウィンドウが空いたか確認する動作。"}, {"cat": "TCP・UDP", "group": "フロー制御・輻輳制御", "word": "スロースタートアルゴリズム", "short": "輻輳制御において送信量を段階的に増加させる方式。", "detail": "接続開始直後は輻輳ウィンドウを小さく保ち、ACK受信ごとに段階的に増加させることでネットワーク輻輳を回避する仕組み。"}, {"cat": "TCP・UDP", "group": "フロー制御・輻輳制御", "word": "再送タイムアウト", "short": "ACKが届かない場合に再送を行うまでの待機時間。", "detail": "RTO(Retransmission TimeOut)。この時間内にACKが届かないとセグメントは再送される。"}, {"cat": "TCP・UDP", "group": "フロー制御・輻輳制御", "word": "RTO", "short": "再送タイムアウトの略称。", "detail": "Retransmission TimeOut。RTTの実測値に基づき動的に計算される再送待機時間。"}, {"cat": "TCP・UDP", "group": "フロー制御・輻輳制御", "word": "RTT", "short": "パケット往復にかかる時間。", "detail": "Round Trip Time。送信から応答受信までの時間で、RTO計算などの基礎値として使われる。"}, {"cat": "TCP・UDP", "group": "フロー制御・輻輳制御", "word": "再送処理", "short": "ACKが届かないセグメントを再度送信する処理。", "detail": "パケットロス等でACKが返ってこない場合に、TCPが自動的に同じデータを再送する仕組み。"}, {"cat": "TCP・UDP", "group": "フロー制御・輻輳制御", "word": "再送", "short": "再送処理により同一データを再度送信すること。", "detail": "一度送信したが確認応答が得られなかったデータを、信頼性確保のため再度送信すること。"}, {"cat": "TCP・UDP", "group": "フロー制御・輻輳制御", "word": "輻輳制御", "short": "ネットワーク混雑を検知し送信量を調整する仕組み。", "detail": "パケットロスや遅延増大を輻輳の兆候として検知し、送信量を抑制・回復させるTCPの制御機構。"}, {"cat": "TCP・UDP", "group": "フロー制御・輻輳制御", "word": "輻輳ウィンドウ", "short": "輻輳制御により決まる実際の送信可能量。", "detail": "受信側が通知するウィンドウサイズとは別に、輻輳状況に応じて送信側が自律的に管理する送信量の上限。"}, {"cat": "TCP・UDP", "group": "フロー制御・輻輳制御", "word": "輻輳回避アルゴリズム", "short": "輻輳ウィンドウを緩やかに増加させる制御方式。", "detail": "スロースタート後、輻輳ウィンドウの増加を線形的に緩やかにし、輻輳の再発を防ぐアルゴリズム。"}, {"cat": "TCP・UDP", "group": "UDP", "word": "UDP", "short": "コネクションレス型で信頼性を保証しないトランスポート層プロトコル。", "detail": "User Datagram Protocol。ハンドシェークや再送制御を行わず、低遅延・低オーバーヘッドが求められる用途(DNS、ストリーミング等)で使われる。"}, {"cat": "TCP・UDP", "group": "UDP", "word": "UDPヘッダ", "short": "UDPデータグラムの制御情報部分。", "detail": "送信元/宛先ポート番号、長さ、チェックサムのみを含む、TCPより単純なヘッダ構造。"}, {"cat": "TCP・UDP", "group": "UDP", "word": "UDPデータグラム", "short": "UDP層で転送されるデータの単位。", "detail": "UDPヘッダとデータから構成される転送単位で、TCPのような順序保証・再送はない。"}, {"cat": "TCP・UDP", "group": "UDP", "word": "UDP通信", "short": "UDPを用いたコネクションレス型の通信全般。", "detail": "接続確立の手順を持たず、送りたい時にすぐデータを送信できる通信方式。"}, {"cat": "TCP・UDP", "group": "UDP", "word": "チェックサム", "short": "データ破損検知のための検査値。", "detail": "TCP/UDP/IPヘッダに含まれる誤り検出用の値で、受信側で再計算し一致するか確認する。"}, {"cat": "TCP・UDP", "group": "ポート番号", "word": "ポート番号", "short": "トランスポート層でアプリケーションを識別する番号。", "detail": "IPアドレスに加えポート番号を組み合わせることで、同一ホスト上の複数アプリケーションを識別する。"}, {"cat": "TCP・UDP", "group": "ポート番号", "word": "ウェルノウンポート番号", "short": "0〜1023の標準的な用途が決められたポート番号。", "detail": "HTTP(80)やSMTP(25)など、代表的なサービスに割り当てられている予約済みのポート番号帯。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "経路制御", "short": "パケットの転送先を決定する仕組み全般。", "detail": "ルーティング全般を指す用語で、静的・動的経路制御を含む宛先決定の仕組み。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "経路選択", "short": "複数の候補経路から使用する経路を決めること。", "detail": "ルーティングテーブル内に複数経路がある場合、メトリックやアドミニストレイティブディスタンスにより最適経路を選ぶこと。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "ルーティング", "short": "経路情報に基づきパケットを転送する処理。", "detail": "宛先IPアドレスに応じて次にパケットを送るべきインタフェース/ネクストホップを決定し転送する処理。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "ルーティングテーブル", "short": "経路情報を保持するテーブル。", "detail": "宛先ネットワーク、ネクストホップ、メトリック等を保持し経路選択に使われるテーブル。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "静的経路制御", "short": "管理者が手動で経路を設定する方式。", "detail": "スタティックルーティング。ネットワーク変化に自動追従しないが、シンプルで負荷が低い。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "スタティックルーティング", "short": "静的経路制御の英語表記。", "detail": "管理者が固定的に設定する経路情報で、動的経路制御プロトコルを使わない方式。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "動的経路制御", "short": "ルーティングプロトコルにより自動的に経路を学習・更新する方式。", "detail": "OSPF、BGP、RIPなどのプロトコルにより近隣ルータと経路情報を交換し自動で最適経路を維持する方式。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "動的経路制御プロトコル", "short": "動的経路制御を実現するプロトコルの総称。", "detail": "RIP、OSPF、BGP等、経路情報を自動的に交換・更新するためのプロトコル群を指す。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "フローティングスタティック", "short": "動的経路が使えない場合のバックアップとして設定する静的経路。", "detail": "アドミニストレイティブディスタンスを高く設定した静的経路で、通常時は使われず動的経路障害時のみ有効化される。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "デフォルトルート", "short": "経路表に一致がない場合に使われる既定の経路。", "detail": "0.0.0.0/0のようにすべての宛先にマッチする経路で、他に合致する経路がない場合の最終的な転送先となる。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "アドミニストレイティブディスタンス", "short": "経路情報の信頼度を示す値。", "detail": "AD。同一宛先に対し複数のプロトコルから経路情報を得た場合に、どちらを優先するか決める信頼性指標(値が小さいほど優先)。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "経路集約", "short": "複数の経路情報を1つにまとめること。", "detail": "サマライゼーション。連続するネットワークアドレスを1つの上位アドレスにまとめ、ルーティングテーブルのエントリ数を削減する。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "経路ベクトル方式", "short": "経路情報とその方向(ベクトル)を交換する経路制御方式。", "detail": "隣接ルータから受け取った経路とAS_PATH等の付加情報をもとに経路を選択する方式で、BGPが該当する。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "距離ベクトル方式", "short": "隣接ルータとの経路情報とメトリック(距離)のみを交換する方式。", "detail": "RIPが代表例で、リンク状態の詳細を持たず、隣接ルータから受け取った距離情報のみで経路を計算する。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "ダイクストラ", "short": "最短経路を計算するアルゴリズム。", "detail": "Dijkstra法。OSPFなどリンクステート型プロトコルで、リンクステートデータベースから最短経路木を計算するために使われる。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "負荷分散", "short": "複数経路や複数機器にトラフィックを分散させること。", "detail": "同コストの複数経路や複数サーバに処理・トラフィックを振り分け、特定箇所への負荷集中を避ける手法。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "負荷分散型", "short": "負荷分散を目的とした構成方式の分類。", "detail": "冗長構成のうち、複数の経路や機器に処理を分散させることを主目的とする方式を指す分類。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "負荷分散アルゴリズム", "short": "負荷分散の割り振り方法。", "detail": "ラウンドロビンや最小コネクション数などトラフィック・処理をどう振り分けるか決めるロジック。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "負荷分散装置", "short": "負荷分散を行う専用機器。", "detail": "ロードバランサ。複数サーバへのアクセスを振り分け、可用性・性能を向上させる装置。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "ラウンドロビン", "short": "順番に均等に割り当てる負荷分散方式。", "detail": "接続要求を複数の宛先に順番に均等に割り振る単純な負荷分散アルゴリズム。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "最小コネクション数", "short": "現在の接続数が最も少ない宛先へ割り振る方式。", "detail": "負荷分散アルゴリズムの一つで、各サーバの現在の接続数を比較し最も空いているサーバへ振り分ける。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "重み", "short": "負荷分散において宛先ごとの割当比率を決める値。", "detail": "サーバの処理能力差などに応じて振り分け比率に重み付けを行うための設定値。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "振り分け方式", "short": "負荷分散でトラフィックを割り当てる方法の総称。", "detail": "ラウンドロビン、最小コネクション数、重み付けなど、負荷分散の割当ロジック全般を指す。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "トラフィック分析", "short": "通信量やパターンを解析すること。", "detail": "経路設計や障害対応、性能改善のためトラフィックの傾向・量を調べる作業。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "経路MTU", "short": "経路上で許容される最大MTUのこと。", "detail": "Path MTU。送信元から宛先までの経路上で最も小さいMTU値のことで、これを超えるパケットはフラグメント化が必要になる。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "経路制御基本", "word": "ポリシーベースルーティング", "short": "宛先アドレス以外の条件で経路を決める方式。", "detail": "送信元アドレスやプロトコル種別などの条件に基づき、通常のルーティングテーブルとは異なる経路へ転送する仕組み。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "OSPF", "word": "OSPF", "short": "リンクステート型の代表的なIGP。", "detail": "Open Shortest Path First。各ルータがリンクステート情報をデータベースとして持ち、ダイクストラ法で最短経路を計算する動的経路制御プロトコル。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "OSPF", "word": "エリア", "short": "OSPFにおける経路情報の管理単位。", "detail": "OSPFネットワークを分割する論理的な範囲で、エリア内はリンクステート情報を共有し、エリア間はABRが要約情報を中継する。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "OSPF", "word": "エリア分割", "short": "OSPFネットワークを複数エリアに分けること。", "detail": "大規模ネットワークでLSDBの肥大化や再計算負荷を抑えるため、バックボーンエリア(エリア0)を中心に複数エリアへ分割する設計。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "OSPF", "word": "エリア境界ルータ", "short": "複数エリアに接続するOSPFルータ。", "detail": "ABR(Area Border Router)。エリア間の経路情報(要約LSA)を中継する役割を担う。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "OSPF", "word": "ABR", "short": "エリア境界ルータの略称。", "detail": "Area Border Router。複数OSPFエリアに所属し、エリア間の経路情報を要約・中継するルータ。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "OSPF", "word": "LSA", "short": "OSPFがやり取りする経路情報の単位。", "detail": "Link State Advertisement。リンク状態(接続関係、コスト等)を広告するためのOSPFメッセージ。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "OSPF", "word": "LSB", "short": "バイト内の最下位ビットを指す一般用語。", "detail": "Least Significant Bit。IPアドレスやフラグの解釈で用いられる、値の中で最も影響の小さいビット位置。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "OSPF", "word": "隣接関係", "short": "OSPFルータ同士が経路情報を交換する状態。", "detail": "アジェセンシー(Adjacency)。Helloパケットのやり取りを経て確立される、LSAを交換し合う関係。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "OSPF", "word": "アジェセンシー", "short": "隣接関係の英語表記。", "detail": "OSPFルータ間でLSDBを同期し合う完全な隣接状態を指す。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "OSPF", "word": "ネイバー", "short": "OSPFで直接Helloパケットを交換する相手ルータ。", "detail": "隣接関係になる前段階として、Helloパケットを検知し合っているルータ同士の関係。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "OSPF", "word": "Helloパケット", "short": "OSPFルータ間で定期的にやり取りされる生存確認パケット。", "detail": "隣接ルータの発見・維持のために送信される制御パケットで、パラメータ不一致があるとネイバーは形成されない。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "OSPF", "word": "DR", "short": "マルチアクセス網でLSAの中継を代表するルータ。", "detail": "Designated Router。ブロードキャスト型ネットワークでLSAのフラッディングを効率化するため選出される代表ルータ。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "OSPF", "word": "BDR", "short": "DRのバックアップルータ。", "detail": "Backup Designated Router。DR障害時に即座にDRの役割を引き継ぐために選出される予備ルータ。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "OSPF", "word": "バックアップ代表ルータ", "short": "BDRの日本語表記。", "detail": "DR障害時に代替するため待機している代表ルータ。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "OSPF", "word": "マスタルータ", "short": "OSPFデータベース交換時に主導権を持つルータ。", "detail": "隣接関係確立時のデータベース記述(DBD)交換で、シーケンス番号の制御を主導する側のルータ。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "OSPF", "word": "スタブエリア", "short": "外部経路情報を持ち込まない特殊なOSPFエリア。", "detail": "エリア内のLSDBサイズを抑えるため、外部ASからの経路情報の流入を制限したエリア。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "OSPF", "word": "スタブネットワーク", "short": "隣接ルータを持たない末端のネットワーク。", "detail": "他のルータへの接続がない、経路の末端となるネットワークセグメント。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "BGP", "short": "AS間で経路情報を交換する経路ベクトル型のEGP。", "detail": "Border Gateway Protocol。インターネット全体の経路制御を担う、AS番号やパスアトリビュートを用いた経路ベクトル型プロトコル。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "BGPピア", "short": "BGPで経路交換を行う相手ルータとの関係。", "detail": "TCP179番ポート上でBGPセッションを確立した相手ルータとの関係を指す。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "BGPピアリング", "short": "BGPピア関係を確立すること。", "detail": "BGPネイバーとしてTCPセッションを確立し経路情報を交換し始める設定・処理。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "iBGPピア", "short": "同一AS内のBGPピア関係。", "detail": "Internal BGP。同一AS内のルータ同士で経路情報を交換するBGPセッション。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "iBGPピアリング", "short": "iBGPピア関係の確立。", "detail": "同一AS内でのBGPセッション確立を指す。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "eBGPピア", "short": "異なるAS間のBGPピア関係。", "detail": "External BGP。異なるAS同士のルータ間で経路情報を交換するBGPセッション。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "AS", "short": "インターネット上で単一の運用方針を持つネットワークの単位。", "detail": "Autonomous System。ASごとに一意のAS番号が割り当てられ、BGPによりAS間で経路情報を交換する。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "プライベートAS番号", "short": "インターネット上でグローバルに使われない予約AS番号。", "detail": "内部利用限定のAS番号範囲で、外部に広告されるべきではない番号(公開時は変換が必要)。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "AS_PATH", "short": "経路が通過したAS番号の並びを示すBGPパスアトリビュート。", "detail": "経路情報に付与される必須アトリビュートで、ループ防止や経路選択の判断材料として使われる。パス長が短いほど優先されやすい。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "AS境界ルータ", "short": "自ASと他ASの境界でBGPを話すルータ。", "detail": "ASBRとも呼ばれ、外部の別ASとBGPピアを張って経路情報を交換する役割を担う。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "ASパスプリペンド", "short": "AS_PATHを意図的に水増しして経路を不利にする手法。", "detail": "自ASの番号を複数回AS_PATHに追加することでパスを長く見せかけ、他ASからの当該経路の優先度を下げる目的で使う。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "ASオーバーライド", "short": "iBGP環境でAS_PATHのループ検知を回避する機能。", "detail": "通常は自AS番号がAS_PATHに含まれる経路は受信側で破棄されるが、ハブ&スポーク構成などで意図的にこれを回避するために使う機能。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "as-override", "short": "ASオーバーライド機能を有効化するコマンド/設定名。", "detail": "Cisco機器などにおけるASオーバーライド機能のコンフィグレーションコマンド名として使われる用語。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "MP-BGP", "short": "IPv6等の複数アドレスファミリに対応した拡張BGP。", "detail": "Multiprotocol BGP。IPv4以外のアドレスファミリ(IPv6、VPN経路等)を扱えるよう拡張したBGP。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "COMMUNITYパスアトリビュート", "short": "経路にタグ付けし特定ポリシーを適用するためのBGP属性。", "detail": "経路情報に任意のタグ(コミュニティ値)を付与し、他のルータでそのタグに基づいたフィルタ・優先制御を行うためのアトリビュート。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "LOCAL_PREF", "short": "iBGP内で経路の優先度を示すパスアトリビュート。", "detail": "同一AS内で複数の出口経路がある場合に、どの経路を優先するかを示すローカルプリファレンス値(大きいほど優先)。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "MED", "short": "隣接ASに対し自ASへの推奨入口を伝えるパスアトリビュート。", "detail": "Multi Exit Discriminator。複数の接続点がある場合、値が小さい方が優先されるよう相手ASに推奨する指標。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "NEXT_HOP", "short": "経路情報に含まれるネクストホップアドレスを示すBGP属性。", "detail": "その経路へ到達するために転送すべき次のルータのIPアドレスを示すパスアトリビュート。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "ネクストホップセルフ", "short": "iBGP配下でネクストホップを自身のアドレスに書き換える設定。", "detail": "eBGPで受け取った経路のネクストホップを、iBGP内で到達可能な自ルータのアドレスに変更する設定。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "NLRI", "short": "BGPが広告する到達可能性情報(経路情報本体)。", "detail": "Network Layer Reachability Information。実際にどのネットワークに到達可能かを示す情報。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "BGP anycast", "short": "同一アドレスを複数拠点からBGPで広告するAnycast手法。", "detail": "同一のIPアドレス・経路を複数拠点からBGPで広告し、経路制御により最も近い拠点へトラフィックを誘導する仕組み。DNSルートサーバ等で使われる。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "BGP", "word": "BGP Flowspec", "short": "BGPを使って攻撃対策等のフィルタルールを配布する拡張。", "detail": "BGPの経路情報にフィルタリング条件(送信元/宛先/ポート等)を含めて配布し、DDoS対策等を自動的に広範囲へ適用する仕組み。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "その他のルーティング関連", "word": "RIP", "short": "距離ベクトル型の古典的なIGP。", "detail": "Routing Information Protocol。ホップ数をメトリックとするシンプルな距離ベクトル型プロトコルで、最大15ホップの制限がある。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "その他のルーティング関連", "word": "EGP", "short": "AS間で使われる経路制御プロトコルの総称・古い規格名。", "detail": "Exterior Gateway Protocol。BGP以前に使われていたAS間経路制御プロトコルの名称、または広義に外部ゲートウェイプロトコルを指す用語。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "その他のルーティング関連", "word": "IGP", "short": "AS内部で使われる経路制御プロトコルの総称。", "detail": "Interior Gateway Protocol。OSPF、RIPなど、単一AS内で使われる経路制御プロトコルの総称。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "その他のルーティング関連", "word": "RPO", "short": "障害発生時にどの時点までデータを復旧できるかの目標値。", "detail": "Recovery Point Objective。データ損失許容範囲を示す指標で、バックアップ間隔の設計指針となる。ルーティングの用語ではなく可用性・BCPの用語。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "その他のルーティング関連", "word": "BFD", "short": "経路制御プロトコルより高速に障害を検知する仕組み。", "detail": "Bidirectional Forwarding Detection。OSPFやBGPのHello間隔より短い周期でリンク障害を検知し、経路プロトコルへ即座に通知する。"}, {"cat": "ルーティング(OSPF・BGP等)", "group": "その他のルーティング関連", "word": "再配布", "short": "異なる経路制御プロトコル間で経路情報を交換すること。", "detail": "OSPFで学習した経路をBGPに、あるいはその逆に注入するなど、プロトコルをまたいで経路情報を伝える設定。"}, {"cat": "DNS", "group": "DNS基本", "word": "DNS", "short": "ドメイン名とIPアドレスを対応付ける分散型データベースシステム。", "detail": "Domain Name System。階層的な分散データベースにより、人が読みやすいドメイン名からIPアドレスへの名前解決を提供する。"}, {"cat": "DNS", "group": "DNS基本", "word": "DNS機能", "short": "DNSが提供する名前解決等の各種機能。", "detail": "正引き・逆引き、MXレコードによるメールサーバ特定、ゾーン転送など、DNSが担う機能全般を指す。"}, {"cat": "DNS", "group": "DNS基本", "word": "分散協調型データベース", "short": "DNSのように複数サーバが分担・連携してデータを管理する方式。", "detail": "1台に集中せず、階層構造の各サーバが担当範囲(ゾーン)のデータを持ち連携して全体を構成するデータベース方式。DNSの設計思想を表す表現。"}, {"cat": "DNS", "group": "DNS基本", "word": "ドメインツリー", "short": "ドメイン名の階層構造。", "detail": "ルートを頂点にTLD、SLD…と階層的に構成されるドメイン名の木構造。"}, {"cat": "DNS", "group": "DNS基本", "word": "ドメイン空間", "short": "DNSが管理するドメイン名全体の名前空間。", "detail": "階層的なドメイン名すべてを包含する論理的な名前空間。"}, {"cat": "DNS", "group": "DNS基本", "word": "ドメインの書式", "short": "ドメイン名の表記ルール。", "detail": "ラベルをドット区切りで連結し、右から上位階層になるという命名規則。"}, {"cat": "DNS", "group": "DNS基本", "word": "国際化ドメイン名", "short": "日本語等の非ASCII文字を使えるドメイン名。", "detail": "IDN(Internationalized Domain Name)。PunycodeによりASCIIに変換して既存のDNSインフラで扱えるようにしている。"}, {"cat": "DNS", "group": "DNSサーバの種類", "word": "権威DNSサーバ", "short": "自身が管理するゾーン情報を回答するDNSサーバ。", "detail": "そのドメインの正式な情報源となるサーバで、ゾーンファイルに基づき正引き・逆引きの回答を行う。"}, {"cat": "DNS", "group": "DNSサーバの種類", "word": "プライマリDNSサーバ", "short": "ゾーンファイルのマスタを保持するDNSサーバ。", "detail": "権威サーバのうち、当該ゾーンの正本データを管理し更新する側のサーバ。"}, {"cat": "DNS", "group": "DNSサーバの種類", "word": "セカンダリDNSサーバ", "short": "プライマリからゾーン転送を受け複製を保持するDNSサーバ。", "detail": "プライマリDNSサーバの内容をゾーン転送で複製し、冗長性を提供する権威サーバ。"}, {"cat": "DNS", "group": "DNSサーバの種類", "word": "スレーブDNSサーバ", "short": "セカンダリDNSサーバの別称。", "detail": "プライマリ(マスタ)からゾーン情報を複製して保持するサーバを指す、セカンダリと同義の呼び方。"}, {"cat": "DNS", "group": "DNSサーバの種類", "word": "フルサービスリゾルバ", "short": "クライアントに代わり再帰的に名前解決を行うDNSサーバ。", "detail": "キャッシュDNSサーバとも呼ばれ、権威サーバへの問い合わせを繰り返し最終結果をクライアントへ返す。"}, {"cat": "DNS", "group": "DNSサーバの種類", "word": "キャッシュサーバ", "short": "名前解決結果を一時的に保持し再利用するDNSサーバ。", "detail": "フルサービスリゾルバが持つ、TTLに基づき解決結果をキャッシュする機能・サーバを指す。"}, {"cat": "DNS", "group": "DNSサーバの種類", "word": "オープンリゾルバ", "short": "誰からの問い合わせにも応答してしまう設定不備のDNSサーバ。", "detail": "本来社内利用者限定であるべきキャッシュサーバが、外部からの問い合わせにも応答してしまう状態で、DNS Amp攻撃の踏み台にされやすい。"}, {"cat": "DNS", "group": "DNS問い合わせ", "word": "再帰的問合せ", "short": "最終的な回答をDNSサーバに求める問い合わせ方式。", "detail": "クライアントがフルサービスリゾルバに対し、自分では他サーバに問い合わせずリゾルバ側で最終回答を得るよう要求する方式。"}, {"cat": "DNS", "group": "DNS問い合わせ", "word": "反復問合せ", "short": "権威サーバ間で行われる、次の参照先を示す問い合わせ方式。", "detail": "リゾルバが権威サーバに問い合わせ、答えが分からない場合は次に聞くべきサーバを紹介してもらいながら順にたどる方式。"}, {"cat": "DNS", "group": "DNS問い合わせ", "word": "正引き", "short": "ドメイン名からIPアドレスを求める名前解決。", "detail": "ホスト名を指定してそれに対応するIPアドレスを取得する、最も一般的なDNS問い合わせ。"}, {"cat": "DNS", "group": "DNS問い合わせ", "word": "逆引き", "short": "IPアドレスからドメイン名を求める名前解決。", "detail": "PTRレコードを用いて、IPアドレスから対応するホスト名を取得する問い合わせ。"}, {"cat": "DNS", "group": "DNSレコード", "word": "Aレコード", "short": "ホスト名とIPv4アドレスを対応付けるDNSレコード。", "detail": "最も基本的なDNSリソースレコードで、正引き(名前→IPv4アドレス)に使われる。"}, {"cat": "DNS", "group": "DNSレコード", "word": "AAAAレコード", "short": "ホスト名とIPv6アドレスを対応付けるDNSレコード。", "detail": "IPv4のAレコードに相当するIPv6版で、ドメイン名の名前解決結果としてIPv6アドレスを返す。"}, {"cat": "DNS", "group": "DNSレコード", "word": "CNAMEレコード", "short": "ホスト名の別名を定義するDNSレコード。", "detail": "あるホスト名を別の正式なホスト名の別名(エイリアス)として定義するレコード。"}, {"cat": "DNS", "group": "DNSレコード", "word": "MXレコード", "short": "ドメイン宛メールを受け取るメールサーバを指定するレコード。", "detail": "そのドメイン宛のメールをどのメールサーバへ配送すべきかを示す、優先度付きのDNSレコード。"}, {"cat": "DNS", "group": "DNSレコード", "word": "NSレコード", "short": "ゾーンを管理する権威DNSサーバを示すレコード。", "detail": "そのドメイン(ゾーン)の権威を持つネームサーバのホスト名を示すレコード。"}, {"cat": "DNS", "group": "DNSレコード", "word": "PTRレコード", "short": "IPアドレスからホスト名を示す逆引き用レコード。", "detail": "in-addr.arpa等の逆引きゾーンに登録され、IPアドレスに対応するホスト名を返すレコード。"}, {"cat": "DNS", "group": "DNSレコード", "word": "SOAレコード", "short": "ゾーンの管理情報を示すレコード。", "detail": "ゾーンのプライマリサーバ、シリアル番号、ゾーン転送間隔などの管理情報を保持するレコード。各ゾーンに1つ必須。"}, {"cat": "DNS", "group": "DNSレコード", "word": "RDATA", "short": "DNSリソースレコードの実データ部分。", "detail": "レコードタイプごとに異なる形式で格納される、実際の値(IPアドレス等)を保持するフィールド。"}, {"cat": "DNS", "group": "DNSレコード", "word": "type", "short": "DNSリソースレコードの種別を示すフィールド。", "detail": "A、AAAA、MX、NS等、レコードの種類を識別するためのフィールド。"}, {"cat": "DNS", "group": "DNSレコード", "word": "逆引きゾーン", "short": "IPアドレスからホスト名を引くための逆引き用ゾーン。", "detail": "in-addr.arpa(IPv4)やip6.arpa(IPv6)配下に構成される、逆引きのための専用ゾーン。"}, {"cat": "DNS", "group": "ゾーン管理", "word": "ゾーン", "short": "権威DNSサーバが管理するドメイン名空間の範囲。", "detail": "ドメインツリーの一部を、特定の権威サーバが実際に管理する単位として区切ったもの。"}, {"cat": "DNS", "group": "ゾーン管理", "word": "ゾーン情報", "short": "ゾーンに含まれる各種DNSレコードの集合。", "detail": "そのゾーンで管理されるA、MX、NS等のレコード群全体を指す。"}, {"cat": "DNS", "group": "ゾーン管理", "word": "ゾーンファイル", "short": "ゾーン情報を記述したテキスト形式のファイル。", "detail": "権威サーバ上でゾーンのレコード群を定義・保持するための設定ファイル。"}, {"cat": "DNS", "group": "ゾーン管理", "word": "ゾーン転送", "short": "プライマリからセカンダリへゾーン情報を複製する処理。", "detail": "TCPを用いてプライマリDNSサーバの内容をセカンダリDNSサーバへコピーする処理。過剰な公開はゾーン情報漏えいのリスクとなる。"}, {"cat": "DNS", "group": "ドメイン名レジストリ", "word": "ドメインツリー", "short": "ドメイン名の階層構造。", "detail": "ルートを頂点にTLD、SLD…と階層的に構成されるドメイン名の木構造。(ゾーン管理と重複掲載)"}, {"cat": "DNS", "group": "ドメイン名レジストリ", "word": "TLD", "short": "ドメイン名の最上位階層。", "detail": "Top Level Domain。.com、.jpなど、ドメイン名の一番右側に位置する階層。"}, {"cat": "DNS", "group": "ドメイン名レジストリ", "word": "ccTLD", "short": "国や地域を表すトップレベルドメイン。", "detail": "country code TLD。.jp(日本)、.us(米国)のように国・地域を割り当てられたTLD。"}, {"cat": "DNS", "group": "ドメイン名レジストリ", "word": "gTLD", "short": "分野・目的を表す一般トップレベルドメイン。", "detail": "generic TLD。.com、.org、.netなど特定の国に依存しない汎用のTLD。"}, {"cat": "DNS", "group": "ドメイン名レジストリ", "word": "新gTLD", "short": "近年新設された多様な種類のgTLD。", "detail": ".tokyo、.shopなど、ICANNの拡大方針により新たに導入された多種多様なgTLD群。"}, {"cat": "DNS", "group": "ドメイン名レジストリ", "word": "sTLD", "short": "特定のスポンサー組織が運用するトップレベルドメイン。", "detail": "sponsored TLD。.edu(教育機関)、.gov(米国政府)のように特定コミュニティ向けに運用されるTLD。"}, {"cat": "DNS", "group": "ドメイン名レジストリ", "word": "SLD", "short": "トップレベルドメインの直下にあたる第二階層のドメイン。", "detail": "Second Level Domain。example.comにおけるexampleの部分など、TLDの下に位置する階層。"}, {"cat": "DNS", "group": "ドメイン名レジストリ", "word": "汎用JPドメイン", "short": ".jpの直下で自由に取得できる日本のドメイン。", "detail": "地域型・属性型に依存せず、日本語や英数字を自由に選んで取得できる「〜.jp」形式のドメイン。"}, {"cat": "DNS", "group": "ドメイン名レジストリ", "word": "JPNIC", "short": "日本国内のIPアドレス・AS番号等を管理する組織。", "detail": "Japan Network Information Center。日本におけるIPアドレス割当やAS番号管理等を行うレジストリ組織。"}, {"cat": "DNS", "group": "ドメイン名レジストリ", "word": "JPRS", "short": "日本語ドメイン名(.jp)の登録管理を行う組織。", "detail": "Japan Registry Services。.jpドメインのレジストリ業務を担う指定registry organization。"}, {"cat": "DNS", "group": "ドメイン名レジストリ", "word": "レジストラ", "short": "ドメイン名の登録受付を行う事業者。", "detail": "エンドユーザーからの申請を受け、レジストリへドメイン登録手続きを行う窓口事業者。"}, {"cat": "DNS", "group": "ドメイン名レジストリ", "word": "ICANN", "short": "世界のドメイン名・IPアドレス資源を統括する国際組織。", "detail": "Internet Corporation for Assigned Names and Numbers。ドメイン名やIPアドレスの世界的な調整・管理を行う非営利組織。"}, {"cat": "DNS", "group": "ドメイン名レジストリ", "word": "IANA", "short": "IPアドレスやポート番号等のインターネット資源を管理する機関。", "detail": "Internet Assigned Numbers Authority。プロトコル番号、ポート番号、IPアドレスブロック等の割当を統括するICANN傘下の機能。"}, {"cat": "DNS", "group": "ドメイン名レジストリ", "word": "公開ドメイン情報", "short": "WHOIS等で公開されるドメイン登録者情報。", "detail": "ドメイン所有者や連絡先など、レジストリ/レジストラが一般に公開している登録情報。"}, {"cat": "DNS", "group": "ドメイン名レジストリ", "word": "非公開ドメイン情報", "short": "プライバシー保護により非公開にできる登録者情報。", "detail": "WHOISプライバシー保護サービス等により、第三者に公開されないよう設定された登録者情報。"}, {"cat": "DNS", "group": "ドメイン名レジストリ", "word": "hostsファイル", "short": "DNSより優先されるローカルの名前解決ファイル。", "detail": "OSが持つ、ホスト名とIPアドレスの対応を静的に記述したファイルで、DNS問い合わせより先に参照される。"}, {"cat": "DNS", "group": "ドメイン名レジストリ", "word": "ホスト名の書式", "short": "ホスト名の命名規則。", "detail": "使用可能文字数や文字種など、ホスト名として有効な表記に関する規則。"}, {"cat": "DNS", "group": "ドメイン名レジストリ", "word": "名前解決", "short": "ホスト名とIPアドレスを相互に変換すること。", "detail": "DNSやhostsファイルを用いて、人が扱いやすい名前と機械が扱うIPアドレスを対応付けるプロセス全般。"}, {"cat": "DNS", "group": "ドメイン名レジストリ", "word": "コンピュータ名", "short": "ネットワーク上で機器に付与される識別名。", "detail": "DNSのホスト名やNetBIOS名など、機器を識別するための名称を指す一般的な用語。"}, {"cat": "DNS", "group": "ドメイン名レジストリ", "word": "更新", "short": "ドメインやレコード等の登録情報を最新化すること。", "detail": "ドメインの有効期限延長やゾーン情報の書き換えなど、登録情報を更新する作業全般。"}, {"cat": "DNS", "group": "DNSセキュリティ・攻撃", "word": "DNSSEC", "short": "DNS応答の正当性をデジタル署名で保証する拡張。", "detail": "DNS Security Extensions。応答が改ざんされていないこと・正しい権威サーバからのものであることを公開鍵暗号により検証可能にする拡張。"}, {"cat": "DNS", "group": "DNSセキュリティ・攻撃", "word": "DNSキャッシュ汚染", "short": "キャッシュサーバに偽の名前解決結果を注入する攻撃。", "detail": "DNSキャッシュポイズニングとも呼ばれ、偽の応答をキャッシュに記憶させることで利用者を偽サイトへ誘導する攻撃。"}, {"cat": "DNS", "group": "DNSセキュリティ・攻撃", "word": "DNSキャッシュポイズニング", "short": "DNSキャッシュ汚染の別称。", "detail": "キャッシュDNSサーバに不正な名前解決結果を記憶させ、正規のドメイン名でも攻撃者が用意したIPアドレスへ誘導する攻撃。"}, {"cat": "DNS", "group": "DNSセキュリティ・攻撃", "word": "DNS Amp攻撃", "short": "DNSを悪用した反射・増幅型のDoS攻撃。", "detail": "送信元を偽装した小さな問い合わせに対し、DNSサーバが大きな応答を標的へ返すよう仕向け、帯域を圧迫する攻撃。オープンリゾルバが悪用されやすい。"}, {"cat": "DNS", "group": "DNSセキュリティ・攻撃", "word": "DNSリフレクタ攻撃", "short": "送信元を詐称しDNSサーバを踏み台にする攻撃全般。", "detail": "攻撃者が標的のIPアドレスを送信元として偽装した問い合わせをDNSサーバへ送り、応答が標的に届くようにする攻撃手法。"}, {"cat": "DNS", "group": "DNSセキュリティ・攻撃", "word": "DNSラウンドロビン", "short": "複数のIPアドレスを順番に応答して負荷分散する方式。", "detail": "1つのホスト名に複数のAレコードを登録し、問い合わせのたびに異なる順番で応答することで簡易的な負荷分散を行う方式。"}, {"cat": "DNS", "group": "Dynamic DNS", "word": "Dynamic DNS", "short": "IPアドレス変化時にDNSレコードを自動更新する仕組み。", "detail": "動的に変化するグローバルIPアドレスに対し、専用クライアント等がDNSレコードを自動更新し続けることで固定ホスト名でのアクセスを可能にする仕組み。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メール送受信プロトコル", "word": "SMTP", "short": "メール送信に使われるプロトコル。", "detail": "Simple Mail Transfer Protocol。メールクライアントからサーバへ、またはサーバ間でメールを転送する際に使われるプロトコル。TCP25番ポートを使用。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メール送受信プロトコル", "word": "SMTP-AUTH", "short": "SMTPに認証機能を追加した拡張。", "detail": "メール送信時にユーザ名/パスワードによる認証を要求する拡張仕様。587番ポート(サブミッションポート)と組み合わせて使われることが多い。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メール送受信プロトコル", "word": "POP3", "short": "メールサーバから受信メールをダウンロードするプロトコル。", "detail": "Post Office Protocol version 3。TCP110番ポートを使い、メールをクライアント側に取得(通常は削除)する方式。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メール送受信プロトコル", "word": "IMAP4", "short": "メールサーバ上でメールを管理・閲覧するプロトコル。", "detail": "Internet Message Access Protocol version 4。メールをサーバに残したまま複数端末から同じ状態で閲覧・管理できる。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メール送受信プロトコル", "word": "MTA", "short": "メールサーバ間でメールを転送するソフトウェア。", "detail": "Mail Transfer Agent。SMTPを用いてメールを次のサーバへ中継・配送する役割を持つソフトウェア。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メール送受信プロトコル", "word": "MUA", "short": "利用者がメールの作成・閲覧に使うソフトウェア。", "detail": "Mail User Agent。メールクライアントソフトを指し、MTAへ送信したりMTAから受信したりする。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メール送受信プロトコル", "word": "MH装置", "short": "メールを中継・処理する装置(メールハンドリング装置)を指す表現。", "detail": "メールの送受信・フィルタリング等を行うメールサーバ機器全般を指す文脈上の用語。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールヘッダ", "word": "Date", "short": "メールが作成・送信された日時を示すヘッダ。", "detail": "RFC5322で定義される、メール作成日時を示すヘッダフィールド。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールヘッダ", "word": "From", "short": "メールの送信者を示すヘッダ。", "detail": "表示上の送信者アドレスを示すフィールドで、詐称(なりすまし)されやすい部分でもある。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールヘッダ", "word": "To", "short": "メールの主たる宛先を示すヘッダ。", "detail": "メールを直接送りたい相手のアドレスを列挙するフィールド。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールヘッダ", "word": "Cc", "short": "メールの参考送付先を示すヘッダ。", "detail": "Carbon Copy。宛先には含めないが同じ内容を共有したい相手を指定するフィールドで、全受信者に見える。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールヘッダ", "word": "Bcc", "short": "他の受信者に見えない形で送付するヘッダ。", "detail": "Blind Carbon Copy。指定した相手にはメールが届くが "detail": "Sender Policy Framework。ドメインが公開するSPFレコード(許可された送信サーバのIPリスト)と実際の送信元IPを照合し正当性を検証する仕組み。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールセキュリティ・認証", "word": "SPFレコード", "short": "SPFで参照されるDNS上の設定情報。", "detail": "そのドメインからのメール送信を許可されたサーバのIPアドレス等をDNSのTXTレコードとして公開したもの。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールセキュリティ・認証", "word": "DKIM", "short": "デジタル署名によりメールの改ざん・なりすましを検知する仕組み。", "detail": "DomainKeys Identified Mail。送信側が秘密鍵で署名を付与し、受信側がDNS上の公開鍵レコードで検証することで、送信ドメインの正当性と非改ざんを確認する。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールセキュリティ・認証", "word": "DKIMレコード", "short": "DKIM検証に使う公開鍵情報を公開するDNSレコード。", "detail": "DKIM署名の検証に必要な公開鍵を格納した、DNSのTXTレコード。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールセキュリティ・認証", "word": "DKIM-Signatureフィールド", "short": "DKIMの署名情報を格納するメールヘッダ。", "detail": "送信側が付与するデジタル署名や、署名対象ヘッダ・セレクタ等の情報を含むヘッダフィールド。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールセキュリティ・認証", "word": "DomainKey-Signature", "short": "DKIMの前身であるDomainKeys方式の署名ヘッダ。", "detail": "DKIM登場以前に使われていた送信ドメイン認証方式DomainKeysで付与される署名フィールド。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールセキュリティ・認証", "word": "DMARC", "short": "SPF/DKIMの結果を基にした受信側の処理方針を公開する仕組み。", "detail": "Domain-based Message Authentication, Reporting and Conformance。SPF/DKIM認証が失敗した際の扱い(隔離・拒否等)をドメイン管理者がDNSで宣言し、レポートも受け取れる。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールセキュリティ・認証", "word": "セレクタ", "short": "DKIMで使用する公開鍵を特定するための識別子。", "detail": "複数の鍵ペアを運用できるよう、DKIM署名やDNSレコードで使用する鍵を指定するために使われる文字列。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールセキュリティ・認証", "word": "送信ドメイン認証", "short": "送信元ドメインの正当性を検証する技術の総称。", "detail": "SPF、DKIM、DMARCなど、メールのなりすましを防ぐためドメインの正当性を確認する各種技術をまとめた呼称。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールセキュリティ・認証", "word": "送信者認証", "short": "メール送信者の正当性を確認する仕組み全般。", "detail": "送信ドメイン認証やSMTP-AUTH等、送り主が正当であることを確認するための技術・手続き全般を指す。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールセキュリティ・認証", "word": "否認防止", "short": "送信の事実を後から否定できないようにする性質。", "detail": "デジタル署名等により、送信者が「送っていない」と後から主張することを技術的に防止する性質。DKIM等の副次的効果としても言及される。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "迷惑メール対策", "word": "迷惑メール", "short": "受信者の意図に反して大量に送られる不要なメール。", "detail": "スパムメールとも呼ばれる、広告や詐欺目的等で無差別に送信される望まれないメールの総称。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "迷惑メール対策", "word": "SPAMメール", "short": "迷惑メールの英語表記・別称。", "detail": "一方的かつ大量に送りつけられる、受信者が望んでいない宣伝・詐欺目的等のメール。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "迷惑メール対策", "word": "UBE", "short": "迷惑メールを指す用語(Unsolicited Bulk Email)。", "detail": "Unsolicited Bulk Email。要求されていない大量一斉送信メールを指す、迷惑メール分類の一つ。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "迷惑メール対策", "word": "UCE", "short": "商業目的の迷惑メールを指す用語。", "detail": "Unsolicited Commercial Email。要求されていない商業広告目的のメールを指す分類。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "迷惑メール対策", "word": "メールのスキャン", "short": "受信メールの内容を検査しウイルス・迷惑メールを検知すること。", "detail": "添付ファイルや本文をパターンマッチング等で検査し、脅威や迷惑メールを検出・隔離する処理。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "迷惑メール対策", "word": "メールアドレス", "short": "電子メールの宛先を一意に示す識別子。", "detail": "ユーザ名とドメイン名を@で連結した、メールの送受信先を特定する識別子。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "迷惑メール対策", "word": "25番ポートブロック", "short": "ISPがTCP25番ポートへの外部通信を遮断する迷惑メール対策。", "detail": "契約ISP以外のメールサーバへ直接SMTP(25番ポート)で送信することを防ぎ、ボットによるスパム送信を抑止する仕組み。OP25Bとも呼ばれる。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "迷惑メール対策", "word": "OP25B", "short": "25番ポートブロックの略称。", "detail": "Outbound Port25 Blocking。動的IPアドレス帯からの直接的な外部25番ポート通信を遮断するISPの対策。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "迷惑メール対策", "word": "587番ポート", "short": "SMTP-AUTHによる正規のメール投稿に使うポート。", "detail": "サブミッションポートと呼ばれ、認証(SMTP-AUTH)を必須とすることで送信者を特定できるようにしたメール投稿専用ポート。25番ポートブロック環境でも利用可能。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "迷惑メール対策", "word": "Pop before SMTP", "short": "POP3認証成功後に一定時間SMTP送信を許可する古い迷惑メール対策方式。", "detail": "事前にPOP3でユーザ認証させ、そのIPアドレスからのSMTP送信を一時的に許可することで、送信者を実質的に認証する手法。SMTP-AUTHの普及前に使われた。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "電子メールシステム全般", "word": "電子メールシステム", "short": "メールの作成・送信・配送・受信を実現する仕組み全体。", "detail": "MUA、MTA、SMTP/POP3/IMAP4といった要素から構成される、電子メールの送受信基盤全体を指す。"}, {"cat": "Web・HTTP", "group": "Webシステム基本", "word": "Webシステム", "short": "Webブラウザとサーバで構成される情報システム。", "detail": "クライアント(ブラウザ)とWebサーバがHTTP/HTTPSで通信し、情報の提供・処理を行うシステム全般。"}, {"cat": "Web・HTTP", "group": "Webシステム基本", "word": "Webアプリケーション", "short": "Webブラウザ経由で利用するアプリケーション。", "detail": "サーバサイドで処理を行い、ブラウザ上で操作・表示するタイプのソフトウェア。"}, {"cat": "Web・HTTP", "group": "Webシステム基本", "word": "WAS", "short": "Webアプリケーションを実行するサーバ・基盤。", "detail": "Web Application Server。動的なWebアプリケーションのロジックを実行するミドルウェア・サーバ。"}, {"cat": "Web・HTTP", "group": "Webシステム基本", "word": "Webメール", "short": "ブラウザ上でメールの送受信を行うサービス。", "detail": "専用メールソフトを使わずWebブラウザからメールの閲覧・送信ができるサービス形態。"}, {"cat": "Web・HTTP", "group": "HTTP基本", "word": "HTTP", "short": "Webでリソースをやり取りするためのプロトコル。", "detail": "Hypertext Transfer Protocol。クライアントの要求(リクエスト)とサーバの応答(レスポンス)からなる、Webの基盤プロトコル。"}, {"cat": "Web・HTTP", "group": "HTTP基本", "word": "HTTP通信", "short": "HTTPを用いたクライアント・サーバ間の通信。", "detail": "リクエスト/レスポンスモデルに基づく、Webにおける典型的な通信のやり取り。"}, {"cat": "Web・HTTP", "group": "HTTP基本", "word": "HTTPメッセージ", "short": "HTTPのリクエスト・レスポンスの構造。", "detail": "リクエストライン(またはステータスライン)、ヘッダ、ボディから構成されるHTTP通信のデータ形式。"}, {"cat": "Web・HTTP", "group": "HTTP基本", "word": "リクエストライン", "short": "HTTPリクエストの先頭行。", "detail": "メソッド、URI、HTTPバージョンから構成される、リクエストメッセージの最初の行。"}, {"cat": "Web・HTTP", "group": "HTTP基本", "word": "ステータスライン", "short": "HTTPレスポンスの先頭行。", "detail": "HTTPバージョン、ステータスコード、理由句から構成される、レスポンスメッセージの最初の行。"}, {"cat": "Web・HTTP", "group": "HTTP基本", "word": "ステータスコード", "short": "HTTPレスポンスの結果を示す3桁の数値。", "detail": "200(成功)、404(未検出)、500(サーバエラー)など、リクエストの処理結果を表す数値コード。"}, {"cat": "Web・HTTP", "group": "HTTPメソッド", "word": "GETメソッド", "short": "リソースの取得を要求するHTTPメソッド。", "detail": "サーバから指定したURIのリソースを取得するために使われる、最も基本的なHTTPメソッド。"}, {"cat": "Web・HTTP", "group": "HTTPメソッド", "word": "POSTメソッド", "short": "リソースの作成・データ送信を要求するHTTPメソッド。", "detail": "フォーム送信などサーバ側に新しいデータを送り処理させる際に使われるHTTPメソッド。"}, {"cat": "Web・HTTP", "group": "HTTPメソッド", "word": "HEADメソッド", "short": "ヘッダのみを取得するHTTPメソッド。", "detail": "GETと同様の応答ヘッダのみを取得し、ボディは返さないメソッド。リソースの存在確認等に使う。"}, {"cat": "Web・HTTP", "group": "HTTPメソッド", "word": "PUTメソッド", "short": "指定したURIにリソースを作成・置換するHTTPメソッド。", "detail": "クライアントが指定したURIへ、送信データでリソースを丸ごと作成または置き換えるメソッド。"}, {"cat": "Web・HTTP", "group": "HTTPメソッド", "word": "DELETEメソッド", "short": "指定したリソースの削除を要求するHTTPメソッド。", "detail": "サーバ上の指定されたリソースを削除するよう要求するメソッド。"}, {"cat": "Web・HTTP", "group": "HTTPメソッド", "word": "OPTIONSメソッド", "short": "サーバが対応している通信オプションを問い合わせるHTTPメソッド。", "detail": "対象リソースに対して使用可能なHTTPメソッドなどの情報を取得するために使われる。"}, {"cat": "Web・HTTP", "group": "HTTPメソッド", "word": "TRACEメソッド", "short": "リクエストの経路を確認するためのHTTPメソッド。", "detail": "サーバに届いたリクエストをそのまま返送させ、経由するプロキシ等での改変を確認するデバッグ用メソッド。"}, {"cat": "Web・HTTP", "group": "HTTPメソッド", "word": "CONNECTメソッド", "short": "プロキシ経由でTCPトンネルを確立するHTTPメソッド。", "detail": "主にHTTPSをプロキシ経由で使う際、プロキシにTCPトンネルの確立を要求するメソッド。"}, {"cat": "Web・HTTP", "group": "Cookie・セッション", "word": "Cookie", "short": "サーバがクライアントに保存させる小さなデータ。", "detail": "HTTPはステートレスであるため、ログイン状態などをブラウザ側に保持させ次回以降のリクエストで送り返させる仕組み。"}, {"cat": "Web・HTTP", "group": "Cookie・セッション", "word": "Set-Cookieヘッダフィールド", "short": "サーバがCookieの発行を指示するレスポンスヘッダ。", "detail": "レスポンスに含まれ、ブラウザに特定の値をCookieとして保存させるためのヘッダフィールド。"}, {"cat": "Web・HTTP", "group": "Cookie・セッション", "word": "HttpOnly", "short": "JavaScriptからのCookieアクセスを禁止する属性。", "detail": "Cookieに付与できる属性の一つで、スクリプト経由でのCookie読み取りを防ぎXSSによる漏えいリスクを軽減する。"}, {"cat": "Web・HTTP", "group": "Cookie・セッション", "word": "セッションCookie", "short": "ブラウザを閉じると破棄される一時的なCookie。", "detail": "有効期限を指定せず発行されるCookieで、ブラウザセッション終了とともに削除される。"}, {"cat": "Web・HTTP", "group": "Cookie・セッション", "word": "セッションID", "short": "セッションを識別するための一意な値。", "detail": "ログインセッション等を識別するためサーバが発行しCookie等で保持させる識別子。漏えいするとセッションハイジャックの危険がある。"}, {"cat": "Web・HTTP", "group": "Cookie・セッション", "word": "セッション維持", "short": "一連のやり取りの間、状態を保持し続けること。", "detail": "ステートレスなHTTP上で、ログイン状態やカート内容などのユーザ状態を維持する仕組み全般。"}, {"cat": "Web・HTTP", "group": "Cookie・セッション", "word": "セッション共有", "short": "複数サーバ間でセッション情報を共有する構成。", "detail": "負荷分散環境において、どのサーバが処理してもセッション状態を維持できるよう情報を共有する仕組み。"}, {"cat": "Web・HTTP", "group": "Cookie・セッション", "word": "セッションクラスタリング", "short": "複数サーバでセッション情報を複製・共有するクラスタ構成。", "detail": "ロードバランサ配下の複数サーバでセッション情報を同期・共有し、どのサーバにアクセスしても継続利用できるようにする構成。"}, {"cat": "Web・HTTP", "group": "URI・URL", "word": "URI", "short": "リソースを識別するための統一的な識別子。", "detail": "Uniform Resource Identifier。URLやURNを包含する、リソースを一意に指し示すための識別子の総称。"}, {"cat": "Web・HTTP", "group": "URI・URL", "word": "URL", "short": "リソースの場所を示す識別子。", "detail": "Uniform Resource Locator。スキーム、ホスト、パス等からリソースの所在を示す形式。"}, {"cat": "Web・HTTP", "group": "URI・URL", "word": "URLの書式", "short": "URLの構文規則。", "detail": "scheme://host:port/path?query#fragment のような、URLを構成する各要素の記述規則。"}, {"cat": "Web・HTTP", "group": "URI・URL", "word": "URN", "short": "リソースの場所によらない永続的な名前。", "detail": "Uniform Resource Name。所在に依存せずリソースを識別するための名前付け方式。"}, {"cat": "Web・HTTP", "group": "URI・URL", "word": "URLリライティング", "short": "URLの構造を書き換える技術・攻撃手法双方を指す用語。", "detail": "プロキシ等がリンクURLを内部形式に書き換える技術、または攻撃者がURLを改変し不正なパラメータを注入する手法の両方を指しうる。"}, {"cat": "Web・HTTP", "group": "リバースプロキシ・CDN", "word": "リバースプロキシ", "short": "クライアントの代わりにサーバへ要求を中継する仕組み。", "detail": "クライアントからの要求を受け取り、背後の複数サーバへ転送・キャッシュ・負荷分散を行う、サーバ側に設置されるプロキシ。"}, {"cat": "Web・HTTP", "group": "リバースプロキシ・CDN", "word": "リバースプロキシ方式", "short": "リバースプロキシを用いた構成方式。", "detail": "公開Webサーバの前段にリバースプロキシを配置し、セキュリティやキャッシュ、負荷分散を実現する構成。"}, {"cat": "Web・HTTP", "group": "リバースプロキシ・CDN", "word": "フォワードプロキシ", "short": "クライアント側に設置され外部への通信を代理するプロキシ。", "detail": "社内から外部サイトへのアクセスを中継し、アクセス制御・キャッシュ等を行うクライアント側のプロキシ。"}, {"cat": "Web・HTTP", "group": "リバースプロキシ・CDN", "word": "CDN", "short": "コンテンツを地理的に分散配置し配信を高速化する仕組み。", "detail": "Content Delivery Network。世界各地のエッジサーバにコンテンツをキャッシュし、利用者に近い場所から配信することで高速化・負荷分散する仕組み。"}, {"cat": "Web・HTTP", "group": "リバースプロキシ・CDN", "word": "プログレッシブダウンロード", "short": "再生しながら順次ダウンロードする配信方式。", "detail": "動画等を全てダウンロードし終える前から再生を開始できる配信方式で、ストリーミングの簡易的な代替として使われる。"}, {"cat": "Web・HTTP", "group": "リバースプロキシ・CDN", "word": "プログレッシブ表示技術", "short": "画像などを段階的に精細化しながら表示する技術。", "detail": "低解像度から徐々に高解像度へと表示を切り替えることで、体感的な表示速度を向上させる技術。"}, {"cat": "Web・HTTP", "group": "Webセキュリティ", "word": "WAF", "short": "Webアプリケーションを狙う攻撃を検知・防御する装置。", "detail": "Web Application Firewall。SQLインジェクションやXSSなど、Webアプリケーション層の攻撃をシグネチャ等で検知・遮断する専用ファイアウォール。"}, {"cat": "Web・HTTP", "group": "Webセキュリティ", "word": "クライアントサイドスクリプト", "short": "ブラウザ側で実行されるスクリプト。", "detail": "JavaScriptなど、サーバではなくクライアント(ブラウザ)側で実行されるプログラムコード。"}, {"cat": "Web・HTTP", "group": "Webセキュリティ", "word": "サーバサイドスクリプト", "short": "サーバ側で実行されるスクリプト。", "detail": "PHPなど、サーバ上で実行されHTMLを動的に生成するプログラムコード。"}, {"cat": "Web・HTTP", "group": "Webセキュリティ", "word": "サーバサイドのプログラム", "short": "サーバ上で動作する処理プログラム全般。", "detail": "Webアプリケーションのロジックを担う、サーバ上で実行されるプログラム全体を指す表現。"}, {"cat": "Web・HTTP", "group": "Webセキュリティ", "word": "スクリプト", "short": "一連の処理を記述したプログラムの総称。", "detail": "コンパイル不要で実行されることが多い、比較的簡易な処理を記述したプログラムコードの総称。"}, {"cat": "Web・HTTP", "group": "Webセキュリティ", "word": "Webトラフィックのスキャン", "short": "Web通信内容を検査し脅威を検出すること。", "detail": "プロキシやセキュリティ製品がHTTP/HTTPS通信の内容を解析し、マルウェアや不正な挙動を検出する処理。"}, {"cat": "暗号技術・PKI", "group": "暗号方式基本", "word": "暗号化", "short": "データを第三者に読めない形式に変換すること。", "detail": "平文を鍵とアルゴリズムにより暗号文へ変換し、機密性を確保する処理全般。"}, {"cat": "暗号技術・PKI", "group": "暗号方式基本", "word": "暗号方式", "short": "暗号化の仕組み・アルゴリズムの分類。", "detail": "共通鍵方式・公開鍵方式など、暗号化の方法論を指す上位概念。"}, {"cat": "暗号技術・PKI", "group": "暗号方式基本", "word": "共通鍵方式", "short": "暗号化と復号に同じ鍵を使う方式。", "detail": "送受信者が同一の秘密鍵を共有し、その鍵で暗号化・復号を行う方式。処理は高速だが鍵配送に課題がある。"}, {"cat": "暗号技術・PKI", "group": "暗号方式基本", "word": "公開鍵方式", "short": "暗号化と復号に異なる鍵(公開鍵・秘密鍵)を使う方式。", "detail": "公開鍵で暗号化したものは対応する秘密鍵でしか復号できない非対称暗号方式。鍵配送問題を解決する一方、処理は共通鍵より重い。"}, {"cat": "暗号技術・PKI", "group": "暗号方式基本", "word": "ハイブリッド方式", "short": "公開鍵方式と共通鍵方式を組み合わせた方式。", "detail": "公開鍵暗号で共通鍵(セッション鍵)を安全に配送し、実データの暗号化には高速な共通鍵暗号を使う、TLS等で採用される方式。"}, {"cat": "暗号技術・PKI", "group": "ブロック暗号", "word": "ブロック暗号方式", "short": "データを一定サイズのブロック単位で暗号化する方式。", "detail": "AESなど、平文を固定長ブロックに区切って処理する暗号方式。ストリーム暗号方式と対比される。"}, {"cat": "暗号技術・PKI", "group": "ブロック暗号", "word": "ブロック暗号アルゴリズム", "short": "ブロック暗号方式を実現する具体的なアルゴリズム。", "detail": "AES、DES(旧)などの、ブロック単位で暗号化処理を行う個別のアルゴリズムを指す。"}, {"cat": "暗号技術・PKI", "group": "ブロック暗号", "word": "AES", "short": "共通鍵ブロック暗号の標準規格。", "detail": "Advanced Encryption Standard。128/192/256ビット鍵長を持つ現在標準的に使われるブロック暗号アルゴリズムで、旧DESの後継。"}, {"cat": "暗号技術・PKI", "group": "ブロック暗号", "word": "暗号利用モード", "short": "ブロック暗号を繰り返し適用する際の運用方式。", "detail": "1ブロックずつ独立に暗号化するECBや、前のブロックの結果を利用するCBC、ストリーム的に使うCTR/GCMなど、複数ブロックへの適用方法を定めるモード。"}, {"cat": "暗号技術・PKI", "group": "ブロック暗号", "word": "CBC", "short": "前のブロックの暗号文を次の暗号化に利用する暗号利用モード。", "detail": "Cipher Block Chaining。各ブロックの暗号化に直前の暗号文をXORしてから適用することでパターンの露見を防ぐモード。"}, {"cat": "暗号技術・PKI", "group": "ブロック暗号", "word": "CBC-MAC", "short": "CBCモードを応用したメッセージ認証コード生成方式。", "detail": "CBCモードで暗号化した最終ブロックをメッセージ認証子(MAC)として利用し、改ざん検知に用いる方式。"}, {"cat": "暗号技術・PKI", "group": "ブロック暗号", "word": "CTR", "short": "ブロック暗号をカウンタ値でストリーム的に使う暗号利用モード。", "detail": "Counter mode。連番のカウンタ値を暗号化した結果を平文とXORすることで暗号化する、並列処理しやすいモード。"}, {"cat": "暗号技術・PKI", "group": "ブロック暗号", "word": "CCMP", "short": "AESをCTRモード+CBC-MACで使う無線LAN向け暗号方式。", "detail": "Counter mode CBC-MAC Protocol。WPA2で採用される、機密性(CTR)と完全性(CBC-MAC)を同時に提供する方式。"}, {"cat": "暗号技術・PKI", "group": "ブロック暗号", "word": "XCBC-MAC", "short": "CBC-MACを拡張し可変長メッセージに対応させたMAC方式。", "detail": "任意長のメッセージに対して安全にCBC-MACを適用できるよう改良されたメッセージ認証コード生成方式。"}, {"cat": "暗号技術・PKI", "group": "ストリーム暗号", "word": "ストリーム暗号方式", "short": "データをビット/バイト単位で連続的に暗号化する方式。", "detail": "鍵ストリームを生成し平文と逐次XORしていく方式で、ブロック単位に区切らず処理する。"}, {"cat": "暗号技術・PKI", "group": "ストリーム暗号", "word": "RC4", "short": "代表的なストリーム暗号アルゴリズム(現在非推奨)。", "detail": "WEPやSSLで使われた軽量なストリーム暗号だが、鍵ストリームの偏りなど脆弱性が指摘され現在は非推奨。"}, {"cat": "暗号技術・PKI", "group": "ストリーム暗号", "word": "ChaCha20", "short": "RC4に代わる現代的なストリーム暗号アルゴリズム。", "detail": "Googleらにより設計された高速かつ安全なストリーム暗号で、TLS1.3やモバイル環境で採用が進む。"}, {"cat": "暗号技術・PKI", "group": "ストリーム暗号", "word": "キーストリーム", "short": "ストリーム暗号で平文とXORされる鍵由来のビット列。", "detail": "暗号鍵と初期化ベクトルなどから生成される疑似乱数列で、これを平文にXORして暗号文を得る。"}, {"cat": "暗号技術・PKI", "group": "ストリーム暗号", "word": "初期化ベクトル", "short": "暗号化のたびに変化させる初期値。", "detail": "IV(Initialization Vector)。同じ鍵でも毎回異なる暗号文になるよう処理の開始時に加える値で、パターン露見や再送攻撃を防ぐ。"}, {"cat": "暗号技術・PKI", "group": "ストリーム暗号", "word": "IV", "short": "初期化ベクトルの略称。", "detail": "Initialization Vector。ストリーム暗号やCBCモード等で使われる、暗号化のたびに変化させる初期値。"}, {"cat": "暗号技術・PKI", "group": "ストリーム暗号", "word": "ワンタイムパッド", "short": "理論上解読不能とされる暗号方式。", "detail": "平文と同じ長さの真にランダムな鍵を一度きり使用する暗号方式。実用上は鍵配布・管理の難しさから一般には使われない。"}, {"cat": "暗号技術・PKI", "group": "AEAD・関連", "word": "AEAD", "short": "暗号化と改ざん検知を同時に行う暗号利用モード。", "detail": "Authenticated Encryption with Associated Data。AES-GCMなどが該当し、機密性と完全性を1つの処理でまとめて提供するためTLS1.3などで採用されている。"}, {"cat": "暗号技術・PKI", "group": "AEAD・関連", "word": "AES-GCM", "short": "AESをGCMモードで使うAEAD方式。", "detail": "AESブロック暗号にGalois/Counter Mode(GCM)を組み合わせ、暗号化と認証タグ生成を同時に行う。TLS1.2/1.3で広く使われる暗号スイート。"}, {"cat": "暗号技術・PKI", "group": "AEAD・関連", "word": "認証付き暗号", "short": "暗号化とメッセージ認証を組み合わせた仕組み。", "detail": "機密性(暗号化)と完全性・認証(MAC等)を同時に提供する暗号方式の総称で、AEADはその代表例。"}, {"cat": "暗号技術・PKI", "group": "公開鍵暗号アルゴリズム", "word": "RSA暗号", "short": "素因数分解の困難性に基づく公開鍵暗号。", "detail": "大きな合成数の素因数分解が困難であることを安全性の根拠とする、広く使われる公開鍵暗号アルゴリズム。"}, {"cat": "暗号技術・PKI", "group": "公開鍵暗号アルゴリズム", "word": "楕円曲線暗号", "short": "楕円曲線上の離散対数問題に基づく公開鍵暗号。", "detail": "ECC(Elliptic Curve Cryptography)。RSAより短い鍵長で同等の安全性を実現でき、モバイル等軽量な環境でも使われる。"}, {"cat": "暗号技術・PKI", "group": "公開鍵暗号アルゴリズム", "word": "ECC", "short": "楕円曲線暗号の略称。", "detail": "Elliptic Curve Cryptography。楕円曲線上の演算を利用した公開鍵暗号方式。"}, {"cat": "暗号技術・PKI", "group": "公開鍵暗号アルゴリズム", "word": "原像計算困難性", "short": "ある出力から入力を逆算することが計算量的に困難な性質。", "detail": "ハッシュ関数の安全性の根拠となる性質の一つで、出力から元のデータを求めることが実用的な時間では不可能であること。"}, {"cat": "暗号技術・PKI", "group": "公開鍵暗号アルゴリズム", "word": "第2原像計算困難性", "short": "あるデータと同じハッシュ値を持つ別のデータを見つけることが困難な性質。", "detail": "ハッシュ関数の安全性根拠の一つで、既知のデータと同じハッシュ値になる別データを見つけることが計算量的に困難であること。"}, {"cat": "暗号技術・PKI", "group": "公開鍵暗号アルゴリズム", "word": "衝突困難性", "short": "異なる入力から同じハッシュ値が生じにくい性質。", "detail": "ハッシュ関数において、異なる2つの入力から同じ出力(ハッシュ値)が得られる組を見つけることが困難であるという性質。"}, {"cat": "暗号技術・PKI", "group": "公開鍵暗号アルゴリズム", "word": "衝突", "short": "異なる入力から同一のハッシュ値が生じる事象。", "detail": "ハッシュ関数における理論上避けられない現象だが、衝突困難性が高いほど実際に見つけるのは困難になる。"}, {"cat": "暗号技術・PKI", "group": "鍵交換", "word": "Diffie-Hellman鍵交換方式", "short": "盗聴されても共通鍵を安全に共有できる鍵交換方式。", "detail": "公開情報のやり取りのみから、当事者だけが計算可能な共通の秘密鍵を導出できる方式。DHE、ECDHEの基礎となる。"}, {"cat": "暗号技術・PKI", "group": "鍵交換", "word": "DHE", "short": "Diffie-Hellman鍵交換の一時鍵版。", "detail": "Diffie-Hellman Ephemeral。セッションごとに一時的な鍵ペアを生成することでPFS(前方秘匿性)を提供する方式。"}, {"cat": "暗号技術・PKI", "group": "鍵交換", "word": "ECDHE", "short": "楕円曲線を用いたDiffie-Hellman鍵交換の一時鍵版。", "detail": "Elliptic Curve DHE。楕円曲線暗号を使いDHEより短い鍵長で高速にPFSを提供する、TLSで広く使われる鍵交換方式。"}, {"cat": "暗号技術・PKI", "group": "鍵交換", "word": "鍵交換", "short": "通信当事者間で暗号鍵を安全に共有すること。", "detail": "盗聴の可能性がある経路上でも安全に共通鍵を確立するための手続き全般を指す。"}, {"cat": "暗号技術・PKI", "group": "鍵交換", "word": "前方秘匿性", "short": "長期鍵が漏洩しても過去の通信内容は解読されない性質。", "detail": "PFS(Perfect/Forward Secrecy)。セッションごとに一時鍵を使うことで、後日サーバの秘密鍵が漏れても過去の暗号文は解読できない性質。"}, {"cat": "暗号技術・PKI", "group": "鍵交換", "word": "PFS", "short": "前方秘匿性の略称。", "detail": "Perfect Forward Secrecy(Forward Secrecy)。長期鍵の漏洩が過去のセッション鍵に影響しない性質。"}, {"cat": "暗号技術・PKI", "group": "鍵交換・認証鍵", "word": "鍵管理", "short": "暗号鍵の生成・配布・保管・更新・廃棄を行う運用。", "detail": "暗号システムの安全性を支える、鍵のライフサイクル全体を管理する実務・仕組み。"}, {"cat": "暗号技術・PKI", "group": "鍵交換・認証鍵", "word": "セッション鍵", "short": "一時的な通信のために生成される鍵。", "detail": "そのセッション(通信)限りで使い捨てにされる共通鍵で、鍵交換方式により安全に確立される。"}, {"cat": "暗号技術・PKI", "group": "鍵交換・認証鍵", "word": "事前共有鍵", "short": "通信開始前にあらかじめ共有しておく鍵。", "detail": "PSK(Pre-Shared Key)。IPsecや無線LANのパーソナルモードなどで、事前に手動設定しておく共通の鍵。"}, {"cat": "暗号技術・PKI", "group": "鍵交換・認証鍵", "word": "PSK", "short": "事前共有鍵の略称。", "detail": "Pre-Shared Key。IKEや無線LANのパーソナルモードで使われる、事前に設定しておく共通鍵。"}, {"cat": "暗号技術・PKI", "group": "MAC・ハッシュ", "word": "メッセージ認証コード", "short": "メッセージの完全性と認証を提供する短い値。", "detail": "MAC。共通鍵とメッセージから計算される値で、改ざんの有無となりすましでない送信元の確認に使われる。"}, {"cat": "暗号技術・PKI", "group": "MAC・ハッシュ", "word": "ハッシュアルゴリズム", "short": "任意長データから固定長の値を生成する関数群。", "detail": "SHA-2等、メッセージダイジェスト生成に使われるアルゴリズムの総称。改ざん検知やデジタル署名の基礎となる。"}, {"cat": "暗号技術・PKI", "group": "MAC・ハッシュ", "word": "メッセージダイジェスト", "short": "ハッシュ関数により生成される固定長の要約値。", "detail": "元データの完全性検証に使われる、ハッシュ関数の出力値そのものを指す用語。"}, {"cat": "暗号技術・PKI", "group": "MAC・ハッシュ", "word": "HMAC", "short": "共通鍵を用いたハッシュベースのメッセージ認証コード。", "detail": "Hash-based MAC。ハッシュ関数と秘密鍵を組み合わせて安全なMACを生成する方式で、TLSやIPsecで広く使われる。"}, {"cat": "暗号技術・PKI", "group": "MAC・ハッシュ", "word": "ハッシュ付き鍵", "short": "HMACのように鍵を組み込んだハッシュ処理を指す表現。", "detail": "ハッシュ関数の入力に秘密鍵を含めることで認証機能を持たせる方式(HMAC等)を指す表現。"}, {"cat": "暗号技術・PKI", "group": "MAC・ハッシュ", "word": "SHA-2", "short": "現在標準的に使われるハッシュ関数のファミリー。", "detail": "SHA-256やSHA-512などを含む、SHA-1の後継として広く使われるハッシュアルゴリズム群。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "PKI", "short": "公開鍵暗号を実運用で使うための信頼基盤。", "detail": "Public Key Infrastructure。認証局が発行するデジタル証明書により、公開鍵の正当な持ち主を保証する仕組み全体。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "公開鍵基盤", "short": "PKIの日本語表記。", "detail": "公開鍵暗号を安全に運用するための認証局・証明書・失効管理などから成る仕組み全体。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "CA", "short": "証明書を発行する信頼された第三者機関。", "detail": "Certificate Authority(認証局)。公開鍵と申請者の身元を結びつけたデジタル証明書を発行・管理する機関。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "プライベートCA", "short": "組織内など閉じた範囲で運用される独自の認証局。", "detail": "一般に公開された商用CAではなく、社内システム等の限定された用途向けに構築・運用される認証局。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "認証局", "short": "CAの日本語表記。", "detail": "デジタル証明書を発行し、公開鍵の正当性を保証する信頼された第三者機関。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "電子証明書", "short": "公開鍵と持ち主の情報を結びつけたデジタルなデータ。", "detail": "認証局の署名により、公開鍵が確かにその持ち主のものであることを証明するデータ。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "デジタル署名", "short": "秘密鍵で署名し公開鍵で検証する電子的な署名。", "detail": "送信者の秘密鍵でメッセージのハッシュ値を暗号化したもので、公開鍵による検証により送信者の真正性と非改ざんを確認できる。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "サーバ証明書", "short": "Webサーバ等の身元を証明する電子証明書。", "detail": "TLS通信において、接続先サーバが正当な運営者であることを示すために提示される証明書。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "サーバ署名", "short": "サーバ証明書に含まれるCAによるデジタル署名。", "detail": "認証局がサーバ証明書の内容に対して行う署名で、証明書の正当性を保証する。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "サーバ認証", "short": "接続先サーバの正当性をクライアントが確認すること。", "detail": "TLSハンドシェイク時にサーバ証明書を検証し、接続先が確かに意図した相手であることを確認する処理。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "クライアント証明書", "short": "クライアント(利用者)の身元を証明する電子証明書。", "detail": "サーバ側がクライアントの正当性を確認するために要求する、利用者個人・端末に発行される証明書。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "クライアント署名", "short": "クライアント証明書に付与されるデジタル署名。", "detail": "認証局がクライアント証明書の内容に対して行う署名で、証明書の正当性を保証する。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "クライアント認証", "short": "接続してきたクライアントの正当性をサーバが確認すること。", "detail": "クライアント証明書等を用いて、通信相手のクライアントが正当な利用者であることを検証する処理。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "証明書署名要求", "short": "CAへ証明書発行を依頼するためのデータ。", "detail": "CSR(Certificate Signing Request)。公開鍵と申請者情報を含み、CAに送付して署名(証明書発行)を依頼するためのデータ。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "CSR", "short": "証明書署名要求の略称。", "detail": "Certificate Signing Request。CAに証明書発行を申請する際に送付するデータ。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "失効リスト", "short": "失効した証明書の一覧。", "detail": "CRL(Certificate Revocation List)。有効期限内でも何らかの理由で無効化された証明書のシリアル番号等を列挙したリスト。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "エンティティ認証", "short": "通信相手が主張する身元(実体)であることを確認すること。", "detail": "証明書やパスワード等を用いて、通信相手が確かに本人・当該システムであることを検証するプロセス全般を指す用語。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "VPN基本", "word": "VPN通信", "short": "公衆網上に仮想的な専用線を構築する通信。", "detail": "Virtual Private Network。インターネット等の共用ネットワーク上で、暗号化やトンネリングにより専用線のような閉域通信を実現する仕組み。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "VPN基本", "word": "仮想の専用線", "short": "VPNが提供する論理的な専用線環境を表す表現。", "detail": "物理的な専用線を敷設せず、暗号化・トンネリング技術により専用線相当のセキュアな通信路を実現するという概念を指す。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "VPN基本", "word": "インターネットVPN", "short": "インターネット回線を利用して構築するVPN。", "detail": "公衆インターネット上に暗号化トンネルを構築して拠点間を接続する、コストを抑えたVPN形態。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "VPN基本", "word": "IP-VPN網", "short": "通信事業者のIP網を使って構築するVPN。", "detail": "インターネットを経由せず、通信事業者が提供する閉域のIP網内でVPNを構築するサービス形態。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "VPN基本", "word": "VPN網", "short": "VPNによって構築された仮想ネットワーク全体を指す表現。", "detail": "拠点間を結ぶVPN接続群によって形成される論理ネットワーク全体を指す用語。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "VPN基本", "word": "SSL-VPN", "short": "WebブラウザやSSL/TLSを利用するVPN方式。", "detail": "専用クライアントソフトなしにブラウザ経由、またはSSL/TLSを用いた専用クライアントでリモートアクセスを実現するVPN方式。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "VPN基本", "word": "リモートアクセス", "short": "外部から社内ネットワークへ接続すること。", "detail": "出張先や自宅など社外から、VPN等を経由して社内リソースへアクセスする形態。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "トンネリング", "short": "あるプロトコルのパケットを別プロトコルでカプセル化して転送する技術。", "detail": "元のパケット全体を新しいヘッダで包み(カプセル化)、異なるネットワークを経由して透過的に転送する技術。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "トンネル処理", "short": "カプセル化・非カプセル化を行う一連の処理。", "detail": "送信側でのカプセル化と受信側での復元(デカプセル化)を含む、トンネリングを実現する処理全体。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "トンネルモード", "short": "元のIPパケット全体を新しいIPヘッダで包むIPsecの動作モード。", "detail": "IPsecにおいて、元のIPヘッダを含めペイロード全体を暗号化し新たなIPヘッダを付与するモード。拠点間VPN(ゲートウェイ型)で使われる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "トランスポートモード", "short": "元のIPヘッダを維持しペイロードのみ保護するIPsecの動作モード。", "detail": "IPsecにおいて、元のIPヘッダはそのままにペイロード部分のみを暗号化・認証するモード。主にホスト間の直接通信で使われる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "L2フォワーディング方式", "short": "データリンク層のフレームをトンネリングする方式。", "detail": "レイヤ2レベルでフレームをそのままカプセル化して転送する方式で、L2TP等が該当する。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "GRE", "short": "汎用的なカプセル化トンネリングプロトコル。", "detail": "Generic Routing Encapsulation。様々なプロトコルのパケットをIPでカプセル化して転送できる、暗号化機能を持たない汎用トンネリングプロトコル。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "GRE o
