ver Ipsec", "short": "GREトンネルをIPsecで暗号化する構成。", "detail": "GRE単体では暗号化されないため、IPsecと組み合わせてトンネル内の通信を暗号化する構成。マルチキャストや動的ルーティングをVPN上で使いたい場合に利用される。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "L2TP", "short": "レイヤ2のフレームをトンネリングするプロトコル。", "detail": "Layer 2 Tunneling Protocol。PPPフレームをカプセル化して転送するが、それ自体には暗号化機能がない。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "L2TP over Ipsec", "short": "L2TPをIPsecで暗号化して安全性を補う構成。", "detail": "暗号化機能を持たないL2TPを、IPsecのトランスポートモードと組み合わせて暗号化・認証を付加するVPN構成。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "PPP", "short": "2点間のシリアル接続で使われるデータリンク層プロトコル。", "detail": "Point-to-Point Protocol。ダイヤルアップ接続やL2TP/PPPoEの内部で使われる、1対1リンク用のプロトコル。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "PPPoE", "short": "PPPをイーサネット上にカプセル化する規格。", "detail": "PPP over Ethernet。ブロードバンド回線上でPPPのユーザ認証・接続管理の仕組みを利用するために使われる規格。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "IPsec", "short": "IP層でパケットの暗号化・認証を行うプロトコル群。", "detail": "Internet Protocol Security。ESPやAHを用い、IPパケット単位での機密性・完全性・送信元認証を提供するプロトコルスイート。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "ESP", "short": "IPsecでペイロードの暗号化と認証を行うプロトコル。", "detail": "Encapsulating Security Payload。データの機密性(暗号化)と完全性・認証の両方を提供する、実運用で主に使われるIPsecプロトコル。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "AH", "short": "IPsecでパケットの改ざん検知・送信元認証を行うプロトコル。", "detail": "Authentication Header。ペイロードの暗号化は行わず完全性・認証のみを提供する点がESPと異なる。NATとの相性が悪いため実運用ではESPが主流。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "IPsec SA", "short": "IPsecで暗号化・認証方式を取り決めた論理的な接続関係。", "detail": "Security Association。使用する暗号アルゴリズムや鍵、有効期間などを両者間で取り決めた一方向の論理コネクション。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "SA", "short": "セキュリティアソシエーションの略称。", "detail": "Security Association。IPsecやIKEにおいて、暗号化方式・鍵・寿命などのパラメータを合意した論理的な関係。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "SPI", "short": "IPsec SAを識別するための値。", "detail": "Security Parameter Index。ESP/AHヘッダに含まれ、受信側がどのSAに基づき処理すべきかを識別するための値。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "SAD", "short": "確立済みのSA情報を保持するデータベース。", "detail": "Security Association Database。有効なSAのパラメータ(鍵、アルゴリズム等)を管理するデータベース。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "SPD", "short": "どの通信にIPsecを適用するか定めたポリシーデータベース。", "detail": "Security Policy Database。通信の送信元/宛先等に応じてIPsecを適用するか、どう適用するかを定義したポリシー集。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "IKE", "short": "IPsecで使う鍵やSAを自動的にネゴシエーションするプロトコル。", "detail": "Internet Key Exchange。Diffie-Hellman鍵交換等を用い、IPsec通信に必要な鍵・SAパラメータを自動で安全に取り決めるプロトコル。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "IKEv1", "short": "IKEの第1版。", "detail": "2フェーズ構成(ISAKMP SA確立→IPsec SA確立)で動作する、初期のIKE仕様。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "IKEv2", "short": "IKEの改良版。", "detail": "IKEv1より手順を簡素化・高速化し、NATトラバーサルやモバイル対応(MOBIKE)なども強化された現行のIKE仕様。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "IKE SA", "short": "IKEネゴシエーションのための論理的な保護関係。", "detail": "IKE自体の通信を保護するために最初に確立されるSAで、この上でIPsec SAのネゴシエーションが行われる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "ISAKMP SA", "short": "IKEv1のフェーズ1で確立される制御用SA。", "detail": "Internet Security Association and Key Management Protocol SA。IKEv1における鍵交換の枠組みおよびその制御チャネルの保護関係。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "IKE_SA_INIT交換", "short": "IKEv2の最初の鍵交換フェーズ。", "detail": "IKEv2において、暗号アルゴリズムの提案とDiffie-Hellman鍵交換を行い、以降の通信を保護するIKE SAを確立する最初の交換。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "IKE_AUTH交換", "short": "IKEv2で相互認証とIPsec SA確立を行うフェーズ。", "detail": "IKE_SA_INIT交換で保護されたチャネル上で、当事者同士の認証と実際のIPsec(Child) SAの確立を行う交換。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "Child SA", "short": "IKEv2で確立される実データ保護用のSA。", "detail": "IKE_AUTH交換の結果生成される、実際のユーザデータ(ESP/AH)を保護するためのSA。IKEv1のIPsec SAに相当。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "メインモード", "short": "IKEv1フェーズ1で身元を秘匿しつつネゴシエーションする方式。", "detail": "6メッセージのやり取りにより、当事者の身元情報を暗号化してから交換するIKEv1のネゴシエーションモード。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "アグレッシブモード", "short": "IKEv1フェーズ1を高速化する代わりに身元を秘匿しないモード。", "detail": "3メッセージで完了する高速なネゴシエーション方式だが、身元情報が平文でやり取りされるためメインモードより安全性が劣る。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "IPsec-VPN鍵交換", "short": "IKEによる鍵交換全般を指す表現。", "detail": "IPsec通信を開始する前段階として行われる、IKEを用いた鍵とSAパラメータの合意プロセス全般を指す。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "XAUTH", "short": "IKEv1にユーザ認証機能を追加する拡張。", "detail": "Extended Authentication。機器認証に加え、リモートアクセスVPN利用者個人の認証(ユーザ名/パスワード等)を追加するIKEv1拡張。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "NATトラバーサル", "short": "NAT環境でIPsec通信を成立させる技術。", "detail": "NAT-T。ESPパケットをUDPでカプセル化するなどして、NATを経由してもIPsec通信が成立するようにする技術。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "NAT越え", "short": "NATトラバーサルとほぼ同義の表現。", "detail": "NAT環境を挟んでもEnd-to-Endの通信(IPsec等)を成立させることを指す表現。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "IP in IP", "short": "IPパケットをIPでカプセル化する単純なトンネリング方式。", "detail": "元のIPパケット全体を新しいIPヘッダで包む、GREなどより単純なトンネリングプロトコル。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "SSL", "short": "TLSの前身にあたる旧世代の暗号化プロトコル。", "detail": "Secure Sockets Layer。TLSの前身であり脆弱性のため現在は非推奨、実質的にTLSに置き換わっている。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "TLS", "short": "通信の暗号化・認証・完全性を提供するプロトコル。", "detail": "Transport Layer Security。SSLの後継規格で、HTTPS等の安全な通信を実現するために広く使われる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "TLS1.2", "short": "広く普及しているTLSのバージョン。", "detail": "AEAD暗号スイートへの対応など、旧バージョンより安全性・柔軟性を高めたTLSのバージョン。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "TLS1.3", "short": "最新かつ高速・高セキュリティなTLSのバージョン。", "detail": "ハンドシェイクの往復回数を削減し、PFSを必須化するなど大幅に安全性と速度を向上させた最新バージョン。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "TLS通信", "short": "TLSを用いた暗号化通信全般。", "detail": "ハンドシェイクによる鍵交換・認証の後、共通鍵で暗号化されたデータ通信を行うプロセス全体を指す。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "TLSアクセラレーション機能", "short": "TLSの暗号処理を専用ハードウェア等で高速化する機能。", "detail": "CPU負荷の高い暗号処理を専用チップやロードバランサに肩代わりさせ、サーバの処理性能を向上させる機能。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "ハンドシェイク", "short": "通信開始時に行うパラメータ交渉・鍵確立の手順。", "detail": "TLS等において、暗号方式の合意・証明書検証・鍵交換を行う、実データ送信前の一連の手続き。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "ハンドシェイクプロトコル", "short": "ハンドシェイクの手順を規定するプロトコル。", "detail": "TLS仕様の中で、ハンドシェイクメッセージの種類・順序・形式を定めるサブプロトコル。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "Change Cipher Specプロトコル", "short": "以降の通信で暗号化を開始することを通知するTLSのプロトコル。", "detail": "ハンドシェイク完了後、これ以降のメッセージを合意した暗号方式で保護することを相手に通知するための短いプロトコル。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "Server Name Indication", "short": "1つのIPで複数ドメインのTLS証明書を使い分ける拡張。", "detail": "SNI。TLSハンドシェイク開始時にクライアントが接続先ホスト名を通知することで、サーバが適切な証明書を選択できるようにする拡張。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "SNI", "short": "Server Name Indicationの略称。", "detail": "1つのIPアドレスで複数のホスト名・証明書を運用できるようにするTLSの拡張機能。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "ALPN", "short": "TLSハンドシェイク中に上位アプリケーションプロトコルを合意する拡張。", "detail": "Application-Layer Protocol Negotiation。HTTP/2かHTTP/1.1かなどをTLSのハンドシェイク時点で決定でき、通信の往復回数を削減できる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "暗号スイート", "short": "TLSで使用する暗号アルゴリズムの組み合わせ。", "detail": "鍵交換方式、暗号化アルゴリズム、MACアルゴリズムなどの組み合わせを定義したセットで、ハンドシェイクで両者が合意する。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "リモートアクセス関連", "word": "XAUTH", "short": "IKEv1にユーザ認証機能を追加する拡張。", "detail": "(IPsecグループと重複掲載)リモートアクセスVPN利用者個人の認証を追加するIKEv1拡張。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "リモートアクセス関連", "word": "VPNパススルー", "short": "NATルータ配下でVPN通信を透過させる機能。", "detail": "家庭用ルータ等が持つ、PPTPやIPsecなどのVPNプロトコルをNAT越しに正しく中継するための機能。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証モデル基本", "word": "AAAモデル", "short": "認証・認可・課金の3機能をまとめた概念。", "detail": "Authentication(認証)・Authorization(認可)・Accounting(課金・記録)の頭文字で、RADIUSなどのAAAサーバがこの3機能を提供する。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証モデル基本", "word": "認証", "short": "通信相手や利用者が主張する身元を確認すること。", "detail": "パスワードや証明書、生体情報等を用いて、本人・正当な機器であることを検証するプロセス全般。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証モデル基本", "word": "認証局", "short": "デジタル証明書を発行し正当性を保証する機関。", "detail": "CA(Certificate Authority)。公開鍵と申請者を結びつけたデジタル証明書を発行・管理する信頼された第三者機関。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証モデル基本", "word": "認証機能", "short": "認証を実現するための機能全般。", "detail": "IEEE802.1XやRADIUS等、システムが提供する利用者・機器確認の仕組みを指す。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証モデル基本", "word": "認証と接続の手順", "short": "認証プロセスと接続確立までの一連の流れ。", "detail": "認証要求から成功・失敗判定、通信路確立までの手順全体を指す一般的な表現。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証モデル基本", "word": "認証プロトコル", "short": "認証のやり取りを規定するプロトコル。", "detail": "PAP、CHAP、EAP等、認証情報のやり取り方法を定めたプロトコル群。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証モデル基本", "word": "認証方式", "short": "認証を行う具体的な手法の分類。", "detail": "パスワード認証、証明書認証、生体認証など、どのような情報・手段で本人確認を行うかの分類。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証モデル基本", "word": "認証鍵", "short": "認証処理に使用される鍵。", "detail": "HMAC等の認証コード生成や、事前共有鍵のように認証目的で使われる鍵全般を指す。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証モデル基本", "word": "認証付き暗号", "short": "暗号化とメッセージ認証を組み合わせた仕組み。", "detail": "AEAD等、機密性と完全性・認証を同時に提供する暗号方式の総称。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証要素", "word": "パスワード認証", "short": "知識情報(パスワード)による本人確認方式。", "detail": "ユーザが記憶している秘密の文字列を照合して本人確認を行う、最も一般的な認証方式。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証要素", "word": "ワンタイムパスワード認証", "short": "毎回異なる使い捨てパスワードによる認証方式。", "detail": "OTP。トークンやアプリが生成する一度限り有効なパスワードを用いることで、パスワードの使い回しや盗聴による不正利用を防ぐ。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証要素", "word": "バイオメトリクス認証", "short": "指紋や虹彩等の身体的特徴による認証方式。", "detail": "生体認証。所持や記憶に頼らず、本人固有の身体的特徴を用いて認証する方式。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証要素", "word": "ICカード認証", "short": "ICカードを用いた所持情報による認証方式。", "detail": "ICチップに格納された鍵や証明書を用い、カードの所持を根拠に本人確認を行う認証方式。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証要素", "word": "二要素認証", "short": "異なる2種類の要素を組み合わせる認証方式。", "detail": "知識(パスワード)・所持(トークン)・生体(指紋)のうち2つを組み合わせ、単一要素より安全性を高めた認証方式。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証要素", "word": "発信者番号通知/コールバック認証", "short": "電話番号や折り返し発信による認証方式。", "detail": "発信者番号を確認したり、登録済み番号へ折り返し発信することで正当な利用者かを確認する認証方式。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証要素", "word": "主体認証", "short": "通信・操作を行う主体(利用者や機器)自体を確認すること。", "detail": "メッセージの内容ではなく、それを送っている主体そのものの正当性を確認するという認証の分類。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証要素", "word": "メッセージ認証", "short": "受信したメッセージが正当な送信元からの改ざんされていないものであることを確認すること。", "detail": "MACやデジタル署名により、通信内容自体の完全性と送信元の正当性を確認する認証の分類。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "802.1X・EAP", "word": "IEEE802.1X", "short": "ポートベースの利用者・機器認証を行う標準規格。", "detail": "有線・無線LANにおいて、ポート(接続)単位で認証が成功するまで通信を許可しない仕組みを規定する標準。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "802.1X・EAP", "word": "EAP", "short": "様々な認証方式を統一的に扱う拡張認証プロトコル。", "detail": "Extensible Authentication Protocol。IEEE802.1X等の上位で、パスワード・証明書など多様な認証方式を柔軟に利用できるようにする枠組み。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "802.1X・EAP", "word": "EAP-TLS", "short": "証明書ベースの相互認証を行うEAP方式。", "detail": "クライアント・サーバ双方が証明書を用いて相互に認証する、非常に強固だが証明書配布・管理の負担があるEAP方式。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "802.1X・EAP", "word": "EAP-PEAP", "short": "サーバ証明書のみでTLSトンネルを張り内部で認証するEAP方式。", "detail": "Protected EAP。サーバ証明書によるTLSトンネル内で、パスワード等による内側の認証(MSCHAPv2等)を安全に行う方式。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "802.1X・EAP", "word": "PEAP", "short": "EAP-PEAPの略称。", "detail": "Protected EAP。TLSトンネルでカプセル化した中で利用者認証を行うEAP方式。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "802.1X・EAP", "word": "サプリカント", "short": "802.1X認証を要求するクライアント側ソフトウェア。", "detail": "認証を受ける端末側で動作し、認証情報を認証者(スイッチ/AP)経由で認証サーバへ送る役割を持つソフトウェア。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "802.1X・EAP", "word": "オーセンティケータ", "short": "802.1X認証における認証仲介役の機器。", "detail": "クライアント(サプリカント)と認証サーバの間に立ち、認証が完了するまでポートの通信を制限するスイッチやAPの役割。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "802.1X・EAP", "word": "利用者認証方式", "short": "IEEE802.1Xで採用される、個々の利用者を識別する認証方式。", "detail": "エンタープライズモードの無線LANや有線LANで、個々のユーザ単位に認証・鍵管理を行う方式。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "RADIUS", "word": "RADIUS", "short": "AAA機能を提供する代表的な認証プロトコル。", "detail": "Remote Authentication Dial In User Service。認証・認可・課金情報をクライアント(NAS)と集中管理サーバ間でやり取りするプロトコル。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "RADIUS", "word": "認証局(RADIUS文脈)", "short": "(重複整理用の見出し)", "detail": "このシートでは認証局はPKI・証明書グループにも記載。RADIUS自体は証明書発行機能を持たない。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "RADIUS", "word": "AAAサーバ", "short": "認証・認可・課金を一元的に提供するサーバ。", "detail": "RADIUSサーバ等、複数の機器・利用者に対し集中的にAAA機能を提供するサーバを指す。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "ハンドシェイク・認証プロトコル(その他)", "word": "CHAP", "short": "チャレンジ・レスポンス方式によるPPP認証プロトコル。", "detail": "Challenge Handshake Authentication Protocol。パスワードそのものを送らず、チャレンジに対する応答を照合することでなりすましを防ぐPPP用認証方式。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "ハンドシェイク・認証プロトコル(その他)", "word": "チャレンジ/レスポンス方式", "short": "一時的な問い(チャレンジ)への応答で認証する方式。", "detail": "毎回異なるチャレンジ値を提示し、それに対する正しい応答を返せるかで認証するリプレイ攻撃に強い方式。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "ハンドシェイク・認証プロトコル(その他)", "word": "ハンドシェーク方式(記載ゆらぎ)", "short": "ハンドシェイクの表記ゆらぎ。", "detail": "索引上「ハンドシェーク」と表記される場合があるが、内容はTLSやEAP等のハンドシェイクと同義。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "ハンドシェイク・認証プロトコル(その他)", "word": "スリーウェイハンドシェーク", "short": "3回のやり取りで接続を確立する手順。", "detail": "TCPコネクション確立(SYN→SYN/ACK→ACK)に代表される、3段階のメッセージ交換による接続確立手順。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "ハンドシェイク・認証プロトコル(その他)", "word": "バックドア", "short": "正規の認証を経ずにシステムへアクセスできる裏口。", "detail": "正規の認証機構を迂回してアクセスを可能にする、意図的または悪意によって仕込まれた侵入経路。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "ハンドシェイク・認証プロトコル(その他)", "word": "踏み台", "short": "攻撃者が別の攻撃の中継地点として悪用する機器。", "detail": "不正アクセスされた機器を経由して別の標的を攻撃することで、攻撃元の追跡を困難にする手法における中継機器。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(フラッド系)", "word": "DoS攻撃", "short": "サービス提供を妨害することを目的とした攻撃。", "detail": "Denial of Service。大量の通信や特殊なパケットにより対象システムのリソースを枯渇させ、正常なサービス提供を妨げる攻撃。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(フラッド系)", "word": "分散型DoS攻撃", "short": "多数の踏み台から一斉にDoS攻撃を行う手法。", "detail": "DDoS。複数の攻撃元(ボットネット等)から同時に攻撃対象へ大量の通信を送りつけ、遮断を困難にする攻撃。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(フラッド系)", "word": "SYNフラッド攻撃", "short": "大量のSYNパケットで接続待ちリソースを枯渇させる攻撃。", "detail": "3ウェイハンドシェイクのSYN/ACK後、ACKを返さず接続確立を放置することでサーバの接続管理テーブルを枯渇させる攻撃。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(フラッド系)", "word": "UDPフラッド攻撃", "short": "大量のUDPパケットで帯域・処理能力を消費させる攻撃。", "detail": "コネクションレスなUDPの特性を利用し、大量パケットを送りつけて帯域やリソースを圧迫する攻撃。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(フラッド系)", "word": "ICMPフラッド攻撃", "short": "大量のICMPパケットで帯域・処理能力を消費させる攻撃。", "detail": "pingパケット等ICMPメッセージを大量送信し、帯域やホストの処理能力を圧迫する攻撃。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(反射・増幅系)", "word": "DNS Amp攻撃", "short": "DNSを悪用した反射・増幅型のDoS攻撃。", "detail": "送信元を偽装した小さな問い合わせに対し、DNSサーバが大きな応答を標的へ返すよう仕向け、帯域を圧迫する攻撃。オープンリゾルバが悪用されやすい。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(反射・増幅系)", "word": "DNSリフレクタ攻撃", "short": "送信元を詐称しDNSサーバを踏み台にする攻撃全般。", "detail": "攻撃者が標的のIPアドレスを送信元として偽装した問い合わせをDNSサーバへ送り、応答が標的に届くようにする攻撃手法。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(なりすまし・中間者)", "word": "MITM攻撃", "short": "通信の当事者になりすまし内容を盗聴・改ざんする攻撃。", "detail": "Man-In-The-Middle攻撃。通信経路上に割り込み、双方に対し相手のふりをして情報を盗聴・改ざんする攻撃。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(なりすまし・中間者)", "word": "中間者攻撃", "short": "MITM攻撃の日本語表記。", "detail": "通信の間に第三者が介入し、当事者に気づかれずに内容を盗聴・改変する攻撃手法。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(なりすまし・中間者)", "word": "DNSキャッシュ汚染", "short": "キャッシュサーバに偽の名前解決結果を注入する攻撃。", "detail": "DNSキャッシュポイズニングとも呼ばれ、偽の応答をキャッシュに記憶させることで利用者を偽サイトへ誘導する攻撃。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(なりすまし・中間者)", "word": "DNSキャッシュポイズニング", "short": "DNSキャッシュ汚染の別称。", "detail": "キャッシュDNSサーバに不正な名前解決結果を記憶させ、正規のドメイン名でも攻撃者が用意したIPアドレスへ誘導する攻撃。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(なりすまし・中間者)", "word": "リプレイ攻撃", "short": "過去に取得した正規の通信データを再利用する攻撃。", "detail": "認証情報やセッションデータをキャプチャし、そのまま再送信することで不正に認証・処理を通そうとする攻撃。チャレンジ/レスポンス方式で対策される。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "脆弱性・侵入", "word": "公開サーバの脆弱性", "short": "インターネットに公開されたサーバが持つ弱点。", "detail": "外部から到達可能なサーバの、パッチ未適用や設定不備などにより攻撃者に悪用され得る弱点。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "脆弱性・侵入", "word": "コネクションレス型通信の脆弱性", "short": "状態管理をしない通信方式特有の弱点。", "detail": "UDP等、送信元の正当性を保証しないため送信元詐称による攻撃(DoS、リフレクタ攻撃等)を受けやすいという性質。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "脆弱性・侵入", "word": "さらし端末問題", "short": "無線LAN等で自分の電波が他端末の通信を阻害してしまう問題。", "detail": "隠れ端末問題とは逆に、実際には競合しない端末同士でもキャリアセンスにより送信を控えてしまい、実効スループットが低下する問題。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "脆弱性・侵入", "word": "ゼロデイ(記載なしのため一般知識で補足)", "short": "修正パッチが存在しない未知の脆弱性を突く攻撃。", "detail": "本索引には明記されていないが、頻出関連語として補足。パッチ公開前の脆弱性を悪用する攻撃全般を指す。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "IDS", "short": "不正な通信・侵入の兆候を検知するシステム。", "detail": "Intrusion Detection System。シグネチャやアノマリ(異常)検知により不正アクセスの兆候を発見し通知する仕組み。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "IPS", "short": "不正な通信を検知しリアルタイムで遮断するシステム。", "detail": "Intrusion Prevention System。IDSの検知機能に加え、検知した不正通信を自動的に遮断する防御機能を持つ。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "侵入検知システム", "short": "IDSの日本語表記。", "detail": "ネットワークやホスト上の不正な活動・侵入の兆候を検知し管理者へ通知するシステム。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "侵入防御システム", "short": "IPSの日本語表記。", "detail": "不正な通信を検知した際にリアルタイムで遮断・防御まで行うシステム。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "シグネチャ型", "short": "既知の攻撃パターンと照合して検知する方式。", "detail": "既知の攻撃手法の特徴(シグネチャ)をデータベース化し、通信内容と照合して検知する方式。未知の攻撃には弱い。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "アノマリ型", "short": "通常と異なる異常な挙動を検知する方式。", "detail": "平常時の通信パターンからの逸脱を検知することで、シグネチャにない未知の攻撃も検出しようとする方式。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "ホスト型", "short": "監視対象のホスト自体にエージェントを導入する検知方式。", "detail": "サーバ等の個々のホストにインストールされ、そのホスト上の活動を監視するIDS/IPSの形態。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "ネットワーク型IDS", "short": "ネットワーク経路上の通信を監視する検知方式。", "detail": "特定のセグメントを流れる全通信をミラーポート等で取得し監視するIDSの形態。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "ミラーポート", "short": "スイッチの特定ポートの通信を別ポートへ複製する機能。", "detail": "監視機器がネットワーク上の通信を把握できるよう、あるポート(またはVLAN)の通信内容を別のポートへコピーする機能。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "ミラーリング", "short": "ミラーポート機能によりトラフィックを複製する処理。", "detail": "分析・監視のために特定の通信を別のポートへそのまま複製して転送する処理。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "フォールスポジティブ", "short": "正常な通信を誤って攻撃と判定してしまう誤検知。", "detail": "誤検知(過剰検知)。正当な通信をIDS/IPSが不正と誤判定してしまう状態で、業務影響が出ることがある。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "フォールスネガティブ", "short": "実際の攻撃を見逃してしまう検知漏れ。", "detail": "実際に発生している不正な通信を、IDS/IPSが検知できずに見逃してしまう状態。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "FW", "short": "不正な通信を制御・遮断する境界防御装置。", "detail": "ファイアウォール。あらかじめ定めたルールに基づき、通過させる通信・遮断する通信を制御する装置。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "ファイアウォール", "short": "FWの日本語表記。", "detail": "内部ネットワークと外部ネットワークの境界に設置され、通信を制御するセキュリティ装置。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "パケットフィルタリング", "short": "パケットのヘッダ情報に基づき通過可否を判定する方式。", "detail": "送信元/宛先IPアドレス、ポート番号等の情報を見て、あらかじめ定めたルールで通過・遮断を決める最も基本的なFWの方式。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "フィルタリング", "short": "ルールに基づき通信の可否を判定・制御すること。", "detail": "パケットフィルタリングやURLフィルタリング等、条件に応じて通過・遮断を判定する処理全般を指す。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "アドミッション制御", "short": "一定の条件を満たす通信のみ受け入れる制御。", "detail": "帯域や優先度、認証状態等の条件に基づき、新規セッションの受け入れ可否を制御する仕組み。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "アプリケーションレベルゲートウェイ", "short": "アプリケーション層まで解析して中継するFW方式。", "detail": "データの内容(アプリケーション層プロトコル)まで解釈し、内容に応じて中継・制御を行うファイアウォール方式。プロキシ型FWとも呼ばれる。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "ステートフルインスペクション", "short": "通信の状態(セッション)を管理しながら制御するFW方式。", "detail": "単純なパケットフィルタリングと異なり、コネクションの状態を追跡し、その文脈に沿った通信のみを許可する高度なFW方式。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "ステートフル", "short": "状態を保持・追跡しながら処理を行う性質。", "detail": "セッションの確立状況など通信の文脈情報を保持し、それに基づき判断を行う仕組みの性質。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "ステートフルフェールオーバー機能", "short": "FWの障害時にセッション状態を引き継ぐ機能。", "detail": "冗長化されたFW間でセッションテーブルを同期し、障害発生時にも既存通信を切断せず継続させる機能。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "ステートレス", "short": "状態を保持せず各パケットを独立に処理する性質。", "detail": "前後の通信の文脈を持たず、個々のパケット単体の情報だけで判断を行う処理方式の性質。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "ミドルボックス", "short": "通信経路上に存在しパケットを加工・制御する中間機器の総称。", "detail": "FW、NAT機器、ロードバランサ等、エンドツーエンドの通信経路上に介在しパケットを処理する機器全般の呼称。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "セキュリティスキャン・侵入テスト", "word": "侵入検知システム", "short": "(重複整理用の見出し)", "detail": "上記「検知・防御システム」参照。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "セキュリティスキャン・侵入テスト", "word": "ペネトレーションテスト", "short": "実際に攻撃を試みてシステムの弱点を検証する試験。", "detail": "侵入テスト。攻撃者の視点でシステムに侵入を試み、実際に悪用可能な脆弱性がないか検証する手法。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "セキュリティスキャン・侵入テスト", "word": "スキャン", "short": "対象のポートや脆弱性を機械的に調査すること。", "detail": "開いているポートや既知の脆弱性の有無を、ツールを用いて網羅的に調べる行為。攻撃の事前調査としても行われる。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "セキュリティスキャン・侵入テスト", "word": "Webトラフィックのスキャン", "short": "Web通信内容を検査し脅威を検出すること。", "detail": "プロキシやセキュリティ製品がHTTP/HTTPS通信の内容を解析し、マルウェアや不正な挙動を検出する処理。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "セキュリティスキャン・侵入テスト", "word": "メールのスキャン", "short": "受信メールの内容を検査しウイルス・迷惑メールを検知すること。", "detail": "添付ファイルや本文をパターンマッチング等で検査し、脅威や迷惑メールを検出・隔離する処理。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "セキュリティスキャン・侵入テスト", "word": "ウイルス対策", "short": "マルウェア感染を防止・検知・除去する対策全般。", "detail": "アンチウイルスソフトの導入、パターンファイル更新、挙動監視など、ウイルス被害を防ぐための施策全般。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "セキュリティスキャン・侵入テスト", "word": "ステルス化", "short": "攻撃活動を検知されにくくする隠蔽手法。", "detail": "マルウェアや攻撃者が、セキュリティ製品やログから自身の存在・活動を隠す手法。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "セキュリティスキャン・侵入テスト", "word": "ステルス機能", "short": "ステルス化を実現する機能。", "detail": "検知回避のためプロセスや通信を隠蔽する、マルウェア等が持つ機能。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "その他セキュリティ用語", "word": "出口対策", "short": "内部から外部への不正通信を検知・遮断する対策。", "detail": "侵入を100%防げない前提で、内部に侵入したマルウェア等が外部と通信(C2通信等)する際に検知・遮断する多層防御の考え方。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "その他セキュリティ用語", "word": "入口対策", "short": "外部から内部への侵入を防ぐ対策。", "detail": "FWやIPS等、外部からの不正アクセス・侵入を水際で防ぐための対策の総称。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "その他セキュリティ用語", "word": "セキュリティポリシー", "short": "組織のセキュリティに関する方針・ルール。", "detail": "何をどう守るか、どのような行動を許容・禁止するかを定めた組織の基本方針文書。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "その他セキュリティ用語", "word": "セキュリティプロトコル", "short": "通信の安全性を確保するために使われるプロトコル群。", "detail": "TLS、IPsec等、機密性・完全性・認証を提供するために設計された通信プロトコルの総称。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "その他セキュリティ用語", "word": "情報セキュリティポリシー", "short": "情報資産保護に関する組織の方針体系。", "detail": "基本方針・対策基準・実施手順の階層で構成される、組織の情報セキュリティに関するルール体系。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "その他セキュリティ用語", "word": "なりすまし防止", "short": "第三者による身元の詐称を防ぐこと。", "detail": "デジタル署名や認証技術により、送信者や利用者が本人であることを保証し、詐称を防止する取り組み。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "その他セキュリティ用語", "word": "否認防止", "short": "送信の事実を後から否定できないようにする性質。", "detail": "デジタル署名等により、送信者が「送っていない」と後から主張することを技術的に防止する性質。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "その他セキュリティ用語", "word": "UTM", "short": "複数のセキュリティ機能を1台に統合した装置。", "detail": "Unified Threat Management。FW、IPS、アンチウイルス、URLフィルタリング等を統合した多機能セキュリティ装置。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "その他セキュリティ用語", "word": "不正アタック対策", "short": "不正アクセス・攻撃全般への対策の総称。", "detail": "FW、IDS/IPS、認証強化等、様々な攻撃手法に対する防御施策全体を指す包括的な表現。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "冗長化基本", "word": "冗長化", "short": "故障に備え予備の経路・機器を用意し可用性を高めること。", "detail": "単一障害点を排除するため、機器・回線・電源等を二重化しておく設計手法全般。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "冗長化基本", "word": "NICの冗長化", "short": "NICの故障に備えて予備回線・予備NICを用意する構成。", "detail": "アクティブ/スタンバイ方式などでNIC障害時にも通信を継続できるようにする冗長構成全般。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "冗長化基本", "word": "NICチーミング", "short": "サーバの複数NICを束ねて冗長化・帯域拡張する技術。", "detail": "OS/ドライバレベルで複数の物理NICを論理的に1つにまとめ、可用性向上やスループット向上を図る機能。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "冗長化基本", "word": "ルータの冗長化", "short": "ルータ障害に備え予備ルータを用意する構成。", "detail": "VRRP等を用いて主ルータ障害時に予備ルータへ自動的に切り替える構成。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "冗長化基本", "word": "サーバの冗長化", "short": "サーバ障害に備え複数台構成にすること。", "detail": "クラスタリングやロードバランサ配下の複数台構成により、1台の障害でもサービス継続できるようにする構成。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "冗長化基本", "word": "インターネット接続回線の冗長化", "short": "複数の回線・ISPを用意し接続断に備える構成。", "detail": "1回線・1事業者の障害に依存しないよう、複数のインターネット接続経路を確保する構成。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "冗長化基本", "word": "マルチホーミング", "short": "複数の接続先(ISP等)を同時に利用する構成。", "detail": "1組織が複数のISPまたは複数の物理回線を持つことで、経路や事業者の障害に対する耐性を高める構成。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "冗長化基本", "word": "耐障害性対策", "short": "障害が発生してもサービスを継続できるようにする対策全般。", "detail": "冗長化、バックアップ、フェイルオーバー等、システムが障害に耐えられるようにする施策の総称。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "冗長化基本", "word": "複数のネットワーク階層", "short": "異なる階層(コア・ディストリビューション・アクセス等)で冗長化を図る考え方。", "detail": "単一階層だけでなく複数階層にわたり冗長構成を持たせることで、より広範な障害に耐えられるようにする設計思想。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "VRRP", "word": "VRRP", "short": "複数ルータで仮想的な1つのデフォルトゲートウェイを構成するプロトコル。", "detail": "Virtual Router Redundancy Protocol。複数の物理ルータが仮想IPアドレス・仮想MACアドレスを共有し、主ルータ障害時に自動的にバックアップルータへ切り替える。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "VRRP", "word": "仮想IPアドレス", "short": "VRRPグループが共有する見かけ上のIPアドレス。", "detail": "エンドホストのデフォルトゲートウェイとして設定される、実際のルータとは別に用意される仮想的なIPアドレス。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "VRRP", "word": "仮想MACアドレス", "short": "VRRPグループが共有する見かけ上のMACアドレス。", "detail": "マスタが切り替わってもARPの再学習が不要になるよう、VRRPグループ共通で使われる仮想的なMACアドレス。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "VRRP", "word": "マスタルータ(VRRP)", "short": "VRRPで現在仮想IPアドレスを担当しているルータ。", "detail": "VRRPグループ内で実際にトラフィックを転送する役割を担う、優先度が最も高いルータ。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "VRRP", "word": "バックアップルータ", "short": "VRRPでマスタ障害時に昇格する予備のルータ。", "detail": "マスタの障害を検知すると、あらかじめ定めた優先度順に昇格しマスタの役割を引き継ぐルータ。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "VRRP", "word": "VRRP広告パケット", "short": "マスタがVRRPグループへ生存を通知するパケット。", "detail": "マスタルータが一定間隔で送信し、自身が正常に稼働していることをバックアップルータ群へ知らせる制御パケット。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "VRRP", "word": "VRRPトラッキング", "short": "上位回線等の状態をVRRPの優先度に反映する機能。", "detail": "WAN側インタフェースの障害などを検知し、VRRPの優先度を自動的に下げてバックアップへ切り替えさせる機能。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "VRRP", "word": "VRRPトリガ", "short": "VRRPの切り替えを引き起こす条件・イベント。", "detail": "インタフェース障害の検知等、優先度変更やマスタ切替のきっかけとなる事象を指す。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "VRRP", "word": "プリエンプトモード", "short": "優先度の高いルータが復旧時にマスタの座を奪還する動作モード。", "detail": "一度バックアップに切り替わった後、元々優先度の高いルータが復旧すると自動的にマスタの座を取り戻す設定。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "VRRP", "word": "プリエンプトディレイ", "short": "プリエンプト動作を一定時間遅延させる設定。", "detail": "復旧直後の不安定な状態でのマスタ奪還によるフラッピングを防ぐため、切り替えまでに待機時間を設ける設定。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "構成方式(冗長化)", "word": "アクティブ/スタンバイ構成", "short": "1台が稼働、他は待機する冗長構成。", "detail": "通常時は1台(アクティブ)のみが処理を行い、障害時に待機系(スタンバイ)へ切り替える構成。切り替え中は瞬断が発生しうる。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "構成方式(冗長化)", "word": "アクティブ/スタンバイ方式", "short": "アクティブ/スタンバイ構成の別表記。", "detail": "主系のみが稼働し従系は待機する冗長化方式全般を指す。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "構成方式(冗長化)", "word": "アクティブ/アクティブ構成", "short": "複数台が同時に稼働し負荷分散も兼ねる冗長構成。", "detail": "全ての機器が同時に処理を行い、負荷分散と冗長化を両立する構成。1台障害時は残りが処理を引き継ぐ。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "構成方式(冗長化)", "word": "デュアル方式", "short": "2系統で構成する冗長方式全般を指す表現。", "detail": "主に2台・2経路で冗長性を確保する構成方式の総称的な表現。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "構成方式(冗長化)", "word": "切替手順", "short": "障害検知から系切替までの一連の手続き。", "detail": "冗長構成において、障害発生時にどのように主系から従系へ切り替えるかを定めた運用手順。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "構成方式(冗長化)", "word": "切り戻し", "short": "一時的に切り替えた系を元の系へ戻すこと。", "detail": "障害復旧後、暫定的に使っていた予備系から本来の主系へ運用を戻す作業。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "構成方式(冗長化)", "word": "フェールオーバー", "short": "障害発生時に自動的に予備系へ切り替わること。", "detail": "システムやサービスの継続性を保つため、障害検知時に自動的にバックアップ系統へ切り替える動作。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "構成方式(冗長化)", "word": "フォールバック", "short": "障害等により一時的に低下した機能・経路に切り替わること。", "detail": "本来の経路・機能が使えない場合に代替の(通常より劣る)経路・手段へ自動的に切り替わる動作。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "構成方式(冗長化)", "word": "ステートフルフェールオーバー機能", "short": "FWの障害時にセッション状態を引き継ぐ機能。", "detail": "冗長化されたFW間でセッションテーブルを同期し、障害発生時にも既存通信を切断せず継続させる機能。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "クラスタリング", "word": "クラスタシステム", "short": "複数の機器を連携させ1つのシステムとして動作させる構成。", "detail": "負荷分散や高可用性を目的として、複数サーバをまとめて1つのサービス提供単位として運用する構成。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "クラスタリング", "word": "クラスタリング", "short": "複数の機器をまとめて連携動作させること。", "detail": "クラスタシステムを構築・運用する技術全般を指す。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "クラスタリング", "word": "スタック接続", "short": "複数のスイッチを論理的に1台として扱う接続方式。", "detail": "複数の物理スイッチを専用ケーブル等で接続し、管理・制御上は1台の論理スイッチとして扱えるようにする方式。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "クラスタリング", "word": "フルメッシュ", "short": "全ノード同士が直接接続される構成。", "detail": "冗長性は最も高いが接続数が多くなる、全拠点・全ノードが互いに直接リンクを持つ構成。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "ハートビート・監視", "word": "ハートビートパケット", "short": "機器同士が生存確認のために定期送信するパケット。", "detail": "冗長構成のペア機器間で、相手が正常に稼働しているかを確認するために定期的にやり取りする制御パケット。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "ハートビート・監視", "word": "死活監視", "short": "機器・サービスが正常に稼働しているか継続的に確認すること。", "detail": "ping等を用い、監視対象が応答するか(生きているか)を定期的にチェックする監視手法。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "ハートビート・監視", "word": "スプリットブレインシンドローム", "short": "冗長化ペアの通信断で双方がマスタと誤認する障害状態。", "detail": "ハートビート通信の切断により両系が互いを「相手が停止した」と誤判断し、双方が同時にアクティブとして動作してしまう問題。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "ハートビート・監視", "word": "稼働監視", "short": "システムが正常に動作し続けているかを監視すること。", "detail": "サービスやプロセスが期待通り稼働しているかを継続的にチェックする運用監視業務。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "負荷分散(冗長化観点)", "word": "負荷分散装置", "short": "負荷分散を行う専用機器。", "detail": "ロードバランサ。複数サーバへのアクセスを振り分け、可用性・性能を向上させる装置。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "負荷分散(冗長化観点)", "word": "負荷分散機能", "short": "負荷分散を実現する機能。", "detail": "トラフィックを複数の宛先へ振り分けることで、特定の機器への負荷集中を避ける機能。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "負荷分散(冗長化観点)", "word": "健全性チェック", "short": "負荷分散対象のサーバが正常に応答するか確認する仕組み。", "detail": "ヘルスチェック。ロードバランサが定期的にバックエンドサーバの状態を確認し、異常時には振り分け対象から除外する機能。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "負荷分散(冗長化観点)", "word": "ヘルスチェック", "short": "健全性チェックの英語表記。", "detail": "ロードバランサが監視対象サーバの稼働状態を定期的に確認する機能。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "ライブマイグレーション", "word": "ライブマイグレーション", "short": "仮想マシンを稼働させたまま別ホストへ移動する技術。", "detail": "サービスを停止せずに仮想マシンの実行状態(メモリ含む)を別の物理サーバへ移す仮想化基盤の機能。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "QoS基本", "word": "QoS制御", "short": "通信品質を確保するための各種制御技術。", "detail": "Quality of Service。帯域・遅延・パケットロス等の品質を、優先度制御や帯域制御により一定水準に保つための技術全般。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "QoS基本", "word": "IPネットワークのQoS", "short": "IPネットワークにおける通信品質制御の総称。", "detail": "DiffServやIntServなど、IPパケットに対して優先度や帯域を制御する仕組み全般を指す。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "QoS基本", "word": "イーサネットのQoS", "short": "データリンク層で行う通信品質制御。", "detail": "IEEE802.1pのようにイーサネットフレームレベルで優先度を制御する仕組み。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "QoS基本", "word": "優先度", "short": "パケットやフレームの処理順序・帯域配分の重み。", "detail": "混雑時にどの通信を優先的に処理・転送するかを決めるための指標。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "QoS基本", "word": "優先度タグ", "short": "フレームに付与される優先度情報。", "detail": "IEEE802.1p等で使われる、VLANタグ内に格納される優先度クラスを示す値。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "QoS基本", "word": "優先度フィールド", "short": "パケット/フレーム内で優先度を示すフィールド。", "detail": "IPヘッダのToSフィールドやイーサネットの優先度タグなど、優先制御のための値を格納する場所。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "QoS基本", "word": "優先制御", "short": "優先度に応じて処理順を制御すること。", "detail": "混雑時に優先度の高い通信を先に処理・転送し、遅延に敏感なトラフィックの品質を確保する制御。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "QoS基本", "word": "CoS", "short": "データリンク層における通信の優先度クラス。", "detail": "Class of Service。IEEE802.1pにより定義される、フレームの優先度を8段階で示す分類。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "QoS基本", "word": "ToS", "short": "IPヘッダ内で優先度・サービス種別を示すフィールド。", "detail": "Type of Service。IPv4ヘッダに含まれる、優先度やサービス品質要求を示すために使われるフィールド。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "QoS基本", "word": "ToSフィールド", "short": "ToSの実体であるフィールド。", "detail": "現在はDSフィールドとして再定義され、DiffServによる品質制御に使われることが多い。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "QoS基本", "word": "DSフィールド", "short": "DiffServで使われる優先度指定フィールド。", "detail": "Differentiated Services Field。旧ToSフィールドを再定義したもので、パケットの転送優先度(PHB)を示す。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "QoS基本", "word": "DiffServ", "short": "パケットの種別ごとに転送品質を差別化する仕組み。", "detail": "Differentiated Services。DSフィールドの値に基づき、各中継ルータがパケットの転送優先度を判断する、スケーラブルなQoSアーキテクチャ。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "帯域制御", "word": "帯域制御", "short": "通信に割り当てる帯域を制御すること。", "detail": "特定の通信やユーザに対し使用できる帯域幅の上限・保証等を制御する技術全般。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "帯域制御", "word": "帯域制限装置", "short": "帯域を制限する専用の装置・機能。", "detail": "シェーピングやポリシングにより、特定トラフィックの帯域使用量を制限する装置。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "帯域制御", "word": "シェーピング", "short": "送信レートを平滑化し設定値以下に調整する制御。", "detail": "バッファリングによりバースト的なトラフィックを平滑化し、契約帯域内に収まるよう送信タイミングを調整する制御。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "帯域制御", "word": "ポリシング", "short": "設定値を超えたトラフィックを破棄・マークする制御。", "detail": "バッファせずに、規定の帯域を超えたパケットをその場で破棄またはマーキング(優先度を下げる等)する制御。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "帯域制御", "word": "ギャランティード型", "short": "最低帯域を保証する契約・制御方式。", "detail": "ベストエフォート型と異なり、一定の帯域を確実に確保することを約束するサービス形態。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "帯域制御", "word": "ベストエフォート型", "short": "最善は尽くすが帯域を保証しない方式。", "detail": "インターネット接続等で一般的な、帯域や品質を保証せず可能な範囲で通信を行う方式。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "帯域制御", "word": "契約帯域", "short": "契約上取り決められた利用可能な帯域幅。", "detail": "通信事業者との契約で定められた、利用者が使用可能な最大または保証帯域。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "キューイング", "word": "優先制御(キューイング方式)", "short": "複数のキューを用意し優先度順に処理する制御。", "detail": "トラフィックを複数のキューに振り分け、優先度の高いキューから先に処理することで遅延を制御する仕組み。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "キューイング", "word": "Priority Queuing", "short": "優先度順にキューを処理する方式。", "detail": "最も優先度の高いキューが空になるまで下位キューを処理しない、単純だが優先度低トラフィックが飢餓状態になり得る方式。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "キューイング", "word": "WRR", "short": "キューごとに重み付けした比率で処理する方式。", "detail": "Weighted Round Robin。各キューに設定した重みに応じて処理量を割り振ることで、優先度と公平性を両立させる方式。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "キューイング", "word": "キュー(用語補足)", "short": "処理待ちのデータを一時的に蓄えておく待ち行列。", "detail": "ネットワーク機器がパケットを送出順に並べて保持しておくバッファ構造。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "品質・性能監視", "word": "応答遅延", "short": "要求から応答が返るまでの時間の遅れ。", "detail": "処理・伝送にかかる時間により生じる、要求に対する応答の遅延。QoS監視の指標の一つ。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "品質・性能監視", "word": "伝播遅延時間", "short": "信号が物理的な距離を伝わるのにかかる時間。", "detail": "電気/光信号が伝送媒体上を伝わる際に生じる、距離に依存する遅延時間。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "品質・性能監視", "word": "ノード内処理時間", "short": "1台の機器内でパケットが処理されるのにかかる時間。", "detail": "ルータ・スイッチ等がパケットを受信してから転送するまでに要する内部処理時間。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "品質・性能監視", "word": "ジッタ", "short": "パケット到着間隔のばらつき。", "detail": "本来一定間隔で届くはずのパケットの到着タイミングが揺らぐ現象で、音声・映像品質に影響する。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "品質・性能監視", "word": "ピーク時間帯", "short": "通信量が最も多くなる時間帯。", "detail": "トラフィックが集中し輻輳が発生しやすい時間帯を指し、帯域設計の基準になる。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "品質・性能監視", "word": "パケットロス", "short": "送信したパケットが宛先に届かず失われること。", "detail": "輻輳や回線品質劣化等により、送信したデータの一部が受信側に届かない現象。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "品質・性能監視", "word": "品質", "short": "通信サービスの良し悪しを表す指標全般。", "detail": "遅延、ジッタ、パケットロス、帯域等、通信の性能・信頼性を表す指標をまとめた概念。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "品質・性能監視", "word": "品質劣化", "short": "通信品質が低下すること。", "detail": "遅延増大やパケットロス増加など、通信の状態が本来より悪化すること。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "品質・性能監視", "word": "品質要件との適合性", "short": "求められる品質基準を満たしているかどうか。", "detail": "SLA等で定められた品質要求に対し、実際の通信品質が適合しているかを評価する観点。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "品質・性能監視", "word": "ステータスコード(補足・性能監視の文脈ではない)", "short": "HTTPの応答結果を示す数値。", "detail": "Web・HTTPシートに記載の内容と同一。ここでは分野横断の関連語として補足掲載。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "音声・映像通信のQoS", "word": "VoIP", "short": "音声を IPネットワーク上で伝送する技術。", "detail": "Voice over IP。音声をデジタル化・パケット化してIPネットワーク上で伝送する技術で、遅延・ジッタに敏感なためQoSが重要になる。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "音声・映像通信のQoS", "word": "VoIP GW", "short": "VoIPと従来の電話網を相互接続する装置。", "detail": "VoIPネットワークとPSTN(公衆電話網)等を接続し、音声信号とIPパケットを相互変換するゲートウェイ装置。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "音声・映像通信のQoS", "word": "ストリーミング", "short": "データを受信しながら順次再生する配信方式。", "detail": "動画・音声等を全てダウンロードせずに、受信しながらリアルタイムに近い形で再生していく配信方式。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "音声・映像通信のQoS", "word": "ストリーム暗号方式(補足)", "short": "ストリーム暗号のこと(暗号技術シートと関連)。", "detail": "暗号技術・PKIシートのストリーム暗号方式を参照。ストリーミング配信のQoSとは別概念のため注意。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "音声・映像通信のQoS", "word": "コーデック", "short": "音声・映像を圧縮・符号化する方式。", "detail": "限られた帯域で音声・映像品質を保つため、データを圧縮・伸長するアルゴリズム(方式)。"}, {"cat": "QoS(優先制御・帯域制御)", "group": "音声・映像通信のQoS", "word": "擬似ストリーミング", "short": "プログレッシブダウンロードによる疑似的なストリーミング再生。", "detail": "真のストリーミングプロトコルを使わず、ダウンロードしながら再生することでストリーミング風の体験を提供する方式。"}, {"cat": "仮想化", "group": "仮想化基本", "word": "仮想化", "short": "物理リソースを論理的に分割・統合して利用する技術。", "detail": "1台の物理機器を複数の論理的な機器として、または複数の物理機器を1つの論理的な機器として扱えるようにする技術全般。"}, {"cat": "仮想化", "group": "仮想化基本", "word": "仮想化技術", "short": "仮想化を実現する技術の総称。", "detail": "サーバ仮想化、ネットワーク仮想化、ストレージ仮想化等、対象領域を問わず仮想化を実現する各種技術。"}, {"cat": "仮想化", "group": "仮想化基本", "word": "仮想化設計", "short": "仮想化環境をどう構築するか決める設計作業。", "detail": "リソース配分、冗長性、性能要件等を踏まえ仮想化基盤をどう構成するか検討・設計する作業。"}, {"cat": "仮想化", "group": "仮想化基本", "word": "仮想化機構", "short": "仮想化を実現する内部的な仕組み。", "detail": "ハイパーバイザ等、物理リソースを仮想リソースへ変換・割り当てる基盤部分の仕組み。"}, {"cat": "仮想化", "group": "サーバ仮想化", "word": "仮想マシン", "short": "物理サーバ上に構築される論理的なコンピュータ。", "detail": "VM。ハイパーバイザにより物理リソースを割り当てられ、独立したOSを実行できる論理的なサーバ。"}, {"cat": "仮想化", "group": "サーバ仮想化", "word": "ハイパーバイザ型", "short": "物理ハードウェア上で直接動作する仮想化方式。", "detail": "ホストOSを介さず直接ハードウェア上で動作し、複数の仮想マシンを効率的に管理する仮想化方式(ベアメタル型)。"}, {"cat": "仮想化", "group": "サーバ仮想化", "word": "ホストOS型", "short": "既存のOS上にソフトウェアとして仮想化環境を構築する方式。", "detail": "既にインストールされたOS(ホストOS)の上でアプリケーションとして仮想化ソフトを動かし、仮想マシンを実行する方式。"}, {"cat": "仮想化", "group": "サーバ仮想化", "word": "コンテナ仮想化技術", "short": "OSカーネルを共有しアプリケーション単位で分離する軽量な仮想化技術。", "detail": "仮想マシンのようにOS全体を複製せず、カーネルを共有しつつプロセス・ファイルシステムを分離することで軽量・高速に動作する仮想化方式。"}, {"cat": "仮想化", "group": "サーバ仮想化", "word": "LXC", "short": "Linuxのコンテナ仮想化技術。", "detail": "Linux Containers。Linuxカーネルの機能(namespace、cgroups等)を利用した、代表的なコンテナ仮想化技術。"}, {"cat": "仮想化", "group": "サーバ仮想化", "word": "ライブマイグレーション", "short": "仮想マシンを稼働させたまま別ホストへ移動する技術。", "detail": "サービスを停止せずに仮想マシンの実行状態(メモリ含む)を別の物理サーバへ移す仮想化基盤の機能。"}, {"cat": "仮想化", "group": "ネットワーク仮想化", "word": "オーバーレイネットワーク", "short": "既存の物理網の上に構築される論理的なネットワーク。", "detail": "物理トポロジに依存せず、トンネリング等により論理的なネットワーク構造を実現する仕組み(VXLAN等が代表例)。"}, {"cat": "仮想化", "group": "ネットワーク仮想化", "word": "仮想ルータ", "short": "論理的に構成される仮想的なルータ機能。", "detail": "1台の物理機器上、または仮想マシンとして動作する、独立したルーティング機能を持つ論理ルータ。"}, {"cat": "仮想化", "group": "ネットワーク仮想化", "word": "VRF", "short": "1台のルータ内に複数の独立したルーティングテーブルを持たせる技術。", "detail": "Virtual Routing and Forwarding。物理ルータを論理的に分割し、テナントごとに独立した経路情報・アドレス空間を扱えるようにする技術。"}, {"cat": "仮想化", "group": "ネットワーク仮想化", "word": "マイクロサービスアーキテクチャ", "short": "機能ごとに独立した小さなサービスを組み合わせるシステム設計手法。", "detail": "1つの大きなアプリケーションを、独立してデプロイ・スケールできる小さなサービス群に分割して構築するアーキテクチャ。"}, {"cat": "仮想化", "group": "ネットワーク仮想化", "word": "スケールアウト", "short": "機器・サーバの台数を増やして処理能力を拡張する方式。", "detail": "1台の性能向上ではなく、並列に稼働する機器数を増やすことでシステム全体の処理能力を拡張する方式。"}, {"cat": "仮想化", "group": "ネットワーク仮想化", "word": "スケールアップ", "short": "1台の機器の性能自体を向上させる拡張方式。", "detail": "CPUやメモリの増強など、既存の1台の処理能力を高めることでシステムの性能を拡張する方式。"}, {"cat": "仮想化", "group": "ストレージ・共有基盤", "word": "共有ストレージ", "short": "複数のサーバから共通してアクセスできる記憶領域。", "detail": "クラスタ構成やライブマイグレーションを実現するために、複数の物理サーバから同一のデータ領域へアクセスできるようにするストレージ。"}, {"cat": "仮想化", "group": "ストレージ・共有基盤", "word": "ストレージネットワーキング", "short": "ストレージ専用のネットワーク基盤を構築する技術。", "detail": "SAN(Storage Area Network)のように、サーバとストレージ間の通信に特化したネットワークを構成する技術。"}, {"cat": "仮想化", "group": "ストレージ・共有基盤", "word": "iSCSI", "short": "IPネットワーク上でSCSIコマンドをやり取りするストレージ接続プロトコル。", "detail": "Internet Small Computer System Interface。既存のIPネットワークを使い、離れた場所にあるストレージをローカルディスクのように扱えるようにするプロトコル。"}, {"cat": "仮想化", "group": "ストレージ・共有基盤", "word": "IP-SAN", "short": "IPネットワークを利用して構築するストレージ専用網。", "detail": "iSCSI等を用い、通常のIPネットワークインフラ上に構築されるSAN(ストレージエリアネットワーク)。"}, {"cat": "仮想化", "group": "ストレージ・共有基盤", "word": "FC-SAN", "short": "光ファイバチャネルを利用して構築するストレージ専用網。", "detail": "Fibre Channelプロトコルを用いた、専用の高速・低遅延なストレージエリアネットワーク。"}, {"cat": "仮想化", "group": "ストレージ・共有基盤", "word": "Memcached", "short": "データをメモリ上にキャッシュする分散キャッシュシステム。", "detail": "データベースの負荷軽減等を目的に、頻繁にアクセスされるデータをメモリ上に一時保存する分散キャッシュソフトウェア。"}, {"cat": "仮想化", "group": "ストレージ・共有基盤", "word": "Redis", "short": "メモリ上で動作するキーバリュー型データストア。", "detail": "高速なインメモリデータベースで、キャッシュやセッション共有、メッセージキュー等幅広い用途に使われる。"}, {"cat": "仮想化", "group": "ストレージ・共有基盤", "word": "セッション共有", "short": "複数サーバ間でセッション情報を共有する構成。", "detail": "負荷分散環境において、どのサーバが処理してもセッション状態を維持できるよう情報を共有する仕組み。"}, {"cat": "仮想化", "group": "ストレージ・共有基盤", "word": "セッションクラスタリング", "short": "複数サーバでセッション情報を複製・共有するクラスタ構成。", "detail": "ロードバランサ配下の複数サーバでセッション情報を同期・共有し、どのサーバにアクセスしても継続利用できるようにする構成。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "運用管理基本", "word": "ITIL", "short": "ITサービスマネジメントのベストプラクティス集。", "detail": "Information Technology Infrastructure Library。ITサービスの企画・設計・運用・改善に関する成功事例・手法をまとめたフレームワーク。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "運用管理基本", "word": "ITサービス", "short": "ITシステムを通じて提供される業務上の価値・機能。", "detail": "利用者にとっての成果・価値提供の単位として捉えた、システムやアプリケーションが提供するサービス。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "運用管理基本", "word": "運用", "short": "構築済みのシステムを日々稼働させ続ける業務。", "detail": "監視、定期作業、障害対応など、システムを安定的に稼働させ続けるための日常的な業務全般。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "運用管理基本", "word": "運用規定", "short": "運用に関するルールを定めた文書。", "detail": "作業手順や禁止事項、責任範囲などを明文化した、運用業務の拠り所となる規定文書。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "運用管理基本", "word": "運用系の技術", "short": "運用業務を支える各種技術。", "detail": "監視、自動化、構成管理等、システム運用を効率化・高度化するための技術群を指す。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "運用管理基本", "word": "運用設計", "short": "運用フェーズをどう行うか事前に計画・設計すること。", "detail": "監視項目、バックアップ方針、障害対応フロー等、システム運用の枠組みをあらかじめ設計する工程。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "運用管理基本", "word": "運用組織", "short": "運用業務を担う体制・組織構造。", "detail": "運用担当者の役割分担や指揮系統など、運用業務を遂行するための組織的な枠組み。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "運用管理基本", "word": "運用マニュアル", "short": "運用手順を具体的に記載した文書。", "detail": "日々の作業手順や障害時の対応手順を、実務者が参照できるよう詳細に記した文書。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "運用管理基本", "word": "運用ルール", "short": "運用にあたって遵守すべき決まりごと。", "detail": "作業実施時間帯や承認プロセスなど、運用業務における具体的な取り決め。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "インシデント・問題管理", "word": "インシデント", "short": "サービスの中断や品質低下を引き起こす事象。", "detail": "ITILにおいて、通常のサービス運用を妨げる、または妨げる可能性のある予期しない出来事。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "インシデント・問題管理", "word": "インシデント管理", "short": "インシデントを迅速に解決しサービスを復旧させるプロセス。", "detail": "発生したインシデントの検知・記録・対応・解決までを管理し、サービスへの影響を最小化するプロセス。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "インシデント・問題管理", "word": "インシデント記録のデータベース化", "short": "発生したインシデントの情報を検索・分析可能な形で蓄積すること。", "detail": "過去のインシデント対応履歴をデータベース化し、傾向分析や再発防止、ナレッジ活用に役立てる取り組み。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "インシデント・問題管理", "word": "インシデント対応の評価", "short": "インシデント対応の適切性・効果を振り返り評価すること。", "detail": "対応時間や手順の妥当性を事後に評価し、改善につなげるプロセス。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "インシデント・問題管理", "word": "問題管理", "short": "インシデントの根本原因を特定し再発を防ぐプロセス。", "detail": "ITILにおいて、1つまたは複数のインシデントの根本原因(問題)を特定・解消し、再発を防止するプロセス。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "インシデント・問題管理", "word": "原因究明", "short": "障害・インシデントの根本的な原因を特定する作業。", "detail": "問題管理の中核となる、なぜその事象が発生したのかを技術的に調査・特定する作業。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "インシデント・問題管理", "word": "障害対応", "short": "発生した障害に対処し復旧させる一連の活動。", "detail": "検知・切り分け・復旧・報告までの、障害発生時に行う対応業務全体を指す。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "インシデント・問題管理", "word": "障害復旧", "short": "障害発生前の正常な状態にサービスを戻すこと。", "detail": "応急処置または恒久対策により、サービスを利用可能な状態に戻すこと。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "インシデント・問題管理", "word": "早期発見", "short": "問題やインシデントの兆候を可能な限り早く検知すること。", "detail": "監視やアラート設定により、影響が広がる前に異常を検知する取り組み。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "インシデント・問題管理", "word": "早期復旧", "short": "サービス停止時間を最小限にとどめて復旧させること。", "detail": "影響範囲・時間を最小化することを目指した障害対応の目標・考え方。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "インシデント・問題管理", "word": "緊急ポインタ", "short": "TCPで緊急データの位置を示すフィールド(URGフラグに付随)。", "detail": "TCPヘッダ内でURGフラグが立っている場合に、緊急データがどこまでかを示すフィールド。用語としてはTCPシートとも関連。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "インシデント・問題管理", "word": "緊急を要する変更", "short": "通常の変更管理プロセスを短縮して迅速に適用する変更。", "detail": "障害対応など緊急性が高く、通常の承認プロセスを簡略化して迅速に実施する必要がある変更。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "変更管理・構成管理", "word": "変更管理", "short": "システムへの変更を計画的・統制的に実施するプロセス。", "detail": "変更によるリスクを最小化するため、変更内容の申請・評価・承認・実施・レビューを管理するプロセス。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "変更管理・構成管理", "word": "変更可否", "short": "提案された変更を実施すべきかどうかの判断。", "detail": "リスクと効果を評価し、変更管理プロセスの中で承認するか却下するかを決定すること。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "変更管理・構成管理", "word": "標準的な変更", "short": "事前承認済みで低リスクな定型的な変更。", "detail": "リスクが低く手順が確立しているため、都度の個別承認を経ずに実施できる変更の分類。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "変更管理・構成管理", "word": "通常の変更", "short": "標準的な変更以外の、通常の承認プロセスを経る変更。", "detail": "個別に評価・承認を得たうえで実施される、標準変更ほど定型化されていない変更。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "変更管理・構成管理", "word": "構成管理", "short": "ITシステムを構成する要素の情報を正確に把握・維持するプロセス。", "detail": "ハードウェア・ソフトウェア等の構成要素(CI)の情報を記録・維持し、変更の影響評価等に活用するプロセス。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "変更管理・構成管理", "word": "構成要素の関連", "short": "構成要素間の依存関係・関連性。", "detail": "ある機器・システムが他のどの要素と関連しているかという情報で、変更影響分析に使われる。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "変更管理・構成管理", "word": "構成要素の識別", "short": "管理対象の構成要素を明確に特定すること。", "detail": "構成管理データベース(CMDB)等で管理する対象を漏れなく特定し識別子を付与すること。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "セキュリティ管理・体制", "word": "権限と責任", "short": "組織内での役割に応じた権限範囲と責任の所在。", "detail": "誰が何を承認・実行できるか、その結果に対して誰が責任を負うかを明確にする管理上の考え方。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "セキュリティ管理・体制", "word": "体制・環境", "short": "運用を支える組織体制と物理・技術的な環境。", "detail": "運用組織の構成や設備、ツールなど、運用を支える基盤的な要素全般を指す表現。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "セキュリティ管理・体制", "word": "要員の教育", "short": "運用担当者に必要な知識・スキルを習得させる活動。", "detail": "手順の理解や技術力向上のために実施される研修・教育活動。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "セキュリティ管理・体制", "word": "要員の訓練", "short": "実際の対応力を高めるための実践的な訓練。", "detail": "障害対応訓練など、実際の手順を体験させることでいざという時の対応力を養う活動。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "セキュリティ管理・体制", "word": "訓練", "short": "実践的な演習・練習活動全般。", "detail": "マニュアルの内容を実際に体験・実施することでスキル定着を図る活動。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "セキュリティ管理・体制", "word": "役割分担", "short": "業務における各担当者の担当範囲の割り振り。", "detail": "運用業務を円滑に進めるため、誰がどの作業を担当するか明確に定めること。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "セキュリティ管理・体制", "word": "連絡手順", "short": "障害等発生時にどのように関係者へ連絡するかの手順。", "detail": "エスカレーションフローを含む、事象発生時の報告・連絡・相談の流れを定めた手順。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "セキュリティ管理・体制", "word": "エスカレーション", "short": "対応が困難な事象をより上位・専門の担当者へ引き継ぐこと。", "detail": "現場での対応が困難な場合に、責任者や専門チームへ判断・対応を引き上げる仕組み。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "監視・性能管理", "word": "監視", "short": "システムの状態を継続的に把握すること。", "detail": "死活監視、性能監視、ログ監視など、システムの正常性・異常を継続的に把握する活動全般。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "監視・性能管理", "word": "性能監視", "short": "システムの処理性能・リソース使用状況を継続的に把握すること。", "detail": "CPU使用率、応答時間等を監視し、性能劣化の兆候を早期に検知する活動。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "監視・性能管理", "word": "性能要件との適合性", "short": "求められる性能水準を満たしているかどうか。", "detail": "SLA等で定められた性能要求に対し、実際のシステム性能が適合しているかを評価する観点。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "監視・性能管理", "word": "性能劣化の兆候", "short": "性能が低下し始めている際に見られる予兆。", "detail": "レスポンス遅延の増加やリソース使用率の上昇など、性能問題の前触れとなる兆候。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "監視・性能管理", "word": "ログ監視", "short": "出力されるログを継続的に確認し異常を検知すること。", "detail": "システムやアプリケーションのログを収集・分析し、障害やセキュリティ上の異常を検知する活動。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "監視・性能管理", "word": "ヘルスチェック", "short": "監視対象が正常に応答するか確認する仕組み。", "detail": "ロードバランサ等が定期的に監視対象サーバの稼働状態を確認する機能。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "バックアップ・復旧", "word": "データのバックアップ", "short": "データを別の場所・媒体に複製し保全すること。", "detail": "障害やデータ消失に備え、システムやデータの複製を作成し保管しておく作業。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "バックアップ・復旧", "word": "バックアップ", "short": "データのバックアップの略称。", "detail": "消失・破損に備えたデータの複製・保管作業全般。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "バックアップ・復旧", "word": "フルバックアップ", "short": "対象データ全体を毎回複製するバックアップ方式。", "detail": "全データを毎回まるごと複製する方式で、復旧は容易だが時間・容量を多く要する。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "バックアップ・復旧", "word": "差分バックアップ", "short": "前回のフルバックアップからの変更分のみを複製する方式。", "detail": "フルバックアップ以降に変更されたデータのみを保存する方式で、復旧時はフルバックアップと最新の差分の2つが必要。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "バックアップ・復旧", "word": "増分バックアップ", "short": "前回のバックアップ(フルまたは増分)からの変更分のみを複製する方式。", "detail": "直前のバックアップ以降の変更のみを保存する方式で、バックアップ自体は高速だが復旧時に複数世代を順に適用する必要がある。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "バックアップ・復旧", "word": "差分", "short": "前回の基準からの変更部分。", "detail": "比較対象からの差異・変更点を指す一般的な用語で、差分バックアップの基礎となる概念。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "バックアップ・復旧", "word": "データ復旧の目標時間", "short": "障害発生からデータを復旧させるまでの目標時間。", "detail": "RTO(Recovery Time Objective)。サービスをどれだけ早く復旧させるかの目標値。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "バックアップ・復旧", "word": "データの整合性", "short": "バックアップ・複製データが矛盾なく正しい状態であること。", "detail": "複製やリストア後もデータ間の関連・内容が矛盾なく保たれていることを指す性質。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "保守・作業管理", "word": "定期保守", "short": "計画的に定期実施される保守作業。", "detail": "機器の点検、パッチ適用等、あらかじめ定めたスケジュールに従って行う保守活動。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "保守・作業管理", "word": "定時作業用のマニュアル", "short": "定期的に実施する作業の手順を記した文書。", "detail": "定期保守など、繰り返し行う定型作業のための具体的な手順書。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "保守・作業管理", "word": "非定時作業用のマニュアル", "short": "不定期に発生する作業向けの手順書。", "detail": "障害対応など、発生タイミングが定まっていない作業のための手順書。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "保守・作業管理", "word": "オンサイト保守", "short": "現地に赴いて行う保守作業。", "detail": "技術者が実際に機器の設置場所へ出向いて行う保守・修理作業。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "保守・作業管理", "word": "オフサイト保守", "short": "遠隔から行う保守作業。", "detail": "リモートアクセス等により、現地に赴かずに行う保守・監視・設定変更作業。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "保守・作業管理", "word": "パッチの更新", "short": "ソフトウェアの修正プログラムを適用すること。", "detail": "脆弱性修正や不具合改善のため提供される更新プログラム(パッチ)をシステムへ適用する作業。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "保守・作業管理", "word": "ドキュメント", "short": "運用・設計に関する各種文書。", "detail": "手順書、設計書、構成図など、システムに関する情報を記録した文書全般。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "保守・作業管理", "word": "記録", "short": "作業内容や発生事象を書き残すこと。", "detail": "監査対応やナレッジ蓄積のため、実施した作業や発生した事象を証跡として残すこと。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "設計フェーズ", "word": "方式設計", "short": "システム全体の構成方式を決定する設計工程。", "detail": "アーキテクチャや使用技術など、システムの大枠となる方式を決める上流工程。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "設計フェーズ", "word": "詳細設計", "short": "方式設計を踏まえ具体的な仕様まで落とし込む設計工程。", "detail": "パラメータ値や画面仕様など、実装可能なレベルまで詳細化する設計工程。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "設計フェーズ", "word": "アーキテクチャ設計", "short": "システムの全体構造・骨格を設計すること。", "detail": "コンポーネント構成や技術選定など、システムの基本的な構造を決定する設計活動。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "設計フェーズ", "word": "要件との適合性", "short": "設計・実装内容が要件を満たしているかどうか。", "detail": "顧客・利用者から求められた要件に対し、成果物が適切に対応しているかを評価する観点。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "移行・切替", "word": "移行", "short": "現行システムから新システムへ切り替えること。", "detail": "データやサービスを旧環境から新環境へ移すこと、またはそのプロセス全体。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "移行・切替", "word": "移行計画", "short": "移行作業をどのように実施するか計画すること。", "detail": "移行手順、スケジュール、切り戻し方針等を事前に定める計画。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "移行・切替", "word": "切替手順", "short": "現行システムから新システムへの切り替え手順。", "detail": "移行本番当日に実施する、具体的な作業手順を定めたもの。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "移行・切替", "word": "切り分け手順", "short": "障害発生時に原因箇所を特定するための手順。", "detail": "ネットワーク、サーバ、アプリケーション等どの層に問題があるかを段階的に特定していく手順。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "移行・切替", "word": "デッドタイムライン", "short": "移行等の作業において後戻りできなくなる限界時刻。", "detail": "この時刻を過ぎると計画通りの切り戻しができなくなる、作業判断上のタイムリミット。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "移行・切替", "word": "リハーサル", "short": "本番前に手順を模擬的に実施し確認すること。", "detail": "移行や切替作業の本番前に、同じ手順を試験的に実施し問題がないか確認する取り組み。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "移行・切替", "word": "導入容易性", "short": "新しい仕組みをどれだけ容易に導入できるかという性質。", "detail": "既存環境への影響の少なさや設定の簡便さなど、導入のしやすさを評価する観点。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "サービスデスク・利用者対応", "word": "サービスデスク", "short": "利用者からの問い合わせ・障害報告を受け付ける窓口。", "detail": "インシデントの一次受付や問い合わせ対応を行う、利用者とIT部門の窓口機能。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "サービスデスク・利用者対応", "word": "利用者への対応", "short": "利用者からの問い合わせ・要望へ応じること。", "detail": "サービスデスク等が行う、利用者とのコミュニケーション業務全般。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "サービスデスク・利用者対応", "word": "マインドフル", "short": "目の前の状況に注意を集中し冷静に対応する心構え。", "detail": "対応品質を保つため、目の前の作業・利用者対応に集中し落ち着いて取り組む姿勢を指す一般的な表現。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "サービスデスク・利用者対応", "word": "マインドレス", "short": "注意が散漫で機械的・不注意な対応をしてしまう状態。", "detail": "マインドフルの対義として使われる、集中を欠いた対応状態を指す表現。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "サービスレベル・その他", "word": "SLA", "short": "提供するサービスの品質水準を利用者と取り決めた合意。", "detail": "Service Level Agreement。可用性や応答時間など、サービス提供者と利用者の間で合意する品質基準。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "サービスレベル・その他", "word": "サービス時間", "short": "サービスが利用可能であると定められた時間帯。", "detail": "SLAにおいて、サービスを提供する(利用者が利用できる)ことを保証する時間帯。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "サービスレベル・その他", "word": "サービスの設計", "short": "要件を踏まえサービスの内容・提供方法を設計すること。", "detail": "ITILにおけるサービスデザインの考え方に基づき、サービス仕様や運用方法を設計する工程。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "サービスレベル・その他", "word": "サービスの復旧", "short": "停止・低下していたサービスを利用可能な状態に戻すこと。", "detail": "インシデント対応の目的である、サービス品質を正常な水準へ回復させること。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "サービスレベル・その他", "word": "サプライヤ", "short": "システムの一部を提供する外部の供給元。", "detail": "ハードウェア・ソフトウェア・回線等を提供する外部事業者を指すITILの用語。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "サービスレベル・その他", "word": "外部業者への対応", "short": "委託先・供給元の事業者とのやり取り・管理。", "detail": "SLA管理や契約管理など、外部委託先とのコミュニケーション・統制を行う業務。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "サービスレベル・その他", "word": "検証環境", "short": "本番環境に影響を与えず動作確認を行うための環境。", "detail": "変更や新機能を本番へ適用する前に、安全に試験・検証するために用意される環境。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "サービスレベル・その他", "word": "検証環境の設置", "short": "検証環境を新たに構築すること。", "detail": "本番と同等またはそれに近い環境を用意し、動作確認や検証を行えるようにすること。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "サービスレベル・その他", "word": "テスト計画", "short": "どのようにテストを実施するか事前に定める計画。", "detail": "テスト範囲、方法、判定基準等をあらかじめ定めた計画書。"}, {"cat": "運用管理(ITIL・インシデント変更管理)", "group": "サービスレベル・その他", "word": "テスト", "short": "成果物が仕様・要件通りに動作するか確認する作業。", "detail": "移行や変更の前に、システムが期待通りに機能するかを検証する作業。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "DHCP", "word": "DHCP", "short": "IPアドレス等のネットワーク設定を自動的に配布するプロトコル。", "detail": "Dynamic Host Configuration Protocol。IPアドレス、サブネットマスク、デフォルトゲートウェイ、DNSサーバ等をクライアントへ自動的に払い出すプロトコル。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "DHCP", "word": "DHCPスヌーピング", "short": "不正なDHCPサーバからの応答をスイッチが遮断する機能。", "detail": "スイッチが信頼できるポートのみDHCPサーバ応答(DHCP OFFER/ACK)を通過させ、不正なDHCPサーバによる誤った設定配布を防ぐセキュリティ機能。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "DHCP", "word": "DHCPリレーエージェント", "short": "異なるセグメントのDHCP要求をDHCPサーバへ中継する機能。", "detail": "ブロードキャストであるDHCP要求を、ルータ等がユニキャストに変換して別セグメントのDHCPサーバへ転送する機能。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "DHCP", "word": "初期リースの取得", "short": "クライアントが最初にIPアドレスを取得する処理。", "detail": "DHCP DISCOVER〜ACKの一連のやり取りにより、クライアントが初めてIPアドレス等の設定を取得するプロセス。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "DHCP", "word": "リース期間", "short": "DHCPで払い出されたIPアドレスの有効期限。", "detail": "クライアントがそのIPアドレスを使用できる期間で、期限が近づくと更新要求が行われる。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "DHCP", "word": "リースの更新", "short": "有効期限が近いIPアドレス割当を延長すること。", "detail": "クライアントがDHCPサーバへ再度要求を送り、同じIPアドレスの使用期限を延長してもらう処理。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "ネットワーク管理プロトコル", "word": "SNMP", "short": "ネットワーク機器を監視・設定するための管理プロトコル。", "detail": "Simple Network Management Protocol。エージェントが保持するMIB情報をマネージャが取得・設定することで、機器の状態監視や制御を行う。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "ネットワーク管理プロトコル", "word": "SNMPエージェント", "short": "監視対象機器上で動作しSNMP要求に応答するソフトウェア。", "detail": "ルータ・スイッチ等の機器上で動作し、自身の状態情報(MIB)をマネージャからの要求に応じて提供するプログラム。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "ネットワーク管理プロトコル", "word": "MIB", "short": "SNMPで管理される機器の情報を体系化したデータベース構造。", "detail": "Management Information Base。CPU使用率やインタフェース状態など、SNMPで取得・設定可能な管理情報の階層的な定義。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "ネットワーク管理プロトコル", "word": "NTP", "short": "ネットワーク機器の時刻を同期するプロトコル。", "detail": "Network Time Protocol。基準となる時刻源(上位サーバ)と同期を取ることで、複数機器間の時刻を一致させるプロトコル。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "ネットワーク管理プロトコル", "word": "タイムサーバ", "short": "正確な時刻情報を配信するサーバ。", "detail": "NTPにおいて時刻の基準となる情報を提供する上位のサーバ。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "ネットワーク管理プロトコル", "word": "時刻同期", "short": "複数機器の時計を一致させること。", "detail": "ログの時刻整合性確保や証明書の有効期限判定等のため、NTP等により機器間の時刻をそろえること。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "ネットワーク管理プロトコル", "word": "時刻同期方式", "short": "時刻同期を実現する方法の分類。", "detail": "NTPの階層構造(Stratum)など、どのように基準時刻を伝搬・同期させるかの方式。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "音声・リアルタイム通信プロトコル", "word": "SIP", "short": "IP電話等のセッション確立・制御を行うプロトコル。", "detail": "Session Initiation Protocol。VoIP等において、通話の開始・変更・終了(セッション制御)を行うシグナリングプロトコル。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "音声・リアルタイム通信プロトコル", "word": "SIPサーバ", "short": "SIPによるセッション制御を仲介するサーバ。", "detail": "発信者・着信者間のSIPメッセージを中継し、呼制御(発着信管理)を行うサーバ。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "音声・リアルタイム通信プロトコル", "word": "RTP", "short": "音声・映像データをリアルタイムに伝送するプロトコル。", "detail": "Real-time Transport Protocol。SIP等でセッションが確立された後、実際の音声・映像データをUDP上で伝送するために使われるプロトコル。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "音声・リアルタイム通信プロトコル", "word": "RTSP", "short": "ストリーミングメディアの再生を制御するプロトコル。", "detail": "Real Time Streaming Protocol。再生・停止・早送りなど、ストリーミング配信の制御コマンドをやり取りするプロトコル。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "ファイル共有・その他アプリケーション層", "word": "SMB", "short": "Windows環境で使われるファイル・プリンタ共有プロトコル。", "detail": "Server Message Block。ネットワーク経由でファイルやプリンタ等のリソースを共有するために使われるプロトコル。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "ファイル共有・その他アプリケーション層", "word": "WebDAV", "short": "HTTPを拡張しファイル操作を可能にするプロトコル。", "detail": "Web Distributed Authoring and Versioning。PUT/DELETE等のメソッドを用い、Webサーバ上のファイルを直接編集・管理できるようにするHTTP拡張。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "ファイル共有・その他アプリケーション層", "word": "REST", "short": "HTTPの仕組みを活用したシンプルなAPI設計思想。", "detail": "Representational State Transfer。リソースをURIで表現し、HTTPメソッドで操作するというシンプルなWeb APIの設計原則。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "ファイル共有・その他アプリケーション層", "word": "FQDN", "short": "ホスト名からルートまでを省略せず完全に記述したドメイン名。", "detail": "Fully Qualified Domain Name。ホスト名・ドメイン名・TLDまで全てを含む、一意に特定可能な完全なドメイン名表記。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "ファイル共有・その他アプリケーション層", "word": "EUC", "short": "日本語等を表現するための文字コード体系の一つ。", "detail": "Extended Unix Code。Unix系システムで古くから使われてきた日本語等の多バイト文字コード規格。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "応答・エラー処理", "word": "応答遅延", "short": "要求から応答が返るまでの時間の遅れ。", "detail": "処理・伝送にかかる時間により生じる、要求に対する応答の遅延。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "応答・エラー処理", "word": "既知のエラー", "short": "過去に発生し原因・対処法が判明している障害・不具合。", "detail": "運用管理において、恒久対策が未実施でも回避策や原因が分かっている既知の問題を指すITIL用語(既知の誤り)。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "応答・エラー処理", "word": "宛先到達不能メッセージ", "short": "パケットが宛先に届かないことを通知するICMPメッセージ。", "detail": "ICMP Destination Unreachable。ルーティングやポートの問題等で宛先にパケットを届けられない場合に送信元へ返される通知。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "応答・エラー処理", "word": "リダイレクトメッセージ", "short": "より適切な経路があることを通知するICMPメッセージ。", "detail": "ICMP Redirect。ホストが最適でない経路を使っている場合に、ルータがより適切なネクストホップを通知するメッセージ。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "応答・エラー処理", "word": "エコー要求/応答", "short": "pingで使われるICMPメッセージのペア。", "detail": "ICMP Echo Request/Reply。相手が到達可能か確認するために送信要求と、それに対する応答から成るメッセージ。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "応答・エラー処理", "word": "ping", "short": "ICMPエコー要求を使い到達性を確認するツール。", "detail": "対象ホストへICMP Echo Requestを送信し、応答(Echo Reply)の有無や応答時間から疎通状況を確認するコマンド。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "応答・エラー処理", "word": "pingコマンド", "short": "pingを実行するコマンドの呼称。", "detail": "OS標準で提供される、ICMPによる疎通確認を行うためのコマンドラインツール。"}, {"cat": "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "group": "応答・エラー処理", "word": "tracerouteコマンド", "short": "経路上の各ルータを調べるコマンド。", "detail": "TTLを1から順に増やしたパケットを送信し、各ホップのルータから返る応答を利用して経路を可視化するコマンド。"}, {"cat": "関連RFC一覧", "group": "基礎プロトコルRFC", "word": "RFC791", "short": "IPv4を規定するRFC。", "detail": "Internet Protocol。IPv4のヘッダ形式や基本仕様を定義する基礎的なRFC。"}, {"cat": "関連RFC一覧", "group": "基礎プロトコルRFC", "word": "RFC792", "short": "ICMPを規定するRFC。", "detail": "Internet Control Message Protocol。エラー通知や到達性確認のためのICMPメッセージ仕様を定義する。"}, {"cat": "関連RFC一覧", "group": "基礎プロトコルRFC", "word": "RFC793", "short": "TCPを規定するRFC(後にRFC9293で更新)。", "detail": "Transmission Control Protocol。TCPの基本仕様(コネクション確立・データ転送・フロー制御等)を定義する。"}, {"cat": "関連RFC一覧", "group": "基礎プロトコルRFC", "word": "RFC826", "short": "ARPを規定するRFC。", "detail": "Address Resolution Protocol。IPアドレスからMACアドレスを解決する仕組みを定義する。"}, {"cat": "関連RFC一覧", "group": "基礎プロトコルRFC", "word": "RFC894", "short": "イーサネット上でのIP伝送方法を規定するRFC。", "detail": "Ethernet上でIPデータグラムを伝送する際のカプセル化形式(Ethernet II)を定義する。"}, {"cat": "関連RFC一覧", "group": "基礎プロトコルRFC", "word": "RFC1042", "short": "IEEE802ネットワーク上でのIP伝送方法を規定するRFC。", "detail": "IEEE802.2/802.3ネットワーク上でIPデータグラムを伝送する際のカプセル化形式を定義する。"}, {"cat": "関連RFC一覧", "group": "基礎プロトコルRFC", "word": "RFC1122", "short": "インターネットホストの通信層要件を規定するRFC。", "detail": "Requirements for Internet Hosts - Communication Layers。ホストが満たすべきIP/TCP/UDP等の実装要件をまとめている。"}, {"cat": "関連RFC一覧", "group": "基礎プロトコルRFC", "word": "RFC1027", "short": "Proxy ARPの利用方法を規定するRFC。", "detail": "異なるセグメント間であたかも同一セグメントのように通信させるProxy ARPの仕組みを説明するRFC。"}, {"cat": "関連RFC一覧", "group": "経路制御RFC", "word": "RFC1918", "short": "プライベートアドレスの範囲を規定するRFC(索引にはRFC3022等関連記載)。", "detail": "10.0.0.0/8等、インターネット上でグローバルにルーティングされないアドレス空間を定義する(補足として一般知識で記載)。"}, {"cat": "関連RFC一覧", "group": "経路制御RFC", "word": "RFC3022", "short": "NAT(NAPT/伝統的NAT)の仕様を規定するRFC。", "detail": "Traditional IP Network Address Translator。基本的なNATおよびNAPTの動作を定義する。"}, {"cat": "関連RFC一覧", "group": "経路制御RFC", "word": "RFC3031", "short": "MPLSアーキテクチャを規定するRFC。", "detail": "Multiprotocol Label Switching Architecture。ラベルによる高速な転送の仕組みの全体像を定義する。"}, {"cat": "関連RFC一覧", "group": "経路制御RFC", "word": "RFC3046", "short": "DHCPリレーエージェント情報オプションを規定するRFC。", "detail": "DHCPリレーが付加する追加情報(Option82)の仕様を定義し、より詳細なクライアント識別を可能にする。"}, {"cat": "関連RFC一覧", "group": "経路制御RFC", "word": "RFC3580", "short": "IEEE802.1Xの実装ガイドラインを規定するRFC。", "detail": "IEEE 802.1X Remote Authentication Dial In User Service (RADIUS) Usage Guidelines。802.1XとRADIUSの連携方法を説明する。"}, {"cat": "関連RFC一覧", "group": "DNS関連RFC", "word": "RFC1912", "short": "DNS運用における一般的な誤りを解説するRFC。", "detail": "Common DNS Operational and Configuration Errors。ゾーン設定等でありがちな誤りをまとめた運用上のガイド。"}, {"cat": "関連RFC一覧", "group": "DNS関連RFC", "word": "RFC2136", "short": "DNSの動的更新(Dynamic Update)を規定するRFC。", "detail": "Dynamic Updates in the Domain Name System。ゾーンファイルを手動編集せず動的にレコードを更新する仕組みを定義する。"}, {"cat": "関連RFC一覧", "group": "DNS関連RFC", "word": "RFC2845", "short": "DNSメッセージの認証(TSIG)を規定するRFC(索引記載なし・関連補足)。", "detail": "Transaction SIGnatureにより、DNS通信の当事者間で共有鍵を用いたメッセージ認証を行う仕組みを定義する(一般知識として補足)。"}, {"cat": "関連RFC一覧", "group": "メール関連RFC", "word": "RFC2284", "short": "EAPの基本仕様を規定するRFC(後にRFC3748で更新)。", "detail": "PPP Extensible Authentication Protocol。EAPの基本フレーム形式・手順を定義する。"}, {"cat": "関連RFC一覧", "group": "メール関連RFC", "word": "RFC2474", "short": "DiffServにおけるDSフィールドの定義を規定するRFC。", "detail": "Definition of the Differentiated Services Field。DSフィールドの構造と意味を定義する。"}, {"cat": "関連RFC一覧", "group": "メール関連RFC", "word": "RFC2865", "short": "RADIUSプロトコルの仕様を規定するRFC。", "detail": "Remote Authentication Dial In User Service (RADIUS)。認証・認可のためのRADIUSメッセージ形式と動作を定義する。"}, {"cat": "関連RFC一覧", "group": "メール関連RFC", "word": "RFC2866", "short": "RADIUSのアカウンティング機能を規定するRFC。", "detail": "RADIUS Accounting。利用状況の記録(課金・ログ)機能に関するRADIUSの拡張を定義する。"}, {"cat": "関連RFC一覧", "group": "メール関連RFC", "word": "RFC5322", "short": "電子メールメッセージの書式を規定するRFC。", "detail": "Internet Message Format。From/To/Subject等、メールヘッダとメッセージ本文の形式を定義する。"}, {"cat": "関連RFC一覧", "group": "メール関連RFC", "word": "RFC5358", "short": "DNSリフレクタ攻撃の防止に関するRFC。", "detail": "Preventing Use of Recursive Nameservers in Reflector Attacks。オープンリゾルバ対策など、DNSを踏み台にした攻撃の緩和策を解説する。"}, {"cat": "関連RFC一覧", "group": "メール関連RFC", "word": "RFC7208", "short": "SPFの仕様を規定するRFC(索引記載はSPFレコードとして関連)。", "detail": "Sender Policy Framework for Authorizing Use of Domains in Email。SPFレコードの書式と検証方法を定義する(一般知識として補足)。"}, {"cat": "関連RFC一覧", "group": "セキュリティ・TLS関連RFC", "word": "RFC5246", "short": "TLS1.2の仕様を規定するRFC。", "detail": "The Transport Layer Security (TLS) Protocol Version 1.2。TLS1.2のハンドシェイクや暗号スイート等を定義する。"}, {"cat": "関連RFC一覧", "group": "セキュリティ・TLS関連RFC", "word": "RFC8446", "short": "TLS1.3の仕様を規定するRFC。", "detail": "The Transport Layer Security (TLS) Protocol Version 1.3。ハンドシェイクの簡素化やPFS必須化など最新のTLS仕様を定義する。"}, {"cat": "関連RFC一覧", "group": "セキュリティ・TLS関連RFC", "word": "RFC4302", "short": "IPsecのAH(認証ヘッダ)を規定するRFC。", "detail": "IP Authentication Header。ESPとは別に完全性・認証のみを提供するAHプロトコルの仕様を定義する。"}, {"cat": "関連RFC一覧", "group": "セキュリティ・TLS関連RFC", "word": "RFC4303", "short": "IPsecのESPを規定するRFC。", "detail": "IP Encapsulating Security Payload。機密性と完全性・認証の両方を提供するESPプロトコルの仕様を定義する。"}, {"cat": "関連RFC一覧", "group": "セキュリティ・TLS関連RFC", "word": "RFC4305", "short": "AH/ESPで用いる暗号アルゴリズムの実装要件を規定するRFC。", "detail": "Cryptographic Algorithm Implementation Requirements for ESP and AH。相互運用性のため必須とすべきアルゴリズムを定める。"}, {"cat": "関連RFC一覧", "group": "HTTP関連RFC", "word": "RFC4918", "short": "WebDAVの仕様を規定するRFC。", "detail": "HTTP Extensions for Web Distributed Authoring and Versioning。HTTPを拡張しファイル操作を可能にする仕様を定義する。"}, {"cat": "関連RFC一覧", "group": "HTTP関連RFC", "word": "RFC5227", "short": "IPアドレスの重複検出(ACD)を規定するRFC。", "detail": "IPv4 Address Conflict Detection。Gratuitous ARP等を用いたアドレス重複検出手法を定義する。"}, {"cat": "関連RFC一覧", "group": "HTTP関連RFC", "word": "RFC3986", "short": "URIの一般的な構文を規定するRFC。", "detail": "Uniform Resource Identifier (URI): Generic Syntax。URI/URLの構文規則を定義する。"}, {"cat": "関連RFC一覧", "group": "HTTP関連RFC", "word": "RFC7230~7235", "short": "HTTP/1.1の仕様一式を規定するRFC群。", "detail": "メッセージ構文、セマンティクス、条件付きリクエスト、範囲リクエスト、認証等、HTTP/1.1の詳細仕様を分割して定義するRFC群。"}, {"cat": "関連RFC一覧", "group": "HTTP関連RFC", "word": "RFC7540~7541", "short": "HTTP/2の仕様を規定するRFC群。", "detail": "HTTP/2本体の仕様(RFC7540)と、ヘッダ圧縮方式HPACK(RFC7541)を定義する。"}, {"cat": "関連RFC一覧", "group": "無線LAN関連RFC・規格", "word": "IEEE802.11i", "short": "無線LANのセキュリティ強化を定めた標準。", "detail": "WPA2のベースとなった標準で、CCMP(AES)による強固な暗号化と認証の枠組みを規定する。(重複整理:無線LANシートにも記載)"}, {"cat": "TCP・IP追加用語", "group": "TCP追加", "word": "コネクション型", "short": "接続を確立してから通信を行う方式。", "detail": "TCPのように、通信前にコネクションを確立し、状態を管理しながらデータをやり取りする通信方式の分類。"}, {"cat": "TCP・IP追加用語", "group": "TCP追加", "word": "コネクションレス型", "short": "接続確立の手続きなしに通信する方式。", "detail": "UDPやIPのように、事前のハンドシェイクなしに個々のパケットを独立して送信する通信方式の分類。"}, {"cat": "TCP・IP追加用語", "group": "TCP追加", "word": "シーケンス番号", "short": "送信データの順序を管理するための番号。", "detail": "TCPヘッダに含まれ、送信したバイト列の順序を示し、受信側での並び替え・欠落検出に使われる番号。"}, {"cat": "TCP・IP追加用語", "group": "TCP追加", "word": "確認応答番号", "short": "次に受信を期待するシーケンス番号を示す値。", "detail": "TCPヘッダに含まれ、これまで正常に受信したデータの続きとして次に期待する番号を相手に伝える値(ACK番号)。"}, {"cat": "TCP・IP追加用語", "group": "TCP追加", "word": "データオフセット", "short": "TCPヘッダの長さを示すフィールド。", "detail": "オプションを含むTCPヘッダ全体の長さを32ビットワード単位で示すフィールドで、データ部の開始位置を特定するために使われる。"}, {"cat": "TCP・IP追加用語", "group": "TCP追加", "word": "コントロールビット", "short": "TCPヘッダ内の各種フラグ(SYN/ACK/FIN等)をまとめた呼称。", "detail": "SYN、ACK、FIN、RST、PSH、URG等の制御用フラグ群を指すTCPヘッダ内のフィールド。"}, {"cat": "TCP・IP追加用語", "group": "TCP追加", "word": "コントロールフラグ", "short": "コントロールビットの別称。", "detail": "TCPの状態や意図(接続開始・終了・確認等)を示すために立てられる各種フラグ。"}, {"cat": "TCP・IP追加用語", "group": "TCP追加", "word": "順序管理", "short": "受信データを正しい順番に並べ直す処理。", "detail": "TCPがシーケンス番号を用いて、ネットワーク上で順序が入れ替わって届いたデータを正しい順に復元する仕組み。"}, {"cat": "TCP・IP追加用語", "group": "TCP追加", "word": "高速再転送", "short": "重複ACKを検知し即座に再送する輻輳制御アルゴリズム。", "detail": "再送タイムアウトを待たず、同じACKを複数回受信した時点でパケットロスと判断し即座に再送するTCPの高速化技術。"}, {"cat": "TCP・IP追加用語", "group": "TCP追加", "word": "ハーフオープン", "short": "片側のみが接続状態にあるTCPコネクションの状態。", "detail": "SYNフラッド攻撃で悪用される、3ウェイハンドシェイクが完了せず片方向のみ接続要求が残っている中途半端な状態。"}, {"cat": "TCP・IP追加用語", "group": "TCP追加", "word": "フラグ", "short": "制御用に立てられる1ビットの状態表示。", "detail": "TCPやIP等のヘッダで、特定の意味(緊急・継続・確認等)を示すために使われる1ビットの表示。"}, {"cat": "TCP・IP追加用語", "group": "輻輳制御追加", "word": "明示的輻輳制御", "short": "パケット破棄前にネットワークの混雑を通知する仕組み。", "detail": "ECN(Explicit Congestion Notification)。IPヘッダのビットを使い、パケットを破棄せずに輻輳の兆候を通信端点に伝える仕組み。"}, {"cat": "TCP・IP追加用語", "group": "輻輳制御追加", "word": "ECN", "short": "明示的輻輳制御の略称。", "detail": "Explicit Congestion Notification。輻輳の兆候をパケット破棄前に通知し、送信側が事前に送信量を調整できるようにする拡張。"}, {"cat": "TCP・IP追加用語", "group": "経路制御用語追加", "word": "メトリック", "short": "経路の優先度を数値化した指標。", "detail": "ホップ数や帯域等、経路制御プロトコルが最適経路を選択する際に用いる評価値。"}, {"cat": "TCP・IP追加用語", "group": "経路制御用語追加", "word": "パスアトリビュート", "short": "BGPの経路情報に付与される属性情報。", "detail": "AS_PATH、LOCAL_PREF、MED等、BGPが経路の性質や優先度を表現するために使う属性の総称。"}, {"cat": "TCP・IP追加用語", "group": "経路制御用語追加", "word": "ロンゲストマッチアルゴリズム", "short": "最も詳細に一致する経路を優先する経路選択方式。", "detail": "複数の経路候補がある場合、サブネットマスクが最も長く(詳細に)一致する経路を優先して選択するルーティングの基本原則。"}, {"cat": "TCP・IP追加用語", "group": "経路制御用語追加", "word": "ループ防止", "short": "経路情報の循環参照を防ぐ仕組み。", "detail": "AS_PATHの自AS番号チェックやスプリットホライズン等、経路情報が無限に循環してしまうことを防ぐための各種手法。"}, {"cat": "TCP・IP追加用語", "group": "経路制御用語追加", "word": "ルート証明書", "short": "認証局自身の公開鍵を含む最上位の証明書。", "detail": "ルートCA証明書。証明書チェーンの信頼の起点となる、自己署名された最上位のデジタル証明書。"}, {"cat": "TCP・IP追加用語", "group": "OSPF追加", "word": "マルチアクセスネットワーク", "short": "複数のルータが同一セグメントに接続されるネットワーク形態。", "detail": "OSPFにおけるネットワークタイプの一つで、イーサネットのように複数ルータが同一リンクを共有する形態。DRの選出が必要になる。"}, {"cat": "TCP・IP追加用語", "group": "OSPF追加", "word": "バックボーンエリア", "short": "OSPFで全エリアの中心となるエリア0。", "detail": "全てのエリア間通信が経由する必要がある、OSPFにおける特別なエリア(エリアID 0)。"}, {"cat": "TCP・IP追加用語", "group": "OSPF追加", "word": "ポイントツーポイントネットワーク", "short": "2台のルータのみが接続されるリンク形態。", "detail": "OSPFにおけるネットワークタイプの一つで、DR/BDRの選出が不要な1対1のリンク。"}, {"cat": "TCP・IP追加用語", "group": "BGP追加", "word": "ルートリフレクタ", "short": "iBGPのフルメッシュ接続を不要にする中継ルータ。", "detail": "RR(Route Reflector)。特定のルータを経路情報の反射役とすることで、iBGP全ルータ間のフルメッシュ接続を不要にする仕組み。"}, {"cat": "TCP・IP追加用語", "group": "BGP追加", "word": "トランジットネットワーク", "short": "他のASの通過経路として利用されるネットワーク。", "detail": "2つのAS間のトラフィックが自ASを経由して流れる、中継的な役割を持つネットワーク。"}, {"cat": "TCP・IP追加用語", "group": "鍵管理追加", "word": "リキー", "short": "セッション途中で暗号鍵を再生成・更新すること。", "detail": "長時間の通信で同じ鍵を使い続けるリスクを減らすため、一定間隔・一定量ごとに新しい鍵へ切り替える処理。"}, {"cat": "TCP・IP追加用語", "group": "鍵管理追加", "word": "シード", "short": "乱数生成の元になる初期値。", "detail": "擬似乱数生成器に与える初期値で、同じシードからは同じ乱数列が生成される。暗号鍵生成にも関わる。"}, {"cat": "TCP・IP追加用語", "group": "鍵管理追加", "word": "ナンス", "short": "一度限り使用される使い捨ての値。", "detail": "Number used once。リプレイ攻撃防止のため、通信のたびに変化させる値で、初期化ベクトルと似た役割を持つ。"}, {"cat": "TCP・IP追加用語", "group": "鍵管理追加", "word": "プライマリシークレット", "short": "TLSのハンドシェイクで導出される元になる秘密情報。", "detail": "マスターシークレット。鍵交換の結果得られる情報から、実際の暗号化鍵やMAC鍵を導出するための元になる値。"}, {"cat": "TCP・IP追加用語", "group": "鍵管理追加", "word": "一時鍵", "short": "そのセッション限りで使われる一時的な鍵。", "detail": "DHE/ECDHE等により生成される、前方秘匿性を実現するための使い捨ての鍵。"}, {"cat": "TCP・IP追加用語", "group": "ハッシュ関数の性質追加", "word": "一方向性", "short": "出力から入力を逆算できない性質。", "detail": "ハッシュ関数の基本的な安全性根拠で、計算は一方向にしか実用的に行えないという性質。"}, {"cat": "TCP・IP追加用語", "group": "IKE追加", "word": "イニシエータ", "short": "IKEネゴシエーションを開始する側。", "detail": "鍵交換や接続確立の要求を最初に送信する当事者を指すIKE等の用語。"}, {"cat": "TCP・IP追加用語", "group": "IKE追加", "word": "レスポンダ", "short": "IKEネゴシエーションの要求を受ける側。", "detail": "イニシエータからの要求に応答する当事者を指すIKE等の用語。"}, {"cat": "LAN物理層・無線LAN追加用語", "group": "LAN物理層追加", "word": "拡張イーサネット", "short": "標準規格を拡張した独自のイーサネット仕様。", "detail":
