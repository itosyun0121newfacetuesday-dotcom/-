ort": "IEEE802.11で規定されるフレームの構造。", "detail": "管理フレーム、制御フレーム、データフレームなど、無線LANで使われるフレームの種類・構造を指す。"}, {"cat": "LAN物理層・無線LAN追加用語", "group": "無線LAN追加", "word": "インテリジェントスイッチ", "short": "高度な制御機能を持つスイッチの総称。", "detail": "VLANやQoS制御、監視機能など、単純な転送以上の付加機能を持つスイッチを指す一般的な呼称。"}, {"cat": "運用・仮想化追加用語", "group": "運用・構成方式追加", "word": "集中型", "short": "処理・管理機能を1箇所に集約する構成方式。", "detail": "無線LANコントローラのように、複数機器の制御・管理を単一の拠点・機器に集約する構成の分類。"}, {"cat": "運用・仮想化追加用語", "group": "運用・構成方式追加", "word": "集中管理", "short": "複数の機器・拠点を1つの管理システムでまとめて管理すること。", "detail": "設定変更や監視を個別に行わず、一元的な管理システムから複数対象を統制する運用方式。"}, {"cat": "運用・仮想化追加用語", "group": "運用・構成方式追加", "word": "機能分散型", "short": "処理・管理機能を複数箇所に分散配置する構成方式。", "detail": "集中型とは反対に、各拠点・機器がそれぞれ自律的に機能を持つ構成の分類。"}, {"cat": "運用・仮想化追加用語", "group": "運用・構成方式追加", "word": "オーケストレーション", "short": "複数のシステム・処理を自動的に連携・制御すること。", "detail": "仮想化基盤やクラウド環境で、リソースの割当・展開・連携を自動化して統制する仕組み。"}, {"cat": "運用・仮想化追加用語", "group": "運用・構成方式追加", "word": "シンクライアント", "short": "処理をサーバ側に集約し、端末側の機能を最小限にする構成。", "detail": "データやアプリケーションをサーバ側で処理し、利用者端末は表示・入力に特化させることでセキュリティ・管理性を高める方式。"}, {"cat": "運用・仮想化追加用語", "group": "運用・構成方式追加", "word": "システム環境", "short": "システムが動作する前提となるハードウェア・ソフトウェア構成。", "detail": "OS、ミドルウェア、ネットワーク構成等、システムが稼働するための基盤全体を指す表現。"}, {"cat": "運用・仮想化追加用語", "group": "運用・構成方式追加", "word": "動作テスト", "short": "機能や設定が意図通りに動くかを確認する試験。", "detail": "変更や新規構築後に、実際に想定通りの動作をするかを検証する作業。"}, {"cat": "運用・仮想化追加用語", "group": "運用・構成方式追加", "word": "同期処理", "short": "複数の処理・機器の状態を一致させながら進める処理方式。", "detail": "処理の完了を待ってから次に進む、または複数ノードの状態を揃えながら動作する処理方式。"}, {"cat": "運用・仮想化追加用語", "group": "運用・構成方式追加", "word": "非同期処理", "short": "処理の完了を待たずに次の処理を進める方式。", "detail": "応答を待たずに他の処理を並行して進められる方式で、応答性を高める一方で状態管理が複雑になる。"}, {"cat": "運用・仮想化追加用語", "group": "運用・構成方式追加", "word": "専用ネットワーク", "short": "特定の目的・利用者に限定して構築されるネットワーク。", "detail": "管理用ネットワークなど、通常の業務トラフィックとは分離して構築される限定用途のネットワーク。"}, {"cat": "運用・仮想化追加用語", "group": "運用・構成方式追加", "word": "管理用ネットワーク", "short": "機器の監視・設定変更専用に構築されるネットワーク。", "detail": "業務トラフィックとは別系統で、機器管理(SNMP、SSH等)専用に用意されるネットワーク。"}, {"cat": "運用・仮想化追加用語", "group": "運用・構成方式追加", "word": "電源", "short": "機器を動作させるための電力供給源。", "detail": "冗長化の観点では、電源二重化(デュアル電源)等の対象として運用管理上重要視される要素。"}, {"cat": "運用・仮想化追加用語", "group": "運用・構成方式追加", "word": "待ち時間", "short": "処理・応答が完了するまでの経過時間。", "detail": "キューイングや処理待ちなど、要求してから結果が得られるまでの時間を指す一般的な表現。"}, {"cat": "運用・仮想化追加用語", "group": "運用・構成方式追加", "word": "マニュアル作成", "short": "運用・作業手順を文書化すること。", "detail": "再現性・引き継ぎを可能にするため、作業手順や判断基準を文書として整備する作業。"}, {"cat": "運用・仮想化追加用語", "group": "運用・構成方式追加", "word": "有効期限", "short": "証明書やCookie等が有効である期限。", "detail": "この期限を過ぎると証明書やセッション等が無効になり、更新や再取得が必要になる。"}, {"cat": "運用・仮想化追加用語", "group": "運用・構成方式追加", "word": "ユーザ名/パスワード", "short": "利用者を識別・認証するための基本的な情報の組。", "detail": "知識情報による認証の最も基本的な組み合わせで、多くのシステムログインの基礎となる。"}, {"cat": "運用・仮想化追加用語", "group": "運用・構成方式追加", "word": "最短レスポンス時間", "short": "負荷分散において最も応答が速いサーバを選ぶ方式の指標。", "detail": "負荷分散アルゴリズムの一つで、応答時間が最も短いサーバへ優先的に振り分ける際に用いられる評価指標。"}, {"cat": "運用・仮想化追加用語", "group": "運用・構成方式追加", "word": "サイバー攻撃", "short": "コンピュータやネットワークを標的とする攻撃全般。", "detail": "DoS攻撃、マルウェア感染、不正アクセスなど、情報システムを狙う攻撃行為全体を指す包括的な用語。"}, {"cat": "運用・仮想化追加用語", "group": "運用・構成方式追加", "word": "情報収集", "short": "攻撃や運用対応のために必要な情報を集める行為。", "detail": "攻撃者が行う事前調査(偵察)、または運用担当者が障害対応のために状況を把握する行為の両方を指しうる。"}, {"cat": "運用・仮想化追加用語", "group": "負荷分散・仮想化追加", "word": "レイヤ7方式", "short": "アプリケーション層の内容を見て振り分ける負荷分散方式。", "detail": "URLやHTTPヘッダの内容に基づいて、より高度な条件でトラフィックを振り分けるロードバランシング方式。"}, {"cat": "運用・仮想化追加用語", "group": "負荷分散・仮想化追加", "word": "ローカルブレークアウト", "short": "支店等のトラフィックを本社経由せず直接インターネットへ出す構成。", "detail": "VPN経由で全トラフィックを本社に集約せず、クラウドサービス等へのアクセスを現地から直接インターネットへ出す構成。SD-WAN等で使われる考え方。"}, {"cat": "運用・仮想化追加用語", "group": "負荷分散・仮想化追加", "word": "連続転送", "short": "データを途切れることなく継続的に転送すること。", "detail": "ストリーミングやバックアップ転送など、一連のデータを中断せず送り続ける転送形態を指す表現。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "セキュリティ・機器配置追加", "word": "インライン", "short": "通信経路上に直接設置される配置形態。", "detail": "IPS等のセキュリティ機器が、実際の通信経路上に直列に設置され、通過する通信をリアルタイムに検査・制御する配置。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "セキュリティ・機器配置追加", "word": "インライン型", "short": "インライン配置を行う機器・構成の分類。", "detail": "ミラーポート経由の監視型(パッシブ)とは異なり、通信を直接中継しながら検査・遮断を行う構成の分類。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "セキュリティ・機器配置追加", "word": "コンテンツサーバ", "short": "コンテンツ(データ)を保持・配信するサーバ。", "detail": "Webサイトのファイルや動画等、配信対象のデータ本体を保持するサーバを指す一般的な用語。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "セキュリティ・機器配置追加", "word": "コンテンツフィルタリング", "short": "閲覧・送受信できるコンテンツの種類を制限する仕組み。", "detail": "URLフィルタリングやキーワード検査等により、不適切または業務上不要なコンテンツへのアクセスを制限する仕組み。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "トラフィック・パケット関連追加", "word": "インバウンド", "short": "外部から内部へ向かう通信の方向。", "detail": "組織のネットワークにおいて、外部から内部へ入ってくる通信の方向を指す表現。アウトバウンドと対になる。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "トラフィック・パケット関連追加", "word": "アウトバウンド", "short": "内部から外部へ向かう通信の方向。", "detail": "組織のネットワークにおいて、内部から外部へ出ていく通信の方向を指す表現。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "トラフィック・パケット関連追加", "word": "片方向通信", "short": "一方向のみにデータが流れる通信形態。", "detail": "送信専用・受信専用のように、双方向のやり取りを行わない通信の形態を指す表現。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "トラフィック・パケット関連追加", "word": "データ圧縮", "short": "データサイズを小さくする処理。", "detail": "伝送効率や保存容量の節約のため、冗長性を取り除いてデータ量を削減する処理。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "トラフィック・パケット関連追加", "word": "ディレクテッドブロードキャスト", "short": "異なるセグメント宛に送るブロードキャストパケット。", "detail": "自セグメント以外の特定ネットワーク宛に送信されるブロードキャストで、Smurf攻撃等に悪用され得るため多くの機器でデフォルト無効化されている。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "トラフィック・パケット関連追加", "word": "トラフィック", "short": "ネットワーク上を流れるデータの量・流れ全体。", "detail": "回線やネットワーク機器を通過する通信データの総称。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "トラフィック・パケット関連追加", "word": "パス(経路の意)", "short": "データが通過する経路、またはURLの階層構造部分。", "detail": "文脈により、通信の経路(ネットワークパス)またはURLにおけるリソースの位置を示す部分(パス)を意味する。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "トラフィック・パケット関連追加", "word": "パケット長", "short": "1つのパケットのデータサイズ。", "detail": "ヘッダとペイロードを合わせた、そのパケット全体のバイト数。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "トラフィック・パケット関連追加", "word": "フラッピング", "short": "状態が短時間で頻繁に切り替わる不安定な現象。", "detail": "経路やリンクの状態がUP/DOWNを繰り返す等、機器や経路の状態が安定せず頻繁に変化してしまう現象。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "DNS・メール追加", "word": "フォワーダ", "short": "自身で解決できない問い合わせを他のDNSサーバへ委譲する設定・サーバ。", "detail": "キャッシュDNSサーバが、外部への問い合わせを別の指定されたDNSサーバ(フォワーダ)経由で行うよう設定する仕組み。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "DNS・メール追加", "word": "プライベートDNS名前空間", "short": "組織内部でのみ有効なドメイン名空間。", "detail": "インターネットには公開されない、社内システム等のためだけに構築されるDNSの名前空間。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "DNS・メール追加", "word": "スタブリゾルバ", "short": "自身では再帰的問合せを行わずキャッシュサーバへ委ねる簡易なリゾルバ。", "detail": "OSやアプリケーションに組み込まれた最小限の名前解決機能で、実際の反復問合せはフルサービスリゾルバに任せる。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "DNS・メール追加", "word": "クエリ", "short": "DNS等への問い合わせそのもの。", "detail": "名前解決要求など、サーバへ送信される問い合わせメッセージ全般を指す一般的な用語。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "DNS・メール追加", "word": "拡張SMTP", "short": "SMTPにEHLOコマンド等の拡張機能を追加した仕様。", "detail": "ESMTP。SMTP-AUTHやサイズ制限通知など、基本のSMTPにはない拡張機能を利用可能にする規格。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "ネットワーク管理・その他追加", "word": "ネゴシエーション", "short": "通信当事者間でパラメータを合意する手続き。", "detail": "暗号方式やプロトコルバージョン等、通信を開始する前に双方が使用する条件を取り決める処理全般。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "ネットワーク管理・その他追加", "word": "ユニファイドコミュニケーション", "short": "音声・映像・メッセージング等を統合した通信基盤。", "detail": "UC。電話、ビデオ会議、チャット等の複数のコミュニケーション手段を統合的に扱う仕組み・製品群の総称。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "ネットワーク管理・その他追加", "word": "回線終端での通信制御", "short": "回線の末端(終端装置)で行われる通信制御の総称。", "detail": "DTE/DCE間など、回線終端装置において実施されるフロー制御・誤り制御等を指す表現。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "ネットワーク管理・その他追加", "word": "一元管理", "short": "複数の対象を単一の仕組み・場所で管理すること。", "detail": "集中管理とほぼ同義で、設定・監視等を単一の管理基盤にまとめて行うこと。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "ネットワーク管理・その他追加", "word": "一括転送", "short": "複数のデータをまとめて一度に転送すること。", "detail": "個別に送るのではなく、複数件・複数ファイルをまとめて一回の処理で転送すること。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "ネットワーク管理・その他追加", "word": "イメージファイル", "short": "ディスクやシステム全体を1つのファイルとして保存したもの。", "detail": "OSやアプリケーションを含む環境全体を複製・展開可能な形でまとめたファイル。バックアップや仮想マシン展開に使われる。"}, {"cat": "その他関連用語(セキュリティ・DNS・雑多)", "group": "ネットワーク管理・その他追加", "word": "イコールコストマルチパス機能", "short": "コストが等しい複数経路に負荷を分散する機能。", "detail": "ECMP。メトリックが同一の複数経路が存在する場合に、それらへトラフィックを分散して転送する機能。"}]</script>
<script id="glossary-cats" type="application/json">["イーサネット・LAN規格", "無線LAN", "IPアドレス・ARP・NAT", "TCP・UDP", "ルーティング(OSPF・BGP等)", "DNS", "メール(SMTP・POP・IMAP・迷惑メール対策)", "Web・HTTP", "暗号技術・PKI", "VPN(IPsec・SSL-VPN・トンネリング)", "認証(EAP・RADIUS・802.1X)", "セキュリティ攻撃・対策(IDS・IPS・FW等)", "冗長化・可用性(VRRP・クラスタ等)", "QoS(優先制御・帯域制御)", "仮想化", "運用管理(ITIL・インシデント変更管理)", "個別プロトコル(DHCP・SNMP・NTP・SIP等)", "関連RFC一覧", "TCP・IP追加用語", "LAN物理層・無線LAN追加用語", "運用・仮想化追加用語", "その他関連用語(セキュリティ・DNS・雑多)"]</script>
<script>
const DATA = JSON.parse(document.getElementById('glossary-data').textContent);
const CATS = JSON.parse(document.getElementById('glossary-cats').textContent);

let currentCat = 'ALL';
let currentQuery = '';

function countFor(cat) {
  if (cat === 'ALL') return DATA.length;
  return DATA.filter(d => d.cat === cat).length;
}

function renderSidebar() {
  const el = document.getElementById('catList');
  let html = '';
  html += `<div class="cat-item ${currentCat==='ALL'?'active':''}" data-cat="ALL"><span>すべての分野</span><span class="cnt">${countFor('ALL')}</span></div>`;
  CATS.forEach(c => {
    html += `<div class="cat-item ${currentCat===c?'active':''}" data-cat="${escapeAttr(c)}"><span>${escapeHtml(c)}</span><span class="cnt">${countFor(c)}</span></div>`;
  });
  el.innerHTML = html;
  el.querySelectorAll('.cat-item').forEach(item => {
    item.addEventListener('click', () => {
      currentCat = item.getAttribute('data-cat');
      renderSidebar();
      renderContent();
      window.scrollTo({top:0, behavior:'instant'});
    });
  });
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/"/g,'&quot;');
}
function highlight(text, q) {
  if (!q) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return escapeHtml(text);
  const before = escapeHtml(text.slice(0, idx));
  const match = escapeHtml(text.slice(idx, idx+q.length));
  const after = escapeHtml(text.slice(idx+q.length));
  return before + '<mark>' + match + '</mark>' + after;
}

function renderContent() {
  const el = document.getElementById('content');
  const meta = document.getElementById('metaRow');
  let rows = DATA;
  if (currentCat !== 'ALL') rows = rows.filter(d => d.cat === currentCat);
  if (currentQuery) {
    const q = currentQuery.toLowerCase();
    rows = rows.filter(d =>
      d.word.toLowerCase().includes(q) ||
      d.short.toLowerCase().includes(q) ||
      d.detail.toLowerCase().includes(q) ||
      d.group.toLowerCase().includes(q)
    );
  }

  meta.textContent = `${rows.length} / ${DATA.length} 件表示`;

  if (rows.length === 0) {
    el.innerHTML = '<div class="empty">該当する用語が見つかりませんでした</div>';
    return;
  }

  let html = '';
  let lastGroup = null;
  rows.forEach((d, i) => {
    const groupKey = currentCat === 'ALL' ? (d.cat + ' ／ ' + d.group) : d.group;
    if (groupKey !== lastGroup) {
      html += `<div class="group-title">${escapeHtml(groupKey)}</div>`;
      lastGroup = groupKey;
    }
    html += `<details class="term">
      <summary>
        <span class="arrow">&#9656;</span>
        <span class="word">${highlight(d.word, currentQuery)}</span>
        <span class="short-preview">${escapeHtml(d.short)}</span>
      </summary>
      <div class="body">
        <div class="short">${highlight(d.short, currentQuery)}</div>
        <div class="detail">${highlight(d.detail, currentQuery)}</div>
      </div>
    </details>`;
  });
  el.innerHTML = html;
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  currentQuery = e.target.value.trim();
  if (currentQuery) {
    currentCat = 'ALL';
    renderSidebar();
  }
  renderContent();
});

renderSidebar();
renderContent();
</script>
</body>
</html>
