よる検証がこの種の攻撃への根本的な対策になる。"}, {"cat": "DNS", "group": "DNSセキュリティ・攻撃", "word": "DNSキャッシュポイズニング", "short": "DNSキャッシュ汚染の別称。", "detail": "キャッシュDNSサーバに不正な名前解決結果を記憶させ、正規のドメイン名でも攻撃者が用意したIPアドレスへ誘導してしまう攻撃の別名。"}, {"cat": "DNS", "group": "DNSセキュリティ・攻撃", "word": "DNS Amp攻撃", "short": "DNSを悪用した反射・増幅型のDoS攻撃。", "detail": "送信元を標的のIPアドレスに偽装した、比較的小さなDNS問い合わせパケットを大量に送りつけると、DNSサーバはその何倍ものサイズの応答を(偽装された)標的へ返してしまう。この「小さな要求で大きな応答を誘発する」性質を悪用し、少ない攻撃側の帯域で標的に大量のトラフィックを送りつける反射・増幅型のDoS攻撃。誰の問い合わせにも応答してしまうオープンリゾルバが、この攻撃の踏み台として悪用されやすい。"}, {"cat": "DNS", "group": "DNSセキュリティ・攻撃", "word": "DNSリフレクタ攻撃", "short": "送信元を詐称しDNSサーバを踏み台にする攻撃全般。", "detail": "攻撃者が標的のIPアドレスを送信元として偽装した問い合わせをDNSサーバへ送り、その応答が(偽装された送信元である)標的に届くようにする攻撃手法の総称。DNS Amp攻撃はこの一種で、応答サイズが問い合わせより大きくなる性質を組み合わせたものにあたる。"}, {"cat": "DNS", "group": "DNSセキュリティ・攻撃", "word": "DNSラウンドロビン", "short": "複数のIPアドレスを順番に応答して負荷分散する方式。", "detail": "1つのホスト名に複数のAレコードを登録しておき、問い合わせが来るたびに応答するIPアドレスの順番を変える(ローテーションさせる)ことで、簡易的に複数のサーバへアクセスを分散させる方式。専用のロードバランサに比べ、各サーバの稼働状況を反映した振り分けができない(単純に順番を変えるだけ)という限界がある。"}, {"cat": "DNS", "group": "Dynamic DNS", "word": "Dynamic DNS", "short": "IPアドレス変化時にDNSレコードを自動更新する仕組み。", "detail": "DDNS。自宅のブロードバンド回線のように、契約上グローバルIPアドレスが定期的に変化してしまう環境において、専用のクライアントソフトが現在のIPアドレスを検知し、DNSサーバ側のAレコードを自動的に更新し続けることで、固定のホスト名で常に最新のアドレスへアクセスできるようにする仕組み。自宅サーバの外部公開や、簡易的なVPN機器の設定などで使われる。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メール送受信プロトコル", "word": "SMTP", "short": "メール送信に使われるプロトコル。", "detail": "Simple Mail Transfer Protocol。メールクライアントからメールサーバへの投稿(サブミッション)や、メールサーバ間でのメール転送(リレー)に使われるプロトコル。TCPの25番ポート(サーバ間転送)または587番ポート(クライアントからの投稿)を使い、MAIL FROM・RCPT TO・DATAといったテキストベースのコマンドをやり取りしてメールを送る。もともと送信者認証の仕組みを持たない設計だったため、後にSMTP-AUTHという拡張が追加された。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メール送受信プロトコル", "word": "SMTP-AUTH", "short": "SMTPに認証機能を追加した拡張。", "detail": "メール送信時にユーザ名・パスワードによる認証を要求するSMTPの拡張仕様。25番ポートブロックの普及後は、サブミッションポート(587番)とこのSMTP-AUTHを組み合わせることで、正規の契約者であることを確認したうえでメール送信を許可する、という運用が標準になっている。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メール送受信プロトコル", "word": "POP3", "short": "メールサーバから受信メールをダウンロードするプロトコル。", "detail": "Post Office Protocol version 3。TCPの110番ポートを使い、サーバに届いたメールをクライアント端末側へダウンロードする、伝統的な受信用プロトコル。取得すると原則としてサーバ側のメールは削除される(設定でサーバに残すことも可能)ため、複数の端末で同じメール状態を同期させることには向いておらず、1台の端末で完結的にメールを管理する用途に適している。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メール送受信プロトコル", "word": "IMAP4", "short": "メールサーバ上でメールを管理・閲覧するプロトコル。", "detail": "Internet Message Access Protocol version 4。メールをサーバ上に残したまま操作し、既読・未読・フォルダ分けといった状態もサーバ側で一元管理するプロトコル。スマートフォンとパソコンなど複数端末から同じメールボックスにアクセスしても、どの端末で見ても同じ状態(既読/未読等)が反映されるため、複数デバイスを使い分ける現在の利用スタイルではPOP3よりも主流になっている。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メール送受信プロトコル", "word": "MTA", "short": "メールサーバ間でメールを転送するソフトウェア。", "detail": "Mail Transfer Agent。SMTPを用いて、あるメールサーバから次のメールサーバへとメールを中継・配送する役割を持つソフトウェア。Postfix、Sendmailなどが代表的なMTA製品で、送信元から宛先までの間を複数のMTAがバケツリレー式に中継していくことでメールが配送される。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メール送受信プロトコル", "word": "MUA", "short": "利用者がメールの作成・閲覧に使うソフトウェア。", "detail": "Mail User Agent。いわゆるメールクライアントソフトのことで、利用者がメールを作成・送信・閲覧するために直接操作するアプリケーション。作成したメールをMTAへ渡す際にSMTPを、受信メールを取得する際にPOP3やIMAP4を使う。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メール送受信プロトコル", "word": "MH装置", "short": "メールを中継・処理する装置(メールハンドリング装置)を指す表現。", "detail": "メールの送受信・中継・フィルタリングといった処理を行うメールサーバ機器全般を指す文脈上の表現。MTAが動作するサーバ機器そのものを指して使われることが多い。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールヘッダ", "word": "Date", "short": "メールが作成・送信された日時を示すヘッダ。", "detail": "RFC5322で定義される、メールがいつ作成されたかを示すヘッダフィールド。メールソフトが受信メールを日付順に並べる際などに参照される。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールヘッダ", "word": "From", "short": "メールの送信者を示すヘッダ。", "detail": "メールソフトの受信画面に表示される、表示上の送信者アドレスを示すフィールド。SMTPプロトコル上のエンベロープFromとは別の情報として、メール本文の中(ヘッダ)に記載されるものであり、技術的には自由に書き換えられるため、なりすましメールの偽装によく悪用される部分でもある。SPF/DKIM/DMARCといった送信ドメイン認証は、このFromの信頼性を技術的に補強するために生まれた。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールヘッダ", "word": "To", "short": "メールの主たる宛先を示すヘッダ。", "detail": "メールを直接届けたい相手のアドレスを列挙するヘッダフィールド。複数人を宛先に含めることもでき、全受信者からその他の宛先が見える形になる。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールヘッダ", "word": "Cc", "short": "メールの参考送付先を示すヘッダ。", "detail": "Carbon Copy。宛先本人(To)ではないが、内容を共有・把握しておいてほしい相手を指定するフィールド。Ccに指定されたアドレスは、Toと同様に他の受信者全員から見える。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールヘッダ", "word": "Bcc", "short": "他の受信者に見えない形で送付するヘッダ。", "detail": "Blind Carbon Copy。指定した相手にはメールが届くが、そのアドレスが他の受信者(To・Cc・他のBcc)には一切見えない形で送付されるフィールド。複数の外部宛先に個別に送っているように見せたい場合や、相手同士のアドレスをお互いに知られたくない場合に使われる。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールヘッダ", "word": "Subject", "short": "メールの件名を示すヘッダ。", "detail": "メール本文の内容を一言で要約して示す、いわゆるタイトルにあたるヘッダフィールド。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールヘッダ", "word": "Message-ID", "short": "メールを一意に識別するIDを示すヘッダ。", "detail": "送信システムが自動生成する、世界中で重複しないよう作られた文字列で、そのメール1通を一意に識別するために使われる。返信メールのIn-Reply-Toフィールドから元メールを参照するなど、メール同士のスレッド(会話のつながり)を追跡する基盤としても利用される。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールヘッダ", "word": "In-Reply-To", "short": "返信元メールのMessage-IDを示すヘッダ。", "detail": "作成中のメールが、どのメールへの返信であるかを示すために、返信元メールのMessage-IDを格納するフィールド。メールソフトはこの情報を使って、会話のスレッドをまとめて表示することができる。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールヘッダ", "word": "Reply-To", "short": "返信時の宛先を明示的に指定するヘッダ。", "detail": "From(送信者)とは別に、受信者が「返信」ボタンを押した際に実際に送られるべきアドレスを指定するためのフィールド。メールマガジンの配信元アドレスと問い合わせ受付アドレスを分けたい場合など、送信元と返信先を意図的に分離したいケースで使われる。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールヘッダ", "word": "Return-Path", "short": "配送不能時の通知先(envelope from)を示すヘッダ。", "detail": "SMTP通信のMAIL FROMコマンドで実際に指定された送信者アドレス(エンベロープFrom)が、配送過程の最終段階で記録されるヘッダフィールド。配送に失敗した場合の通知(バウンスメール)は、このアドレス宛てに返される。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールヘッダ", "word": "Received", "short": "メールが経由したサーバの履歴を示すヘッダ。", "detail": "メールが送信元から宛先まで配送される過程で、経由した各MTAが自分の処理情報(いつ・どこから受け取り・どこへ転送したか)を先頭に追記していくヘッダフィールド。複数のReceivedヘッダを送信側から順に追っていくことで、そのメールが実際にどのサーバを経由してきたかという配送経路を追跡できる。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "SMTPコマンド・エンベロープ", "word": "MAIL TO", "short": "SMTPで送信元アドレスを通知するコマンド(MAIL FROM)。", "detail": "正しくはMAIL FROMコマンドと呼ばれ、これから送信するメールの送信者アドレス(エンベロープFrom)をSMTPサーバに対して通知する、SMTP通信の最初のコマンドの一つ。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "SMTPコマンド・エンベロープ", "word": "RCPT TO", "short": "SMTPで受信者アドレスを通知するコマンド。", "detail": "そのメールの受信者アドレス(エンベロープTo)をSMTPサーバへ通知するコマンド。複数の宛先にメールを送る場合は、このコマンドを宛先の数だけ繰り返し発行する。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "SMTPコマンド・エンベロープ", "word": "エンベロープFrom", "short": "SMTP通信上でやり取りされる実際の送信者アドレス。", "detail": "メール本文中のヘッダFromとは別に、SMTPプロトコルのレベルでMAIL FROMコマンドとして実際にやり取りされる送信者アドレス。配送に失敗した場合のバウンス通知は、このエンベロープFrom宛てに送られる。SPFはこのエンベロープFromのドメインを検証対象としている。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "SMTPコマンド・エンベロープ", "word": "エンベロープTo", "short": "SMTP通信上でやり取りされる実際の宛先アドレス。", "detail": "メール本文中のヘッダToとは別に、SMTPプロトコルのレベルでRCPT TOコマンドとして実際にやり取りされる配送先アドレス。ヘッダToにはBccの宛先は表示されないが、エンベロープToにはBccを含むすべての実際の配送先が含まれる。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールセキュリティ・認証", "word": "SPF", "short": "送信元IPアドレスによりなりすましを検知する送信ドメイン認証。", "detail": "Sender Policy Framework。あるドメインが「メールを送信してよいサーバのIPアドレス一覧」をDNSのSPFレコードとしてあらかじめ公開しておき、受信側がメールを受け取った際、実際の送信元IPアドレスがその一覧に含まれているかどうかを照合することで、送信元ドメインの正当性(そのドメインを名乗る資格があるか)を検証する仕組み。検証対象はエンベロープFromのドメインである点がポイント。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールセキュリティ・認証", "word": "SPFレコード", "short": "SPFで参照されるDNS上の設定情報。", "detail": "そのドメインからのメール送信を許可されたサーバのIPアドレスや、他ドメインの設定を参照する仕組み(include)などを記述した、DNSのTXTレコードとして公開される設定情報。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールセキュリティ・認証", "word": "DKIM", "short": "デジタル署名によりメールの改ざん・なりすましを検知する仕組み。", "detail": "DomainKeys Identified Mail。送信側のメールサーバが、メールのヘッダや本文の一部から計算した値に対して秘密鍵で署名を行い、DKIM-Signatureヘッダとしてメールに付与する。受信側は、送信ドメインがDNS上に公開している対応する公開鍵を使ってこの署名を検証することで、メールが送信ドメインの正当な管理下で作成されたものであり、途中で改ざんされていないことを確認できる。SPFが「経路(IPアドレス)」を検証するのに対し、DKIMは「内容の完全性と署名者の正当性」を検証するという違いがある。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールセキュリティ・認証", "word": "DKIMレコード", "short": "DKIM検証に使う公開鍵情報を公開するDNSレコード。", "detail": "DKIM署名の検証に必要な公開鍵を格納した、DNSのTXTレコード。セレクタと呼ばれる識別子付きのサブドメイン(例:selector1._domainkey.example.com)に登録される。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールセキュリティ・認証", "word": "DKIM-Signatureフィールド", "short": "DKIMの署名情報を格納するメールヘッダ。", "detail": "送信側が付与するデジタル署名の値そのものに加え、署名対象としたヘッダの範囲、使用したセレクタ、署名アルゴリズムといった検証に必要な情報を含むヘッダフィールド。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールセキュリティ・認証", "word": "DomainKey-Signature", "short": "DKIMの前身であるDomainKeys方式の署名ヘッダ。", "detail": "DKIM登場以前にYahoo!が中心となって提唱していた送信ドメイン認証方式DomainKeysで使われていた署名フィールド。現在ではより発展的なDKIMに実質的に置き換えられている。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールセキュリティ・認証", "word": "DMARC", "short": "SPF/DKIMの結果を基にした受信側の処理方針を公開する仕組み。", "detail": "Domain-based Message Authentication, Reporting and Conformance。SPFやDKIMの認証にそもそも失敗した(あるいは認証したドメインとFromヘッダのドメインが一致しない)メールを受信側がどう扱うべきか(何もしない・迷惑メールフォルダへ入れる・拒否する等)を、送信ドメインの管理者があらかじめDNSで宣言できる仕組み。あわせて、認証の失敗状況をレポートとして受け取れる機能も持ち、なりすまし対策の運用状況をドメイン管理者が把握しやすくなっている。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールセキュリティ・認証", "word": "セレクタ", "short": "DKIMで使用する公開鍵を特定するための識別子。", "detail": "1つのドメインで複数の鍵ペアを運用できるよう、DKIM署名とDNSレコードの両方で使われる識別子の文字列。鍵のローテーション(定期的な入れ替え)を行う際、新旧の鍵を異なるセレクタで併存させることでスムーズな移行が可能になる。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールセキュリティ・認証", "word": "送信ドメイン認証", "short": "送信元ドメインの正当性を検証する技術の総称。", "detail": "SPF、DKIM、DMARCなど、メールのFromに書かれたドメインが本当にそのドメインの管理者によって送られたものかどうかを技術的に検証する仕組み全般の総称。なりすましメール(フィッシング等)対策の基盤技術として、現在では主要なメールサービスの多くで事実上必須の設定とされている。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールセキュリティ・認証", "word": "送信者認証", "short": "メール送信者の正当性を確認する仕組み全般。", "detail": "送信ドメイン認証(SPF/DKIM/DMARC)や、メール投稿時のSMTP-AUTHなど、そのメールの送り主が正当な相手であることを確認するための技術・手続き全般を指す総称的な表現。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "メールセキュリティ・認証", "word": "否認防止", "short": "送信の事実を後から否定できないようにする性質。", "detail": "デジタル署名などの技術によって、後から「自分はそのメール(データ)を送っていない」と送信者が主張することを、技術的な証拠によって防止できる性質。DKIMの署名も、副次的にこの否認防止の効果を一定程度持っている。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "迷惑メール対策", "word": "迷惑メール", "short": "受信者の意図に反して大量に送られる不要なメール。", "detail": "スパムメールとも呼ばれる、広告・詐欺・フィッシングなどの目的で無差別かつ大量に送信される、受信者が望んでいないメールの総称。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "迷惑メール対策", "word": "SPAMメール", "short": "迷惑メールの英語表記・別称。", "detail": "一方的かつ大量に送りつけられる、受信者の同意を得ていない宣伝・詐欺目的等のメールの英語での呼び方。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "迷惑メール対策", "word": "UBE", "short": "迷惑メールを指す用語(Unsolicited Bulk Email)。", "detail": "Unsolicited Bulk Email。要求してもいないのに大量一斉送信されるメールを指す、迷惑メールの分類の一つ。商業目的に限らない広い意味での大量送信メールを指す。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "迷惑メール対策", "word": "UCE", "short": "商業目的の迷惑メールを指す用語。", "detail": "Unsolicited Commercial Email。要求してもいない、商業広告目的で送られるメールを指す、UBEよりやや狭い分類。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "迷惑メール対策", "word": "メールのスキャン", "short": "受信メールの内容を検査しウイルス・迷惑メールを検知すること。", "detail": "添付ファイルや本文の内容を、既知のパターン(シグネチャ)照合やヒューリスティックな解析によって検査し、マルウェアの混入や迷惑メール・フィッシングの兆候を検出して隔離・削除する処理。メールゲートウェイ製品などで一般的に行われる。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "迷惑メール対策", "word": "メールアドレス", "short": "電子メールの宛先を一意に示す識別子。", "detail": "ユーザ名(ローカルパート)とドメイン名を「@」で連結した、電子メールの送受信先を一意に特定するための識別子。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "迷惑メール対策", "word": "25番ポートブロック", "short": "ISPがTCP25番ポートへの外部通信を遮断する迷惑メール対策。", "detail": "契約しているISP以外のメールサーバへ、利用者が直接SMTP(TCP25番ポート)で送信することを技術的に禁止する対策。ボットに感染した端末が大量の迷惑メールを勝手に外部へ直接送りつけることを防ぐ目的で、多くのISPが標準的に導入している。正規に外部のメールサービスを使い続けたい場合は、認証つきのサブミッションポート(587番)を使う必要がある。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "迷惑メール対策", "word": "OP25B", "short": "25番ポートブロックの略称。", "detail": "Outbound Port25 Blocking。ISPの動的IPアドレス帯(一般利用者向け回線)から外部へ直接送られるSMTP(25番ポート)通信を遮断する対策の英語での呼び方。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "迷惑メール対策", "word": "587番ポート", "short": "SMTP-AUTHによる正規のメール投稿に使うポート。", "detail": "サブミッションポートと呼ばれ、メール投稿の際にSMTP-AUTHによる利用者認証を必須とすることで、送信者が誰であるかを特定できるようにした専用ポート。25番ポートブロックが行われている環境でも、この587番ポートは通常ブロックされないため、正規の利用者は問題なくメールを送信できる。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "迷惑メール対策", "word": "Pop before SMTP", "short": "POP3認証成功後に一定時間SMTP送信を許可する古い迷惑メール対策方式。", "detail": "メール送信の前に、まずPOP3でユーザ名・パスワードによる認証をいったん行わせ、その認証に成功したIPアドレスに対してのみ、一定時間だけSMTPでのメール送信を許可する仕組み。SMTP自体には送信者認証の仕組みがなかった時代に考案された過渡的な対策で、より直接的で安全なSMTP-AUTHの普及以降は使われる場面が減っている。"}, {"cat": "メール(SMTP・POP・IMAP・迷惑メール対策)", "group": "電子メールシステム全般", "word": "電子メールシステム", "short": "メールの作成・送信・配送・受信を実現する仕組み全体。", "detail": "MUA(メールクライアント)、MTA(メールサーバ)、そしてSMTP・POP3・IMAP4といった各プロトコルが連携することで成り立つ、電子メールの送受信基盤全体を指す総称。"}, {"cat": "Web・HTTP", "group": "Webシステム基本", "word": "Webシステム", "short": "Webブラウザとサーバで構成される情報システム。", "detail": "クライアント(Webブラウザ)とWebサーバがHTTP/HTTPSで通信し、情報の提供や処理を行う情報システム全般。専用のクライアントソフトを配布・インストールする必要がなく、ブラウザさえあれば利用できるという手軽さから、業務システムからコンシューマ向けサービスまで幅広く採用されている。"}, {"cat": "Web・HTTP", "group": "Webシステム基本", "word": "Webアプリケーション", "short": "Webブラウザ経由で利用するアプリケーション。", "detail": "処理の大部分をサーバ側で行い、ブラウザ上での表示・操作を通じて利用するタイプのソフトウェア。パソコンにインストールする従来型アプリケーションと異なり、サーバ側を更新するだけで全利用者に最新版を届けられるという運用上のメリットがある。"}, {"cat": "Web・HTTP", "group": "Webシステム基本", "word": "WAS", "short": "Webアプリケーションを実行するサーバ・基盤。", "detail": "Web Application Server。動的なWebアプリケーションのビジネスロジックを実行するミドルウェア・サーバ。静的なHTMLファイルをそのまま返すだけのWebサーバとは役割が異なり、データベースへのアクセスや複雑な処理結果をもとに、その場でHTMLを生成してブラウザへ返す。"}, {"cat": "Web・HTTP", "group": "Webシステム基本", "word": "Webメール", "short": "ブラウザ上でメールの送受信を行うサービス。", "detail": "専用のメールソフト(MUA)を使わず、Webブラウザからそのままメールの閲覧・送信・管理ができるサービス形態。内部的にはWebサーバがIMAP4やSMTPでメールサーバと通信し、その結果をHTML画面としてブラウザに表示している。"}, {"cat": "Web・HTTP", "group": "HTTP基本", "word": "HTTP", "short": "Webでリソースをやり取りするためのプロトコル。", "detail": "Hypertext Transfer Protocol。クライアントからの要求(リクエスト)と、それに対するサーバからの応答(レスポンス)という単純な1往復のやり取りを基本単位とする、Webの基盤となるアプリケーション層プロトコル。当初のHTTP/1.0・1.1はテキストベースのシンプルな設計だったが、HTTP/2以降ではバイナリ形式・多重化により1本のTCP接続で複数のリクエストを並行処理できるよう高速化が図られている。"}, {"cat": "Web・HTTP", "group": "HTTP基本", "word": "HTTP通信", "short": "HTTPを用いたクライアント・サーバ間の通信。", "detail": "リクエスト/レスポンスというモデルに基づく、Webにおける典型的な通信のやり取り全般。HTTP自体はステートレス(状態を保持しない)設計であるため、ログイン状態のようなやり取りをまたぐ情報を扱うにはCookie等の補助的な仕組みが必要になる。"}, {"cat": "Web・HTTP", "group": "HTTP基本", "word": "HTTPメッセージ", "short": "HTTPのリクエスト・レスポンスの構造。", "detail": "リクエストライン(またはステータスライン)、複数のヘッダフィールド、空行、そしてボディ(本文)から構成される、HTTP通信で実際にやり取りされるデータの形式。"}, {"cat": "Web・HTTP", "group": "HTTP基本", "word": "リクエストライン", "short": "HTTPリクエストの先頭行。", "detail": "「GET /index.html HTTP/1.1」のように、メソッド・要求対象のURI・HTTPバージョンの3要素から構成される、リクエストメッセージの最初の1行。"}, {"cat": "Web・HTTP", "group": "HTTP基本", "word": "ステータスライン", "short": "HTTPレスポンスの先頭行。", "detail": "「HTTP/1.1 200 OK」のように、HTTPバージョン・ステータスコード・理由句(人間が読める簡単な説明文)の3要素から構成される、レスポンスメッセージの最初の1行。"}, {"cat": "Web・HTTP", "group": "HTTP基本", "word": "ステータスコード", "short": "HTTPレスポンスの結果を示す3桁の数値。", "detail": "1xx(情報)、2xx(成功、代表例200)、3xx(リダイレクト、代表例301・302)、4xx(クライアント側エラー、代表例404)、5xx(サーバ側エラー、代表例500)というように、先頭の数字によって大まかな結果の種類が分類されている、リクエストの処理結果を示す3桁の数値。"}, {"cat": "Web・HTTP", "group": "HTTPメソッド", "word": "GETメソッド", "short": "リソースの取得を要求するHTTPメソッド。", "detail": "サーバから指定したURIのリソースを取得するために使われる、最も基本的なHTTPメソッド。仕様上、GETはサーバ側の状態を変化させない「安全」な操作であることが期待されており、検索キーワードなどのパラメータをURLの末尾(クエリ文字列)に付けて送るのが一般的な使い方。"}, {"cat": "Web・HTTP", "group": "HTTPメソッド", "word": "POSTメソッド", "short": "リソースの作成・データ送信を要求するHTTPメソッド。", "detail": "フォーム送信やファイルアップロードなど、サーバ側に新しいデータを送信し何らかの処理をさせる際に使われるHTTPメソッド。送信するデータはURLではなくリクエストボディに含められるため、GETに比べて長いデータや機密性の高いデータの送信に向いている(ただし暗号化はTLSに依存する点は変わらない)。"}, {"cat": "Web・HTTP", "group": "HTTPメソッド", "word": "HEADメソッド", "short": "ヘッダのみを取得するHTTPメソッド。", "detail": "GETと全く同じ処理をサーバに行わせるが、レスポンスボディは返さずヘッダ情報のみを取得するメソッド。リソースが存在するかどうかの確認や、最終更新日時だけを効率よく調べたい場合など、本文全体をダウンロードする必要がない場面で使われる。"}, {"cat": "Web・HTTP", "group": "HTTPメソッド", "word": "PUTメソッド", "short": "指定したURIにリソースを作成・置換するHTTPメソッド。", "detail": "クライアントが指定したURIに対し、送信したデータでリソースを丸ごと作成、または既存の内容を完全に置き換えるメソッド。何度実行しても結果が同じになる(冪等性がある)よう設計されている点がPOSTとの大きな違い。"}, {"cat": "Web・HTTP", "group": "HTTPメソッド", "word": "DELETEメソッド", "short": "指定したリソースの削除を要求するHTTPメソッド。", "detail": "サーバ上の指定されたURIのリソースを削除するよう要求するメソッド。REST APIの設計において、GET(取得)・POST(作成)・PUT(更新)と並ぶ基本操作の一つとして位置づけられる。"}, {"cat": "Web・HTTP", "group": "HTTPメソッド", "word": "OPTIONSメソッド", "short": "サーバが対応している通信オプションを問い合わせるHTTPメソッド。", "detail": "対象リソースに対して、そのサーバがどのHTTPメソッドや機能に対応しているかを問い合わせるために使われるメソッド。異なるオリジン間の通信を制御するCORS(Cross-Origin Resource Sharing)の事前確認(プリフライトリクエスト)としても内部的に利用される。"}, {"cat": "Web・HTTP", "group": "HTTPメソッド", "word": "TRACEメソッド", "short": "リクエストの経路を確認するためのHTTPメソッド。", "detail": "クライアントが送ったリクエストを、経由するプロキシ等での改変内容も含めてそのままエコーバック(送り返す)させる、デバッグ・診断用のメソッド。悪用されるとクロスサイトトレーシングという攻撃に利用され得るため、多くのWebサーバでは初期状態で無効化されている。"}, {"cat": "Web・HTTP", "group": "HTTPメソッド", "word": "CONNECTメソッド", "short": "プロキシ経由でTCPトンネルを確立するHTTPメソッド。", "detail": "主にHTTPS通信をプロキシサーバ経由で行う際、プロキシに対して宛先サーバまでのTCPトンネルの確立を要求するメソッド。プロキシは以降、暗号化された通信の中身を見ることなく単なるバイト列の中継役に徹する。"}, {"cat": "Web・HTTP", "group": "Cookie・セッション", "word": "Cookie", "short": "サーバがクライアントに保存させる小さなデータ。", "detail": "HTTPは1回1回のリクエストが独立しており前後の文脈を覚えていない(ステートレス)ため、ログイン状態やカートの中身といった「状態」を維持するために考案された仕組み。サーバがSet-Cookieヘッダで発行した小さなデータをブラウザが保存し、以降の同じサーバへのリクエストにはそのCookieを自動的に付けて送り返すことで、サーバ側は「この一連のリクエストは同じ利用者からのものだ」と判別できるようになる。"}, {"cat": "Web・HTTP", "group": "Cookie・セッション", "word": "Set-Cookieヘッダフィールド", "short": "サーバがCookieの発行を指示するレスポンスヘッダ。", "detail": "サーバからのレスポンスに含まれ、ブラウザに対して特定の名前と値の組をCookieとして保存するよう指示するためのヘッダフィールド。有効期限、送信対象のドメイン・パス、HttpOnlyやSecureといった安全性に関わる属性もここで指定できる。"}, {"cat": "Web・HTTP", "group": "Cookie・セッション", "word": "HttpOnly", "short": "JavaScriptからのCookieアクセスを禁止する属性。", "detail": "Set-CookieでCookieを発行する際に付与できる属性の一つで、この属性が付いたCookieはJavaScriptのdocument.cookieのようなスクリプトからは読み取れなくなる。クロスサイトスクリプティング(XSS)によって悪意あるスクリプトが埋め込まれてしまった場合でも、セッションIDなどの重要なCookieが盗み出されるリスクを軽減する効果がある。"}, {"cat": "Web・HTTP", "group": "Cookie・セッション", "word": "セッションCookie", "short": "ブラウザを閉じると破棄される一時的なCookie。", "detail": "有効期限を明示的に指定せずに発行されるCookieで、ブラウザのそのセッション(起動している間)限りで保持され、ブラウザを完全に閉じると自動的に削除される。ログイン状態を「次に開いたときは覚えていない」ようにしたい場合などに使われる。"}, {"cat": "Web・HTTP", "group": "Cookie・セッション", "word": "セッションID", "short": "セッションを識別するための一意な値。", "detail": "ログイン状態などの「セッション」を識別するために、サーバが発行しCookie等を通じて保持させる一意な文字列。この値が漏洩すると、正規の利用者になりすまして操作されてしまう「セッションハイジャック」のリスクがあるため、推測されにくい十分な長さのランダムな値を使うことが重要とされる。"}, {"cat": "Web・HTTP", "group": "Cookie・セッション", "word": "セッション維持", "short": "一連のやり取りの間、状態を保持し続けること。", "detail": "本来は前後関係を覚えていないステートレスなHTTPの上で、ログイン状態やショッピングカートの中身といった、利用者ごとの状態を継続的に保持する仕組み全般。"}, {"cat": "Web・HTTP", "group": "Cookie・セッション", "word": "セッション共有", "short": "複数サーバ間でセッション情報を共有する構成。", "detail": "負荷分散環境において、ある利用者のリクエストがロードバランサによってどのサーバに振り分けられても、同じセッション状態(ログイン情報等)を参照できるよう、複数サーバ間でセッション情報を共有する仕組み。データベースや外部のキャッシュ(Redis等)にセッション情報を集約する方法がよく使われる。"}, {"cat": "Web・HTTP", "group": "Cookie・セッション", "word": "セッションクラスタリング", "short": "複数サーバでセッション情報を複製・共有するクラスタ構成。", "detail": "ロードバランサ配下の複数のWebサーバ同士が、互いのセッション情報を同期・複製し合うことで、どのサーバがリクエストを処理しても継続して同じセッションを利用できるようにする構成。"}, {"cat": "Web・HTTP", "group": "URI・URL", "word": "URI", "short": "リソースを識別するための統一的な識別子。", "detail": "Uniform Resource Identifier。「どこにあるか」を示すURLと「何という名前か」を示すURNの両方を包含する、リソースを一意に指し示すための識別子の総称概念。実務上はURLとほぼ同じ意味で使われることが多い。"}, {"cat": "Web・HTTP", "group": "URI・URL", "word": "URL", "short": "リソースの場所を示す識別子。", "detail": "Uniform Resource Locator。スキーム(https等)、ホスト名、ポート番号、パス、クエリ文字列といった要素から構成される、リソースの実際の所在(場所)を示す識別子。日常的に「Webサイトのアドレス」と呼ばれているものがこれにあたる。"}, {"cat": "Web・HTTP", "group": "URI・URL", "word": "URLの書式", "short": "URLの構文規則。", "detail": "`scheme://user:password@host:port/path?query#fragment` のような、URLを構成する各要素の順序・区切り文字を定めた構文規則。"}, {"cat": "Web・HTTP", "group": "URI・URL", "word": "URN", "short": "リソースの場所によらない永続的な名前。", "detail": "Uniform Resource Name。URLのように「今どこにあるか」ではなく、リソースそのものに対して所在に依存しない永続的な名前を付ける方式。書籍のISBNコードのような識別子がこの考え方に近い。"}, {"cat": "Web・HTTP", "group": "URI・URL", "word": "URLリライティング", "short": "URLの構造を書き換える技術・攻撃手法双方を指す用語。", "detail": "リバースプロキシがバックエンドサーバの内部URLを外部向けの見た目のURLに書き換える正規の技術としての用法と、攻撃者がリクエスト中のURLパラメータを不正に改変してSQLインジェクション等を試みる文脈での用法の、両方の意味で使われうる表現。文脈に応じて意味を見極める必要がある。"}, {"cat": "Web・HTTP", "group": "リバースプロキシ・CDN", "word": "リバースプロキシ", "short": "クライアントの代わりにサーバへ要求を中継する仕組み。", "detail": "インターネット側のクライアントからの要求を受け取り、その背後に配置された複数のWebサーバへ転送する、サーバ側に設置されるプロキシ。単なる中継だけでなく、キャッシュによる高速化、複数サーバへの負荷分散、TLS処理の集約(TLSアクセラレーション)、WAFによる攻撃検知など、さまざまな付加機能を担う入口として使われることが多い。"}, {"cat": "Web・HTTP", "group": "リバースプロキシ・CDN", "word": "リバースプロキシ方式", "short": "リバースプロキシを用いた構成方式。", "detail": "公開Webサーバ群の前段にリバースプロキシを配置することで、セキュリティ・キャッシュ・負荷分散といった機能をアプリケーションサーバ本体から切り離して実現する構成方式。"}, {"cat": "Web・HTTP", "group": "リバースプロキシ・CDN", "word": "フォワードプロキシ", "short": "クライアント側に設置され外部への通信を代理するプロキシ。", "detail": "社内ネットワークなどクライアント側に設置され、内部の利用者から外部のインターネットサイトへのアクセスを代理で中継するプロキシ。アクセス制御(特定サイトへのアクセス禁止)、キャッシュによる高速化、通信ログの記録などの目的で使われる。「クライアント側の代理」というリバースプロキシとの立ち位置の違いに注意。"}, {"cat": "Web・HTTP", "group": "リバースプロキシ・CDN", "word": "CDN", "short": "コンテンツを地理的に分散配置し配信を高速化する仕組み。", "detail": "Content Delivery Network。世界各地に配置されたエッジサーバに画像・動画・静的ファイルなどのコンテンツをあらかじめキャッシュしておき、利用者から地理的・ネットワーク的に近いエッジサーバから配信することで、応答速度を高速化しつつオリジンサーバへの負荷を軽減する仕組み。大規模なアクセス集中(フラッシュクラウド)やDDoS攻撃への耐性を高める効果もある。"}, {"cat": "Web・HTTP", "group": "リバースプロキシ・CDN", "word": "プログレッシブダウンロード", "short": "再生しながら順次ダウンロードする配信方式。", "detail": "動画などのファイルを最初から最後まで完全にダウンロードし終える前から、既にダウンロード済みの部分の再生を開始できる配信方式。RTSPのような専用のストリーミングプロトコルを使わずとも、通常のHTTPによるファイル転送の延長として簡易的にストリーミング風の体験を提供できる。"}, {"cat": "Web・HTTP", "group": "リバースプロキシ・CDN", "word": "プログレッシブ表示技術", "short": "画像などを段階的に精細化しながら表示する技術。", "detail": "画像ファイルなどを、最初はぼんやりとした低解像度の状態でまず表示し、データのダウンロードが進むにつれて徐々に鮮明な高解像度へと切り替えていく表示技術。ファイル全体がそろうまで真っ白のまま待たせるより、体感的な表示速度が速く感じられる効果を狙っている。"}, {"cat": "Web・HTTP", "group": "Webセキュリティ", "word": "WAF", "short": "Webアプリケーションを狙う攻撃を検知・防御する装置。", "detail": "Web Application Firewall。SQLインジェクションやクロスサイトスクリプティング(XSS)など、通常のファイアウォールでは検知できないアプリケーション層(HTTPの中身)への攻撃を、既知の攻撃パターン(シグネチャ)や通信の異常な振る舞いから検知・遮断する専用のセキュリティ製品。リバースプロキシの位置に配置されることが多い。"}, {"cat": "Web・HTTP", "group": "Webセキュリティ", "word": "クライアントサイドスクリプト", "short": "ブラウザ側で実行されるスクリプト。", "detail": "JavaScriptに代表される、サーバではなく利用者のブラウザ(クライアント)側で実際に実行されるプログラムコード。フォーム入力のリアルタイムなチェックや、画面を再読み込みせずに一部だけ更新する動的な演出などに使われる。"}, {"cat": "Web・HTTP", "group": "Webセキュリティ", "word": "サーバサイドスクリプト", "short": "サーバ側で実行されるスクリプト。", "detail": "PHPやPythonなどで書かれ、Webサーバ上で実行されてHTMLを動的に生成するプログラムコード。データベースへの問い合わせ結果を反映したページを作るなど、クライアントには見えない側の処理を担う。"}, {"cat": "Web・HTTP", "group": "Webセキュリティ", "word": "サーバサイドのプログラム", "short": "サーバ上で動作する処理プログラム全般。", "detail": "サーバサイドスクリプトを含む、Webアプリケーションのビジネスロジックを担いサーバ上で実行されるプログラム全般を指す表現。"}, {"cat": "Web・HTTP", "group": "Webセキュリティ", "word": "スクリプト", "short": "一連の処理を記述したプログラムの総称。", "detail": "コンパイル(事前の機械語変換)を必要とせず、比較的手軽に実行できるプログラムコード全般を指す総称。クライアントサイドスクリプト・サーバサイドスクリプトのいずれの文脈でも使われる。"}, {"cat": "Web・HTTP", "group": "Webセキュリティ", "word": "Webトラフィックのスキャン", "short": "Web通信内容を検査し脅威を検出すること。", "detail": "プロキシやセキュリティ製品がHTTP/HTTPS通信の中身(URLやリクエスト・レスポンスの内容)を解析し、マルウェアのダウンロードや不正な通信パターンを検出する処理。暗号化されたHTTPS通信を検査するには、途中でいったん復号する仕組み(SSLインスペクション)が必要になる場合がある。"}, {"cat": "暗号技術・PKI", "group": "暗号方式基本", "word": "暗号化", "short": "データを第三者に読めない形式に変換すること。", "detail": "平文(元のデータ)を、鍵と暗号アルゴリズムを用いて第三者には解読できない暗号文へ変換する処理。通信の盗聴対策としてだけでなく、保存データの漏洩対策(ディスク暗号化)としても幅広く使われる、情報セキュリティの最も基本的な要素技術。"}, {"cat": "暗号技術・PKI", "group": "暗号方式基本", "word": "暗号方式", "short": "暗号化の仕組み・アルゴリズムの分類。", "detail": "共通鍵方式・公開鍵方式・それらを組み合わせたハイブリッド方式など、暗号化をどのような鍵の枠組みで行うかという方法論の分類を指す上位概念。"}, {"cat": "暗号技術・PKI", "group": "暗号方式基本", "word": "共通鍵方式", "short": "暗号化と復号に同じ鍵を使う方式。", "detail": "対称鍵暗号。送信者と受信者があらかじめ同一の秘密鍵を共有しておき、その同じ鍵で暗号化・復号の両方を行う方式。計算量が比較的小さく高速に処理できる利点がある一方、通信相手ごとに異なる鍵を安全に配送・管理する必要があるという課題(鍵配送問題)を抱えている。AESが現在の代表的なアルゴリズム。"}, {"cat": "暗号技術・PKI", "group": "暗号方式基本", "word": "公開鍵方式", "short": "暗号化と復号に異なる鍵(公開鍵・秘密鍵)を使う方式。", "detail": "非対称鍵暗号。数学的に対になった2つの鍵(公開鍵・秘密鍵)を用い、一方の鍵で暗号化したデータはもう一方の鍵でしか復号できないという性質を利用する方式。公開鍵は誰に知られても問題ないため事前の鍵共有が不要になり、共通鍵方式が抱える鍵配送問題を解決できる一方、計算量が多く処理速度は共通鍵方式より遅い。RSA暗号や楕円曲線暗号が代表例。"}, {"cat": "暗号技術・PKI", "group": "暗号方式基本", "word": "ハイブリッド方式", "short": "公開鍵方式と共通鍵方式を組み合わせた方式。", "detail": "処理は軽いが鍵配送に難がある共通鍵方式と、鍵配送は容易だが処理が重い公開鍵方式の、両方の長所を組み合わせた方式。公開鍵暗号(または鍵交換アルゴリズム)を使ってその場限りのセッション鍵を安全に共有し、実際の大量のデータのやり取りには高速な共通鍵暗号を使う、というのがTLSをはじめ実用の暗号通信のほぼすべてで採用されている基本構造。"}, {"cat": "暗号技術・PKI", "group": "ブロック暗号", "word": "ブロック暗号方式", "short": "データを一定サイズのブロック単位で暗号化する方式。", "detail": "AESのように、平文を128ビットなど固定長の「ブロック」単位に区切り、そのブロックごとに暗号化処理を適用していく方式。1ビットずつ処理していくストリーム暗号方式と対比される、共通鍵暗号の代表的な設計方式の一つ。"}, {"cat": "暗号技術・PKI", "group": "ブロック暗号", "word": "ブロック暗号アルゴリズム", "short": "ブロック暗号方式を実現する具体的なアルゴリズム。", "detail": "現行標準のAES、旧世代のDES・トリプルDESなど、ブロック単位でデータを暗号化する具体的な計算手順(アルゴリズム)を指す。"}, {"cat": "暗号技術・PKI", "group": "ブロック暗号", "word": "AES", "short": "共通鍵ブロック暗号の標準規格。", "detail": "Advanced Encryption Standard。米国NISTが公募・選定した、128・192・256ビットのいずれかの鍵長を選べる現行標準のブロック暗号アルゴリズム。旧世代のDESが計算能力の向上により解読可能になったことを受けてその後継として2001年に標準化され、現在では政府機関から民間まで、実質的にほぼすべての場面で標準的に使われている。"}, {"cat": "暗号技術・PKI", "group": "ブロック暗号", "word": "暗号利用モード", "short": "ブロック暗号を繰り返し適用する際の運用方式。", "detail": "ブロック暗号は1ブロック分のデータしか一度に暗号化できないため、平文全体(複数ブロック)にどのように繰り返し適用していくかを決める運用方式。単純に各ブロックを独立して暗号化するECBモードは同じ平文が同じ暗号文になってしまいパターンが露見する弱点があり、前のブロックの結果を次に使うCBCモードや、ストリーム暗号的に使うCTR・GCMモードなど、安全性・並列処理性を高めた様々なモードが考案されている。"}, {"cat": "暗号技術・PKI", "group": "ブロック暗号", "word": "CBC", "short": "前のブロックの暗号文を次の暗号化に利用する暗号利用モード。", "detail": "Cipher Block Chaining。各ブロックを暗号化する前に、直前のブロックの暗号文と平文をXOR(排他的論理和)してから暗号化することで、同じ平文ブロックが繰り返し出てきても毎回異なる暗号文になるようにし、パターンの露見を防ぐ暗号利用モード。復号時にエラーが起きても影響が限定的である一方、暗号化処理はブロックを順番に処理する必要があり並列化しにくいという特性がある。"}, {"cat": "暗号技術・PKI", "group": "ブロック暗号", "word": "CBC-MAC", "short": "CBCモードを応用したメッセージ認証コード生成方式。", "detail": "CBCモードで暗号化した際の最終ブロックの値を、そのメッセージ全体の改ざん検知用のメッセージ認証コード(MAC)として利用する方式。暗号化そのものではなく、認証(改ざん検知)を目的にCBCの仕組みを転用している点がポイント。"}, {"cat": "暗号技術・PKI", "group": "ブロック暗号", "word": "CTR", "short": "ブロック暗号をカウンタ値でストリーム的に使う暗号利用モード。", "detail": "Counter mode。平文そのものではなく、単純に1ずつ増えていくカウンタ値をブロック暗号で暗号化し、その結果を平文とXORすることで暗号文を得るモード。各ブロックの処理が互いに独立しているため並列処理や事前計算がしやすく、高速な実装が可能。ストリーム暗号のように振る舞える点も特徴。"}, {"cat": "暗号技術・PKI", "group": "ブロック暗号", "word": "CCMP", "short": "AESをCTRモード+CBC-MACで使う無線LAN向け暗号方式。", "detail": "Counter mode CBC-MAC Protocol。AES暗号を、機密性のためのCTRモードと、完全性(改ざん検知)のためのCBC-MACとで組み合わせて使う、無線LANのWPA2/WPA3で採用される暗号化方式。1つの鍵とアルゴリズムで暗号化と改ざん検知を同時に実現するAEAD的な設計になっている。"}, {"cat": "暗号技術・PKI", "group": "ブロック暗号", "word": "XCBC-MAC", "short": "CBC-MACを拡張し可変長メッセージに対応させたMAC方式。", "detail": "元々のCBC-MACは、メッセージの長さがブロックサイズの倍数でない場合に安全性上の問題が生じる制約があったが、それを補うため任意の長さのメッセージに対して安全に適用できるよう改良されたメッセージ認証コード生成方式。"}, {"cat": "暗号技術・PKI", "group": "ストリーム暗号", "word": "ストリーム暗号方式", "short": "データをビット/バイト単位で連続的に暗号化する方式。", "detail": "鍵から生成される疑似乱数の列(キーストリーム)を、平文と1ビットまたは1バイトずつ順次XORしていく方式。ブロック単位にデータをまとめて処理するブロック暗号方式と異なり、データが届く端から逐次処理できるため、リアルタイム性が求められる通信との相性が良いとされる。"}, {"cat": "暗号技術・PKI", "group": "ストリーム暗号", "word": "RC4", "short": "代表的なストリーム暗号アルゴリズム(現在非推奨)。", "detail": "1987年に開発された、シンプルで高速なストリーム暗号アルゴリズム。WEPやSSLの一部で使われていたが、生成される鍵ストリームに統計的な偏りがあることが判明し、この偏りを利用した解析によって暗号文から情報が漏れてしまうことが知られており、現在ではあらゆる用途で使用が推奨されない。"}, {"cat": "暗号技術・PKI", "group": "ストリーム暗号", "word": "ChaCha20", "short": "RC4に代わる現代的なストリーム暗号アルゴリズム。", "detail": "Googleのエンジニアらによって設計された、高速性と安全性を両立する現代的なストリーム暗号。AESのハードウェアアクセラレーション機能を持たないモバイル端末等でもソフトウェアだけで高速に動作するため、TLS1.3の暗号スイートの一つとしても採用されている。"}, {"cat": "暗号技術・PKI", "group": "ストリーム暗号", "word": "キーストリーム", "short": "ストリーム暗号で平文とXORされる鍵由来のビット列。", "detail": "暗号鍵と初期化ベクトル(IV)などを元に、暗号アルゴリズムが生成する疑似乱数のビット列。このキーストリームを平文と1ビットずつXORすることで暗号文が得られる。真にランダムに近い性質を持つほど、統計的な解析による攻撃に強くなる。"}, {"cat": "暗号技術・PKI", "group": "ストリーム暗号", "word": "初期化ベクトル", "short": "暗号化のたびに変化させる初期値。", "detail": "IV(Initialization Vector)。同じ鍵を使い続けていても、暗号化するたびに毎回異なる値を設定することで、結果として毎回異なる暗号文が生成されるようにするための初期値。同一の鍵・同一の平文であっても暗号文にパターンが生じないようにする目的、およびリプレイ攻撃を防ぐ目的の両方で使われる。"}, {"cat": "暗号技術・PKI", "group": "ストリーム暗号", "word": "IV", "short": "初期化ベクトルの略称。", "detail": "Initialization Vector。ストリーム暗号やCBCモードなど、多くの暗号利用モードで、暗号化のたびに変化させる初期値として使われる値。"}, {"cat": "暗号技術・PKI", "group": "ストリーム暗号", "word": "ワンタイムパッド", "short": "理論上解読不能とされる暗号方式。", "detail": "平文と全く同じ長さを持つ、真にランダムな鍵を一度きり使用し、二度と同じ鍵を使い回さないという条件を満たした場合に限り、数学的に解読が不可能であることが証明されている暗号方式。理論上は最強だが、平文と同じ長さの鍵を安全に事前共有し、かつ一度も使い回さないという運用が現実的に極めて困難なため、実用の通信でそのまま使われることはほとんどない。"}, {"cat": "暗号技術・PKI", "group": "AEAD・関連", "word": "AEAD", "short": "暗号化と改ざん検知を同時に行う暗号利用モード。", "detail": "Authenticated Encryption with Associated Data。AES-GCMやChaCha20-Poly1305などが該当し、機密性(暗号化)の確保と完全性・認証(改ざん検知)の確保を、1つの処理でまとめて効率よく提供する暗号利用モードの分類。暗号化とMAC計算を別々の手順で行うより実装ミスのリスクが少なく処理も効率的なため、TLS1.3では実質的にAEADの暗号スイートのみが採用されている。"}, {"cat": "暗号技術・PKI", "group": "AEAD・関連", "word": "AES-GCM", "short": "AESをGCMモードで使うAEAD方式。", "detail": "AESブロック暗号を、CTRモードに似た仕組みで暗号化を行いつつ、同時にGalois体上の演算を使って認証タグ(改ざん検知用の値)も計算するGCM(Galois/Counter Mode)と組み合わせた暗号方式。暗号化と認証を一体的に、かつ高速に処理できるため、TLS1.2・1.3をはじめ現代の暗号通信で最も広く使われる暗号スイートの一つになっている。"}, {"cat": "暗号技術・PKI", "group": "AEAD・関連", "word": "認証付き暗号", "short": "暗号化とメッセージ認証を組み合わせた仕組み。", "detail": "機密性(第三者に内容を読ませない)と完全性・認証(改ざんされていないことの保証)を同時に提供する暗号方式の総称。AEADはこの認証付き暗号を実現するための具体的な暗号利用モードの分類にあたる。"}, {"cat": "暗号技術・PKI", "group": "公開鍵暗号アルゴリズム", "word": "RSA暗号", "short": "素因数分解の困難性に基づく公開鍵暗号。", "detail": "非常に大きな2つの素数の積(合成数)を、元の2つの素数に効率よく分解することが計算量的に極めて困難である、という数学的事実を安全性の根拠とする公開鍵暗号アルゴリズム。1977年に考案されて以降、暗号化・デジタル署名の両方の用途で長年にわたり広く使われてきた、公開鍵暗号の代表格。"}, {"cat": "暗号技術・PKI", "group": "公開鍵暗号アルゴリズム", "word": "楕円曲線暗号", "short": "楕円曲線上の離散対数問題に基づく公開鍵暗号。", "detail": "ECC(Elliptic Curve Cryptography)。楕円曲線と呼ばれる特殊な数学的構造上での演算における「離散対数問題」の求解の困難さを安全性の根拠とする公開鍵暗号方式。RSA暗号と同等の安全性を、より短い鍵長で実現できるため、計算資源やバッテリーが限られるモバイル機器やIoT機器との相性が良いとされる。"}, {"cat": "暗号技術・PKI", "group": "公開鍵暗号アルゴリズム", "word": "ECC", "short": "楕円曲線暗号の略称。", "detail": "Elliptic Curve Cryptography。楕円曲線上の数学的な演算を利用し、RSA暗号より短い鍵長で同等の安全性を実現する公開鍵暗号方式。"}, {"cat": "暗号技術・PKI", "group": "公開鍵暗号アルゴリズム", "word": "原像計算困難性", "short": "ある出力から入力を逆算することが計算量的に困難な性質。", "detail": "ハッシュ関数の安全性を支える基本的な性質の一つ。あるハッシュ値(出力)が与えられたとき、そのハッシュ値になる元のデータ(入力、原像)を、力任せに試す以外の効率的な方法で求めることが計算量的に不可能であるという性質。この性質があるおかげで、パスワードをハッシュ値の形で保存しても元のパスワードは推測されにくい。"}, {"cat": "暗号技術・PKI", "group": "公開鍵暗号アルゴリズム", "word": "第2原像計算困難性", "short": "あるデータと同じハッシュ値を持つ別のデータを見つけることが困難な性質。", "detail": "ハッシュ関数の安全性を支える性質の一つ。ある特定のデータが与えられたとき、それとは異なる別のデータでありながら、同じハッシュ値になるものを見つけ出すことが計算量的に困難であるという性質。デジタル署名において、署名対象のデータをこっそり別の内容にすり替えられないことの根拠になっている。"}, {"cat": "暗号技術・PKI", "group": "公開鍵暗号アルゴリズム", "word": "衝突困難性", "short": "異なる入力から同じハッシュ値が生じにくい性質。", "detail": "ハッシュ関数の安全性を支える性質の一つ。特定のデータを指定せず「異なる2つの入力の組であって、同じハッシュ値になるもの」を任意に探すことすら計算量的に困難であるという性質。第2原像計算困難性より条件が緩い(片方のデータが自由に選べる)分、実は破りやすいことが知られており、実際にMD5やSHA-1ではこの衝突を意図的に作り出す攻撃が実証され、より新しいSHA-2等への移行が進められた。"}, {"cat": "暗号技術・PKI", "group": "公開鍵暗号アルゴリズム", "word": "衝突", "short": "異なる入力から同一のハッシュ値が生じる事象。", "detail": "ハッシュ関数において、出力の範囲(ハッシュ値の種類の数)が入力の範囲より遥かに少ない以上、理論上は避けられない現象だが、衝突困難性が十分に高いハッシュ関数であれば、実際にそれを意図的に見つけ出すことが現実的な計算資源では不可能に近いレベルまで難しくなる。"}, {"cat": "暗号技術・PKI", "group": "鍵交換", "word": "Diffie-Hellman鍵交換方式", "short": "盗聴されても共通鍵を安全に共有できる鍵交換方式。", "detail": "1976年に考案された、通信経路が盗聴されている前提であっても、通信の両者だけが計算可能な共通の秘密の値(共通鍵)を導出できる画期的な鍵交換方式。互いに公開してよい情報だけをやり取りし、それぞれが手元で秘密の指数計算を行うことで、第三者には計算困難な共通の値にたどり着ける、という数学的な仕組み(離散対数問題の困難性)を利用している。現在のDHE・ECDHEといった鍵交換方式は、いずれもこの発想を発展させたもの。"}, {"cat": "暗号技術・PKI", "group": "鍵交換", "word": "DHE", "short": "Diffie-Hellman鍵交換の一時鍵版。", "detail": "Diffie-Hellman Ephemeral。通信のたびに一時的な(使い捨ての)鍵ペアを新しく生成してDiffie-Hellman鍵交換を行う方式。固定的な鍵を使い回すのではなく毎回異なる鍵を使うことで、後日サーバの長期的な秘密鍵が漏洩したとしても、過去に交わされた通信のセッション鍵までは復元できない、前方秘匿性(PFS)という性質を実現する。"}, {"cat": "暗号技術・PKI", "group": "鍵交換", "word": "ECDHE", "short": "楕円曲線を用いたDiffie-Hellman鍵交換の一時鍵版。", "detail": "Elliptic Curve DHE。楕円曲線暗号の仕組みを用いてDiffie-Hellman鍵交換を行う方式で、通常のDHEに比べ短い鍵長で高速に計算できる。TLS1.2・1.3において、前方秘匿性を実現するための鍵交換方式として最も広く使われている。"}, {"cat": "暗号技術・PKI", "group": "鍵交換", "word": "鍵交換", "short": "通信当事者間で暗号鍵を安全に共有すること。", "detail": "盗聴の可能性がある経路上であっても、通信の両当事者だけが知り得る共通の秘密の鍵を確立するための手続き全般。Diffie-Hellman方式が現在の主流の考え方になっている。"}, {"cat": "暗号技術・PKI", "group": "鍵交換", "word": "前方秘匿性", "short": "長期鍵が漏洩しても過去の通信内容は解読されない性質。", "detail": "PFS(Perfect Forward Secrecy、単にForward Secrecyとも)。サーバの長期的な秘密鍵(証明書に対応する秘密鍵)がもし後日盗まれてしまったとしても、過去に行われた通信で使われたセッション鍵は、その長期鍵からは復元できないようにする性質。DHE・ECDHEのようにセッションごとに一時鍵を生成する鍵交換方式を使うことで実現され、TLS1.3ではこの性質を持つ鍵交換方式が実質的に必須化されている。"}, {"cat": "暗号技術・PKI", "group": "鍵交換", "word": "PFS", "short": "前方秘匿性の略称。", "detail": "Perfect Forward Secrecy。サーバの長期鍵の漏洩が、過去に確立された個々のセッション鍵の解読には影響しないという性質。"}, {"cat": "暗号技術・PKI", "group": "鍵交換・認証鍵", "word": "鍵管理", "short": "暗号鍵の生成・配布・保管・更新・廃棄を行う運用。", "detail": "暗号システム全体の安全性は、実質的に鍵の管理がどれだけ厳密に行われているかにかかっているとも言われる。生成から配布、安全な保管、定期的な更新(ローテーション)、そして不要になった際の確実な廃棄まで、鍵のライフサイクル全体を管理する運用・技術の総称。"}, {"cat": "暗号技術・PKI", "group": "鍵交換・認証鍵", "word": "セッション鍵", "short": "一時的な通信のために生成される鍵。", "detail": "そのセッション(1回の通信)限りで使われ、通信が終われば破棄される共通鍵。TLS等のハイブリッド方式では、鍵交換によってこのセッション鍵を安全に確立し、実際の大量のデータの暗号化にはこの鍵が使われる。"}, {"cat": "暗号技術・PKI", "group": "鍵交換・認証鍵", "word": "事前共有鍵", "short": "通信開始前にあらかじめ共有しておく鍵。", "detail": "PSK(Pre-Shared Key)。IPsecのVPNや無線LANのパーソナルモードなどで、公開鍵暗号を使った鍵交換の手続きを省略し、あらかじめ手動で両者に設定しておく共通の鍵。設定は容易だが、大規模な環境では漏洩時の変更負担や、利用者ごとの個別管理ができないといった限界がある。"}, {"cat": "暗号技術・PKI", "group": "鍵交換・認証鍵", "word": "PSK", "short": "事前共有鍵の略称。", "detail": "Pre-Shared Key。IKE(IPsec)や無線LANのパーソナルモードにおいて、事前に手動で両者に設定しておく共通鍵。"}, {"cat": "暗号技術・PKI", "group": "MAC・ハッシュ", "word": "メッセージ認証コード", "short": "メッセージの完全性と認証を提供する短い値。", "detail": "MAC(Message Authentication Code)。共通鍵とメッセージ内容の両方から計算される、比較的短い固定長の値。送信者と受信者だけが知る共通鍵を使って計算するため、途中の第三者が内容を改ざんしても正しいMACの値を再計算できず、受信側で不一致として検出できる。改ざんの有無だけでなく、その鍵を持つ正当な相手からの送信であることの確認(認証)も同時に行える。"}, {"cat": "暗号技術・PKI", "group": "MAC・ハッシュ", "word": "ハッシュアルゴリズム", "short": "任意長データから固定長の値を生成する関数群。", "detail": "SHA-2などに代表される、どんな長さの入力データからも常に一定の長さの出力(ハッシュ値)を生成するアルゴリズムの総称。改ざん検知やデジタル署名、パスワードの安全な保存など、情報セキュリティの基盤技術として幅広く使われる。"}, {"cat": "暗号技術・PKI", "group": "MAC・ハッシュ", "word": "メッセージダイジェスト", "short": "ハッシュ関数により生成される固定長の要約値。", "detail": "元のデータをハッシュ関数にかけて得られる、固定長の要約値そのものを指す用語。同じデータからは常に同じダイジェストが得られるため、受信データのダイジェストを再計算して送信時の値と比較することで、伝送中の改ざん・破損の有無を検証できる。"}, {"cat": "暗号技術・PKI", "group": "MAC・ハッシュ", "word": "HMAC", "short": "共通鍵を用いたハッシュベースのメッセージ認証コード。", "detail": "Hash-based MAC。ハッシュ関数(SHA-2等)と秘密鍵を組み合わせて、安全性の高いメッセージ認証コードを生成する標準的な方式。ハッシュ関数をそのままメッセージ認証に転用する際に生じうる特定の攻撃を回避できるよう、鍵をハッシュ計算に組み込む手順が工夫されており、TLSやIPsec、多くのAPI認証の仕組みで広く使われている。"}, {"cat": "暗号技術・PKI", "group": "MAC・ハッシュ", "word": "ハッシュ付き鍵", "short": "HMACのように鍵を組み込んだハッシュ処理を指す表現。", "detail": "ハッシュ関数の入力に秘密鍵を組み込むことで、単なる改ざん検知に留まらず送信者の認証機能まで持たせる方式(HMAC等)を指す表現。"}, {"cat": "暗号技術・PKI", "group": "MAC・ハッシュ", "word": "SHA-2", "short": "現在標準的に使われるハッシュ関数のファミリー。", "detail": "SHA-256やSHA-512などを含む、旧世代のSHA-1が理論的な衝突耐性の低下を指摘されたことを受けて後継として広く採用されているハッシュアルゴリズム群。デジタル署名やTLSの整合性検証など、現在の暗号通信の基盤として標準的に使われている。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "PKI", "short": "公開鍵暗号を実運用で使うための信頼基盤。", "detail": "Public Key Infrastructure。「この公開鍵は本当にこの相手のものである」という対応関係を、信頼できる第三者機関(認証局)が発行するデジタル証明書によって保証する、公開鍵暗号を安全に社会的に運用するための仕組み全体。公開鍵暗号自体は「誰の公開鍵か分からなくても暗号化はできてしまう」という弱点(なりすまし)を持っており、PKIはこの弱点を補うために発展した。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "公開鍵基盤", "short": "PKIの日本語表記。", "detail": "認証局・デジタル証明書・失効管理の仕組みなどから構成される、公開鍵暗号を安全に運用するための社会的な基盤全体を指す日本語表記。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "CA", "short": "証明書を発行する信頼された第三者機関。", "detail": "Certificate Authority(認証局)。申請者の身元確認を行ったうえで、その公開鍵と身元情報を結びつけたデジタル証明書に自らの署名を付与して発行する、PKIの信頼の根幹を担う機関。ブラウザやOSにはあらかじめ主要なCAの証明書(ルート証明書)が組み込まれており、その信頼が証明書の連鎖を通じて末端のサーバ証明書にまで及んでいる。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "プライベートCA", "short": "組織内など閉じた範囲で運用される独自の認証局。", "detail": "一般に公開された商用CAとは異なり、社内システムなど限定された利用者・機器の範囲だけで通用させることを目的に、組織が自前で構築・運用する認証局。外部のブラウザ等には自動的に信頼されないため、利用する端末に自組織のルート証明書を個別に配布・登録しておく必要がある。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "認証局", "short": "CAの日本語表記。", "detail": "申請者の身元を確認したうえでデジタル証明書を発行し、公開鍵とその持ち主との対応関係を保証する、PKIにおいて信頼の根幹を担う第三者機関。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "電子証明書", "short": "公開鍵と持ち主の情報を結びつけたデジタルなデータ。", "detail": "証明書の持ち主の情報(組織名・ドメイン名等)、その公開鍵、有効期限、そして発行した認証局によるデジタル署名などを含む電子的なデータ。認証局の署名によって、この公開鍵が確かにその持ち主のものであることが保証される。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "デジタル署名", "short": "秘密鍵で署名し公開鍵で検証する電子的な署名。", "detail": "送信者が、メッセージのハッシュ値を自分の秘密鍵で暗号化(署名)し、そのメッセージに添えて送る仕組み。受信側は、送信者の公開鍵を使ってこの署名を検証(復号して元のハッシュ値と比較)することで、そのメッセージが確かに秘密鍵の持ち主(送信者本人)によって作成されたこと(認証)、そして途中で改ざんされていないこと(完全性)の両方を確認できる。手書きの署名や印鑑に相当する役割を電子データの世界で果たす技術。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "サーバ証明書", "short": "Webサーバ等の身元を証明する電子証明書。", "detail": "TLS通信において、接続先のサーバが確かに正当な運営者(証明書に記載されたドメイン・組織)であることを、ブラウザ側に提示するために使われる電子証明書。ブラウザはこの証明書を検証することで、フィッシングサイトのような偽サーバへの接続でないことを確認する。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "サーバ署名", "short": "サーバ証明書に含まれるCAによるデジタル署名。", "detail": "認証局がサーバ証明書の内容(公開鍵・ドメイン名等)に対して行うデジタル署名。この署名があることで、証明書の内容が発行後に改ざんされていないこと、および正規のCAによって発行されたものであることが保証される。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "サーバ認証", "short": "接続先サーバの正当性をクライアントが確認すること。", "detail": "TLSハンドシェイクの過程で、クライアントがサーバから提示されたサーバ証明書を検証(署名の正当性、有効期限、失効の有無、ドメイン名の一致等を確認)することで、接続先が確かに意図した正当なサーバであることを確認する処理。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "クライアント証明書", "short": "クライアント(利用者)の身元を証明する電子証明書。", "detail": "サーバ側が接続してきたクライアント(利用者や端末)の正当性を確認するために要求する、個人や端末に対して発行される電子証明書。企業のリモートアクセスVPNや、金融機関のオンラインシステムなどで、パスワードに加えたより強固な本人確認手段として使われる。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "クライアント署名", "short": "クライアント証明書に付与されるデジタル署名。", "detail": "認証局がクライアント証明書の内容に対して行うデジタル署名で、その証明書の正当性・非改ざんを保証する。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "クライアント認証", "short": "接続してきたクライアントの正当性をサーバが確認すること。", "detail": "クライアント証明書等を用いて、サーバ側が接続元のクライアントが正当な利用者・端末であることを検証する処理。通常のTLSがサーバ認証のみを行うのに対し、クライアント認証もあわせて行う場合を相互TLS(mTLS)と呼ぶことがある。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "証明書署名要求", "short": "CAへ証明書発行を依頼するためのデータ。", "detail": "CSR(Certificate Signing Request)。証明書を取得したい申請者が、自分の公開鍵と組織・ドメインなどの情報をまとめて生成し、認証局(CA)に送付して署名(=証明書の発行)を依頼するためのデータ。CSRの生成時に対応する秘密鍵も同時に作られ、この秘密鍵は申請者側が厳重に保管し、CAへは送らない。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "CSR", "short": "証明書署名要求の略称。", "detail": "Certificate Signing Request。証明書を取得したい申請者が、公開鍵と身元情報をまとめてCAに送付し、証明書発行(署名)を依頼するために作成するデータ。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "失効リスト", "short": "失効した証明書の一覧。", "detail": "CRL(Certificate Revocation List)。有効期限がまだ残っているにもかかわらず、秘密鍵の漏洩や組織の廃止などの理由で無効化された証明書のシリアル番号を列挙したリスト。ブラウザ等はこのリスト(または後継のオンライン照会の仕組みOCSP)を参照し、提示された証明書が失効していないかを確認する。"}, {"cat": "暗号技術・PKI", "group": "PKI・証明書", "word": "エンティティ認証", "short": "通信相手が主張する身元(実体)であることを確認すること。", "detail": "証明書、パスワード、生体情報などを用いて、通信相手・利用者が確かに主張している本人・当該システムそのもの(エンティティ)であることを検証するプロセス全般を指す、比較的広い意味を持つ用語。サーバ認証・クライアント認証はいずれもこのエンティティ認証の一種にあたる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "VPN基本", "word": "VPN通信", "short": "公衆網上に仮想的な専用線を構築する通信。", "detail": "Virtual Private Network。インターネットのような不特定多数が共用するネットワークの上に、暗号化やトンネリングといった技術を使って、あたかも自分たちだけの専用回線であるかのような閉域的な通信路を仮想的に構築する仕組み。専用線を物理的に敷設するのに比べ、大幅に低コストで拠点間・リモート利用者との接続を実現できる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "VPN基本", "word": "仮想の専用線", "short": "VPNが提供する論理的な専用線環境を表す表現。", "detail": "物理的な専用線を実際に敷設するのではなく、暗号化・トンネリング技術によって専用線と同等のセキュアな通信環境を論理的に実現するという、VPNの本質的な性質を表す表現。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "VPN基本", "word": "インターネットVPN", "short": "インターネット回線を利用して構築するVPN。", "detail": "既存の一般的なインターネット回線の上に、暗号化トンネル(多くの場合IPsecやSSL-VPN)を構築して拠点間や在宅勤務者との接続を実現する、最もコストを抑えられるVPNの形態。回線自体は公衆網であるため、通信事業者側での帯域保証や品質保証は基本的に得られない。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "VPN基本", "word": "IP-VPN網", "short": "通信事業者のIP網を使って構築するVPN。", "detail": "不特定多数が使うインターネットを経由せず、通信事業者が独自に構築・運用している閉域のIP網の中でVPNを構築するサービス形態。同じ事業者網内のユーザ同士に限定される代わりに、インターネットVPNより高い品質・セキュリティが期待できる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "VPN基本", "word": "VPN網", "short": "VPNによって構築された仮想ネットワーク全体を指す表現。", "detail": "複数拠点間のVPN接続が組み合わさって形成される、組織全体をカバーする論理的なネットワーク全体を指す表現。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "VPN基本", "word": "SSL-VPN", "short": "WebブラウザやSSL/TLSを利用するVPN方式。", "detail": "IPsecのように専用のクライアントソフトのインストールや、VPN専用のプロトコルを通すためのファイアウォール設定を必要とせず、通常のHTTPS通信で使われるTCP443番ポートとTLSの仕組みを利用してリモートアクセスを実現するVPN方式。ブラウザだけで利用できる簡易な「クリップレス型」と、より高機能な専用クライアントを使う「トンネル型」に大別され、外出先や取引先のネットワークなど、IPsecでは通信が通りにくい環境でも比較的接続しやすいという利点がある。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "VPN基本", "word": "リモートアクセス", "short": "外部から社内ネットワークへ接続すること。", "detail": "出張先、在宅勤務中の自宅、外出先のカフェなど、社外のネットワークからVPN等を経由して社内システムへ安全にアクセスする利用形態。拠点間を常時結ぶサイト間VPNとは異なり、個々の利用者端末が必要な時だけ接続するという点が特徴。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "トンネリング", "short": "あるプロトコルのパケットを別プロトコルでカプセル化して転送する技術。", "detail": "元のパケット全体を新しいヘッダで包み込む「カプセル化」を行い、本来そのままでは通せない、あるいは通したくないネットワークを経由して、透過的に(まるでトンネルの中を通すように)転送する技術の総称。受信側では包んでいたヘッダを取り除く「デカプセル化」を行い、元のパケットを取り出す。GRE、L2TP、IPsecなど、多くのVPN技術の基盤になっている考え方。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "トンネル処理", "short": "カプセル化・非カプセル化を行う一連の処理。", "detail": "送信側でのカプセル化(元のパケットに新しいヘッダを付与)と、受信側でのデカプセル化(付与されたヘッダを取り除き元のパケットを復元)を含む、トンネリングを実現するための一連の処理全体。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "トンネルモード", "short": "元のIPパケット全体を新しいIPヘッダで包むIPsecの動作モード。", "detail": "IPsecの2つの動作モードの一つ。元のIPヘッダを含むIPパケット全体をそのままペイロードとして暗号化し、さらに外側から新しいIPヘッダを付与する。これにより、実際の送信元・宛先アドレス(内部のプライベートアドレス等)が外部からは見えなくなり、拠点間をつなぐVPNゲートウェイ同士の通信(サイト間VPN)で一般的に使われる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "トランスポートモード", "short": "元のIPヘッダを維持しペイロードのみ保護するIPsecの動作モード。", "detail": "IPsecのもう一つの動作モード。元のIPヘッダはそのまま残し、その中身(TCP/UDPセグメント以降のペイロード部分)だけを暗号化・認証する。IPヘッダを書き換えない分オーバーヘッドが小さく、主にホスト同士が直接IPsecで通信する場合(サーバ管理用の通信の保護等)に使われる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "L2フォワーディング方式", "short": "データリンク層のフレームをトンネリングする方式。", "detail": "IPパケットではなくレイヤ2のフレームそのものをカプセル化して転送する方式で、L2TPなどが該当する。上位のプロトコルに依存せず、拠点間であたかも同一のLANセグメントにいるかのように通信させたい場合に使われる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "GRE", "short": "汎用的なカプセル化トンネリングプロトコル。", "detail": "Generic Routing Encapsulation。IPパケットの中に、IPを含む様々な種類のプロトコルのパケットをそのままカプセル化して運べる、汎用性の高いトンネリングプロトコル。IPヘッダのプロトコル番号47として現れる。GRE自体には暗号化・認証の機能が一切ないため、機密性が必要な場合はIPsecと組み合わせて使う(GRE over IPsec)。マルチキャストやOSPF・EIGRPのような動的ルーティングプロトコルもそのままトンネル越しに流せるという、IPsec単体にはない柔軟性がある。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "GRE over Ipsec", "short": "GREトンネルをIPsecで暗号化する構成。", "detail": "暗号化機能を持たないGREトンネルの上に、さらにIPsec(通常はトランスポートモード)を重ねることで、GREの柔軟性(マルチキャストや動的ルーティングを流せる)を保ちながら、通信内容の暗号化も同時に実現する構成。VPN経由で拠点間の動的ルーティングプロトコルを動かしたい場合の定番の組み合わせ。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "L2TP", "short": "レイヤ2のフレームをトンネリングするプロトコル。", "detail": "Layer 2 Tunneling Protocol。PPPフレームをUDPの1701番ポートでカプセル化して転送する、L2フォワーディング方式のトンネリングプロトコル。PPPの認証・接続管理の仕組みをそのまま利用できる利点がある一方、それ自体には暗号化機能が全くないため、実運用ではIPsecのトランスポートモードと組み合わせて使うL2TP over IPsecがほぼ標準的な使い方になっている。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "L2TP over Ipsec", "short": "L2TPをIPsecで暗号化して安全性を補う構成。", "detail": "暗号化機能を持たないL2TPを、IPsecのトランスポートモードで包むことで暗号化・認証を付加した構成。多くのOS・スマートフォンに標準機能として搭載されているため、追加のクライアントソフトを必要としない手軽なリモートアクセスVPNとして広く使われてきた。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "PPP", "short": "2点間のシリアル接続で使われるデータリンク層プロトコル。", "detail": "Point-to-Point Protocol。ダイヤルアップ接続のようにモデム等を介した1対1のシリアル回線で使われるデータリンク層プロトコル。接続確立時にLCP(リンク制御プロトコル)でパラメータを取り決め、必要ならCHAP等で利用者認証を行い、NCP(ネットワーク制御プロトコル)を通じてIPなどの上位プロトコルを流せるようにする、という段階的な手順で動作する。L2TPやPPPoEの内部でもこのPPPの仕組みがそのまま利用されている。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "トンネリング技術", "word": "PPPoE", "short": "PPPをイーサネット上にカプセル化する規格。", "detail": "PPP over Ethernet。もともとシリアル回線用だったPPPを、ブロードバンド回線(光回線等)で使われるイーサネットフレームの中にカプセル化して伝送できるようにした規格。接続開始時にPADI/PADOといったディスカバリ手順でPPPoEサーバ(アクセスコンセントレータ)を発見し、その上でPPPセッションを開始する。日本の光回線サービスの多くで、認証・接続管理の仕組みとして採用されてきた。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "IPsec", "short": "IP層でパケットの暗号化・認証を行うプロトコル群。", "detail": "Internet Protocol Security。ネットワーク層(IP層)で動作し、上位のTCP/UDPやアプリケーションの種類を問わず、IPで通信するあらゆるトラフィックに対して機密性(暗号化)・完全性(改ざん検知)・送信元認証を提供するプロトコル群の総称。実際の暗号化・認証処理を担うESP/AHと、必要な鍵・パラメータを自動的に取り決めるIKEという、大きく2つの要素から構成される。拠点間VPN(サイト間VPN)の実現方式として最も広く使われている。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "ESP", "short": "IPsecでペイロードの暗号化と認証を行うプロトコル。", "detail": "Encapsulating Security Payload。IPヘッダの後ろにプロトコル番号50として現れる、IPsecの中核プロトコル。ペイロード(トランスポートモードなら上位層データ、トンネルモードなら元のIPパケット全体)を暗号化し、あわせて改ざん検知のための認証データも付与する。機密性と完全性の両方を1つのプロトコルで提供できるため、実運用のIPsec-VPNではAHよりもほぼ必ずこちらが使われる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "AH", "short": "IPsecでパケットの改ざん検知・送信元認証を行うプロトコル。", "detail": "Authentication Header。IPヘッダの後ろにプロトコル番号51として現れる、IPsecのもう一つの中核プロトコル。ペイロードの暗号化(機密性の確保)は行わず、パケットが改ざんされていないこと、正当な送信元から送られたものであることの2点のみを保証する。IPヘッダ自体も認証対象に含められる利点があるが、NAT装置がIPヘッダを書き換えると認証が壊れてしまいNAT環境で正しく機能しないという弱点があるため、実運用ではESPが主に選ばれる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "IPsec SA", "short": "IPsecで暗号化・認証方式を取り決めた論理的な接続関係。", "detail": "Security Association。使用する暗号アルゴリズム、鍵、有効期間(寿命)などのパラメータについて、通信の両者間で合意した一方向の論理的な接続関係。1つのIPsec通信には、送信用と受信用でそれぞれ別のSAが必要になるため、通常2つのSAが対になって存在する。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "SA", "short": "セキュリティアソシエーションの略称。", "detail": "Security Association。IPsecやIKEにおいて、暗号化方式・鍵・有効期間などのパラメータを、通信の両者間であらかじめ合意しておいた論理的な関係。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "SPI", "short": "IPsec SAを識別するための値。", "detail": "Security Parameter Index。ESP/AHヘッダに含まれる32ビットの値で、受信側がそのパケットをどのSA(どんな鍵・アルゴリズムで処理すべきか)に基づいて処理すればよいかを識別するために使われる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "SAD", "short": "確立済みのSA情報を保持するデータベース。", "detail": "Security Association Database。現在有効なすべてのSAについて、対応する鍵、アルゴリズム、寿命といったパラメータを管理しているデータベース。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "SPD", "short": "どの通信にIPsecを適用するか定めたポリシーデータベース。", "detail": "Security Policy Database。通信の送信元・宛先アドレスやプロトコルなどの条件に応じて、その通信にIPsecを適用すべきか(適用するならトンネル/トランスポートのどちらのモードで、ESP/AHのどちらを使うか等)を定義したポリシーの集合。パケットを送受信する際、まずこのSPDを参照して処理方針を決める。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "IKE", "short": "IPsecで使う鍵やSAを自動的にネゴシエーションするプロトコル。", "detail": "Internet Key Exchange。ESP/AHが実際にパケットを暗号化する前に必要な鍵とSAのパラメータを、Diffie-Hellman鍵交換を用いて通信の両端で安全かつ自動的に取り決めるための制御プロトコル。UDPの500番ポート(NAT越え時は4500番も併用)を使う。手動で鍵を設定する運用に比べ、定期的な鍵の自動更新(リキー)ができるなど、運用性と安全性を大きく向上させている。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "IKEv1", "short": "IKEの第1版。", "detail": "フェーズ1(ISAKMP SAの確立)とフェーズ2(実際のIPsec SAの確立)という2段階構成で動作する初期のIKE仕様。フェーズ1にはメインモードとアグレッシブモードという2つの動作方式があり、前者は身元情報を保護しながら6メッセージで、後者は身元情報の保護を犠牲にする代わり3メッセージで完了する。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "IKEv2", "short": "IKEの改良版。", "detail": "IKEv1の複雑だった手順を整理・簡素化し、必要なメッセージ数を削減して高速化したほか、NATトラバーサルへの標準対応や、モバイル環境でIPアドレスが変わっても接続を維持できるMOBIKEといった拡張も取り込まれた、現行のIKE仕様。IKE_SA_INIT交換とIKE_AUTH交換という、より単純な2往復の交換で鍵確立と認証を完了できる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "IKE SA", "short": "IKEネゴシエーションのための論理的な保護関係。", "detail": "IKEプロトコル自身のやり取り(制御メッセージ)を保護するために、最初のステップで確立されるSA。このIKE SAによって保護された安全なチャネルの上で、続く実際のデータ通信用のSA(IPsec SA / Child SA)のネゴシエーションが行われる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "ISAKMP SA", "short": "IKEv1のフェーズ1で確立される制御用SA。", "detail": "Internet Security Association and Key Management Protocol SA。IKEv1のフェーズ1において確立される、鍵交換の枠組み全体とその制御用チャネルを保護するためのSA。IKEv2におけるIKE SAに相当する概念。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "IKE_SA_INIT交換", "short": "IKEv2の最初の鍵交換フェーズ。", "detail": "IKEv2の最初のメッセージ交換段階で、使用する暗号アルゴリズムの提案・合意と、Diffie-Hellman鍵交換による共有鍵の確立を行う。この交換が終わった時点で、以降のメッセージはすべて暗号化・保護された状態でやり取りできるようになる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "IKE_AUTH交換", "short": "IKEv2で相互認証とIPsec SA確立を行うフェーズ。", "detail": "IKE_SA_INIT交換によって既に保護された安全なチャネルの上で行われる、2段階目のメッセージ交換。通信当事者同士の相互認証(証明書や事前共有鍵による)と、実際にデータを保護するためのSA(Child SA)の確立が、この段階でまとめて行われる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "Child SA", "short": "IKEv2で確立される実データ保護用のSA。", "detail": "IKE_AUTH交換の結果として生成される、実際のユーザデータ(ESP/AHで保護される通信内容)を保護するためのSA。IKEv1における(狭義の)IPsec SAに相当する。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "メインモード", "short": "IKEv1フェーズ1で身元を秘匿しつつネゴシエーションする方式。", "detail": "6回のメッセージのやり取りを通じて段階的にパラメータ・鍵を確立し、当事者の身元情報(証明書等)はすべて暗号化された状態でやり取りされる、安全性重視のIKEv1フェーズ1の動作モード。手順が多い分、確立までにやや時間がかかる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "アグレッシブモード", "short": "IKEv1フェーズ1を高速化する代わりに身元を秘匿しないモード。", "detail": "3回のメッセージだけで完了する、メインモードより高速なIKEv1フェーズ1の動作モード。ただし身元情報がまだ暗号化されていない段階で送られてしまうため、メインモードに比べ安全性がやや劣るとされ、特に事前共有鍵を使う構成では総当たり攻撃の材料を与えやすいという指摘がある。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "IPsec-VPN鍵交換", "short": "IKEによる鍵交換全般を指す表現。", "detail": "IPsec通信を実際に開始する前段階として行われる、IKEプロトコルを用いた鍵とSAパラメータの合意プロセス全般を指す表現。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "XAUTH", "short": "IKEv1にユーザ認証機能を追加する拡張。", "detail": "Extended Authentication。IKEv1本来の機器同士の認証(証明書や事前共有鍵によるゲートウェイ同士の認証)に加え、実際に接続している利用者個人を識別するためのユーザ名・パスワード等による追加の認証段階を挿入する拡張。企業のリモートアクセスVPNで、機器認証だけでなく個々の従業員の認証もあわせて行いたい場合に使われる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "NATトラバーサル", "short": "NAT環境でIPsec通信を成立させる技術。", "detail": "NAT-T(NAT Traversal)。NAT装置がIPヘッダやポート番号を書き換えることでESPパケットの整合性が壊れてしまう問題を回避するため、ESPパケットをさらにUDP(通常4500番ポート)でカプセル化するなどの工夫を行い、NAT配下からでもIPsecによるend-to-endの暗号化通信を成立させる技術。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "NAT越え", "short": "NAT環境を越えてEnd-to-End通信を成立させること全般。", "detail": "NAT配下にある端末同士や、NAT配下からの外部接続を、何らかの追加の仕組みによって成立させることの総称。IPsecの文脈ではNATトラバーサル技術がこれにあたる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "IPsec", "word": "IP in IP", "short": "IPパケットをIPでカプセル化する単純なトンネリング方式。", "detail": "元のIPパケット全体を、そのまま新しいIPヘッダで包み込んでカプセル化する、GREなどに比べてさらに単純なトンネリングプロトコル(プロトコル番号4)。モバイル環境での経路制御(モバイルIP)など、限定的な用途で使われる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "SSL", "short": "TLSの前身にあたる旧世代の暗号化プロトコル。", "detail": "Secure Sockets Layer。1990年代にNetscape社が開発した、TCPの上でアプリケーションを問わず通信を暗号化する仕組みの元祖にあたるプロトコル。設計上の脆弱性(POODLE攻撃等)が次々に発見された結果、SSL2.0・3.0はいずれも安全ではないとして使用が禁止されており、事実上その役割はすべて後継のTLSに引き継がれている。慣習的に「SSL通信」「SSL証明書」のようにTLSを指して呼ばれることも多い。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "TLS", "short": "通信の暗号化・認証・完全性を提供するプロトコル。", "detail": "Transport Layer Security。SSLの後継として標準化された、現在主流の暗号化プロトコル。TCP接続の確立後、ハンドシェイクの中で暗号方式の合意・サーバ証明書によるサーバ認証・共通鍵(セッション鍵)の確立を行い、以降の通信をその鍵で暗号化する。上位のアプリケーション(HTTP、SMTP等)はTLSの存在をほぼ意識せずに利用でき、HTTPS(HTTP over TLS)をはじめ数多くのプロトコルの安全性を下支えしている。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "TLS1.2", "short": "広く普及しているTLSのバージョン。", "detail": "AEAD方式の暗号スイート(AES-GCM等)への対応が追加されるなど、旧バージョンより安全性と柔軟性を高めたTLSのバージョン。長らく事実上の標準として広く使われ、現在もTLS1.3への移行が済んでいない多くのシステムで稼働している。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "TLS1.3", "short": "最新かつ高速・高セキュリティなTLSのバージョン。", "detail": "ハンドシェイクに必要な往復回数を従来の2回から1回に削減して接続確立を高速化し、あわせて危殆化した古い暗号アルゴリズムを仕様から排除、前方秘匿性を持つ鍵交換方式を実質必須化するなど、速度と安全性の両面で大幅に改良された最新バージョン。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "TLS通信", "short": "TLSを用いた暗号化通信全般。", "detail": "ハンドシェイクによる鍵交換・サーバ認証(必要ならクライアント認証も)を経たのち、確立された共通鍵で保護されたデータ通信を行う一連のプロセス全体を指す。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "TLSアクセラレーション機能", "short": "TLSの暗号処理を専用ハードウェア等で高速化する機能。", "detail": "TLSの暗号化・復号はCPUに一定の負荷をかけるため、この処理を専用のハードウェアチップやロードバランサに肩代わりさせ、背後のWebサーバ本体はTLSを意識せず平文の処理に専念できるようにする機能。多数のTLS接続をさばく必要がある大規模サイトで、サーバの処理能力を効率よく使うために活用される。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "ハンドシェイク", "short": "通信開始時に行うパラメータ交渉・鍵確立の手順。", "detail": "TLSやIKEなどにおいて、実際のデータのやり取りを始める前に、使用する暗号方式の合意、証明書による相手の認証、そして共通鍵(セッション鍵)の確立を行う、一連の準備手続き。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "ハンドシェイクプロトコル", "short": "ハンドシェイクの手順を規定するプロトコル。", "detail": "TLS仕様の中で、ハンドシェイクの際にやり取りされるメッセージの種類(ClientHello、ServerHello、Certificate等)、その順序、フォーマットを具体的に定めるサブプロトコル。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "Change Cipher Specプロトコル", "short": "以降の通信で暗号化を開始することを通知するTLSのプロトコル。", "detail": "TLSのハンドシェイクが完了する直前に送られる、これ以降のメッセージは合意済みの暗号方式で保護して送る、ということを相手に通知するための非常に短いプロトコル(サブプロトコル)。TLS1.3では手順の簡素化に伴いこのメッセージの実質的な役割は縮小しているが、旧バージョンとの互換性維持のため、形式的に送信されることがある。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "Server Name Indication", "short": "1つのIPで複数ドメインのTLS証明書を使い分ける拡張。", "detail": "SNI。1つのサーバ・1つのIPアドレスで複数の異なるドメインのWebサイトをホスティングしている場合、TLSハンドシェイクの最初の段階(証明書がまだ提示される前)で、クライアントが「接続したいホスト名」を平文で通知することで、サーバ側がそのホスト名に対応した正しい証明書を選んで提示できるようにするTLSの拡張機能。この仕組みがなければ、1つのIPアドレスにつき1つの証明書しか運用できなかった。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "SNI", "short": "Server Name Indicationの略称。", "detail": "1つのIPアドレス上で複数のホスト名・証明書を運用できるようにする、TLSハンドシェイク時の拡張機能。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "ALPN", "short": "TLSハンドシェイク中に上位アプリケーションプロトコルを合意する拡張。", "detail": "Application-Layer Protocol Negotiation。TLSのハンドシェイクメッセージの中に「この後どのアプリケーションプロトコル(HTTP/1.1かHTTP/2か等)を使いたいか」という情報を含めることで、TLS確立後すぐに目的のプロトコルで通信を開始できるようにする拡張。この仕組みがないと、TLS確立後に別途プロトコルを交渉するための往復が必要になり、余計な遅延が生じてしまう。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "SSL/TLS", "word": "暗号スイート", "short": "TLSで使用する暗号アルゴリズムの組み合わせ。", "detail": "鍵交換方式(ECDHE等)、暗号化アルゴリズム(AES-GCM等)、メッセージ認証の方式を、まとめて1つのセットとして定義したもの。TLSハンドシェイクの最初の段階で、クライアントが対応可能な暗号スイートの候補を提示し、サーバがその中から実際に使うものを選択する、という形で合意される。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "リモートアクセス関連", "word": "XAUTH", "short": "IKEv1にユーザ認証機能を追加する拡張。", "detail": "Extended Authentication。IKEv1本来の機器同士の認証(証明書や事前共有鍵によるゲートウェイ同士の認証)に加え、実際に接続している利用者個人を識別するためのユーザ名・パスワード等による追加の認証段階を挿入する拡張。企業のリモートアクセスVPNで、機器認証だけでなく個々の従業員の認証もあわせて行いたい場合に使われる。"}, {"cat": "VPN(IPsec・SSL-VPN・トンネリング)", "group": "リモートアクセス関連", "word": "VPNパススルー", "short": "NATルータ配下でVPN通信を透過させる機能。", "detail": "家庭用のブロードバンドルータなどが持つ、PPTPやIPsecといったVPNプロトコル特有の通信内容を認識し、通常のNAT変換によって内容が壊れてしまわないよう正しく中継するための機能。この機能が無効・非対応のルータ配下では、VPN接続を開始できても途中で通信が確立しない、といったトラブルの原因になりやすい。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証モデル基本", "word": "AAAモデル", "short": "認証・認可・課金の3機能をまとめた概念。", "detail": "Authentication(認証:相手が誰か確認する)、Authorization(認可:何をしてよいか決める)、Accounting(課金・記録:何をしたか記録する)という3つの機能をひとまとめにした、アクセス管理の基本的な枠組み。RADIUSやTACACS+のようなAAAサーバが、この3機能を集中的に提供する役割を担う。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証モデル基本", "word": "認証", "short": "通信相手や利用者が主張する身元を確認すること。", "detail": "パスワード、証明書、生体情報、ワンタイムパスワードなど、様々な手段を用いて、相手が確かに本人・正当な機器であることを検証するプロセス全般。認証の後に「その相手に何を許可するか」を決める認可(Authorization)という別のステップが続くのが一般的。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証モデル基本", "word": "認証局", "short": "デジタル証明書を発行し正当性を保証する機関。", "detail": "CA(Certificate Authority)。申請者の身元確認を行ったうえで、その公開鍵と身元情報を結びつけたデジタル証明書に自らの署名を付与して発行する、信頼された第三者機関。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証モデル基本", "word": "認証機能", "short": "認証を実現するための機能全般。", "detail": "IEEE802.1XやRADIUSといった仕組みを通じて、システムが利用者・機器の正当性確認を実施する機能を指す総称。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証モデル基本", "word": "認証と接続の手順", "short": "認証プロセスと接続確立までの一連の流れ。", "detail": "認証要求の送信、認証サーバでの判定、その結果に基づく接続の許可・拒否、そして正式な通信路の確立までの一連の流れ全体を指す一般的な表現。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証モデル基本", "word": "認証プロトコル", "short": "認証のやり取りを規定するプロトコル。", "detail": "PAP、CHAP、EAPなど、認証情報をどのようなメッセージのやり取りで確認し合うかを定めたプロトコルの総称。単純に平文でパスワードを送るだけの方式から、チャレンジ・レスポンスによってパスワード自体を送らずに済む方式まで、安全性のレベルは様々。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証モデル基本", "word": "認証方式", "short": "認証を行う具体的な手法の分類。", "detail": "パスワード認証(知識情報)、証明書認証(所持情報)、生体認証(生体情報)など、どのような種類の情報・手段に基づいて本人確認を行うかによる分類。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証モデル基本", "word": "認証鍵", "short": "認証処理に使用される鍵。", "detail": "HMACのようなメッセージ認証コードの生成に使われる鍵や、IKEにおける事前共有鍵のように、認証を目的として使われる鍵全般を指す。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証モデル基本", "word": "認証付き暗号", "short": "暗号化とメッセージ認証を組み合わせた仕組み。", "detail": "AEADに代表される、機密性(暗号化)の確保と完全性・認証(改ざん検知)の確保を同時に提供する暗号方式の総称。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証要素", "word": "パスワード認証", "short": "知識情報(パスワード)による本人確認方式。", "detail": "利用者本人だけが記憶しているはずの秘密の文字列(パスワード)を照合することで本人確認を行う、最も普及している認証方式。手軽である反面、使い回しや推測されやすい単純なパスワードの利用、フィッシングによる詐取など、様々なリスクを抱えている。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証要素", "word": "ワンタイムパスワード認証", "short": "毎回異なる使い捨てパスワードによる認証方式。", "detail": "OTP。専用のトークン機器やスマートフォンアプリが、時刻や前回の値を基に一定時間ごとに新しいパスワードを生成し、そのときだけ有効な使い捨てのパスワードを使って認証を行う方式。仮に通信を盗聴されてパスワードが漏れても、既に無効になっているためそのまま再利用される心配が少なく、固定パスワードより安全性が高い。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証要素", "word": "バイオメトリクス認証", "short": "指紋や虹彩等の身体的特徴による認証方式。", "detail": "生体認証。指紋、顔、虹彩、静脈といった、本人固有かつ他人と共有されにくい身体的特徴を用いて認証する方式。パスワードのように忘れたり他人に教えたりすることができない反面、身体的特徴自体は基本的に変更できないため、万一情報が漏洩した場合の対応が難しいという特有の課題がある。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証要素", "word": "ICカード認証", "short": "ICカードを用いた所持情報による認証方式。", "detail": "ICチップ内に格納された秘密鍵や証明書を用い、そのカードを物理的に所持していることを根拠に本人確認を行う認証方式。社員証を兼ねた入退室・PC認証用ICカードなどで広く使われている。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証要素", "word": "二要素認証", "short": "異なる2種類の要素を組み合わせる認証方式。", "detail": "知識情報(パスワード)、所持情報(トークン、スマートフォン)、生体情報(指紋等)という3つの認証要素のカテゴリのうち、異なる2種類を組み合わせて行う認証。片方の要素だけが漏洩しても不正ログインを防げるため、単一要素の認証よりも安全性が高いとされる。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証要素", "word": "発信者番号通知/コールバック認証", "short": "電話番号や折り返し発信による認証方式。", "detail": "発信者番号(ナンバーディスプレイ)を確認する方式や、あらかじめ登録された電話番号へシステム側から折り返し発信することで、正当な利用者からのアクセスであることを確認する認証方式。古くからあるダイヤルアップ接続のセキュリティ対策として使われてきた。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証要素", "word": "主体認証", "short": "通信・操作を行う主体(利用者や機器)自体を確認すること。", "detail": "メッセージの内容そのものではなく、それを送信・操作している主体(人や機器)が誰であるかを確認するという、認証の一分類。エンティティ認証とほぼ同じ意味で使われる。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "認証要素", "word": "メッセージ認証", "short": "受信したメッセージが正当な送信元からの改ざんされていないものであることを確認すること。", "detail": "メッセージ認証コード(MAC)やデジタル署名を用いて、通信内容そのものの完全性(改ざんされていないこと)と、正当な送信元から送られたものであること(送信元の認証)を確認するという、認証の一分類。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "802.1X・EAP", "word": "IEEE802.1X", "short": "ポートベースの利用者・機器認証を行う標準規格。", "detail": "スイッチのポートや無線LANの接続単位(論理ポート)ごとに、接続してきた利用者・機器の認証が完了するまで通信を一切許可しない仕組みを定めたIEEEの標準規格。認証を要求する端末(サプリカント)、認証の窓口となるスイッチ・AP(オーセンティケータ)、実際の判定を行う認証サーバ(RADIUS等)という3者で構成され、サプリカントとオーセンティケータ間の実際の認証情報のやり取りにはEAPが使われる。有線LANのポートセキュリティや、無線LANのエンタープライズモードの基盤技術になっている。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "802.1X・EAP", "word": "EAP", "short": "様々な認証方式を統一的に扱う拡張認証プロトコル。", "detail": "Extensible Authentication Protocol。特定の認証方式に依存しない「入れ物」だけを提供するプロトコルで、実際の認証の中身(パスワードを使うのか、証明書を使うのか等)はEAP-TLSやEAP-PEAPといった具体的な方式(EAPメソッド)として自由に選べる。もともとPPPの認証手段として設計されたが、現在はIEEE802.1Xと組み合わせて、有線・無線LANの利用者認証に広く使われている。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "802.1X・EAP", "word": "EAP-TLS", "short": "証明書ベースの相互認証を行うEAP方式。", "detail": "サーバ側・クライアント側の双方がデジタル証明書を提示し合い、TLSの仕組みを使って相互に認証を行うEAPメソッド。パスワードを一切ネットワーク上に流さないため非常に強固な安全性を持つ一方、全端末に個別の証明書を発行・配布・更新する必要があり、PKI基盤の構築・運用コストが大きいという課題がある。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "802.1X・EAP", "word": "EAP-PEAP", "short": "サーバ証明書のみでTLSトンネルを張り内部で認証するEAP方式。", "detail": "Protected EAP。まずサーバ側の証明書だけを使ってTLSの暗号化トンネルを確立し、そのトンネルの中でパスワードベースの認証(MSCHAPv2等)を安全に行う、というEAPメソッド。クライアント側に証明書を配布する必要がないため、EAP-TLSに比べて導入・運用のハードルが低く、企業の無線LAN認証で広く採用されている。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "802.1X・EAP", "word": "PEAP", "short": "EAP-PEAPの略称。", "detail": "Protected EAP。サーバ証明書によるTLSトンネルの中で、パスワードベースの利用者認証を安全に行うEAPメソッド。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "802.1X・EAP", "word": "サプリカント", "short": "802.1X認証を要求するクライアント側ソフトウェア。", "detail": "認証を受ける側の端末上で動作し、EAPのメッセージをオーセンティケータ(スイッチやAP)経由で認証サーバへ送り、認証を要求する役割を持つソフトウェア。多くのOSに標準機能として組み込まれている。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "802.1X・EAP", "word": "オーセンティケータ", "short": "802.1X認証における認証仲介役の機器。", "detail": "サプリカント(端末)と認証サーバ(RADIUS等)の間に位置し、認証が完了するまでそのポートの通常の通信(EAP以外のトラフィック)を一切遮断する役割を持つスイッチやAP。認証成功の通知を受け取った時点で、初めてそのポートを通常の通信のために開放する。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "802.1X・EAP", "word": "利用者認証方式", "short": "IEEE802.1Xで採用される、個々の利用者を識別する認証方式。", "detail": "無線LANのエンタープライズモードや有線LANのIEEE802.1Xにおいて、端末単位・利用者単位で個別のID・パスワードや証明書を用いて認証を行う方式。全端末が同じ鍵を共有するパーソナルモードと対比される。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "RADIUS", "word": "RADIUS", "short": "AAA機能を提供する代表的な認証プロトコル。", "detail": "Remote Authentication Dial In User Service。認証(Authentication)・認可(Authorization)・課金(Accounting)の情報を、認証を求められる側の機器(NAS。無線LANのAP、VPN装置、802.1X対応スイッチ等)と、中央で一元管理する認証サーバとの間でやり取りするためのプロトコル。UDPの1812番(認証・認可)/1813番(課金)ポートを使う。多数の機器・利用者のアカウント情報を1箇所に集約して管理できるため、大規模な組織での認証基盤として広く採用されている。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "RADIUS", "word": "認証局(RADIUS文脈)", "short": "(重複整理用の見出し)", "detail": "このシートでは認証局はPKI・証明書グループにも記載している。RADIUS自体は証明書発行機能を持たず、必要であれば別途PKI(認証局)と連携してEAP-TLS等の証明書ベース認証を行う。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "RADIUS", "word": "AAAサーバ", "short": "認証・認可・課金を一元的に提供するサーバ。", "detail": "RADIUSサーバなどが該当する、複数の機器・利用者に対しAAAの3機能(認証・認可・課金)を集中的に提供するサーバの総称。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "ハンドシェイク・認証プロトコル(その他)", "word": "CHAP", "short": "チャレンジ・レスポンス方式によるPPP認証プロトコル。", "detail": "Challenge Handshake Authentication Protocol。PPP接続における認証方式の一つで、認証する側が送るランダムな値(チャレンジ)に対し、認証される側がパスワードと組み合わせてハッシュ計算した結果(レスポンス)だけを返す。パスワードそのものをネットワーク上に流さないため、単純に平文でパスワードを送るPAPより安全性が高い。毎回異なるチャレンジが使われるため、通信を盗聴されて同じレスポンスを再利用しても(リプレイ攻撃)認証は通らない。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "ハンドシェイク・認証プロトコル(その他)", "word": "チャレンジ/レスポンス方式", "short": "一時的な問い(チャレンジ)への応答で認証する方式。", "detail": "認証のたびに異なるランダムな問い合わせ(チャレンジ)を提示し、それに対する正しい応答(レスポンス)を返せるかどうかで本人確認を行う方式。パスワード自体を直接やり取りしないため盗聴に強く、また過去のやり取りをそのまま再利用するリプレイ攻撃にも強いという利点がある。CHAPやワンタイムパスワードの一部の実装がこの考え方を採用している。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "ハンドシェイク・認証プロトコル(その他)", "word": "ハンドシェーク方式(記載ゆらぎ)", "short": "ハンドシェイクの表記ゆらぎ。", "detail": "索引上「ハンドシェーク」と長音符号ありで表記される場合があるが、内容としてはTLSやEAP、CHAPなどにおける手続き(パラメータ交渉・鍵確立・認証)と同じものを指す。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "ハンドシェイク・認証プロトコル(その他)", "word": "スリーウェイハンドシェーク", "short": "3回のやり取りで接続を確立する手順。", "detail": "TCPコネクション確立時のSYN→SYN/ACK→ACKという3回のセグメントのやり取りに代表される、双方が3回の往復メッセージによって合意・接続確立に至る手順の総称。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "ハンドシェイク・認証プロトコル(その他)", "word": "バックドア", "short": "正規の認証を経ずにシステムへアクセスできる裏口。", "detail": "本来通るべき正規の認証機構を迂回して、システムへのアクセスを可能にしてしまう、意図的または悪意によって仕込まれた抜け道。開発者が保守用に残した意図的な裏口が、後に悪用されるケースもある。"}, {"cat": "認証(EAP・RADIUS・802.1X)", "group": "ハンドシェイク・認証プロトコル(その他)", "word": "踏み台", "short": "攻撃者が別の攻撃の中継地点として悪用する機器。", "detail": "既に不正アクセスや乗っ取りを受けた機器を経由して、さらに別の標的への攻撃を仕掛けることで、攻撃元の本当の所在地の追跡を困難にする手法において、経由地点として利用される機器。オープンリゾルバなど設定不備のあるサーバも、この踏み台として悪用されることがある。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(フラッド系)", "word": "DoS攻撃", "short": "サービス提供を妨害することを目的とした攻撃。", "detail": "Denial of Service。大量の通信を送りつけたり、特殊な形式のパケットを送ったりすることで、対象のサーバやネットワーク機器のリソース(帯域、CPU、メモリ、接続管理テーブル等)を枯渇させ、正規の利用者へのサービス提供を妨げることを目的とした攻撃全般の総称。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(フラッド系)", "word": "分散型DoS攻撃", "short": "多数の踏み台から一斉にDoS攻撃を行う手法。", "detail": "DDoS。マルウェアに感染させた多数の端末(ボットネット)など、複数の攻撃元から同時に標的へ大量の通信を送りつける攻撃。単一の攻撃元からのDoS攻撃であれば送信元IPアドレスを遮断するだけで対処できることが多いが、攻撃元が無数に分散しているため、遮断対象を絞りにくく対処が格段に難しくなる。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(フラッド系)", "word": "SYNフラッド攻撃", "short": "大量のSYNパケットで接続待ちリソースを枯渇させる攻撃。", "detail": "TCPの3ウェイハンドシェイクにおいて、SYN/ACKへの最後のACKをわざと返さず、大量のSYNパケットだけを送りつけることで、サーバ側に「接続確立待ち(ハーフオープン)」状態のコネクションを大量に作らせ、接続管理用のメモリやテーブルを枯渇させて新規の正規接続を受け付けられなくする攻撃。送信元IPアドレスを詐称して送られることが多く、単純な送信元遮断では対処しにくい。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(フラッド系)", "word": "UDPフラッド攻撃", "short": "大量のUDPパケットで帯域・処理能力を消費させる攻撃。", "detail": "コネクションレスで事前のハンドシェイクを必要としないUDPの特性を悪用し、大量のUDPパケットを送りつけることで、回線帯域や受信側の処理能力を圧迫する攻撃。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(フラッド系)", "word": "ICMPフラッド攻撃", "short": "大量のICMPパケットで帯域・処理能力を消費させる攻撃。", "detail": "pingで使われるICMP Echo Requestなどのパケットを大量に送りつけることで、回線帯域やホストの処理能力を圧迫する攻撃。「Ping flood」とも呼ばれる。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(反射・増幅系)", "word": "DNS Amp攻撃", "short": "DNSを悪用した反射・増幅型のDoS攻撃。", "detail": "送信元アドレスを標的のIPアドレスに偽装した小さなDNS問い合わせを大量に送ると、DNSサーバはその何倍ものサイズの応答を(偽装された)標的へ返してしまう。この性質を悪用し、攻撃者の少ない帯域から標的に大量のトラフィックを送りつける、反射・増幅型のDoS攻撃。オープンリゾルバがこの攻撃の踏み台として悪用されやすいため、外部からの問い合わせを制限することが対策の基本となる。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(反射・増幅系)", "word": "DNSリフレクタ攻撃", "short": "送信元を詐称しDNSサーバを踏み台にする攻撃全般。", "detail": "攻撃者が標的のIPアドレスを送信元として偽装した問い合わせをDNSサーバへ送り、その応答が標的に届くようにする攻撃手法の総称。DNS Amp攻撃はこの一種で、応答が問い合わせより大きくなる性質を組み合わせたものにあたる。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(なりすまし・中間者)", "word": "MITM攻撃", "short": "通信の当事者になりすまし内容を盗聴・改ざんする攻撃。", "detail": "Man-In-The-Middle攻撃。通信経路の途中に第三者が入り込み、通信の両当事者それぞれに対して相手であるかのように振る舞うことで、内容を盗聴・改ざんする攻撃。ARPスプーフィングによるLAN内での割り込みや、偽の公衆Wi-Fi APを設置して通信を経由させる手法などが代表例。TLSによるサーバ認証はこの種の攻撃を検知・防止するための重要な対策になる。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(なりすまし・中間者)", "word": "中間者攻撃", "short": "MITM攻撃の日本語表記。", "detail": "通信の間に第三者が割り込み、当事者に気づかれないまま内容を盗聴・改変する攻撃の日本語での呼び方。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(なりすまし・中間者)", "word": "DNSキャッシュ汚染", "short": "キャッシュサーバに偽の名前解決結果を注入する攻撃。", "detail": "DNSキャッシュポイズニングとも呼ばれる、キャッシュDNSサーバに偽の名前解決結果を記憶させることで、正規のドメイン名でアクセスしてきた利用者を攻撃者の用意した偽サイトへ誘導する攻撃。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(なりすまし・中間者)", "word": "DNSキャッシュポイズニング", "short": "DNSキャッシュ汚染の別称。", "detail": "キャッシュDNSサーバに不正な名前解決結果を記憶させ、正規のドメイン名でも攻撃者が用意したIPアドレスへ誘導してしまう攻撃の別名。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "攻撃手法(なりすまし・中間者)", "word": "リプレイ攻撃", "short": "過去に取得した正規の通信データを再利用する攻撃。", "detail": "盗聴によって取得した、過去に実際に使われた正規の認証情報や通信データを、そのまま(あるいはそのまま再送する形で)再利用することで、正当な認証を通過しようとする攻撃。認証のたびに毎回異なる値を使うチャレンジ/レスポンス方式や、通信ごとに変化する初期化ベクトル・シーケンス番号を使う仕組みは、いずれもこの攻撃への対策として機能している。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "脆弱性・侵入", "word": "公開サーバの脆弱性", "short": "インターネットに公開されたサーバが持つ弱点。", "detail": "外部から自由にアクセス可能なサーバが持つ、セキュリティパッチの未適用や、設定不備(不要なサービスの稼働、デフォルトパスワードの放置等)によって、攻撃者に悪用され得る弱点全般。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "脆弱性・侵入", "word": "コネクションレス型通信の脆弱性", "short": "状態管理をしない通信方式特有の弱点。", "detail": "UDPのように、通信相手の正当性を事前に確認する仕組みを持たないコネクションレス型の通信は、送信元アドレスの詐称による攻撃(DoS攻撃、リフレクタ攻撃等)を受けやすいという性質上の弱点を抱えている。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "脆弱性・侵入", "word": "さらし端末問題", "short": "無線LAN等で自分の電波が他端末の通信を阻害してしまう問題。", "detail": "隠れ端末問題とは逆の現象で、実際には電波が干渉して衝突するわけではない距離にある端末同士でも、キャリアセンスによってお互いに「相手が送信中だ」と検知してしまい、必要以上に送信を控えてしまうために、本来使えるはずの帯域が有効活用できず実効スループットが低下してしまう問題。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "脆弱性・侵入", "word": "ゼロデイ(記載なしのため一般知識で補足)", "short": "修正パッチが存在しない未知の脆弱性を突く攻撃。", "detail": "本索引には明記されていないが、頻出する関連知識として補足する。ベンダーがまだ把握・公表しておらず、したがって修正パッチも存在しない脆弱性を悪用する攻撃。防御側が対策を打つ手段がほぼない状態で行われるため、シグネチャベースの検知だけでなく、振る舞い(アノマリ)ベースの検知が重要になる。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "IDS", "short": "不正な通信・侵入の兆候を検知するシステム。", "detail": "Intrusion Detection System。既知の攻撃パターン(シグネチャ)との照合や、平常時とは異なる通信の振る舞い(アノマリ)の検知によって、不正アクセスやその兆候を発見し、管理者に通知するシステム。検知はするが、通信を自動的に遮断する機能は基本的に持たない(検知して知らせるだけ)点がIPSとの違い。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "IPS", "short": "不正な通信を検知しリアルタイムで遮断するシステム。", "detail": "Intrusion Prevention System。IDSの検知機能に加え、検知した不正な通信をその場でリアルタイムに遮断する防御機能まで備えたシステム。通信経路上に直列に設置(インライン配置)され、通過する全トラフィックを検査対象とすることで、遮断までを自動化している。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "侵入検知システム", "short": "IDSの日本語表記。", "detail": "ネットワークやホスト上で発生する不正な活動・侵入の兆候を検知し、管理者へアラートとして通知するシステム。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "侵入防御システム", "short": "IPSの日本語表記。", "detail": "不正な通信を検知した際に、通知だけでなくリアルタイムでの遮断まで自動的に行うシステム。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "シグネチャ型", "short": "既知の攻撃パターンと照合して検知する方式。", "detail": "既知の攻撃手法が持つ特徴的なパターン(シグネチャ)をあらかじめデータベース化しておき、通過する通信の内容とこれを照合することで検知する方式。既知の攻撃には高い精度で対応できるが、シグネチャが存在しない未知の攻撃(ゼロデイ攻撃等)は原理的に検知できないという弱点がある。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "アノマリ型", "short": "通常と異なる異常な挙動を検知する方式。", "detail": "あらかじめ学習した平常時の通信パターン(ベースライン)からの逸脱を検知することで、シグネチャデータベースに存在しない未知の攻撃も検出しようとする方式。シグネチャ型を補完する検知手法として組み合わせて使われることが多いが、平常時のパターン自体が変化しやすい環境では誤検知(フォールスポジティブ)が増えやすいという課題もある。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "ホスト型", "short": "監視対象のホスト自体にエージェントを導入する検知方式。", "detail": "HIDS。サーバやパソコンなど、個々のホストにインストールされたエージェントソフトが、そのホスト上でのファイル改ざん・プロセスの異常な起動といった活動を監視するIDS/IPSの形態。暗号化された通信であっても、復号後のホスト内部の挙動として検知できる利点がある。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "ネットワーク型IDS", "short": "ネットワーク経路上の通信を監視する検知方式。", "detail": "NIDS。特定のネットワークセグメントを流れる通信全体を、ミラーポート等を通じて取得し、そこから不正な通信パターンを検知するIDSの形態。1台の設置で広い範囲を監視できる利点があるが、暗号化された通信の中身までは検査できないという制約がある。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "ミラーポート", "short": "スイッチの特定ポートの通信を別ポートへ複製する機能。", "detail": "監視・分析用の機器がネットワーク上の通信をそのまま把握できるよう、あるポート(またはVLAN)を流れる通信内容を、別の指定したポートへコピーして送り出す機能(SPANポートとも呼ばれる)。IDSやパケットキャプチャ装置は、このミラーポートに接続することで、実際の通信の流れを妨げることなく内容を監視できる。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "ミラーリング", "short": "ミラーポート機能によりトラフィックを複製する処理。", "detail": "監視・分析のために、特定の通信を別のポートへそのまま複製して転送する処理そのものを指す。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "フォールスポジティブ", "short": "正常な通信を誤って攻撃と判定してしまう誤検知。", "detail": "過剰検知。実際には問題のない正当な通信を、IDS/IPSが誤って不正な通信と判定してしまう現象。IPSがこれを遮断してしまうと、正規の業務通信が意図せず止まってしまうという実害につながるため、検知精度(誤検知率)の調整が運用上重要になる。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "検知・防御システム", "word": "フォールスネガティブ", "short": "実際の攻撃を見逃してしまう検知漏れ。", "detail": "検知漏れ。実際に発生している不正な通信を、IDS/IPSが検知できずに見逃してしまう現象。シグネチャに存在しない未知の攻撃(ゼロデイ攻撃等)では、このフォールスネガティブが起こりやすい。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "FW", "short": "不正な通信を制御・遮断する境界防御装置。", "detail": "ファイアウォールの略称。あらかじめ定めたルール(送信元・宛先・ポート番号等の組み合わせ)に基づき、通過させてよい通信・遮断すべき通信を判定・制御する装置。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "ファイアウォール", "short": "FWの日本語表記。", "detail": "内部ネットワークと外部ネットワークの境界に設置され、あらかじめ定義したルールに従って通信を許可・拒否する、最も基本的なネットワークセキュリティ機器。単純なパケットフィルタリング型から、セッション状態を管理するステートフルインスペクション型、アプリケーション層まで解析するアプリケーションレベルゲートウェイ型まで、様々な世代・方式が存在する。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "パケットフィルタリング", "short": "パケットのヘッダ情報に基づき通過可否を判定する方式。", "detail": "送信元/宛先IPアドレス、ポート番号、プロトコル種別といったIP・TCP/UDPヘッダの情報だけを見て、あらかじめ定めたルールに沿って通過・遮断を決める、最も基本的なファイアウォールの方式。ヘッダ情報しか見ないため処理は高速だが、通信の文脈(セッションの状態)を考慮できず、より高度な攻撃には対応しにくい。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "フィルタリング", "short": "ルールに基づき通信の可否を判定・制御すること。", "detail": "パケットフィルタリングやURLフィルタリングなど、あらかじめ定めた条件に応じて通信の通過・遮断を判定する処理全般を指す総称。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "アドミッション制御", "short": "一定の条件を満たす通信のみ受け入れる制御。", "detail": "帯域の空き状況、優先度、認証状態といった条件をもとに、新規に発生するセッションを受け入れるかどうかを制御する仕組み。VoIPのように品質確保が重要な通信で、既存の通話品質を守るために新規の通話受け入れを制限する、といった用途で使われる。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "アプリケーションレベルゲートウェイ", "short": "アプリケーション層まで解析して中継するFW方式。", "detail": "ALG。パケットのヘッダ情報だけでなく、アプリケーション層のデータ内容(HTTPのURLやFTPのコマンド等)まで解釈・解析したうえで中継・制御を行う、プロキシ型とも呼ばれるファイアウォールの方式。より高度な検査が可能な反面、対応するアプリケーションプロトコルごとに解析ロジックを実装する必要があり、処理負荷も大きくなる。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "ステートフルインスペクション", "short": "通信の状態(セッション)を管理しながら制御するFW方式。", "detail": "単純なパケットフィルタリングが個々のパケットだけを独立して判定するのに対し、コネクションの確立状況(3ウェイハンドシェイクの状態等)をステートテーブルとして保持・追跡し、その通信の文脈に沿った形でパケットの通過を判断する、より高度なファイアウォールの方式。例えば、内側から開始された通信への応答パケットだけを自動的に通す、といった柔軟な制御が可能になる。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "ステートフル", "short": "状態を保持・追跡しながら処理を行う性質。", "detail": "セッションの確立状況など、通信の前後関係(文脈情報)を保持し、それに基づいて判断を行う仕組みの性質。ステートフルインスペクション型FWなどがこの性質を持つ。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "ステートフルフェールオーバー機能", "short": "FWの障害時にセッション状態を引き継ぐ機能。", "detail": "冗長化されたファイアウォールのペア間で、現在確立中の全セッションの状態(ステートテーブル)を常時同期させておくことで、片方に障害が発生した際、もう片方が既存の通信を切断せずそのまま引き継いで処理を継続できるようにする機能。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "ステートレス", "short": "状態を保持せず各パケットを独立に処理する性質。", "detail": "前後の通信の文脈を一切保持せず、個々のパケット・リクエストをそれぞれ完全に独立したものとして処理する方式の性質。単純なパケットフィルタリング型FWや、HTTP自体の基本設計がこの性質を持つ。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "ファイアウォール・フィルタリング", "word": "ミドルボックス", "short": "通信経路上に存在しパケットを加工・制御する中間機器の総称。", "detail": "ファイアウォール、NAT機器、ロードバランサ、WAN高速化装置など、送信元と宛先の間(エンドツーエンド)の通信経路上に介在し、パケットに何らかの処理(遮断、変換、最適化等)を加える機器全般の総称。エンドツーエンドの原則(経路上の機器は中身に手を加えないという設計思想)からは外れた存在であり、時に通信の互換性トラブルの原因にもなる。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "セキュリティスキャン・侵入テスト", "word": "侵入検知システム", "short": "IDSの日本語表記。", "detail": "ネットワークやホスト上で発生する不正な活動・侵入の兆候を検知し、管理者へアラートとして通知するシステム。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "セキュリティスキャン・侵入テスト", "word": "ペネトレーションテスト", "short": "実際に攻撃を試みてシステムの弱点を検証する試験。", "detail": "侵入テスト。許可を得た専門家が実際の攻撃者と同じ視点・手法でシステムへの侵入を試みることで、机上の脆弱性診断だけでは見つからない、実際に悪用可能な弱点を実践的に洗い出す手法。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "セキュリティスキャン・侵入テスト", "word": "スキャン", "short": "対象のポートや脆弱性を機械的に調査すること。", "detail": "対象のホストに対し、開いているポートの有無や、稼働しているサービスの既知の脆弱性を、専用ツールを用いて網羅的に調べる行為。管理者によるセキュリティ診断としても、攻撃者による事前調査(偵察)としても、同じ技術が使われる。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "セキュリティスキャン・侵入テスト", "word": "Webトラフィックのスキャン", "short": "Web通信内容を検査し脅威を検出すること。", "detail": "プロキシやセキュリティ製品がHTTP/HTTPS通信の内容を解析し、マルウェアのダウンロードや不正な通信パターンを検出する処理。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "セキュリティスキャン・侵入テスト", "word": "メールのスキャン", "short": "受信メールの内容を検査しウイルス・迷惑メールを検知すること。", "detail": "添付ファイルや本文の内容をパターン照合等で検査し、脅威や迷惑メールを検出・隔離する処理。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "セキュリティスキャン・侵入テスト", "word": "ウイルス対策", "short": "マルウェア感染を防止・検知・除去する対策全般。", "detail": "アンチウイルスソフトの導入、パターンファイル(シグネチャ)の定期更新、不審な挙動の監視など、コンピュータウイルスをはじめとするマルウェアによる被害を防ぐための施策全般。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "セキュリティスキャン・侵入テスト", "word": "ステルス化", "short": "攻撃活動を検知されにくくする隠蔽手法。", "detail": "マルウェアや攻撃者が、セキュリティ製品による検知やログの記録から自身の存在・活動をできるだけ隠そうとする手法。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "セキュリティスキャン・侵入テスト", "word": "ステルス機能", "short": "ステルス化を実現する機能。", "detail": "プロセスの隠蔽や通信の偽装など、検知を回避するためにマルウェア等が備える機能。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "その他セキュリティ用語", "word": "出口対策", "short": "内部から外部への不正通信を検知・遮断する対策。", "detail": "侵入を完全には防ぎきれないという前提に立ち、万一内部に侵入・感染したマルウェアが外部の攻撃者(C2サーバ)と通信しようとする段階で、それを検知・遮断する多層防御の考え方。入口対策だけに頼らず出口も固めることで、被害の拡大や情報の外部流出を食い止めることを狙う。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "その他セキュリティ用語", "word": "入口対策", "short": "外部から内部への侵入を防ぐ対策。", "detail": "ファイアウォールやIPSなど、外部からの不正アクセス・侵入の試みを水際で防ぐための対策の総称。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "その他セキュリティ用語", "word": "セキュリティポリシー", "short": "組織のセキュリティに関する方針・ルール。", "detail": "組織として何をどう守るのか、利用者にどのような行動を許可・禁止するのかを明文化した、情報セキュリティ対策全体の基本方針を定める文書。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "その他セキュリティ用語", "word": "セキュリティプロトコル", "short": "通信の安全性を確保するために使われるプロトコル群。", "detail": "TLS、IPsecなど、機密性・完全性・認証といった安全性の要素を通信に提供するために設計されたプロトコルの総称。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "その他セキュリティ用語", "word": "情報セキュリティポリシー", "short": "情報資産保護に関する組織の方針体系。", "detail": "多くの場合、最上位の「基本方針」、それを具体化する「対策基準」、さらに実務レベルの手順を定めた「実施手順」という3階層で構成される、組織の情報資産保護に関するルール全体の体系。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "その他セキュリティ用語", "word": "なりすまし防止", "short": "第三者による身元の詐称を防ぐこと。", "detail": "デジタル署名や送信ドメイン認証(SPF/DKIM等)といった技術により、送信者や利用者が本人であることを保証し、第三者による身元の詐称を防止するための取り組み全般。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "その他セキュリティ用語", "word": "否認防止", "short": "送信の事実を後から否定できないようにする性質。", "detail": "デジタル署名等の技術によって、送信者が後から「自分はそれを送っていない」と主張することを技術的に防止する性質。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "その他セキュリティ用語", "word": "UTM", "short": "複数のセキュリティ機能を1台に統合した装置。", "detail": "Unified Threat Management。ファイアウォール、IPS/IDS、アンチウイルス、URLフィルタリング、アンチスパムといった複数のセキュリティ機能を1台の装置に統合した製品。個別に機器を導入・管理するより導入・運用コストを抑えられ、中小規模の拠点で特によく採用される。"}, {"cat": "セキュリティ攻撃・対策(IDS・IPS・FW等)", "group": "その他セキュリティ用語", "word": "不正アタック対策", "short": "不正アクセス・攻撃全般への対策の総称。", "detail": "ファイアウォール、IDS/IPS、認証の強化など、様々な種類の攻撃手法に対して講じられる防御施策全体を指す包括的な表現。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "冗長化基本", "word": "冗長化", "short": "故障に備え予備の経路・機器を用意し可用性を高めること。", "detail": "システムを構成するあらゆる要素(機器、回線、電源など)について、単一の障害箇所がシステム全体の停止に直結しないよう、あらかじめ予備を用意しておく設計手法全般。可用性(システムが継続して使える度合い)を高めるための最も基本的な考え方であり、その実現方式は待機系を用意するアクティブ/スタンバイ方式や、複数系統を同時稼働させるアクティブ/アクティブ方式など様々ある。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "冗長化基本", "word": "NICの冗長化", "short": "NICの故障に備えて予備回線・予備NICを用意する構成。", "detail": "サーバに搭載する複数のNICを、アクティブ/スタンバイ方式(片方だけ普段使い、故障時にもう片方へ切替)やアクティブ/アクティブ方式(両方同時使用)で構成し、1枚のNICやそこに繋がるケーブル・スイッチが故障しても通信が止まらないようにする対策。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "冗長化基本", "word": "NICチーミング", "short": "サーバの複数NICを束ねて冗長化・帯域拡張する技術。", "detail": "OS・ドライバレベルで複数の物理NICを論理的に1つにまとめる技術。冗長化(可用性向上)とリンクアグリゲーションによる帯域拡張(性能向上)の両方の目的で利用される。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "冗長化基本", "word": "ルータの冗長化", "short": "ルータ障害に備え予備ルータを用意する構成。", "detail": "VRRPなどのプロトコルを用い、通常使う主系ルータに障害が発生した際、予備のルータへ自動的にデフォルトゲートウェイの役割を引き継がせる構成。エンドホスト側の設定(デフォルトゲートウェイのアドレス)を変更する必要がない形で切り替えられる点が実用上重要。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "冗長化基本", "word": "サーバの冗長化", "short": "サーバ障害に備え複数台構成にすること。", "detail": "クラスタリングや、ロードバランサ配下に複数台のサーバを並べる構成により、1台のサーバに障害が発生してもサービス全体としては継続提供できるようにする対策。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "冗長化基本", "word": "インターネット接続回線の冗長化", "short": "複数の回線・ISPを用意し接続断に備える構成。", "detail": "契約している1つの通信事業者・1本の物理回線に依存しないよう、複数のインターネット接続経路(異なる事業者、異なる経路の回線)を確保しておく対策。片方の回線・事業者に障害が起きても、もう片方経由でインターネットへの接続を維持できる。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "冗長化基本", "word": "マルチホーミング", "short": "複数の接続先(ISP等)を同時に利用する構成。", "detail": "1つの組織が、複数のISPまたは複数の物理的な回線・経路を同時に契約・利用する構成。特定の経路や特定の事業者に障害が生じても、その他の経路が生きていれば通信を継続できるという耐障害性を持たせる目的で使われる。BGPを使いマルチホーミング環境で複数の経路を制御することも多い。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "冗長化基本", "word": "耐障害性対策", "short": "障害が発生してもサービスを継続できるようにする対策全般。", "detail": "冗長化、バックアップ、フェイルオーバーの仕組みなど、システムが何らかの障害に見舞われてもサービス提供を継続できるようにするための施策の総称。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "冗長化基本", "word": "複数のネットワーク階層", "short": "異なる階層(コア・ディストリビューション・アクセス等)で冗長化を図る考え方。", "detail": "コア層・ディストリビューション層・アクセス層といった、ネットワーク設計上の階層それぞれで個別に冗長構成を持たせることで、単一階層だけの冗長化よりも広範な障害パターンに耐えられるようにする設計上の考え方。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "VRRP", "word": "VRRP", "short": "複数ルータで仮想的な1つのデフォルトゲートウェイを構成するプロトコル。", "detail": "Virtual Router Redundancy Protocol。同一セグメントに接続された複数の物理ルータが、共通の仮想IPアドレス・仮想MACアドレスを共有し、あたかも1台の仮想的なルータであるかのように振る舞うプロトコル。優先度が最も高いルータがマスタとして実際の転送を担当し、マスタに障害が発生すると次に優先度の高いバックアップルータが自動的にその役割を引き継ぐ。エンドホスト側はデフォルトゲートウェイの設定を変更する必要がない、という点が実用上大きな利点。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "VRRP", "word": "仮想IPアドレス", "short": "VRRPグループが共有する見かけ上のIPアドレス。", "detail": "エンドホストがデフォルトゲートウェイとして設定するIPアドレスで、実際の物理ルータそれぞれが持つ個別のIPアドレスとは別に、VRRPグループ全体で1つだけ共有される仮想的なアドレス。マスタが切り替わっても、この仮想IPアドレス自体は変わらない。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "VRRP", "word": "仮想MACアドレス", "short": "VRRPグループが共有する見かけ上のMACアドレス。", "detail": "VRRPグループ内で共通して使われる仮想的なMACアドレス。マスタが切り替わった後もこの仮想MACアドレスは変わらないため、エンドホスト側でARPテーブルを再学習させる必要がなく、切り替えを速やかに行える。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "VRRP", "word": "マスタルータ(VRRP)", "short": "VRRPで現在仮想IPアドレスを担当しているルータ。", "detail": "VRRPグループの中で、実際にトラフィックの転送を担当している、優先度が最も高いルータ。定期的にVRRP広告パケットを送信し、自身が正常に稼働していることを他のメンバーへ伝え続ける。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "VRRP", "word": "バックアップルータ", "short": "VRRPでマスタ障害時に昇格する予備のルータ。", "detail": "マスタからのVRRP広告パケットが一定時間途絶えたことを検知すると、あらかじめ設定された優先度順に、次に優先度の高いバックアップルータが自動的にマスタへ昇格し、転送処理を引き継ぐ。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "VRRP", "word": "VRRP広告パケット", "short": "マスタがVRRPグループへ生存を通知するパケット。", "detail": "現在のマスタルータが一定間隔で送信する、自分が正常に稼働していることをバックアップルータ群へ知らせるための制御パケット。このパケットが途絶えることが、バックアップルータにとってマスタ障害を検知する合図になる。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "VRRP", "word": "VRRPトラッキング", "short": "上位回線等の状態をVRRPの優先度に反映する機能。", "detail": "WAN側のインタフェースの障害など、VRRP自体には直接関わらない別の要素の状態変化を監視し、それに応じてVRRPの優先度を自動的に増減させる機能。例えば、マスタルータのWANインタフェースが落ちた場合、そのままではLAN側は正常に見えてしまいマスタのままになってしまうところを、優先度を下げてバックアップへ切り替えさせることができる。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "VRRP", "word": "VRRPトリガ", "short": "VRRPの切り替えを引き起こす条件・イベント。", "detail": "インタフェース障害の検知など、VRRPの優先度変更やマスタの切り替えを引き起こすきっかけとなる事象を指す。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "VRRP", "word": "プリエンプトモード", "short": "優先度の高いルータが復旧時にマスタの座を奪還する動作モード。", "detail": "一度バックアップへ切り替わった後、元々優先度の高かったルータが復旧すると、自動的にマスタの座を取り戻す(奪還する)ように動作する設定。有効にしておくのが一般的な運用だが、復旧直後の不安定な状態で即座に奪還すると通信が不安定になる恐れがあるため、後述のプリエンプトディレイと組み合わせて使われることもある。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "VRRP", "word": "プリエンプトディレイ", "short": "プリエンプト動作を一定時間遅延させる設定。", "detail": "復旧直後のルータがまだ不安定な状態のまま即座にマスタの座を奪還してしまう(フラッピング)ことを防ぐため、復旧を検知してから実際にマスタへ昇格するまでに一定の待機時間を設ける設定。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "構成方式(冗長化)", "word": "アクティブ/スタンバイ構成", "short": "1台が稼働、他は待機する冗長構成。", "detail": "通常時は1台(アクティブ系)だけが実際の処理を行い、もう1台(スタンバイ系)は普段何もせず待機しておく冗長構成。アクティブ系に障害が起きた時点でスタンバイ系へ切り替えるが、切り替えの瞬間には多少の通信断(スイッチオーバー時間)が生じることが多い。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "構成方式(冗長化)", "word": "アクティブ/スタンバイ方式", "short": "アクティブ/スタンバイ構成の別表記。", "detail": "主系のみが稼働し、従系は障害発生時のためだけに待機しているという冗長化方式全般を指す表現。"}, {"cat": "冗長化・可用性(VRRP・クラスタ等)", "group": "構成方式(冗長化)", "word": "アクティブ/アクティブ構成", "short": "複数台が同時に稼働し負荷分散も兼ねる冗長構成。", "detail": "冗長化された全ての機器が同時に稼働して実際の処理を分担し、冗長化と負荷分散を同時に実現する構成。1台に障害が発生しても、残りの機器がその分の処理を引き継ぐ形で継続できる。アクティブ/スタンバイに比べ、待機している遊
