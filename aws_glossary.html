<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AWS用語集(詳細版)</title><style>
  :root {--bg:#0e1420;--panel:#141c2b;--panel2:#101724;--line:#253247;--text:#dbe4ef;--sub:#8fa3bf;--accent:#4fd1c5;--accent2:#5b8def;--mono:'JetBrains Mono','Menlo','Consolas',monospace;--sans:'Inter',-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;min-height:100vh}

  .brand{padding:0 20px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}.brand .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}.brand h1{font-size:18px;margin:6px 0 0;font-weight:700;line-height:1.3}
  .cat-item{display:flex;justify-content:space-between;align-items:center;padding:9px 20px;cursor:pointer;font-size:13.5px;color:var(--sub);border-left:3px solid transparent;transition:background .12s,color .12s}.cat-item:hover{background:rgba(255,255,255,.03);color:var(--text)}.cat-item.active{color:var(--text);background:rgba(79,209,197,.08);border-left-color:var(--accent)}.cat-item .cnt{font-family:var(--mono);font-size:11px;color:var(--sub);background:rgba(255,255,255,.04);padding:1px 7px;border-radius:10px}
  main{flex:1;padding:28px 40px 80px;max-width:980px}.topbar{position:sticky;top:0;background:var(--bg);padding:4px 0 18px;z-index:5}.search-wrap{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}.search-wrap input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14.5px;font-family:var(--sans)}.search-wrap svg{flex-shrink:0;opacity:.6}.meta-row{margin-top:10px;font-family:var(--mono);font-size:11.5px;color:var(--sub)}
  .group-title{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--accent2);text-transform:uppercase;margin:26px 0 8px;padding-bottom:6px;border-bottom:1px dashed var(--line)}.group-title:first-of-type{margin-top:6px}
  details.term{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:6px;overflow:hidden}details.term>summary{list-style:none;cursor:pointer;padding:11px 16px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;user-select:none}details.term>summary::-webkit-details-marker{display:none}.arrow{font-family:var(--mono);color:var(--accent);transition:transform .15s;flex-shrink:0;font-size:12px}details.term[open] .arrow{transform:rotate(90deg)}.word{color:var(--text)}.badge{font-size:10px;color:#10201e;background:var(--accent);padding:1px 5px;border-radius:10px;font-weight:700}.short-preview{color:var(--sub);font-weight:400;font-size:12.5px;margin-left:auto;text-align:right;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.body{padding:2px 16px 16px 40px;border-top:1px solid var(--line)}.short{color:var(--accent);font-weight:600;font-size:14px;margin:12px 0 8px}.detail{color:var(--text);font-size:13.5px;line-height:1.9;opacity:.92}mark{background:rgba(79,209,197,.35);color:inherit;border-radius:2px;padding:0 1px}.empty{color:var(--sub);font-family:var(--mono);font-size:13px;padding:40px 0;text-align:center}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}@media(max-width:860px){body{flex-direction:column}aside{width:100%;height:auto;position:relative;overflow-y:visible}main{padding:20px}}
</style></head><body>

<script id="glossary-data" type="application/json">[{"cat": "ネットワーク・VPC", "group": "VPC / Subnet / セキュリティ", "word": "VPC", "short": "AWS上に作成する論理的に分離された仮想ネットワーク。", "detail": "Amazon VPCではCIDRを決め、Subnet、Route Table、Security Group、Internet Gatewayなどを組み合わせてネットワークを設計する。オンプレミスの社内LANに近い役割だが、物理配線ではなく設定で構築できる点が大きな特徴である。実務例: Web/AP/DBを同一VPC内の別Subnetに分け、インターネット公開範囲を制御する。", "important": true, "aliases": []}, {"cat": "ネットワーク・VPC", "group": "VPC / Subnet / セキュリティ", "word": "AZ", "short": "リージョン内で物理的に分離された独立性の高いデータセンター群。", "detail": "各AZは低遅延ネットワークで接続されつつ、電源や設備障害の影響を分離できるよう設計されている。複数AZへリソースを分散すると単一AZ障害への耐性を高められる。実務例: ALBとアプリを2AZに配置し、RDSをMulti-AZ構成にする。", "important": false, "aliases": []}, {"cat": "ネットワーク・VPC", "group": "VPC / Subnet / セキュリティ", "word": "シングルAZ・マルチAZ", "short": "1つのAZだけで構成するか、複数AZへ冗長配置するかという可用性設計。", "detail": "シングルAZは構成が単純でコストを抑えやすいがAZ障害の影響を受けやすい。マルチAZは可用性を高められる一方、リソース数やデータ転送料が増える場合がある。実務例: 開発環境はSingle-AZ、本番DBはMulti-AZにする。", "important": false, "aliases": []}, {"cat": "ネットワーク・VPC", "group": "VPC / Subnet / セキュリティ", "word": "Subnet", "short": "VPCのCIDRを分割して作る、1つのAZに属するIPアドレス範囲。", "detail": "SubnetごとにRoute TableやNACLを関連付け、用途や公開範囲を分離する。1つのSubnetが複数AZにまたがることはなく、可用性を高める場合は複数AZにSubnetを作る。実務例: 東京リージョンの2AZにPublic SubnetとPrivate Subnetを1つずつ作り、ALBとECS/RDSを分離する。", "important": true, "aliases": []}, {"cat": "ネットワーク・VPC", "group": "VPC / Subnet / セキュリティ", "word": "Public Subnet", "short": "Internet Gatewayへの経路を持つRoute Tableに関連付けたSubnet。", "detail": "Public Subnetに置いただけでは自動で外部公開されず、対象リソースのPublic IPやSecurity Groupなども必要になる。Internet-facing ALBやNAT Gatewayを置く代表的な場所である。実務例: 2AZのPublic SubnetにALBとNAT Gatewayを配置する。", "important": false, "aliases": []}, {"cat": "ネットワーク・VPC", "group": "VPC / Subnet / セキュリティ", "word": "Private Subnet", "short": "Internet Gatewayへの直接経路を持たないSubnet。", "detail": "外部から直接到達させないEC2、ECS、RDSなどを配置するのに使う。外向きインターネット通信が必要ならNAT Gateway、AWSサービスへの閉域アクセスならVPC Endpointなどを利用する。実務例: APサーバとDBをPrivate Subnetへ配置する。", "important": false, "aliases": ["Privaqte Subnet"]}, {"cat": "ネットワーク・VPC", "group": "VPC / Subnet / セキュリティ", "word": "Amazon ElastiCache", "short": "Redis互換またはMemcachedのインメモリキャッシュをマネージドで提供するサービス。", "detail": "DBの前段で頻繁に読むデータをメモリに保持し、低遅延化やDB負荷軽減に使う。永続的な正本データベースとして使うかはエンジンや要件を慎重に検討する。実務例: ログインセッションや商品ランキングをキャッシュする。", "important": false, "aliases": ["ElasticCashe"]}, {"cat": "ネットワーク・VPC", "group": "VPC / Subnet / セキュリティ", "word": "Security Group", "short": "ENIに適用するステートフルな仮想ファイアウォール。", "detail": "許可ルールのみを定義し、戻り通信は状態追跡により自動的に許可される。NACLよりリソースに近い単位で制御でき、EC2、ALB、RDSなどで基本的なアクセス制御に使う。実務例: DBの5432番ポートをAPサーバのSecurity Groupからのみ許可する。", "important": false, "aliases": []}, {"cat": "ネットワーク・VPC", "group": "VPC / Subnet / セキュリティ", "word": "NACL", "short": "Subnet境界で通信を制御するステートレスなアクセス制御リスト。", "detail": "許可と拒否の両方を番号順で評価し、戻り通信も別ルールが必要になる。Security Groupより粗いSubnet単位で、追加の防御層として使う。実務例: 特定の送信元CIDRをSubnet全体で明示的に拒否する。", "important": false, "aliases": []}, {"cat": "DNS・ネットワークIF", "group": "DNS / ENI", "word": "Amazon Route 53", "short": "AWSのマネージドDNSサービス。", "detail": "公開DNSの権威DNS、VPC内向けPrivate Hosted Zone、ヘルスチェックやルーティングポリシーなどを提供する。単なる名前解決だけでなく、フェイルオーバーや重み付けルーティングにも利用できる。実務例: example.comをALBへAliasレコードで向け、障害時は別リージョンへ切り替える。", "important": true, "aliases": ["Route53"]}, {"cat": "DNS・ネットワークIF", "group": "DNS / ENI", "word": "インターネットDNS", "short": "インターネット上で公開されるドメイン名を解決するDNSの仕組み。", "detail": "Route 53のPublic Hosted Zoneなどで権威DNSレコードを公開し、世界中のリゾルバから問い合わせを受ける。VPC内だけで有効なPrivate Hosted Zoneとは公開範囲が異なる。実務例: public.example.comをインターネット向けALBへ名前解決させる。", "important": false, "aliases": []}, {"cat": "DNS・ネットワークIF", "group": "DNS / ENI", "word": "VPC DNS", "short": "VPC内のAWSリソース向け名前解決を提供するDNS機能。", "detail": "VPC ResolverはVPC固有名、Private Hosted Zone、公開DNS名の再帰解決を行う。オンプレミスDNSと連携する場合はRoute 53 ResolverのInbound/Outbound Endpointやルールを使う。実務例: app.internal.example.comをPrivate Hosted Zoneで内部IPへ解決する。", "important": false, "aliases": []}, {"cat": "DNS・ネットワークIF", "group": "DNS / ENI", "word": "AmazonProvidedDNS", "short": "各VPCで利用できるAWS提供のDNSリゾルバ。", "detail": "VPCのネットワークアドレスに2を加えたアドレスなどから利用でき、EC2のDNS名、Private Hosted Zone、インターネットDNSの名前解決を行う。DHCP Option SetでAmazonProvidedDNSを指定して利用する。実務例: EC2が外部のapi.example.comを名前解決する。", "important": false, "aliases": ["Amazon ProvidedDNS"]}, {"cat": "DNS・ネットワークIF", "group": "DNS / ENI", "word": "ENI", "short": "VPC内リソースにアタッチされる仮想ネットワークインタフェース。", "detail": "IPアドレス、MACアドレス、Security Groupなどを持ち、EC2や各種AWSサービスのネットワーク接続単位になる。複数ENIを持つEC2では管理系と業務系を分ける設計も可能である。実務例: EC2に追加ENIを付けて別Subnet側へ接続する。", "important": false, "aliases": []}, {"cat": "コンピューティング", "group": "ロードバランサ / コンテナ / サーバレス", "word": "ALB", "short": "HTTP/HTTPSの内容を見てリクエストを振り分けるレイヤ7ロードバランサ。", "detail": "ホスト名やパスでターゲットグループを分けられ、EC2、ECS、Lambdaなどへ転送できる。TCP/UDP中心のNLBよりアプリケーション層の柔軟なルーティングに向く。実務例: /api/*はECS、/static/*は別ターゲットへ振り分ける。", "important": false, "aliases": []}, {"cat": "コンピューティング", "group": "ロードバランサ / コンテナ / サーバレス", "word": "EC2", "short": "AWS上で仮想サーバを起動できるコンピューティングサービス。", "detail": "CPU・メモリ・OSなどを選択し、仮想マシン単位で自由度の高い構成を作れる。OS管理やパッチ適用は利用者側の責任になるため、LambdaやFargateより運用範囲は広い。実務例: 独自ミドルウェアが必要なWeb/APサーバをEC2に構築する。", "important": true, "aliases": []}, {"cat": "コンピューティング", "group": "ロードバランサ / コンテナ / サーバレス", "word": "ECS", "short": "コンテナをAWS上で実行・管理するコンテナオーケストレーションサービス。", "detail": "Task Definitionでコンテナ構成を定義し、Serviceで必要数を維持して実行する。実行基盤としてEC2またはFargateを選べる。実務例: ECRに格納したWebアプリのイメージをECS Serviceとして複数タスク起動し、ALBで負荷分散する。", "important": true, "aliases": []}, {"cat": "コンピューティング", "group": "ロードバランサ / コンテナ / サーバレス", "word": "Fargate", "short": "サーバ管理なしでECS/EKSのコンテナを実行するサーバレスコンピュート基盤。", "detail": "EC2インスタンスの台数やOSを管理せず、タスクごとのvCPU・メモリを指定して実行する。常時大規模稼働ではEC2起動タイプの方がコスト最適化しやすい場合がある。実務例: ECS ServiceをFargateで起動し、コンテナ基盤のOS運用をAWSへ任せる。", "important": false, "aliases": []}, {"cat": "コンピューティング", "group": "ロードバランサ / コンテナ / サーバレス", "word": "Lambda", "short": "イベントを契機にコードを実行するサーバレスコンピューティングサービス。", "detail": "サーバの構築や常時起動を意識せず、リクエスト数や実行時間に応じて自動的にスケールする。短時間のイベント駆動処理に向く一方、実行時間やランタイムなどに制約がある。実務例: S3へのファイルアップロードをトリガーに画像変換処理を実行する。", "important": true, "aliases": []}, {"cat": "コンピューティング", "group": "ロードバランサ / コンテナ / サーバレス", "word": "ECR", "short": "コンテナイメージを保存・配布するAWSのコンテナレジストリ。", "detail": "ECSやEKSから認証付きでイメージをpullでき、イメージスキャンやライフサイクルポリシーも利用できる。実務例: CIでビルドしたDockerイメージをECRへpushし、ECSからデプロイする。", "important": false, "aliases": []}, {"cat": "コンピューティング", "group": "ロードバランサ / コンテナ / サーバレス", "word": "LambdaとECS Fargateの比較", "short": "Lambdaは関数単位の短時間イベント処理、ECS Fargateはコンテナ単位の継続処理に向く。", "detail": "Lambdaは実行環境管理が少なく自動スケールしやすい一方、実行時間・ランタイム等の制約がある。Fargateは任意コンテナを長時間動かしやすく自由度が高いが、タスク定義やネットワーク設計など管理項目が増える。実務例: 数秒のファイル変換はLambda、常時稼働APIや長時間バッチはFargateを選ぶ。", "important": false, "aliases": []}, {"cat": "データベース", "group": "RDB / Aurora", "word": "RDBMS", "short": "表形式データを関係とSQLで扱うリレーショナルデータベース管理システム。", "detail": "トランザクション整合性やJOINを使う業務データに向き、AWSではRDSやAuroraが代表的なマネージド選択肢となる。キー値中心で超大規模スケールするDynamoDBとは設計思想が異なる。実務例: 受注・顧客・請求テーブルを外部キーで関連付けて管理する。", "important": false, "aliases": []}, {"cat": "データベース", "group": "RDB / Aurora", "word": "Amazon RDS", "short": "MySQL等のRDBをマネージド運用できるAWSサービス。", "detail": "バックアップ、監視、パッチ、Multi-AZなどをAWSが支援し、EC2上へDBを自前構築するより運用負荷を減らせる。実務例: PostgreSQLをRDSとして起動し、自動バックアップとMulti-AZを有効化する。", "important": false, "aliases": []}, {"cat": "データベース", "group": "RDB / Aurora", "word": "Amazon Aurora", "short": "MySQL/PostgreSQL互換で高可用性を重視したAWS独自のマネージドRDB。", "detail": "Aurora Cluster内でWriterとReaderが分かれ、共有分散ストレージを利用する。読み取り性能を増やす場合はReaderを追加できる。実務例: 読み取り負荷の高いWebシステムでReader Endpointを利用する。", "important": false, "aliases": []}, {"cat": "データベース", "group": "RDB / Aurora", "word": "Aurora Cluster", "short": "Auroraの共有ストレージと複数DBインスタンスをまとめた論理的なクラスタ。", "detail": "通常は書き込みを担当するWriterと、必要に応じて複数のReaderで構成される。フェイルオーバー時にはReaderがWriterへ昇格できる。実務例: 1 Writer + 2 Readersで可用性と読み取り性能を確保する。", "important": false, "aliases": []}, {"cat": "データベース", "group": "RDB / Aurora", "word": "Writer", "short": "Aurora Clusterで書き込みを受け付けるプライマリDBインスタンス。", "detail": "通常1クラスタに1つのWriterが存在し、Cluster Endpointは現在のWriterへ接続を振り向ける。障害時はReaderが昇格し、接続先を固定IPではなくEndpointにしておくと切替へ追従しやすい。実務例: 更新系SQLはCluster Endpoint経由でWriterへ送る。", "important": false, "aliases": []}, {"cat": "データベース", "group": "RDB / Aurora", "word": "Reader", "short": "Aurora Clusterで主に読み取りを処理するレプリカDBインスタンス。", "detail": "複数Readerを追加して読み取り負荷を分散でき、障害時にはWriterへ昇格候補にもなる。実務例: 検索・参照系APIをReader Endpointへ接続しWriter負荷を下げる。", "important": false, "aliases": []}, {"cat": "データベース", "group": "RDB / Aurora", "word": "Endpoint", "short": "DBやサービスへの接続先を表すDNS名などの論理的な接続口。", "detail": "AuroraではCluster Endpoint、Reader Endpoint、Instance Endpointなどがあり、用途に応じて接続先を抽象化する。実務例: アプリ設定にはWriter個体のホスト名ではなくCluster Endpointを設定する。", "important": false, "aliases": []}, {"cat": "データベース", "group": "RDB / Aurora", "word": "Aurora Serverless v2", "short": "AuroraのDB容量を負荷に応じて細かく自動増減させるサーバレス構成。", "detail": "ACUを単位に最小・最大容量範囲を設定し、需要変動に合わせてコンピュートをスケールする。常時一定負荷ではプロビジョンド構成と料金比較が必要である。実務例: 昼夜でアクセス量が大きく変動する社内システムに適用する。", "important": false, "aliases": ["Aurora Severless v2"]}, {"cat": "データベース", "group": "RDB / Aurora", "word": "ACU", "short": "Aurora Serverless v2のコンピュート容量を表す単位。", "detail": "Aurora Capacity Unitとしてメモリ、CPU、ネットワーク能力の組合せを表し、設定した範囲内で自動スケールする。実務例: 最小0.5 ACU、最大8 ACUのように設定し、夜間コストを抑えながらピークに対応する。", "important": false, "aliases": []}, {"cat": "データベース", "group": "RDB / Aurora", "word": "Amazon RDS Proxy", "short": "RDS/AuroraへのDB接続をプールして効率化するマネージドプロキシ。", "detail": "大量の短時間接続をまとめてDB側の接続数を抑え、フェイルオーバー時の接続回復も支援する。Lambdaのように同時接続が急増するワークロードで特に有効である。実務例: LambdaからAuroraへ直接大量接続せずRDS Proxyを経由する。", "important": false, "aliases": []}, {"cat": "データベース", "group": "RDB / Aurora", "word": "Amazon RDSのバックアップ", "short": "RDSのDBを自動バックアップや手動スナップショットで保護する仕組み。", "detail": "自動バックアップは保持期間内のポイントインタイムリカバリに使え、手動スナップショットは明示的に削除するまで保持できる。実務例: 本番RDSで7日間の自動バックアップを設定し、リリース前に手動スナップショットを取る。", "important": false, "aliases": []}, {"cat": "データベース", "group": "RDB / Aurora", "word": "Auroraのバックアップ", "short": "Aurora Clusterの分散ストレージを継続的にS3へバックアップする仕組み。", "detail": "自動バックアップ保持期間内のポイントインタイムリカバリや手動Cluster Snapshotを利用できる。実務例: 障害や誤操作に備えて保持期間を設定し、重要変更前には手動Snapshotを取得する。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "NoSQL", "short": "RDBの表・JOIN中心モデルに限定されないデータベース方式の総称。", "detail": "AWSではDynamoDBが代表的で、キーアクセスを中心に高スケール・低遅延を実現する。データモデルをアクセスパターンから設計する点がRDBと大きく異なる。実務例: ユーザーIDをキーにプロフィールを高速取得する。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "Amazon DynamoDB", "short": "AWSのフルマネージドなKey-Value/ドキュメント型NoSQLデータベース。", "detail": "サーバ管理なしで自動スケールし、ミリ秒単位の応答を狙える。Primary Key設計が性能と拡張性を大きく左右する。実務例: APIの状態管理やショッピングカートを保存する。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "Primary Key / Sort Key", "short": "DynamoDBで各項目を識別し配置・検索に使うキー。", "detail": "Partition Keyのみの単純Primary Keyと、Partition Key + Sort Keyの複合Primary Keyがある。同じPartition Key内でSort Keyによる範囲検索や並び替えができる。実務例: userIdをPartition Key、timestampをSort Keyとしてユーザー別履歴を取得する。", "important": false, "aliases": ["PrimaryKey/SortKey"]}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "DynamoDB Streams", "short": "DynamoDBテーブルの項目変更を時系列で記録する変更ストリーム。", "detail": "追加・更新・削除イベントを一定期間保持し、Lambdaなどから処理できる。実務例: 注文テーブルへのINSERTを契機にLambdaで集計テーブルを更新する。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "Amazon S3", "short": "AWSの高耐久オブジェクトストレージサービス。", "detail": "バケットとオブジェクトキーでデータを管理し、複数のストレージクラス、バージョニング、レプリケーション、Object Lockなどを利用できる。実務例: アプリのログとバックアップをS3へ集約する。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "オブジェクトストレージ", "short": "ファイルを階層ブロックではなくオブジェクトとメタデータとして管理するストレージ方式。", "detail": "S3ではオブジェクトキーでデータを一意に扱い、HTTP APIでアクセスする。EFSのようなPOSIXファイルシステムとは操作方法が異なる。実務例: 画像やログなど大量の非構造データを保存する。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "バケット", "short": "S3でオブジェクトを格納する最上位の論理コンテナ。", "detail": "バケット名、リージョン、アクセス設定、暗号化、ライフサイクルなどを設定し、その内部にオブジェクトを保存する。実務例: company-prod-logsのような専用バケットへ監査ログを集約する。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "オブジェクト", "short": "S3に保存されるデータ本体とメタデータの単位。", "detail": "各オブジェクトはバケット内でオブジェクトキーにより識別され、ストレージクラスやタグなどの属性を持つ。実務例: access-logs/2026/09/23/app.log.gzを1オブジェクトとして保存する。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "オブジェクトキー", "short": "S3バケット内でオブジェクトを一意に識別する名前。", "detail": "見た目はパスのように「/」を含められるが、一般的なファイルシステムのディレクトリ階層そのものではない。実務例: images/2026/09/photo.jpgのようなプレフィックス設計で管理する。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "Block Public Access", "short": "S3の意図しない公開設定をまとめて防止する保護機能。", "detail": "アカウントまたはバケット単位でPublic ACLやPublic Bucket Policyを制限できる。インターネット公開が不要なバケットでは原則有効化する。実務例: バックアップ用バケットで全Block Public Accessを有効にする。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "バージョニング", "short": "S3オブジェクトの更新・削除前の版を保持する機能。", "detail": "同じキーへ上書きしても旧バージョンが残り、誤更新や誤削除から復元しやすくなる。保存容量は増えるためLifecycleと組み合わせることが多い。実務例: 設定ファイルを誤上書きしても前バージョンへ戻す。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "削除保護", "short": "誤操作による削除を防ぐために削除操作へ追加の制約を設ける考え方。", "detail": "AWSではサービスごとに削除保護機能が異なり、S3ではVersioning、MFA Delete、Object Lockなどを組み合わせる。実務例: 本番DBではDeletion Protection、S3重要データではObject Lockを有効化する。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "Object Lock", "short": "S3オブジェクトを指定期間または無期限に削除・上書きできないよう保護する機能。", "detail": "WORM要件に対応し、Governance modeとCompliance mode、Legal Holdを利用できる。バージョニングが前提となる。実務例: 監査ログを7年間Compliance modeで保持する。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "MFA Delete", "short": "S3の特定のバージョン削除操作などにMFA認証を要求する機能。", "detail": "Versioningと併用し、バージョンの完全削除やVersioning状態変更への防御を強める。設定・運用に制約があるためObject Lockとの役割を区別する。実務例: 重要バックアップの完全削除にMFAを必須化する。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "S3 Object Lock", "short": "Amazon S3のWORM型削除・上書き防止機能。", "detail": "保持期間やLegal Holdを設定し、ランサムウェアや誤削除から重要オブジェクトを守る。Compliance modeでは保持期間中の削除制限が非常に強い。実務例: CloudTrailログの改ざん防止に利用する。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "S3 Standard", "short": "頻繁にアクセスするデータ向けの標準S3ストレージクラス。", "detail": "複数AZへ冗長化され、低遅延・高スループットで取り出し料金がない。アクセス頻度が低い長期保管では他クラスの方が安くなる場合がある。実務例: Webコンテンツや日常的に参照するデータを保存する。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "S3 Intelligent-Tiering", "short": "アクセス頻度が読みにくいデータを自動的に適切な階層へ移すストレージクラス。", "detail": "オブジェクトのアクセス状況に応じて頻繁/低頻度などの階層間を自動移動し、手動予測の失敗を減らせる。監視・自動化料金がある。実務例: 将来のアクセス頻度が不明なデータレイクに利用する。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "S3 Standard-IA", "short": "複数AZ冗長で、低頻度アクセス向けのS3ストレージクラス。", "detail": "保管単価はStandardより低いが取り出し料金と最低保存期間などの条件があるため、頻繁に読むデータには不向きである。実務例: 月1回程度参照するバックアップや災害復旧用データを保管する。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "S3 One Zone-IA", "short": "1つのAZだけに保存する低頻度アクセス向けS3ストレージクラス。", "detail": "Standard-IAより安価だがAZ喪失に耐えないため、再生成可能なデータや二次コピーに向く。実務例: 他リージョンにも正本がある再生成可能データの低コストコピーに利用する。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "S3 Glacier Instant Retrieval", "short": "四半期程度の低頻度アクセスを想定し、ミリ秒で取り出せるアーカイブクラス。", "detail": "Glacier系の低コスト保管と即時アクセスを両立するが、最低保存期間や取り出し料金がある。実務例: 普段は読まないが緊急時に即時取得したい医療画像やバックアップを保管する。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "S3 Glacier Flexible Retrieval", "short": "年に数回程度のアクセス向けで、復元に分～時間を許容するアーカイブクラス。", "detail": "即時アクセスより保管コストを抑えられるが、オブジェクトを利用する前に復元処理が必要になる。実務例: 監査対象の過年度データを長期保存する。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "S3 Glacier Deep Archive", "short": "ほとんど参照しない長期保存向けの最安クラスの1つ。", "detail": "復元には長い時間を要するため即時利用には向かないが、法定保管など長期アーカイブのコストを大きく抑えられる。実務例: 数年間ほぼ参照しないコンプライアンス記録を保存する。", "important": false, "aliases": []}, {"cat": "ストレージ・NoSQL", "group": "DynamoDB / S3", "word": "レプリケーション", "short": "S3オブジェクトを別バケットへ自動複製する機能。", "detail": "同一リージョンまたは別リージョンへ非同期複製し、災害対策、データ分離、コンプライアンスに利用する。Versioningなど前提条件がある。実務例: 東京リージョンの重要データを大阪リージョンのバケットへ複製する。", "important": false, "aliases": []}, {"cat": "IAM・権限管理", "group": "IAM / Role / Policy", "word": "IAM", "short": "AWSの認証・認可を管理するサービス。", "detail": "User、Group、Role、Policyを用いて誰がどのAWSリソースに何をできるかを制御する。長期アクセスキーよりRoleの一時認証情報を優先し、最小権限で設計することが重要である。実務例: Lambda実行ロールに特定S3バケットの読み取り権限だけを与える。", "important": true, "aliases": []}, {"cat": "IAM・権限管理", "group": "IAM / Role / Policy", "word": "IAM User", "short": "人やアプリへ長期的なAWS認証情報を与えるIAMアイデンティティ。", "detail": "パスワードやAccess Keyを持てるが、現在は人のアクセスにはIAM Identity Center、ワークロードにはRoleの利用を優先するのが一般的である。実務例: どうしても長期アクセスキーが必要なレガシー連携に限定して作成する。", "important": false, "aliases": []}, {"cat": "IAM・権限管理", "group": "IAM / Role / Policy", "word": "IAM Group", "short": "複数IAM Userへ共通権限をまとめて付与するグループ。", "detail": "Group自体でAWSへログインするものではなく、PolicyをまとめてUserへ継承させるために使う。Roleは一時的な認証主体であり用途が異なる。実務例: 開発者UserをDevelopers Groupへ所属させ、共通読み取り権限を付ける。", "important": false, "aliases": []}, {"cat": "IAM・権限管理", "group": "IAM / Role / Policy", "word": "IAM Role", "short": "固定の長期認証情報を持たず、一時的に引き受けて使うIAMアイデンティティ。", "detail": "Trust Policyで誰がRoleを引き受けられるかを定め、Permission PolicyでRoleが何をできるかを定める。AWSサービスやクロスアカウントアクセスで広く使う。実務例: EC2へRoleを付与してAccess Keyを置かずにS3へアクセスさせる。", "important": false, "aliases": []}, {"cat": "IAM・権限管理", "group": "IAM / Role / Policy", "word": "IAM Policy", "short": "AWS APIに対する許可・拒否条件をJSONで定義する権限文書。", "detail": "Action、Resource、Effect、Conditionなどでアクセス権を表し、Identity-based PolicyやResource-based Policyなどがある。実務例: 特定S3バケットのGetObjectだけを許可する。", "important": false, "aliases": []}, {"cat": "IAM・権限管理", "group": "IAM / Role / Policy", "word": "Resource", "short": "AWS上で作成・管理される個々のサービス対象。", "detail": "EC2 Instance、S3 Bucket、Lambda FunctionなどがResourceで、IAM PolicyではARN等で対象Resourceを絞り込む。実務例: PolicyのResourceに本番バケットARNだけを指定して権限範囲を限定する。", "important": false, "aliases": []}, {"cat": "IAM・権限管理", "group": "IAM / Role / Policy", "word": "Lambda実行ロール", "short": "Lambda関数がAWSサービスへアクセスするために引き受けるIAM Role。", "detail": "Lambdaサービスを信頼するTrust Policyと、関数コードが必要とする権限Policyを持つ。実務例: S3から読み取りCloudWatch Logsへ書き込む権限だけをLambda実行ロールへ付与する。", "important": false, "aliases": ["Lambda実行Role"]}, {"cat": "IAM・権限管理", "group": "IAM / Role / Policy", "word": "ECS Task Role（タスクロール）", "short": "ECSコンテナ内のアプリケーションコードへAWS権限を与えるIAM Role。", "detail": "Task Execution RoleがECS/Fargateエージェント用であるのに対し、Task Roleはコンテナ内アプリ自身がS3やDynamoDBなどを呼ぶために使う。実務例: 注文APIコンテナにDynamoDB PutItem権限を与える。", "important": false, "aliases": ["ECS Task Role"]}, {"cat": "IAM・権限管理", "group": "IAM / Role / Policy", "word": "Task Role（タスクロール）", "short": "ECSタスク内のアプリケーションがAWS APIを利用するためのIAM Role。", "detail": "Task Definitionで指定し、コンテナへ一時認証情報が提供される。Task Execution Roleと混同しないことが重要である。実務例: タスク内アプリからS3へファイルをアップロードする。", "important": false, "aliases": ["Task Role"]}, {"cat": "IAM・権限管理", "group": "IAM / Role / Policy", "word": "Task Execution Role（タスク実行ロール）", "short": "ECS/Fargateがタスクを起動・実行するために利用するIAM Role。", "detail": "ECRからイメージをpullする、CloudWatch Logsへログを送る、起動時にSecrets Managerを参照するなど、ECSエージェント側の処理に使われる。実務例: FargateタスクにAmazonECSTaskExecutionRolePolicyを付けてECR pullとログ出力を可能にする。", "important": false, "aliases": ["Task Execution Role"]}, {"cat": "IAM・権限管理", "group": "IAM / Role / Policy", "word": "AssumeRole", "short": "IAM Roleを引き受けて一時的な認証情報を取得するSTS操作。", "detail": "呼び出し元の権限とRole側Trust Policyの両方が条件を満たす必要がある。クロスアカウントや権限切替で長期Access Keyを共有せずに済む。実務例: 開発アカウントの運用者が本番閲覧RoleをAssumeRoleして一時アクセスする。", "important": false, "aliases": ["Assume Role"]}, {"cat": "IAM・権限管理", "group": "IAM / Role / Policy", "word": "Trust Policy（信頼ポリシー）", "short": "IAM Roleを誰が引き受けられるかを定義するResource-based Policy。", "detail": "PrincipalにAWSアカウント、IAM主体、AWSサービスなどを指定し、sts:AssumeRole等を許可する。Roleの「何ができるか」を定めるPermission Policyとは役割が異なる。実務例: Lambdaサービスだけが実行ロールを引き受けられるよう設定する。", "important": false, "aliases": ["Trust Policy"]}, {"cat": "IAM・権限管理", "group": "IAM / Role / Policy", "word": "Service Role（サービスロール）", "short": "AWSサービスが利用者に代わって処理するために引き受けるIAM Role。", "detail": "サービスに必要なAPI権限を渡すために作り、Trust Policyでは対象AWSサービスを信頼する。実務例: CodeBuildがS3/ECRへアクセスするためのService Roleを設定する。", "important": false, "aliases": ["Service Role"]}, {"cat": "暗号・シークレット", "group": "Secrets Manager / KMS", "word": "シークレット情報", "short": "外部へ漏らしてはいけない認証情報や機密値。", "detail": "パスワード、APIキー、トークン、秘密鍵などが該当し、コードやGitへ直書きせずSecrets ManagerやParameter Store等で管理する。実務例: DBパスワードをSecretとして保存し実行時に取得する。", "important": false, "aliases": []}, {"cat": "暗号・シークレット", "group": "Secrets Manager / KMS", "word": "AWS Secrets Manager", "short": "シークレットの安全な保存・取得・ローテーションを行うAWSサービス。", "detail": "値はKMSを利用して暗号化され、IAMやResource Policyでアクセスを制御できる。実務例: Auroraの認証情報を自動ローテーションし、アプリはSecret ARNから取得する。", "important": false, "aliases": ["AWS Secret Manager"]}, {"cat": "暗号・シークレット", "group": "Secrets Manager / KMS", "word": "シークレットローテーション", "short": "パスワードやキーを定期的に新しい値へ交換する運用。", "detail": "Secrets Managerではスケジュールに基づき対応サービスの認証情報を更新でき、長期間同じ秘密値を使うリスクを下げる。実務例: RDSユーザーパスワードを30日ごとに自動変更する。", "important": false, "aliases": []}, {"cat": "暗号・シークレット", "group": "Secrets Manager / KMS", "word": "AWS KMS", "short": "AWSのマネージド暗号鍵管理サービス。", "detail": "KMS Keyの作成、権限制御、監査、暗号APIを提供し、S3、RDS、Secrets Managerなど多くのサービスと統合される。実務例: 機密S3バケットをCustomer managed KMS keyでSSE-KMS暗号化する。", "important": false, "aliases": []}, {"cat": "暗号・シークレット", "group": "Secrets Manager / KMS", "word": "KMS Key", "short": "AWS KMSで管理される暗号処理のルートとなる論理鍵。", "detail": "Key PolicyやIAMで利用者を制御し、Data Keyの生成・暗号化や直接暗号化などに使う。大量データ本体を直接KMS Keyで暗号化するよりEnvelope Encryptionが一般的である。実務例: Secrets ManagerのSecretを特定KMS Keyで暗号化する。", "important": false, "aliases": []}, {"cat": "暗号・シークレット", "group": "Secrets Manager / KMS", "word": "Data Key", "short": "実データを高速に暗号化するためKMSから生成する対称鍵。", "detail": "平文Data Keyでデータを暗号化し、暗号化済みData KeyをKMS Keyで保護してデータと一緒に保存する。実務例: アプリがGenerateDataKeyで得たData Keyを使って大容量ファイルを暗号化する。", "important": false, "aliases": []}, {"cat": "暗号・シークレット", "group": "Secrets Manager / KMS", "word": "Envelope Encryption", "short": "データをData Keyで暗号化し、そのData KeyをさらにKMS Keyで暗号化する方式。", "detail": "大量データをKMSへ直接送らず高速に処理でき、鍵管理をKMSへ集中できる。Secrets ManagerなどAWSサービス内部でも利用される。実務例: 1GBファイルはData Keyで暗号化し、暗号化済みData Keyだけをファイルのメタデータと一緒に保存する。", "important": false, "aliases": ["Envelop Encrption"]}, {"cat": "メッセージング・イベント", "group": "同期 / 非同期 / SQS / EventBridge", "word": "同期処理", "short": "処理の完了を待ってから次の処理へ進む実行方式。", "detail": "結果をすぐ必要とするAPIには分かりやすいが、後段が遅いと呼び出し元も待たされ、障害が連鎖しやすい。実務例: API GatewayからLambdaを呼び、結果をそのHTTPレスポンスとして返す。", "important": false, "aliases": []}, {"cat": "メッセージング・イベント", "group": "同期 / 非同期 / SQS / EventBridge", "word": "非同期処理", "short": "依頼を受け付けた後、完了を待たず別処理として実行する方式。", "detail": "SQSやEventBridgeを間に置くことでサービスを疎結合化し、負荷ピークや一時障害を吸収しやすい。実務例: 注文受付APIはSQSへメッセージを送って即応答し、後続ワーカーが処理する。", "important": false, "aliases": []}, {"cat": "メッセージング・イベント", "group": "同期 / 非同期 / SQS / EventBridge", "word": "Amazon SQS", "short": "メッセージをキューに保持して非同期処理を実現するマネージドサービス。", "detail": "StandardとFIFOを選べ、Visibility Timeout、Retry、DLQと組み合わせて失敗耐性を高める。実務例: 画像処理ジョブをSQSへ投入し複数ECS Workerで並列処理する。", "important": false, "aliases": []}, {"cat": "メッセージング・イベント", "group": "同期 / 非同期 / SQS / EventBridge", "word": "Standard Queue", "short": "高スループットを優先するSQSの標準キュー。", "detail": "少なくとも1回の配信を前提とし、まれに重複や順序入れ替わりが起こり得るため、Consumer側を冪等に設計する。実務例: 順序が厳密でない大量メール送信ジョブに利用する。", "important": false, "aliases": []}, {"cat": "メッセージング・イベント", "group": "同期 / 非同期 / SQS / EventBridge", "word": "FIFO Queue", "short": "順序性と重複排除を重視するSQSキュー。", "detail": "Message Group ID単位の順序を維持し、重複排除機能を持つ。Standardより制約があるため、順序保証が必要な処理で選ぶ。実務例: 同一口座の更新イベントを順番通り処理する。", "important": false, "aliases": []}, {"cat": "メッセージング・イベント", "group": "同期 / 非同期 / SQS / EventBridge", "word": "Visibility Timeout", "short": "SQSで受信済みメッセージを他Consumerから一時的に見えなくする時間。", "detail": "Consumerが処理中に同じメッセージを他Consumerが同時処理しにくくするが、処理完了後はDeleteMessageが必要である。処理時間より短すぎると重複処理が起きやすい。実務例: 最大処理時間が2分なら余裕を持ったVisibility Timeoutを設定する。", "important": false, "aliases": []}, {"cat": "メッセージング・イベント", "group": "同期 / 非同期 / SQS / EventBridge", "word": "リトライ", "short": "失敗した処理を一定条件で再試行する仕組み。", "detail": "一時的障害には有効だが、無制限リトライは負荷増大を招くため回数・間隔・バックオフ・DLQを設計する。実務例: SQS Consumerが外部APIの一時エラー時にメッセージを削除せず再配信させる。", "important": false, "aliases": []}, {"cat": "メッセージング・イベント", "group": "同期 / 非同期 / SQS / EventBridge", "word": "Dead Letter Queue", "short": "規定回数失敗したメッセージを隔離するためのキュー。", "detail": "本処理を失敗メッセージで詰まらせず、後から原因調査・再処理できる。実務例: 5回処理失敗したSQSメッセージをDLQへ移し、CloudWatch Alarmで通知する。", "important": false, "aliases": []}, {"cat": "メッセージング・イベント", "group": "同期 / 非同期 / SQS / EventBridge", "word": "EventBridge", "short": "AWSサービスやアプリのイベントを条件で振り分けるイベントバスサービス。", "detail": "Event Patternに一致したイベントをLambda、SQS、Step Functionsなどのターゲットへルーティングする。時間指定実行はEventBridge Schedulerの方が専用機能として扱いやすい。実務例: ECS Task停止イベントを検知してLambdaで通知処理を実行する。", "important": true, "aliases": []}, {"cat": "メッセージング・イベント", "group": "同期 / 非同期 / SQS / EventBridge", "word": "EventBridge Rule", "short": "EventBridgeでイベントを条件照合しターゲットへ送るルール。", "detail": "Event PatternでAWSサービス等のイベントを選別して処理を起動する。スケジュール実行用途はEventBridge Schedulerを使う選択肢がある。実務例: EC2の状態がstoppedになったイベントを検出してSNSへ通知する。", "important": false, "aliases": []}, {"cat": "メッセージング・イベント", "group": "同期 / 非同期 / SQS / EventBridge", "word": "EventBridge Scheduler", "short": "日時・周期を指定してAWS処理を起動するマネージドスケジューラ。", "detail": "cron/rateや一回限りの時刻を指定し、Lambda、ECS RunTask、SQSなど多様なAPIをターゲットにできる。イベント内容のマッチングを行うEventBridge Ruleとは用途が異なる。実務例: 毎日22時にECSバッチタスクを起動する。", "important": true, "aliases": []}, {"cat": "監視・運用", "group": "CloudWatch / CloudTrail / Systems Manager", "word": "CloudWatch", "short": "AWSリソースやアプリケーションの監視データを収集・可視化するサービス。", "detail": "Metrics、Logs、Alarm、Dashboardなどを使って性能や障害兆候を監視する。CloudTrailが主にAPI操作の監査記録なのに対し、CloudWatchは運用監視・メトリクス・ログ活用が中心である。実務例: EC2のCPU使用率が80%を超えたらAlarmを発報する。", "important": true, "aliases": []}, {"cat": "監視・運用", "group": "CloudWatch / CloudTrail / Systems Manager", "word": "Metrics", "short": "時間ごとの数値として記録される監視指標。", "detail": "CloudWatchではCPUUtilization、RequestCountなどを時系列で保存し、AlarmやDashboardに利用する。ログ本文とは異なり数値監視に向く。実務例: ALBの5XX件数をMetricとしてAlarm判定する。", "important": false, "aliases": []}, {"cat": "監視・運用", "group": "CloudWatch / CloudTrail / Systems Manager", "word": "CloudWatch Logs", "short": "アプリやAWSサービスのログを集中保存・検索するCloudWatch機能。", "detail": "Log GroupとLog Streamで整理し、Logs InsightsやMetric Filterで分析・監視できる。実務例: ECSコンテナの標準出力をawslogsドライバでCloudWatch Logsへ送る。", "important": false, "aliases": ["CloudWatchLogs"]}, {"cat": "監視・運用", "group": "CloudWatch / CloudTrail / Systems Manager", "word": "Log Group", "short": "CloudWatch Logsで関連するLog Streamをまとめる論理コンテナ。", "detail": "保持期間、KMS暗号化、サブスクリプションフィルタなどをLog Group単位で設定できる。実務例: /ecs/prod-apiというLog Groupへ複数タスクのログを集約する。", "important": false, "aliases": []}, {"cat": "監視・運用", "group": "CloudWatch / CloudTrail / Systems Manager", "word": "Log Stream", "short": "CloudWatch Logs内で1つのログ発生元・系列を表す単位。", "detail": "1つのLog Groupの中に複数作られ、EC2インスタンスやECSタスク単位で分かれることが多い。実務例: ECSの各Task IDごとに別Log Streamを作成する。", "important": false, "aliases": []}, {"cat": "監視・運用", "group": "CloudWatch / CloudTrail / Systems Manager", "word": "CloudWatch Alarm", "short": "Metricがしきい値条件を満たしたとき状態変化を起こす監視機能。", "detail": "OK/ALARM/INSUFFICIENT_DATAなどの状態を持ち、SNS通知やAuto Scalingアクションと連携できる。実務例: RDS CPUUtilizationが10分間80%以上ならSNSへ通知する。", "important": false, "aliases": []}, {"cat": "監視・運用", "group": "CloudWatch / CloudTrail / Systems Manager", "word": "CloudWatch Dashboard", "short": "複数のCloudWatch指標やログ可視化を1画面にまとめるダッシュボード。", "detail": "サービス横断で主要KPIを配置し、障害時の状況把握を速められる。実務例: ALB RequestCount、ECS CPU、RDS Connections、SQS Queue Depthを同じ画面に表示する。", "important": false, "aliases": []}, {"cat": "監視・運用", "group": "CloudWatch / CloudTrail / Systems Manager", "word": "CloudTrail", "short": "AWSアカウントで行われたAPI操作を記録する監査サービス。", "detail": "誰が、いつ、どのAPIを、どのリソースに対して実行したかを追跡でき、セキュリティ監査や変更原因調査に使う。CloudWatch Logsへ連携して検知ルールを作ることもできる。実務例: Security Groupが変更された時に操作ユーザーと時刻を調査する。", "important": true, "aliases": []}, {"cat": "監視・運用", "group": "CloudWatch / CloudTrail / Systems Manager", "word": "AWS Systems Manager", "short": "EC2やハイブリッド環境のサーバ運用を一元化する管理サービス。", "detail": "Session Manager、Run Command、Patch Manager、Parameter Storeなど複数機能を提供し、SSHポートを開けずに管理作業を行う構成も作れる。実務例: Session ManagerでPrivate SubnetのEC2へ踏み台なしで接続する。", "important": true, "aliases": ["SystemManager"]}, {"cat": "監視・運用", "group": "CloudWatch / CloudTrail / Systems Manager", "word": "WAF", "short": "WebアプリへのHTTP/HTTPS攻撃をルールで検査・遮断するWeb Application Firewall。", "detail": "ALB、CloudFront、API Gatewayなどと組み合わせ、IP、URI、SQLインジェクションやXSSパターンなどを条件に許可・拒否できる。ネットワーク層のSecurity Groupとは保護対象のレイヤが異なる。実務例: ALBの前段でAWS Managed Rulesを有効化し、一般的なWeb攻撃を遮断する。", "important": true, "aliases": []}, {"cat": "監視・運用", "group": "CloudWatch / CloudTrail / Systems Manager", "word": "SNS", "short": "1つのメッセージを複数の購読先へ配信するPub/Sub型サービス。", "detail": "SQS、Lambda、HTTP/S、メールなど複数サブスクライバーへ同時配信できる。SQSが「ためる」サービスなのに対し、SNSは「配る」用途が中心である。実務例: 障害イベントをSNSからメールとSQSの両方へ通知する。", "important": true, "aliases": []}, {"cat": "監視・運用", "group": "CloudWatch / CloudTrail / Systems Manager", "word": "EFS", "short": "複数のLinux系インスタンスから共有できるマネージドNFSファイルシステム。", "detail": "複数AZから同じファイルを共有でき、容量も自動的に拡張される。S3より一般的なファイルシステムに近く、EC2/ECSからマウントして使える。実務例: 複数Webサーバで共通のアップロードファイルを参照する。", "important": true, "aliases": []}, {"cat": "監視・運用", "group": "CloudWatch / CloudTrail / Systems Manager", "word": "FSx", "short": "特定用途向けのマネージドファイルシステム群。", "detail": "FSx for Windows File Server、FSx for Lustre、FSx for NetApp ONTAP、FSx for OpenZFSなどがあり、既存製品互換や高性能処理に向く。EFSより要件に特化した選択肢である。実務例: Windowsアプリの共有フォルダをSMBで提供する。", "important": true, "aliases": []}, {"cat": "監視・運用", "group": "CloudWatch / CloudTrail / Systems Manager", "word": "NAT Gateway", "short": "Private Subnetのリソースから外部へ発信するためのマネージドNAT。", "detail": "主にIPv4で、Private Subnet内のEC2/ECSからインターネットへアウトバウンド通信させつつ、インターネット側からの新規接続を直接受けない構成に利用する。可用性を考える場合はAZごとに配置する設計が一般的で、利用時間と処理データ量に料金が発生する。実務例: Private SubnetのEC2からOS更新サイトへアクセスさせる。", "important": true, "aliases": []}, {"cat": "監視・運用", "group": "CloudWatch / CloudTrail / Systems Manager", "word": "Internet Gateway", "short": "VPCとインターネットを接続するVPC向けゲートウェイ。", "detail": "VPCにアタッチし、Route Tableでインターネット宛通信のターゲットに指定して使う。Public IPv4アドレスまたはElastic IPを持つリソースが外部と通信する際に利用される。実務例: Public Subnetの0.0.0.0/0をInternet Gatewayへ向け、ALBをインターネット公開する。", "important": true, "aliases": []}, {"cat": "監視・運用", "group": "CloudWatch / CloudTrail / Systems Manager", "word": "Transit Gateway", "short": "複数VPCやオンプレミスネットワークをハブ型で接続する中継サービス。", "detail": "VPC Peeringを多数張るメッシュ構成より接続関係を集約しやすく、Transit Gateway Route Tableで到達範囲を分離できる。大規模環境では管理性が高い一方、アタッチメントやデータ処理に料金がかかる。実務例: 開発・本番・共有サービスVPCとDirect Connect/VPNを1つのTransit Gatewayに集約する。", "important": true, "aliases": []}, {"cat": "重要語", "group": "重要語", "word": "Route Table", "short": "SubnetやGatewayから出る通信の宛先と転送先を決める経路表。", "detail": "各ルートは宛先CIDRとターゲットの組で構成され、Internet Gateway、NAT Gateway、Transit Gatewayなどへ通信を転送する。最長一致により経路が選択され、SubnetをPublic/Privateに分ける設計の中心となる。実務例: Private Subnetの0.0.0.0/0をNAT Gatewayへ向け、外向き通信だけを許可する。", "important": true, "aliases": []}, {"cat": "重要語", "group": "重要語", "word": "Aurora", "short": "AWSがクラウド向けに設計したMySQL/PostgreSQL互換のマネージドRDB。", "detail": "コンピュートと分散ストレージを分離し、高可用性と読み取りスケールを実現する。一般的なRDSエンジンよりAWS独自機能が多い一方、エンジン互換性やコストを確認する必要がある。実務例: 高可用性が必要な業務DBをAurora PostgreSQLで構築しReaderを追加する。", "important": true, "aliases": []}, {"cat": "重要語", "group": "重要語", "word": "RDS", "short": "リレーショナルデータベースをマネージドで提供するサービス。", "detail": "MySQL、PostgreSQL、MariaDB、Oracle、SQL Serverなどを選べ、バックアップ、パッチ、監視などの運用負荷を軽減できる。OSへ直接ログインして細かく管理する用途には向かない。実務例: WebシステムのPostgreSQLをEC2自前構築ではなくRDSで運用する。", "important": true, "aliases": []}, {"cat": "重要語", "group": "重要語", "word": "DynamoDB", "short": "低遅延でスケーラブルなAWSのマネージドNoSQLデータベース。", "detail": "テーブル設計ではパーティションキーと必要に応じてソートキーを定義し、キーアクセス中心の大規模処理に向く。JOINを多用するRDB型の処理には不向きである。実務例: セッション情報、ゲーム状態、IoTデバイス状態などをミリ秒単位で読み書きする。", "important": true, "aliases": []}, {"cat": "重要語", "group": "重要語", "word": "S3", "short": "オブジェクト単位でデータを保存する高耐久なオブジェクトストレージ。", "detail": "バケットの中にオブジェクトをキーで格納し、容量を事前確保せず利用できる。ファイル共有用POSIXファイルシステムとは異なり、オブジェクトAPIで扱う。実務例: バックアップ、ログ、静的Webコンテンツ、データレイクの保存先として利用する。", "important": true, "aliases": []}, {"cat": "重要語", "group": "重要語", "word": "KMS", "short": "暗号鍵を安全に作成・管理しAWSサービスから利用できる鍵管理サービス。", "detail": "KMS Keyを中心に暗号化・復号・署名などのAPIを提供し、多くのAWSサービスの保存時暗号化と連携する。大量データはData Keyを使うEnvelope Encryptionが一般的である。実務例: S3やRDS、Secrets Managerの暗号化にCustomer managed keyを指定する。", "important": true, "aliases": []}, {"cat": "重要語", "group": "重要語", "word": "Secrets Manager", "short": "パスワードやAPIキーなどのシークレットを安全に保存・取得するサービス。", "detail": "シークレットをKMSで暗号化し、IAMでアクセス制御できるほか、対応データベースではローテーションも自動化できる。単純な設定値保存よりコストはかかるが、機密情報のライフサイクル管理に向く。実務例: RDSのDBパスワードをアプリの環境変数に直書きせずSecrets Managerから取得する。", "important": true, "aliases": []}, {"cat": "重要語", "group": "重要語", "word": "SQS", "short": "メッセージを一時保存して送信側と受信側を疎結合にするキューサービス。", "detail": "Standard QueueとFIFO Queueを選択でき、受信側の一時障害や処理能力差を吸収する。メッセージは処理完了後に削除し、失敗時はDLQへ退避できる。実務例: Web受付処理から重いバッチ処理を切り離し、ワーカーがSQSから順次処理する。", "important": true, "aliases": []}]</script><script id="glossary-cats" type="application/json">["ネットワーク・VPC", "DNS・ネットワークIF", "コンピューティング", "データベース", "ストレージ・NoSQL", "IAM・権限管理", "暗号・シークレット", "メッセージング・イベント", "監視・運用", "重要語"]</script>
<script>
const DATA=JSON.parse(document.getElementById('glossary-data').textContent);const CATS=JSON.parse(document.getElementById('glossary-cats').textContent);let currentCat='ALL',currentQuery='';
function countFor(cat){if(cat==='ALL')return DATA.length;return DATA.filter(d=>d.cat===cat).length}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function attr(s){return esc(s).replace(/"/g,'&quot;')}
function hi(text,q){if(!q)return esc(text);const low=text.toLowerCase(),i=low.indexOf(q.toLowerCase());if(i<0)return esc(text);return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length))}
function renderSidebar(){let el=document.getElementById('catList'),h=`<div class="cat-item ${currentCat==='ALL'?'active':''}" data-cat="ALL"><span>すべての分野</span><span class="cnt">${countFor('ALL')}</span></div>`;CATS.forEach(c=>h+=`<div class="cat-item ${currentCat===c?'active':''}" data-cat="${attr(c)}"><span>${esc(c)}</span><span class="cnt">${countFor(c)}</span></div>`);el.innerHTML=h;el.querySelectorAll('.cat-item').forEach(x=>x.onclick=()=>{currentCat=x.dataset.cat;renderSidebar();renderContent();window.scrollTo({top:0,behavior:'instant'})})}
function renderContent(){let rows=DATA;if(currentCat!=='ALL')rows=rows.filter(d=>d.cat===currentCat);if(currentQuery){let q=currentQuery.toLowerCase();rows=rows.filter(d=>d.word.toLowerCase().includes(q)||d.short.toLowerCase().includes(q)||d.detail.toLowerCase().includes(q)||d.group.toLowerCase().includes(q)||(d.aliases||[]).some(a=>a.toLowerCase().includes(q)))}document.getElementById('metaRow').textContent=`${rows.length} / ${DATA.length} 件表示`;let el=document.getElementById('content');if(!rows.length){el.innerHTML='<div class="empty">該当する用語が見つかりませんでした</div>';return}let h='',last=null;rows.forEach(d=>{let g=currentCat==='ALL'?(d.cat+' ／ '+d.group):d.group;if(g!==last){h+=`<div class="group-title">${esc(g)}</div>`;last=g}h+=`<details class="term"><summary><span class="arrow">&#9656;</span><span class="word">${hi(d.word,currentQuery)}</span>${d.important?'<span class="badge">重要</span>':''}<span class="short-preview">${esc(d.short)}</span></summary><div class="body"><div class="short">${hi(d.short,currentQuery)}</div><div class="detail">${hi(d.detail,currentQuery)}</div></div></details>`});el.innerHTML=h}
document.getElementById('searchInput').addEventListener('input',e=>{currentQuery=e.target.value.trim();if(currentQuery){currentCat='ALL';renderSidebar()}renderContent()});renderSidebar();renderContent();
</script></body></html>
