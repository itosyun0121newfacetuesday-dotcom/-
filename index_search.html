<style>
  :root {
    --bg: #0e1420;
    --panel: #141c2b;
    --line: #253247;
    --text: #dbe4ef;
    --sub: #8fa3bf;
    --accent: #4fd1c5;
    --mono: 'JetBrains Mono', 'Menlo', 'Consolas', monospace;
    --sans: 'Inter', -apple-system, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 760px;
    padding: 48px 24px 100px 24px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--accent);
    text-transform: uppercase;
  }
  h1 {
    font-size: 22px;
    margin: 6px 0 26px 0;
    font-weight: 700;
  }
  .search-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    position: sticky;
    top: 16px;
    z-index: 5;
  }
  .search-wrap svg { flex-shrink: 0; opacity: 0.6; }
  .search-wrap input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 17px;
    font-family: var(--sans);
  }
  .meta-row {
    margin-top: 12px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--sub);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 18px;
    font-size: 14.5px;
  }
  thead th {
    text-align: left;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--sub);
    text-transform: uppercase;
    padding: 0 4px 8px 4px;
    border-bottom: 1px solid var(--line);
  }
  tbody td {
    padding: 10px 4px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  .word-cell { font-weight: 600; }
  .page-cell {
    font-family: var(--mono);
    color: var(--accent);
    white-space: nowrap;
    text-align: right;
    width: 120px;
  }
  mark {
    background: rgba(79,209,197,0.35);
    color: inherit;
    border-radius: 2px;
    padding: 0 1px;
  }
  .empty {
    color: var(--sub);
    font-family: var(--mono);
    font-size: 13px;
    padding: 50px 0;
    text-align: center;
  }
  .hint {
    color: var(--sub);
    font-size: 13px;
    padding: 40px 0;
    text-align: center;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('index-data').textContent);
const TOTAL = DATA.length;

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function highlight(text, q) {
  if (!q) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return escapeHtml(text);
  const before = escapeHtml(text.slice(0, idx));
  const match = escapeHtml(text.slice(idx, idx+q.length));
  const after = escapeHtml(text.slice(idx+q.length));
  return before + '<mark>' + match + '</mark>' + after;
}

function render(query) {
  const el = document.getElementById('content');
  const meta = document.getElementById('metaRow');

  if (!query) {
    meta.textContent = `全 ${TOTAL} 件を収録`;
    el.innerHTML = '<div class="hint">単語を入力すると、該当する索引語とページ数が一覧表示されます。</div>';
    return;
  }

  const q = query.toLowerCase();
  const exact = [];
  const partial = [];
  DATA.forEach(d => {
    const w = d.word.toLowerCase();
    if (w === q) exact.push(d);
    else if (w.includes(q)) partial.push(d);
  });
  const rows = exact.concat(partial);

  meta.textContent = `${rows.length} 件ヒット (全 ${TOTAL} 件中)`;

  if (rows.length === 0) {
    el.innerHTML = '<div class="empty">該当する単語が見つかりませんでした</div>';
    return;
  }

  let html = '<table><thead><tr><th>単語</th><th>ページ</th></tr></thead><tbody>';
  rows.forEach(d => {
    html += `<tr><td class="word-cell">${highlight(d.word, query)}</td><td class="page-cell">${escapeHtml(d.pages)}</td></tr>`;
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  render(e.target.value.trim());
});

render('');
</script>
